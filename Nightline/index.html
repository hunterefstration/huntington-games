<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Highbeam</title>
<style>
/* HIGHBEAM (the folder is still Nightline/): near-black glass, thin lines, headlamp yellow for what you press and what is yours,
   a cold blue for what you read, tail-lamp red for what is locked. Upright heavy type; only the dials in a race lean. */
:root { --beam: #ffd23f; --cold: #8fd8ff; --amber: #ffc24a; --red: #ff5a4d; --ink: #05060c; --glass: rgba(8, 10, 20, .72); --line: rgba(255, 255, 255, .14); --dim: #8d93ad; --tx: #eef1ff; --hd: 'Arial Black', 'Segoe UI Black', Roboto, Arial, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--tx); font: 500 14px/1.4 Roboto, 'Segoe UI', Arial, sans-serif; user-select: none; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border: 1px solid rgba(255, 255, 255, .35); font: 700 11px Roboto, Arial, sans-serif; text-align: center; letter-spacing: .04em; }
#veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .5) 100%); }
.nl-logo { font: italic 900 30px/1 var(--hd); letter-spacing: .02em; transform: skewX(-8deg); color: #fff; text-shadow: 0 0 18px rgba(255, 190, 40, .9), 0 0 46px rgba(255, 190, 40, .5), 3px 0 0 rgba(120, 205, 255, .55); }
.nl-logo b { color: var(--beam); text-shadow: 0 0 18px rgba(255, 190, 40, 1), 0 0 50px rgba(255, 190, 40, .7); margin-left: .12em; }
.nl-logo.big { font-size: clamp(44px, 9vw, 120px); }

/* ---- HOME: your car drives the circuit behind it ---- */
#menu, #garage { position: fixed; inset: 0; }
#menu { background: linear-gradient(90deg, rgba(5, 6, 12, .86) 0, rgba(5, 6, 12, .3) 34%, rgba(5, 6, 12, 0) 52%, rgba(5, 6, 12, .3) 74%, rgba(5, 6, 12, .8) 100%), linear-gradient(0deg, rgba(5, 6, 12, .7), rgba(5, 6, 12, 0) 30%); }
#m-top { position: absolute; left: 34px; right: 34px; top: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
#m-rec { display: flex; gap: 26px; text-align: right; text-shadow: 0 2px 8px #000; }
#m-rec b { display: block; font: 900 22px/1 var(--hd); } #m-rec small { font-size: 10px; letter-spacing: .26em; color: #c5cae0; }
#m-main { position: absolute; left: 34px; right: 34px; top: 92px; bottom: 44px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
#m-left { width: min(360px, 36vw); display: flex; flex-direction: column; gap: 10px; }
.go { position: relative; background: var(--beam); color: #14100a; border: 0; padding: 18px 22px; text-align: left; box-shadow: 0 0 40px rgba(255, 190, 40, .35), 0 14px 40px rgba(0, 0, 0, .6); transition: filter .12s, transform .12s; }
.go b { display: block; font: 900 32px/1 var(--hd); letter-spacing: .1em; } .go small { display: block; margin-top: 7px; font: 700 11px/1 Roboto, Arial, sans-serif; letter-spacing: .2em; color: rgba(20, 16, 10, .8); text-transform: uppercase; }
.go::after { content: ''; position: absolute; right: 22px; top: 50%; width: 12px; height: 12px; border-top: 4px solid #14100a; border-right: 4px solid #14100a; transform: translateY(-50%) rotate(45deg); }
.go:hover { filter: brightness(1.1); transform: translateX(4px); }
.alt { background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--cold); padding: 13px 18px; text-align: left; backdrop-filter: blur(6px); }
.alt b { display: block; font: 900 17px/1 var(--hd); letter-spacing: .12em; } .alt small { display: block; margin-top: 5px; font-size: 11.5px; color: var(--dim); letter-spacing: .03em; }
.alt:hover { border-color: var(--cold); box-shadow: 0 0 22px rgba(120, 205, 255, .3); }
.rows { background: var(--glass); border: 1px solid var(--line); padding: 10px 14px; backdrop-filter: blur(6px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; } .row > span { font-size: 10.5px; letter-spacing: .26em; color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: none; border: 0; padding: 7px 12px; font: 800 11.5px Roboto, Arial, sans-serif; letter-spacing: .14em; color: #aab0c8; }
.seg button:hover { color: #fff; } .seg button.on { background: var(--beam); color: #14100a; box-shadow: 0 0 16px rgba(255, 190, 40, .5); }
#m-links { display: flex; gap: 8px; } #m-links button { flex: 1; background: none; border: 1px solid var(--line); padding: 9px 8px; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .18em; color: #c5cae0; } #m-links button:hover { color: #fff; border-color: #fff; }
#m-car { width: min(340px, 36vw); background: var(--glass); border: 1px solid var(--line); border-top: 3px solid var(--beam); padding: 14px 16px; backdrop-filter: blur(6px); }
#m-car .alt { width: 100%; margin-top: 12px; }
#car-head small, #g-info .cls { font-size: 10.5px; letter-spacing: .28em; color: var(--cold); }
#car-head h2, #g-info h2 { margin: 2px 0 3px; font: 900 30px/1 var(--hd); letter-spacing: .06em; }
.bar { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: 10.5px; letter-spacing: .2em; color: var(--dim); margin: 5px 0; } .bar i { display: block; height: 5px; background: rgba(255, 255, 255, .14); position: relative; } .bar i u { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--cold), #fff); box-shadow: 0 0 10px rgba(120, 205, 255, .6); } .bar b { color: #fff; text-align: right; font: 800 12px Roboto, Arial, sans-serif; letter-spacing: .04em; }
/* seat time: how well you know one car (laps and results in it) */
.seat { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px; margin: 9px 0 4px; font-size: 10.5px; letter-spacing: .2em; color: var(--dim); }
.seat i { display: block; height: 5px; background: rgba(255, 255, 255, .14); position: relative; } .seat i u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--beam); box-shadow: 0 0 10px rgba(255, 190, 40, .7); }
.seat b { color: var(--beam); font: 900 12px/1 var(--hd); letter-spacing: .14em; } .seat small { grid-column: 1 / -1; letter-spacing: .02em; font-size: 11.5px; color: #aeb4cc; }
#m-foot { position: absolute; left: 34px; right: 34px; bottom: 14px; display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .2em; color: rgba(255, 255, 255, .5); }

/* ---- THE GARAGE: one car stands on the road and you walk round it; every car on the left, the one you clicked on the right ---- */
#garage { cursor: grab; background: linear-gradient(90deg, rgba(5, 6, 12, .82) 0, rgba(5, 6, 12, 0) 32%, rgba(5, 6, 12, 0) 68%, rgba(5, 6, 12, .82) 100%), linear-gradient(0deg, rgba(5, 6, 12, .55), rgba(5, 6, 12, 0) 24%); }
#garage.drag { cursor: grabbing; }
#g-top { position: absolute; left: 34px; right: 34px; top: 20px; display: flex; align-items: center; gap: 18px; pointer-events: none; }
#g-top h1 { margin: 0; font: 900 26px/1 var(--hd); letter-spacing: .18em; text-shadow: 0 0 22px rgba(255, 190, 40, .6); }
#g-back { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); padding: 9px 14px; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .18em; } #g-back:hover { border-color: #fff; }
#g-admin { margin-left: auto; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .18em; color: var(--red); text-shadow: 0 1px 6px #000; }
#g-list { position: absolute; left: 34px; top: 68px; bottom: 22px; width: min(330px, 32vw); overflow-y: auto; padding-right: 6px; cursor: default; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .3) transparent; }
.g-cls { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 11px 0 5px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-shadow: 0 1px 6px #000; } .g-cls:first-child { margin-top: 0; }
.g-cls b { font: 900 13px/1 var(--hd); letter-spacing: .2em; } .g-cls small { font-size: 10px; letter-spacing: .1em; color: var(--cold); text-align: right; text-transform: uppercase; } .g-cls.lock small { color: var(--red); }
.g-cars { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.g-cars button { position: relative; background: rgba(9, 11, 18, .8); border: 1px solid var(--line); padding: 8px 8px 7px 16px; text-align: left; backdrop-filter: blur(6px); }
.g-cars button i { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
.g-cars button b { display: block; font: 900 13px/1.1 var(--hd); letter-spacing: .06em; } .g-cars button small { font-size: 9.5px; letter-spacing: .16em; color: var(--dim); white-space: nowrap; }
.g-cars button:hover { border-color: rgba(255, 255, 255, .5); }
.g-cars button.on { border-color: var(--beam); background: rgba(255, 190, 40, .14); box-shadow: 0 0 16px rgba(255, 190, 40, .3); }
.g-cars button.eq small { color: var(--beam); } .g-cars button.lock b { opacity: .5; } .g-cars button.lock small { color: var(--red); } .g-cars button.lock i { opacity: .3; }
#g-info { position: absolute; right: 34px; bottom: 22px; width: min(340px, 34vw); background: var(--glass); border: 1px solid var(--line); border-top: 3px solid var(--beam); padding: 14px 16px; backdrop-filter: blur(8px); cursor: default; }
#g-info p { margin: 0 0 8px; font-size: 12.5px; color: #c5cae0; min-height: 34px; }
#g-info .go { width: 100%; margin-top: 10px; padding: 13px 18px; } #g-info .go b { font-size: 22px; }
.g-eq { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--beam); color: var(--beam); font: 800 11.5px Roboto, Arial, sans-serif; letter-spacing: .16em; text-align: center; }
.g-lock { margin-top: 10px; padding: 10px 14px; border: 1px solid var(--red); background: rgba(255, 90, 77, .1); } .g-lock b { display: block; font: 900 15px/1.3 var(--hd); letter-spacing: .2em; color: var(--red); } .g-lock span { font-size: 12.5px; color: #f0d8d4; }
#car-paint { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; } #car-paint button { position: relative; width: 20px; height: 18px; border: 1px solid rgba(255, 255, 255, .3); padding: 0; } #car-paint button.on { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px currentColor; }
#car-paint button.lock { opacity: .5; } #car-paint button em { position: absolute; inset: 0; font: 800 10px/17px Roboto, Arial, sans-serif; font-style: normal; color: #fff; text-align: center; text-shadow: 0 0 3px #000, 0 0 3px #000; }
#g-hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 10.5px; letter-spacing: .3em; color: rgba(255, 255, 255, .5); pointer-events: none; text-shadow: 0 1px 6px #000; }
.seatres { border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 12px; } .seatres .seat { margin: 0; } .seatres em { font-style: normal; color: var(--beam); }

/* ---- panels, loading, pause, results ---- */
#panel, #pause, #results, #loading, #fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4, 5, 10, .72); z-index: 20; }
#loading { flex-direction: column; background: #04050a; } #load-map { margin-top: 26px; font-size: 12px; letter-spacing: .4em; color: var(--cold); } #load-bar { margin-top: 16px; width: min(420px, 60vw); height: 3px; background: rgba(255, 255, 255, .12); } #load-bar i { display: block; height: 100%; width: 0; background: var(--beam); box-shadow: 0 0 14px var(--beam); transition: width .25s; }
#panel-box, #pause .box, .res { background: rgba(8, 10, 20, .94); border: 1px solid var(--line); border-top: 3px solid var(--beam); padding: 18px 22px; width: min(560px, 92vw); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); }
#panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; } #panel-head h2, #pause h2 { margin: 0; font: italic 900 24px/1 var(--hd); letter-spacing: .08em; }
#panel-x { background: none; border: 1px solid var(--line); padding: 6px 10px; font-size: 11px; letter-spacing: .16em; }
#panel-body p { color: #c5cae0; margin: 6px 0; } #panel-body .set { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line); } #panel-body .set > span { font-size: 11px; letter-spacing: .2em; color: var(--dim); } #panel-body input[type=range] { width: 180px; accent-color: var(--beam); }
#panel-body .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin-top: 8px; }
#pause .box { width: min(320px, 90vw); display: flex; flex-direction: column; gap: 8px; } #pause h2 { margin-bottom: 8px; }
#pause button, .res button { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); padding: 11px 14px; font: 800 12px Roboto, Arial, sans-serif; letter-spacing: .2em; text-align: left; } #pause button:hover, .res button:hover { border-color: #fff; } #pause button:first-of-type, .res button.pri { background: var(--beam); border-color: var(--beam); box-shadow: 0 0 22px rgba(255, 190, 40, .5); }
.res { width: min(620px, 94vw); } .res .place { font: italic 900 clamp(46px, 8vw, 84px)/1 var(--hd); letter-spacing: .04em; text-shadow: 0 0 30px rgba(255, 190, 40, .8); } .res .place small { font: 800 13px Roboto, Arial, sans-serif; letter-spacing: .3em; color: var(--cold); margin-left: 12px; text-shadow: none; vertical-align: middle; }
.res .nums { display: flex; gap: 28px; margin: 10px 0 12px; } .res .nums b { display: block; font: 900 22px/1.1 var(--hd); } .res .nums small { font-size: 10px; letter-spacing: .26em; color: var(--dim); }
.res table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; } .res td { padding: 4px 6px; border-top: 1px solid var(--line); } .res tr.me td { background: rgba(255, 190, 40, .16); color: #fff; font-weight: 800; } .res td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.res .got { border: 1px solid var(--amber); color: var(--amber); padding: 9px 12px; margin-bottom: 12px; letter-spacing: .06em; box-shadow: 0 0 20px rgba(255, 194, 74, .25); } .res .next { color: #c5cae0; font-size: 12.5px; margin-bottom: 12px; }
.res .btns { display: flex; gap: 8px; } .res .btns button { flex: 1; text-align: center; }
#fatal { padding: 30px; text-align: center; font-size: 16px; }
#stats { position: fixed; left: 8px; top: 8px; font: 11px/1.4 monospace; color: #9fd; white-space: pre; pointer-events: none; z-index: 30; text-shadow: 0 1px 2px #000; }

/* ---- the dials ---- */
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 10px rgba(0, 0, 0, .9); font-variant-numeric: tabular-nums; }
#hud small { display: block; font-size: 10px; letter-spacing: .3em; color: #c5cae0; }
#h-pos { position: absolute; left: 30px; top: 22px; transform: skewX(-8deg); } #h-place { font: italic 900 64px/0.9 var(--hd); color: #fff; text-shadow: 0 0 24px rgba(255, 190, 40, .9), 3px 0 0 var(--beam); } #h-of { font: italic 900 24px var(--hd); color: #c5cae0; margin-left: 4px; }
#h-lap { position: absolute; left: 172px; top: 34px; transform: skewX(-8deg); } #h-lapn { font: italic 900 38px/0.9 var(--hd); } #h-lapof { font: italic 900 18px var(--hd); color: #c5cae0; margin-left: 3px; }
#h-time { position: absolute; right: 30px; top: 24px; text-align: right; display: flex; flex-direction: column; gap: 6px; } #h-time b { font: 900 22px/1 var(--hd); letter-spacing: .02em; } #h-time div:first-child b { font-size: 30px; } #h-best { color: var(--cold); }
#h-speed { position: absolute; right: 34px; bottom: 26px; text-align: right; transform: skewX(-8deg); } #h-kmh { font: italic 900 78px/0.85 var(--hd); letter-spacing: -.01em; text-shadow: 0 0 26px rgba(120, 205, 255, .7), 3px 0 0 rgba(120, 205, 255, .7); } #h-unit { display: block; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .34em; color: #c5cae0; margin-top: 4px; }
#h-gear { position: absolute; right: 100%; bottom: 20px; margin-right: 16px; font: italic 900 34px/1 var(--hd); color: var(--amber); font-style: italic; }
#h-rev { width: 250px; height: 7px; background: rgba(255, 255, 255, .14); margin: 0 0 10px auto; position: relative; } #h-rev i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--cold) 0, var(--cold) 70%, var(--beam) 88%); box-shadow: 0 0 12px rgba(120, 205, 255, .8); }
#h-map { position: absolute; left: 26px; bottom: 22px; width: 170px; height: 170px; opacity: .95; }
#h-board { position: absolute; left: 30px; top: 108px; font: 800 12px/1.55 Roboto, Arial, sans-serif; letter-spacing: .08em; } #h-board div { display: flex; gap: 8px; opacity: .8; } #h-board div.me { color: var(--beam); opacity: 1; } #h-board i { width: 14px; font-style: normal; color: #c5cae0; } #h-board em { font-style: normal; color: #9aa0b8; margin-left: 4px; }
#h-lights { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 18px; background: rgba(5, 6, 12, .7); border: 1px solid var(--line); } #h-lights i { width: 34px; height: 34px; border-radius: 50%; background: #1a0508; border: 1px solid rgba(255, 255, 255, .2); } #h-lights i.on { background: #ff2030; box-shadow: 0 0 30px #ff2030, 0 0 70px rgba(255, 32, 48, .6); } #h-lights.go i { background: #2dff7a; box-shadow: 0 0 30px #2dff7a, 0 0 70px rgba(45, 255, 122, .6); }
#h-msg { position: absolute; left: 0; right: 0; top: 17%; text-align: center; font: italic 900 clamp(26px, 4vw, 46px)/1.1 var(--hd); letter-spacing: .08em; text-shadow: 0 0 26px rgba(120, 205, 255, .8); opacity: 0; transition: opacity .2s; } #h-msg.on { opacity: 1; } #h-msg small { margin-top: 8px; font: 800 13px Roboto, Arial, sans-serif; letter-spacing: .3em; color: #fff; }
#h-wrong { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font: italic 900 34px var(--hd); letter-spacing: .14em; color: #ff3040; text-shadow: 0 0 24px #ff2030; animation: blink .5s steps(2) infinite; }
#h-keys { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 11.5px; letter-spacing: .14em; color: #dfe3f5; transition: opacity 1s; } #h-keys kbd { margin: 0 3px 0 12px; }
@keyframes blink { 50% { opacity: .25; } }
@media (max-height: 560px) { #m-main { top: 76px; } #g-info p { display: none; } .go { padding: 13px 20px; } #g-list { top: 60px; } }


</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"></div>

<div id="menu" class="hidden">
  <div id="m-top"><div class="nl-logo">HIGH<b>BEAM</b></div><div id="m-rec"></div></div>
  <div id="m-main">
    <div id="m-left">
      <button class="go" data-act="race"><b>RACE</b><small id="go-sub"></small></button>
      <button class="alt" data-act="trial"><b>TIME TRIAL</b><small>alone on the circuit, against your best lap</small></button>
      <div class="rows">
        <div class="row" id="row-circuit"><span>CIRCUIT</span><div class="seg" id="seg-circuit"></div></div>
        <div class="row"><span>DRIVERS</span><div class="seg" id="seg-level"></div></div>
        <div class="row"><span>LAPS</span><div class="seg" id="seg-laps"></div></div>
      </div>
      <div id="m-links"><button data-act="settings">SETTINGS</button><button data-act="how">HOW TO DRIVE</button></div>
    </div>
    <div id="m-car">
      <div id="car-head"></div>
      <div id="car-seat"></div>
      <div id="car-bars"></div>
      <button class="alt" data-act="garage"><b>GARAGE</b><small id="gar-sub"></small></button>
    </div>
  </div>
  <div id="m-foot"></div>
</div>

<div id="garage" class="hidden">
  <div id="g-top"><button id="g-back" data-act="home">BACK <kbd>Esc</kbd></button><h1>GARAGE</h1><div id="g-admin"></div></div>
  <div id="g-list"></div>
  <div id="g-info"></div>
  <div id="g-hint">DRAG TO TURN THE CAR</div>
</div>

<div id="panel" class="hidden"><div id="panel-box"><div id="panel-head"><h2 id="panel-title"></h2><button id="panel-x">BACK <kbd>Esc</kbd></button></div><div id="panel-body"></div></div></div>
<div id="loading" class="hidden"><div class="nl-logo big">HIGH<b>BEAM</b></div><div id="load-map"></div><div id="load-bar"><i></i></div></div>

<div id="hud" class="hidden">
  <div id="h-pos"><b id="h-place">1</b><span id="h-of">/8</span><small>POSITION</small></div>
  <div id="h-lap"><b id="h-lapn">1</b><span id="h-lapof">/3</span><small>LAP</small></div>
  <div id="h-time"><div><small>TIME</small><b id="h-t">0:00.000</b></div><div><small>BEST</small><b id="h-best">-:--.---</b></div><div><small>LAST</small><b id="h-last">-:--.---</b></div></div>
  <div id="h-speed"><div id="h-rev"><i></i></div><b id="h-kmh">0</b><span id="h-unit">KM/H</span><em id="h-gear">1</em></div>
  <canvas id="h-map" width="170" height="170"></canvas>
  <div id="h-board"></div>
  <div id="h-lights" class="hidden"><i></i><i></i><i></i></div>
  <div id="h-msg"></div>
  <div id="h-wrong" class="hidden">WRONG WAY</div>

// ============================================================
// The circuit as numbers. TRACKDATA (13-trackdata.js, made by tools/race-track.mjs) is the centre line: a closed row of
// samples `step` metres apart, each [x, y, z, tx, tz, bank]. A place on the circuit is (u, d): u = how far round, counted
// in samples (it wraps at N), d = metres LEFT of the centre line (left of the driving direction (tx, tz) is (tz, -tx)).
// The road is `W` wide; the barriers stand at `half` = W / 2 + wall on both sides.
// ============================================================
const Track = { id: '', S: null, N: 0, step: 3, W: 14, half: 8.5, len: 0, line: null, kap: null };

    const T = TRACKDATA[id] || TRACKDATA[Object.keys(TRACKDATA)[0]]; Track.id = T.id; Track.name = T.name; Track.S = T.s; Track.N = T.s.length; Track.step = T.step; Track.W = T.width; Track.half = T.width / 2 + T.wall; Track.len = T.length; Track.marks = T.marks || {};

};

Track.spot = function (u, d, o) { Track.at(u, o); o.x += o.tz * d; o.z -= o.tx * d; o.y -= d * o.bank; return o; };

// (kap[i], 1 / radius, signed: + is a left-hander). Found the old way: every point of an elastic band, held inside the
// road, moves toward the middle of its neighbours until the band is as straight as the road allows.
Track.fastLine = function () {

    return v;
};

// ---- 15-save.js ----
// ============================================================
// What is kept between visits: one key, 'nightline_save'. v counts the shape: a newer game reads an older save and fills
// in what is missing, it never wipes one. (For the launcher to sync it, gv/core.js GAME_KEYS needs 'nightline_': release.)
// ============================================================
const Save = { KEY: 'nightline_save', data: null,
    fresh() { return { v: 1, car: 'kite', paint: {}, cars: { kite: 1 }, best: {}, medals: {}, wins: 0, races: 0, podiums: 0, km: 0, seen: {}, seat: {}, admin: false,
        settings: { circuit: 'quay', laps: 3, level: 0, cam: 0, sfx: 0.8, quality: 'auto', stats: false, mph: false, shake: true } }; },
    load() {
        let d = null; try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { }
        const f = this.fresh(); if (!d || typeof d !== 'object') d = f;
        for (const k in f) { if (d[k] === undefined) d[k] = f[k]; else if (f[k] && typeof f[k] === 'object' && !Array.isArray(f[k])) for (const j in f[k]) if (d[k][j] === undefined) d[k][j] = f[k][j]; }
        // 2026-11-24: twenty cars in five classes, a class opens as one. A save that had one car of a class has the class.
        if (typeof CARS !== 'undefined') { const has = {}; for (const id in d.cars) if (d.cars[id] && CARS[id]) has[CARS[id].ci] = 1; has[0] = 1; for (const id in CARS) if (has[CARS[id].ci]) d.cars[id] = 1; if (!CARS[d.car]) d.car = 'kite'; }
        if (typeof TRACKDATA !== 'undefined' && !TRACKDATA[d.settings.circuit]) d.settings.circuit = 'quay';
        this.data = d; return d;
    },
    store() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { } },
    // the best lap and best race on a circuit in a car: best['quay|kite'] = { lap, race }
    best(circuit, car) { return this.data.best[circuit + '|' + car] || {}; },
    setBest(circuit, car, kind, t) { const k = circuit + '|' + car, b = this.data.best[k] || (this.data.best[k] = {}); if (!b[kind] || t < b[kind]) { b[kind] = +t.toFixed(3); return true; } return false; }
};

// gets a streak of its own colour lying on the asphalt between it and the eye: what a wet street does at night), soft halos

        const id = park ? UI.view : S.car, paint = UI.paintOf(id), mode = park ? 'park' : 'show', key = mode + '|' + id + '|' + paint + '|' + S.settings.circuit; if (UI.showing === key && Race.on && Race.mode === mode) return; UI.showing = key;

UI.bars = function (d) {

UI.renderGarage = function () {

// ADMIN UNLOCK (the owner asked for it; TEMPORARY like Ashfall's P key: before a release, tie it to the launcher's admin powers or take it out).

// the garage: dragging on the picture turns the car
(function () {

document.addEventListener('click', e => {

UI.play = async function (mode) {
    const S = Save.data, st = S.settings; if (Race.busy) return; App.screen = 'race'; UI.showing = ''; Race.shown = false;
    show('menu', false); show('results', false); show('pause', false); UI.loading(true, (TRACKDATA[st.circuit] || TRACKDATA.quay).name);
    show('garage', false); await UI.q; await Race.start({ mode, car: S.car, paint: UI.paintOf(S.car), circuit: st.circuit, laps: st.laps, level: st.level }, UI.prog);
    UI.loading(false); show('hud', true); App.paused = false; UI.hudStart(); return true;
};

// ---- the dials ----
UI.hudStart = function () {
    const race = Race.mode === 'race'; show('h-pos', race); show('h-board', race); $('h-lapof').textContent = race ? '/' + Race.laps : ''; $('h-of').textContent = '/' + Race.cars.length; $('h-unit').textContent = Save.data.settings.mph ? 'MPH' : 'KM/H';
    $('h-keys').innerHTML = '<kbd>W</kbd>gas<kbd>S</kbd>brake<kbd>A</kbd><kbd>D</kbd>steer<kbd>Space</kbd>handbrake<kbd>C</kbd>camera<kbd>R</kbd>back on the road<kbd>Esc</kbd>pause'; $('h-keys').style.opacity = 1; UI.keysT = 9;
    // the circuit, drawn once
    const cv = UI.mapCv = document.createElement('canvas'); cv.width = cv.height = 170; const c = cv.getContext('2d'), S = Track.S; let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; for (const s of S) { x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); z0 = Math.min(z0, s[2]); z1 = Math.max(z1, s[2]); }
    const k = 150 / Math.max(x1 - x0, z1 - z0), ox = 85 - (x0 + x1) / 2 * k, oz = 85 + (z0 + z1) / 2 * k; UI.mapK = [k, ox, oz];
    c.lineJoin = 'round'; for (const [w, col] of [[7, 'rgba(5,6,12,.75)'], [3, 'rgba(255,255,255,.85)']]) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); S.forEach((s, i) => { const X = s[0] * k + ox, Y = -s[2] * k + oz; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); c.stroke(); }
    c.fillStyle = '#ffd23f'; c.fillRect(S[0][0] * k + ox - 2, -S[0][2] * k + oz - 5, 4, 10);
};
UI.frame = function (dt) {

    $('h-kmh').textContent = Math.round(Math.abs(me.u) * (st.mph ? 2.237 : 3.6)); $('h-gear').textContent = me.gear ? me.gear : 'R'; $('h-rev').firstChild.style.width = Math.round(me.rpm * 100) + '%';
    const live = Race.state !== 'grid'; $('h-t').textContent = fmtTime(live ? (me.done || Race.t) : 0.0001); $('h-best').textContent = fmtTime(Race.best); $('h-last').textContent = fmtTime(me.laps[me.laps.length - 1]);

    const M = $('h-msg'); if (Race.msg) { const h = esc(Race.msg.text) + (Race.msg.sub ? '<small>' + esc(Race.msg.sub) + '</small>' : ''); if (M.dataset.h !== h) { M.dataset.h = h; M.innerHTML = h; } M.classList.add('on'); } else M.classList.remove('on');

    // the map
    const c = $('h-map').getContext('2d'), K = UI.mapK; if (K && UI.mapCv) { c.clearRect(0, 0, 170, 170); c.drawImage(UI.mapCv, 0, 0); for (const car of Race.cars) { if (car === me) continue; c.fillStyle = '#8fd8ff'; c.beginPath(); c.arc(car.x * K[0] + K[1], -car.z * K[0] + K[2], 3, 0, 7); c.fill(); } c.fillStyle = '#ffd23f'; c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.beginPath(); c.arc(me.x * K[0] + K[1], -me.z * K[0] + K[2], 4.5, 0, 7); c.fill(); c.stroke(); }

};
UI.pause = function (on) { if (App.screen !== 'race' || Race.state === 'over') return; App.paused = on; show('pause', on); if (on) Snd.engine(0.1, 0, 0, 0); };
UI.key = function (e) {

// ---- after the flag ----
UI.results = function () {

// ---- panels ----
UI.open = (title, html) => { UI.panel = title; $('panel-title').textContent = title; $('panel-body').innerHTML = html; show('panel', true); };
UI.close = () => { UI.panel = ''; show('panel', false); };
UI.settings = function () {
    const st = Save.data.settings, tog = (k, name, on, off) => '<div class="set"><span>' + name + '</span><div class="seg"><button data-set="' + k + '" class="' + (st[k] ? 'on' : '') + '">' + on + '</button><button data-set="' + k + '" class="' + (st[k] ? '' : 'on') + '">' + off + '</button></div></div>';

UI.how = () => UI.open('HOW TO DRIVE', '<div class="keys"><span><kbd>W</kbd> <kbd>↑</kbd></span><span>Gas</span><span><kbd>S</kbd> <kbd>↓</kbd></span><span>Brake, then reverse</span><span><kbd>A</kbd> <kbd>D</kbd></span><span>Steer</span><span><kbd>Space</kbd></span><span>Handbrake: lets the back slide round a tight bend</span><span><kbd>C</kbd></span><span>Camera: close, far, bonnet</span><span><kbd>R</kbd></span><span>Put the car back on the road</span></div><p>Brake in a straight line before a bend, turn in, and come back on the gas as the road opens. Too much gas while the wheels are turned and the back steps out: ease off and steer into it.</p><p>The blue barrier is on your left and the pink one on your right, all the way round.</p><p>A gamepad works too: stick to steer, right trigger gas, left trigger brake.</p>');

// ---- 90-boot.js ----
// ---- start
// for tests and for looking around from the console
window.__nightline = { App, R, HG3D, keys, hit, Save, World, Track, Race, Car, Cars, CARS, CLASSES, FEEL, SEAT, PAINTS, LEVELS, UI, Snd, LOOK, TRACKDATA,
    step(n, dt) { for (let i = 0; i < (n || 1); i++) Race.step(dt || STEP); }, draw(dt) { tick(dt || 0.016); return App.calls; } };
if (!R) UI.fatal('This device cannot run WebGL2, so Highbeam cannot start here.');
else {
    Save.load(); Snd.setVol(Save.data.settings.sfx); resize(); requestAnimationFrame(frame);
    // ?go=race or ?go=trial starts at once (tests), otherwise the menu

    else UI.menu().then(() => { window.__nightline.started = true; });
