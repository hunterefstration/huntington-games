<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nightline</title>
<style>
/* NIGHTLINE: its own look. Near-black glass, thin lines, two neon colours (hot pink, ice blue), slanted wide type. */
:root { --pink: #ff2e88; --ice: #35e0ff; --amber: #ffc24a; --ink: #05060c; --glass: rgba(8, 10, 20, .72); --line: rgba(255, 255, 255, .14); --dim: #8d93ad; --tx: #eef1ff; --hd: 'Arial Black', 'Segoe UI Black', Roboto, Arial, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--tx); font: 500 14px/1.4 Roboto, 'Segoe UI', Arial, sans-serif; user-select: none; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border: 1px solid rgba(255, 255, 255, .35); font: 700 11px Roboto, Arial, sans-serif; text-align: center; letter-spacing: .04em; }
#veil { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .5) 100%); }
.nl-logo { font: italic 900 30px/1 var(--hd); letter-spacing: .02em; transform: skewX(-8deg); color: #fff; text-shadow: 0 0 18px rgba(255, 46, 136, .9), 0 0 46px rgba(255, 46, 136, .5), 3px 0 0 rgba(53, 224, 255, .55); }
.nl-logo b { color: var(--pink); text-shadow: 0 0 18px rgba(255, 46, 136, 1), 0 0 50px rgba(255, 46, 136, .7); margin-left: .12em; }
.nl-logo.big { font-size: clamp(44px, 9vw, 120px); }

/* ---- the menu: the car drives the circuit behind it ---- */
#menu { position: fixed; inset: 0; background: linear-gradient(90deg, rgba(5, 6, 12, .82) 0, rgba(5, 6, 12, .25) 34%, rgba(5, 6, 12, 0) 52%, rgba(5, 6, 12, .3) 76%, rgba(5, 6, 12, .78) 100%), linear-gradient(0deg, rgba(5, 6, 12, .7), rgba(5, 6, 12, 0) 30%); }
#m-top { position: absolute; left: 34px; right: 34px; top: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
#m-rec { display: flex; gap: 26px; text-align: right; text-shadow: 0 2px 8px #000; }
#m-rec b { display: block; font: 900 22px/1 var(--hd); } #m-rec small { font-size: 10px; letter-spacing: .26em; color: #c5cae0; }
#m-main { position: absolute; left: 34px; right: 34px; top: 92px; bottom: 44px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
#m-left { width: min(360px, 36vw); display: flex; flex-direction: column; gap: 10px; }
#m-left .go { background: linear-gradient(100deg, var(--pink), #ff5e3a); border: 0; padding: 20px 22px; text-align: left; transform: skewX(-8deg); box-shadow: 0 0 34px rgba(255, 46, 136, .55), 0 14px 40px rgba(0, 0, 0, .6); transition: filter .12s, transform .12s; }
#m-left .go b { display: block; font: italic 900 34px/1 var(--hd); letter-spacing: .08em; color: #fff; } #m-left .go small { display: block; margin-top: 7px; font: 700 11px/1 Roboto, Arial, sans-serif; letter-spacing: .2em; color: rgba(255, 255, 255, .9); text-transform: uppercase; }
#m-left .go:hover { filter: brightness(1.15); transform: skewX(-8deg) translateX(4px); }
#m-left .alt { background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--ice); padding: 13px 18px; text-align: left; transform: skewX(-8deg); backdrop-filter: blur(6px); }
#m-left .alt b { display: block; font: italic 900 18px/1 var(--hd); letter-spacing: .1em; } #m-left .alt small { display: block; margin-top: 5px; font-size: 11.5px; color: var(--dim); letter-spacing: .03em; }
#m-left .alt:hover { border-color: var(--ice); box-shadow: 0 0 22px rgba(53, 224, 255, .35); }
.rows { background: var(--glass); border: 1px solid var(--line); padding: 10px 14px; backdrop-filter: blur(6px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; } .row > span { font-size: 10.5px; letter-spacing: .26em; color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: none; border: 0; padding: 7px 12px; font: 800 11.5px Roboto, Arial, sans-serif; letter-spacing: .14em; color: #aab0c8; }
.seg button:hover { color: #fff; } .seg button.on { background: var(--ice); color: #04121a; box-shadow: 0 0 16px rgba(53, 224, 255, .6); }
.seg button.lock { opacity: .4; }
#m-links { display: flex; gap: 8px; } #m-links button { flex: 1; background: none; border: 1px solid var(--line); padding: 9px 8px; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .18em; color: #c5cae0; } #m-links button:hover { color: #fff; border-color: #fff; }
#m-car { width: min(400px, 40vw); background: var(--glass); border: 1px solid var(--line); border-top: 3px solid var(--pink); padding: 14px 16px 12px; backdrop-filter: blur(6px); }
#car-head small { font-size: 10.5px; letter-spacing: .28em; color: var(--ice); } #car-head h2 { margin: 2px 0 3px; font: italic 900 32px/1 var(--hd); letter-spacing: .05em; } #car-head p { margin: 0 0 8px; font-size: 12.5px; color: #c5cae0; min-height: 34px; }
.bar { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: 10.5px; letter-spacing: .2em; color: var(--dim); margin: 5px 0; } .bar i { display: block; height: 5px; background: rgba(255, 255, 255, .14); position: relative; } .bar i u { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--ice), #fff); box-shadow: 0 0 10px rgba(53, 224, 255, .7); } .bar b { color: #fff; text-align: right; font: 800 12px Roboto, Arial, sans-serif; letter-spacing: .02em; }
#car-paint { display: flex; gap: 6px; margin: 10px 0 10px; } #car-paint button { width: 30px; height: 18px; border: 1px solid rgba(255, 255, 255, .3); transform: skewX(-12deg); padding: 0; } #car-paint button.on { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px currentColor; }
#car-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#car-pick button { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); padding: 8px 6px; text-align: left; } #car-pick button b { display: block; font: italic 900 13px/1 var(--hd); letter-spacing: .05em; } #car-pick button small { font-size: 9.5px; letter-spacing: .16em; color: var(--dim); }
#car-pick button.on { border-color: var(--pink); background: rgba(255, 46, 136, .16); box-shadow: 0 0 16px rgba(255, 46, 136, .35); } #car-pick button.lock { opacity: .5; } #car-pick button.lock small { color: var(--amber); }
#car-lock { margin-top: 9px; font-size: 12px; color: var(--amber); letter-spacing: .04em; }
#m-foot { position: absolute; left: 34px; right: 34px; bottom: 14px; display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .22em; color: #7c829c; text-transform: uppercase; }

/* ---- panels, loading, pause, results ---- */
#panel, #pause, #results, #loading, #fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4, 5, 10, .72); z-index: 20; }
#loading { flex-direction: column; background: #04050a; } #load-map { margin-top: 26px; font-size: 12px; letter-spacing: .4em; color: var(--ice); } #load-bar { margin-top: 16px; width: min(420px, 60vw); height: 3px; background: rgba(255, 255, 255, .12); } #load-bar i { display: block; height: 100%; width: 0; background: var(--pink); box-shadow: 0 0 14px var(--pink); transition: width .25s; }
#panel-box, #pause .box, .res { background: rgba(8, 10, 20, .94); border: 1px solid var(--line); border-top: 3px solid var(--pink); padding: 18px 22px; width: min(560px, 92vw); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); }
#panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; } #panel-head h2, #pause h2 { margin: 0; font: italic 900 24px/1 var(--hd); letter-spacing: .08em; }
#panel-x { background: none; border: 1px solid var(--line); padding: 6px 10px; font-size: 11px; letter-spacing: .16em; }
#panel-body p { color: #c5cae0; margin: 6px 0; } #panel-body .set { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line); } #panel-body .set > span { font-size: 11px; letter-spacing: .2em; color: var(--dim); } #panel-body input[type=range] { width: 180px; accent-color: var(--pink); }
#panel-body .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin-top: 8px; }
#pause .box { width: min(320px, 90vw); display: flex; flex-direction: column; gap: 8px; } #pause h2 { margin-bottom: 8px; }
#pause button, .res button { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); padding: 11px 14px; font: 800 12px Roboto, Arial, sans-serif; letter-spacing: .2em; text-align: left; } #pause button:hover, .res button:hover { border-color: #fff; } #pause button:first-of-type, .res button.pri { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 22px rgba(255, 46, 136, .5); }
.res { width: min(620px, 94vw); } .res .place { font: italic 900 clamp(46px, 8vw, 84px)/1 var(--hd); letter-spacing: .04em; text-shadow: 0 0 30px rgba(255, 46, 136, .8); } .res .place small { font: 800 13px Roboto, Arial, sans-serif; letter-spacing: .3em; color: var(--ice); margin-left: 12px; text-shadow: none; vertical-align: middle; }
.res .nums { display: flex; gap: 28px; margin: 10px 0 12px; } .res .nums b { display: block; font: 900 22px/1.1 var(--hd); } .res .nums small { font-size: 10px; letter-spacing: .26em; color: var(--dim); }
.res table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; } .res td { padding: 4px 6px; border-top: 1px solid var(--line); } .res tr.me td { background: rgba(255, 46, 136, .16); color: #fff; font-weight: 800; } .res td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.res .got { border: 1px solid var(--amber); color: var(--amber); padding: 9px 12px; margin-bottom: 12px; letter-spacing: .06em; box-shadow: 0 0 20px rgba(255, 194, 74, .25); } .res .next { color: #c5cae0; font-size: 12.5px; margin-bottom: 12px; }
.res .btns { display: flex; gap: 8px; } .res .btns button { flex: 1; text-align: center; }
#fatal { padding: 30px; text-align: center; font-size: 16px; }
#stats { position: fixed; left: 8px; top: 8px; font: 11px/1.4 monospace; color: #9fd; white-space: pre; pointer-events: none; z-index: 30; text-shadow: 0 1px 2px #000; }

/* ---- the dials ---- */
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 10px rgba(0, 0, 0, .9); font-variant-numeric: tabular-nums; }
#hud small { display: block; font-size: 10px; letter-spacing: .3em; color: #c5cae0; }
#h-pos { position: absolute; left: 30px; top: 22px; transform: skewX(-8deg); } #h-place { font: italic 900 64px/0.9 var(--hd); color: #fff; text-shadow: 0 0 24px rgba(255, 46, 136, .9), 3px 0 0 var(--pink); } #h-of { font: italic 900 24px var(--hd); color: #c5cae0; margin-left: 4px; }
#h-lap { position: absolute; left: 172px; top: 34px; transform: skewX(-8deg); } #h-lapn { font: italic 900 38px/0.9 var(--hd); } #h-lapof { font: italic 900 18px var(--hd); color: #c5cae0; margin-left: 3px; }
#h-time { position: absolute; right: 30px; top: 24px; text-align: right; display: flex; flex-direction: column; gap: 6px; } #h-time b { font: 900 22px/1 var(--hd); letter-spacing: .02em; } #h-time div:first-child b { font-size: 30px; } #h-best { color: var(--ice); }
#h-speed { position: absolute; right: 34px; bottom: 26px; text-align: right; transform: skewX(-8deg); } #h-kmh { font: italic 900 78px/0.85 var(--hd); letter-spacing: -.01em; text-shadow: 0 0 26px rgba(53, 224, 255, .7), 3px 0 0 rgba(53, 224, 255, .7); } #h-unit { display: block; font: 800 11px Roboto, Arial, sans-serif; letter-spacing: .34em; color: #c5cae0; margin-top: 4px; }
#h-gear { position: absolute; right: 100%; bottom: 20px; margin-right: 16px; font: italic 900 34px/1 var(--hd); color: var(--amber); font-style: italic; }
#h-rev { width: 250px; height: 7px; background: rgba(255, 255, 255, .14); margin: 0 0 10px auto; position: relative; } #h-rev i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--ice) 0, var(--ice) 70%, var(--pink) 88%); box-shadow: 0 0 12px rgba(53, 224, 255, .8); }
#h-map { position: absolute; left: 26px; bottom: 22px; width: 170px; height: 170px; opacity: .95; }
#h-board { position: absolute; left: 30px; top: 108px; font: 800 12px/1.55 Roboto, Arial, sans-serif; letter-spacing: .08em; } #h-board div { display: flex; gap: 8px; opacity: .8; } #h-board div.me { color: var(--pink); opacity: 1; } #h-board i { width: 14px; font-style: normal; color: #c5cae0; } #h-board em { font-style: normal; color: #9aa0b8; margin-left: 4px; }
#h-lights { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 18px; background: rgba(5, 6, 12, .7); border: 1px solid var(--line); } #h-lights i { width: 34px; height: 34px; border-radius: 50%; background: #1a0508; border: 1px solid rgba(255, 255, 255, .2); } #h-lights i.on { background: #ff2030; box-shadow: 0 0 30px #ff2030, 0 0 70px rgba(255, 32, 48, .6); } #h-lights.go i { background: #2dff7a; box-shadow: 0 0 30px #2dff7a, 0 0 70px rgba(45, 255, 122, .6); }
#h-msg { position: absolute; left: 0; right: 0; top: 17%; text-align: center; font: italic 900 clamp(26px, 4vw, 46px)/1.1 var(--hd); letter-spacing: .08em; text-shadow: 0 0 26px rgba(53, 224, 255, .8); opacity: 0; transition: opacity .2s; } #h-msg.on { opacity: 1; } #h-msg small { margin-top: 8px; font: 800 13px Roboto, Arial, sans-serif; letter-spacing: .3em; color: #fff; }
#h-wrong { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font: italic 900 34px var(--hd); letter-spacing: .14em; color: #ff3040; text-shadow: 0 0 24px #ff2030; animation: blink .5s steps(2) infinite; }
#h-keys { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 11.5px; letter-spacing: .14em; color: #dfe3f5; transition: opacity 1s; } #h-keys kbd { margin: 0 3px 0 12px; }
@keyframes blink { 50% { opacity: .25; } }
@media (max-height: 520px) { #m-main { top: 76px; } #car-head p { display: none; } #m-left .go { padding: 14px 20px; } }

</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"></div>

<div id="menu" class="hidden">
  <div id="m-top"><div class="nl-logo">NIGHT<b>LINE</b></div><div id="m-rec"></div></div>
  <div id="m-main">
    <div id="m-left">
      <button class="go" data-act="race"><b>RACE</b><small id="go-sub"></small></button>
      <button class="alt" data-act="trial"><b>TIME TRIAL</b><small>alone on the circuit, against your best lap</small></button>
      <div class="rows">
        <div class="row"><span>DRIVERS</span><div class="seg" id="seg-level"></div></div>
        <div class="row"><span>LAPS</span><div class="seg" id="seg-laps"></div></div>
      </div>
      <div id="m-links"><button data-act="settings">SETTINGS</button><button data-act="how">HOW TO DRIVE</button></div>
    </div>
    <div id="m-car">
      <div id="car-head"></div>
      <div id="car-bars"></div>
      <div id="car-paint"></div>
      <div id="car-pick"></div>
    </div>
  </div>
  <div id="m-foot"></div>
</div>

<div id="panel" class="hidden"><div id="panel-box"><div id="panel-head"><h2 id="panel-title"></h2><button id="panel-x">BACK <kbd>Esc</kbd></button></div><div id="panel-body"></div></div></div>
<div id="loading" class="hidden"><div class="nl-logo big">NIGHT<b>LINE</b></div><div id="load-map"></div><div id="load-bar"><i></i></div></div>

<div id="hud" class="hidden">
  <div id="h-pos"><b id="h-place">1</b><span id="h-of">/8</span><small>POSITION</small></div>
  <div id="h-lap"><b id="h-lapn">1</b><span id="h-lapof">/3</span><small>LAP</small></div>
  <div id="h-time"><div><small>TIME</small><b id="h-t">0:00.000</b></div><div><small>BEST</small><b id="h-best">-:--.---</b></div><div><small>LAST</small><b id="h-last">-:--.---</b></div></div>
  <div id="h-speed"><div id="h-rev"><i></i></div><b id="h-kmh">0</b><span id="h-unit">KM/H</span><em id="h-gear">1</em></div>
  <canvas id="h-map" width="170" height="170"></canvas>
  <div id="h-board"></div>
  <div id="h-lights" class="hidden"><i></i><i></i><i></i></div>
  <div id="h-msg"></div>
  <div id="h-wrong" class="hidden">WRONG WAY</div>
  <div id="h-keys"></div>
</div>
<div id="pause" class="hidden"><div class="box"><h2>PAUSED</h2><button data-act="resume">RESUME</button><button data-act="restart">START AGAIN</button><button data-act="psettings">SETTINGS</button><button data-act="quit">LEAVE THE RACE</button></div></div>
<div id="results" class="hidden"></div>
<div id="stats" class="hidden"></div>
<div id="fatal" class="hidden"></div>
<script type="module">
// ---- 05-hg3d.js ----
// HG3D engine. BUILT FILE: edit engine/src/*.js, then run `node tools/build-engine.js`.
const HG3D = (() => {
'use strict';
// ---- 00-core.js ----
// ============================================================
// HG3D core: WebGL2 context, GL state cache, small allocation-free math.
// Built for 4 GB Chromebooks with integrated graphics: few GL calls, tiny shaders, no garbage per frame.
// The engine never imports three.js. It draws any scene made of objects shaped like three's
// (visible, children, matrixWorld.elements, geometry.attributes, material...), so the same renderer
// serves the three.js games through the facade (50-facade.js) and native scenes (60-native.js).
// ============================================================
const VERSION = '1.0.0';
const WARNED = {};
function warnOnce(msg) { if (!WARNED[msg]) { WARNED[msg] = 1; try { console.warn('[HG3D] ' + msg); } catch (e) { } } }

// ---------- math: column-major 4x4 in Float32Array(16) ----------
const M4 = {
    ident(o) { o[0] = 1; o[1] = 0; o[2] = 0; o[3] = 0; o[4] = 0; o[5] = 1; o[6] = 0; o[7] = 0; o[8] = 0; o[9] = 0; o[10] = 1; o[11] = 0; o[12] = 0; o[13] = 0; o[14] = 0; o[15] = 1; return o; },
    copy(o, a) { for (let i = 0; i < 16; i++) o[i] = a[i]; return o; },
    mul(o, a, b) {          // o = a * b (o may be a or b)
        const a0 = a[0], a1 = a[1], a2 = a[2], a3 = a[3], a4 = a[4], a5 = a[5], a6 = a[6], a7 = a[7], a8 = a[8], a9 = a[9], a10 = a[10], a11 = a[11], a12 = a[12], a13 = a[13], a14 = a[14], a15 = a[15];
        for (let c = 0; c < 16; c += 4) {
            const b0 = b[c], b1 = b[c + 1], b2 = b[c + 2], b3 = b[c + 3];
            o[c] = a0 * b0 + a4 * b1 + a8 * b2 + a12 * b3; o[c + 1] = a1 * b0 + a5 * b1 + a9 * b2 + a13 * b3;
            o[c + 2] = a2 * b0 + a6 * b1 + a10 * b2 + a14 * b3; o[c + 3] = a3 * b0 + a7 * b1 + a11 * b2 + a15 * b3;
        }
        return o;
    },
    invert(o, m) {
        const n11 = m[0], n21 = m[1], n31 = m[2], n41 = m[3], n12 = m[4], n22 = m[5], n32 = m[6], n42 = m[7], n13 = m[8], n23 = m[9], n33 = m[10], n43 = m[11], n14 = m[12], n24 = m[13], n34 = m[14], n44 = m[15];
        const t11 = n23 * n34 * n42 - n24 * n33 * n42 + n24 * n32 * n43 - n22 * n34 * n43 - n23 * n32 * n44 + n22 * n33 * n44,
            t12 = n14 * n33 * n42 - n13 * n34 * n42 - n14 * n32 * n43 + n12 * n34 * n43 + n13 * n32 * n44 - n12 * n33 * n44,
            t13 = n13 * n24 * n42 - n14 * n23 * n42 + n14 * n22 * n43 - n12 * n24 * n43 - n13 * n22 * n44 + n12 * n23 * n44,
            t14 = n14 * n23 * n32 - n13 * n24 * n32 - n14 * n22 * n33 + n12 * n24 * n33 + n13 * n22 * n34 - n12 * n23 * n34;
        const det = n11 * t11 + n21 * t12 + n31 * t13 + n41 * t14;
        if (det === 0) return M4.ident(o);
        const d = 1 / det;
        o[0] = t11 * d; o[1] = (n24 * n33 * n41 - n23 * n34 * n41 - n24 * n31 * n43 + n21 * n34 * n43 + n23 * n31 * n44 - n21 * n33 * n44) * d;
        o[2] = (n22 * n34 * n41 - n24 * n32 * n41 + n24 * n31 * n42 - n21 * n34 * n42 - n22 * n31 * n44 + n21 * n32 * n44) * d;
        o[3] = (n23 * n32 * n41 - n22 * n33 * n41 - n23 * n31 * n42 + n21 * n33 * n42 + n22 * n31 * n43 - n21 * n32 * n43) * d;
        o[4] = t12 * d; o[5] = (n13 * n34 * n41 - n14 * n33 * n41 + n14 * n31 * n43 - n11 * n34 * n43 - n13 * n31 * n44 + n11 * n33 * n44) * d;

// NIGHTLINE: street racing at night, drawn by HG3D alone (no three.js). The owner, 2026-11-24: "make a racing game with
// the new engine. Prioritize looks." The city is one Blender-made, light-baked file (assets/<circuit>.hgm, made by
// tools/blender/make_nl_<circuit>.py through the centre line in art/nightline/tracks.json); everything that moves is lit
// where it stands from the file's baked light, and the picture gets HG3D's glow.
//   10-core   the page, the picture size, keys, sound          14-track  the centre line, where a car is on it, the fast line
//   20-world  the city, its lights on the wet road, particles  30-car    how a car drives and how it is drawn
//   40-race   the grid, the computer's drivers, laps, places   60-ui     menus, the dials, the results
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $('view'), Q = new URLSearchParams(location.search), M4 = HG3D.M4;
const BASE = window.HG_BASE || '', BUILD = window.HG_PROOF || window.HG_VERSION || 0, VERSION = '0.1';
// The paste-in loader gives BASE (this game's folder at a build's tag). The asset files are published in packs of their own
// (tools/proof-publish.mjs: grouped by the first word of the file name); packs.json beside the game folders says which tag holds which.
const Packs = { map: null, slug: 'nightline' };
Packs.ready = (async () => { if (!/@[^\/]+\//.test(BASE)) return; try { const r = await fetch(BASE.replace(/[^\/]+\/$/, '') + 'packs.json'); if (r.ok) Packs.map = await r.json(); } catch (e) { } })();
const AST = file => { const t = Packs.map && Packs.map[Packs.slug + '/' + file.split(/[_.]/)[0]]; return (t ? BASE.replace(/@[^\/]+\//, '@' + t + '/') : BASE) + 'assets/' + file; };
const R = HG3D.createRenderer({ canvas });
const App = { screen: 'boot', paused: true, basePR: 1, scale: 1, lite: 0, fps: 0, ms: 0, calls: 0, tris: 0, errors: [], t: 0 };
if (R) { R.toneMapping = 4; R.outputColorSpace = 'srgb'; }
addEventListener('error', e => { App.errors.push(String(e.message)); });
addEventListener('unhandledrejection', e => { App.errors.push(String(e.reason && e.reason.message || e.reason)); });
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, rand = (a, b) => a + Math.random() * (b - a), TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = t => { if (!isFinite(t) || t <= 0) return '-:--.---'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };

// ---- picture size: no more pixels than a Chromebook screen has; the governor makes it smaller when frames are slow.
// Glow is a look, so it never costs frames: the first time the picture has to shrink while glow is on, glow goes off
// and this device remembers (g: 0). ?glow=1 tries again, ?glow=0 forces it off.
const PERF_KEY = 'hg3d:perf:nightline'; let perf0 = {}; try { perf0 = JSON.parse(localStorage.getItem(PERF_KEY) || '{}') || {}; } catch (e) { }
App.scale = clamp(+perf0.s || 1, 0.6, 1); App.glowBad = Q.get('glow') === '1' ? false : perf0.g === 0; App.glow = !App.glowBad && Q.get('glow') !== '0';
let perfLive = false; const perfKeep = () => { if (!perfLive) return; try { localStorage.setItem(PERF_KEY, JSON.stringify({ s: App.scale, g: App.glowBad ? 0 : 1 })); } catch (e) { } };
function resize() {
    if (!R) return; const w = innerWidth, h = innerHeight; App.basePR = +Q.get('pr') || Math.min(devicePixelRatio || 1, 1600 / w);
    R.setPixelRatio(App.basePR * App.scale); R.setSize(w, h, false); if (World.camera) { World.camera.aspect = w / h; World.camera.updateProjection(); }
}
addEventListener('resize', resize);
const gov = HG3D.governor({ min: 0.6, start: App.scale, apply: s => { if (s < 1 && App.glow && perfLive) { App.glow = false; App.glowBad = true; } App.scale = s; if (R) R.setPixelRatio(App.basePR * s); perfKeep(); }, paused: () => App.paused });

// ---- keys (a racing game needs no mouse in play)
const keys = {}, hit = {};
addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (!keys[e.code]) hit[e.code] = true; keys[e.code] = true;
    if (/^(Space|Arrow|Tab)/.test(e.code)) e.preventDefault();
    UI.key(e);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// a gamepad, when one is plugged in (stick or pad to steer, right trigger gas, left trigger brake, A handbrake)
const Pad = { steer: 0, gas: 0, brake: 0, hand: false, on: false,
    read() { this.on = false; const ps = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of ps) { if (!p || !p.connected) continue; const b = p.buttons, ax = p.axes[0] || 0; this.steer = Math.abs(ax) > 0.12 ? ax : (b[14] && b[14].pressed ? -1 : b[15] && b[15].pressed ? 1 : 0); this.gas = b[7] ? b[7].value : 0; this.brake = b[6] ? b[6].value : 0; this.hand = !!(b[0] && b[0].pressed); this.on = true; return; } this.steer = this.gas = this.brake = 0; this.hand = false; } };

// ---- small shared things
function aces(c, exposure) {
    const k = exposure / 0.6, r = c[0] * k, g = c[1] * k, b = c[2] * k;
    const a = [0.59719 * r + 0.35458 * g + 0.04823 * b, 0.07600 * r + 0.90834 * g + 0.01566 * b, 0.02840 * r + 0.13383 * g + 0.83777 * b];
    for (let i = 0; i < 3; i++) { const v = a[i]; a[i] = (v * (v + 0.0245786) - 0.000090537) / (v * (0.983729 * v + 0.4329510) + 0.238081); }
    return [clamp(1.60475 * a[0] - 0.53108 * a[1] - 0.07367 * a[2], 0, 1), clamp(-0.10208 * a[0] + 1.10813 * a[1] - 0.00605 * a[2], 0, 1), clamp(-0.00327 * a[0] - 0.07276 * a[1] + 1.07602 * a[2], 0, 1)];
}
const lum = c => c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
function blobTexture(size, stops, srgb) {
    const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const s of stops) gr.addColorStop(s[0], s[1]); g.fillStyle = gr; g.fillRect(0, 0, size, size); return HG3D.texture(c, { srgb: !!srgb });
}
// Where a thing stands and how it is turned, written straight into a matrix (16 numbers, columns: left, up, forward, place).
// Yaw 0 looks along +z and a growing yaw turns LEFT (toward +x when heading +z), the same way round as the track's "left";
// pitch lifts the nose; roll > 0 drops the left side. Models are built +z forward, +y up, so their +x is their left.
function poseMatrix(e, x, y, z, yaw, pitch, roll, s) {
    const sy = Math.sin(yaw), cy = Math.cos(yaw), sp = Math.sin(pitch || 0), cp = Math.cos(pitch || 0), sr = Math.sin(roll || 0), cr = Math.cos(roll || 0), k = s || 1;
    const fx = sy * cp, fy = sp, fz = cy * cp, lx = cy, lz = -sy, ux = fy * lz, uy = fz * lx - fx * lz, uz = -fy * lx;
    e[0] = (lx * cr - ux * sr) * k; e[1] = (-uy * sr) * k; e[2] = (lz * cr - uz * sr) * k; e[3] = 0;
    e[4] = (ux * cr + lx * sr) * k; e[5] = (uy * cr) * k; e[6] = (uz * cr + lz * sr) * k; e[7] = 0;
    e[8] = fx * k; e[9] = fy * k; e[10] = fz * k; e[11] = 0; e[12] = x; e[13] = y; e[14] = z; e[15] = 1; return e;
}

// ---- sound: all of it made here (no files). An engine is two saws and a square through a low-pass that opens with the
// revs; tyres are filtered noise; the wind is the same noise, lower.
const Snd = { ctx: null, noise: null, eng: null, vol: 0.8,
    init() {
        if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
        try { const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C(); const b = this.ctx.createBuffer(1, 44100, 44100), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.noise = b; this.master = this.ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
    },
    setVol(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
    tone(freq, vol, dur, type, to) { const c = this.ctx; if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02); },
    thud(vol) { const c = this.ctx; if (!c) return; const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noise; f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(90, t + 0.25); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.32); },
    // the player's engine, tyres and wind run all the time a race is on
    engineOn() {
        const c = this.ctx; if (!c || this.eng) return; const E = this.eng = {}; E.out = c.createGain(); E.out.gain.value = 0; E.lp = c.createBiquadFilter(); E.lp.type = 'lowpass'; E.lp.frequency.value = 500; E.lp.Q.value = 1.2;
        E.o = [['sawtooth', 1, 0.5], ['sawtooth', 0.502, 0.42], ['square', 2.01, 0.12]].map(([type, mul, g]) => { const o = c.createOscillator(), gg = c.createGain(); o.type = type; o.frequency.value = 60 * mul; gg.gain.value = g; o.connect(gg); gg.connect(E.lp); o.start(); return { o, mul }; });
        E.lp.connect(E.out); E.out.connect(this.master);
        const mk = (type, f, q) => { const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.noise; s.loop = true; fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(this.master); s.start(); return { s, fl, g }; };
        E.sq = mk('bandpass', 1500, 3.5); E.wind = mk('lowpass', 420, 0.4);
    },
    engine(rpm, load, slip, speed) {      // rpm 0..1, load 0..1 (the pedal), slip 0..1 (tyres letting go), speed in m/s
        const E = this.eng, c = this.ctx; if (!E) return; const t = c.currentTime, f = 48 + rpm * 165;
        for (const x of E.o) x.o.frequency.setTargetAtTime(f * x.mul, t, 0.03);
        E.lp.frequency.setTargetAtTime(380 + rpm * 2400 * (0.45 + load * 0.55), t, 0.05); E.out.gain.setTargetAtTime(0.11 + load * 0.1 + rpm * 0.05, t, 0.06);
        E.sq.g.gain.setTargetAtTime(Math.min(0.22, slip * 0.3), t, 0.05); E.sq.fl.frequency.setTargetAtTime(1200 + slip * 900, t, 0.1);
        E.wind.g.gain.setTargetAtTime(Math.min(0.2, speed / 380), t, 0.2); E.wind.fl.frequency.setTargetAtTime(300 + speed * 9, t, 0.2);
    },
    engineOff() { const E = this.eng; if (!E) return; const t = this.ctx.currentTime; E.out.gain.setTargetAtTime(0, t, 0.08); E.sq.g.gain.setTargetAtTime(0, t, 0.05); E.wind.g.gain.setTargetAtTime(0, t, 0.1); setTimeout(() => { try { for (const x of E.o) x.o.stop(); E.sq.s.stop(); E.wind.s.stop(); } catch (e) { } }, 500); this.eng = null; }
};

// ---- the loop: the race runs in fixed steps of 1/120 s (the tyres are stiff), the picture as often as it can
let lastTs = 0, accMs = 0, accN = 0, accT = 0, simAcc = 0;
const STEP = 1 / 120;
function tick(dt) {
    App.t += dt; Pad.read();
    if (!App.paused && Race.on) { simAcc = Math.min(simAcc + dt, 0.1); while (simAcc >= STEP) { Race.step(STEP); simAcc -= STEP; } }
    const a = performance.now();
    if (World.loaded) { Race.frame(dt); World.frame(dt); App.calls = 0; App.tris = 0; R.autoClear = true; R.render(World.scene, World.camera); App.calls = R.info.render.calls; App.tris = R.info.render.triangles; World.glowDraw(); }
    UI.frame(dt);
    for (const k in hit) delete hit[k];
    accMs += performance.now() - a; accN++;
}
function frame(ts) {
    requestAnimationFrame(frame); const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts; if (document.hidden) return;
    tick(dt); perfLive = !App.paused;
    accT += dt; if (accT >= 0.5) { App.fps = Math.round(accN / accT); App.ms = accMs / accN; accT = 0; accN = 0; accMs = 0; }
}

// ---- 14-track.js ----
// ============================================================
// The circuit as numbers. TRACKDATA (13-trackdata.js, made by tools/race-track.mjs) is the centre line: a closed row of
// samples `step` metres apart, each [x, y, z, tx, tz, bank]. A place on the circuit is (u, d): u = how far round, counted
// in samples (it wraps at N), d = metres LEFT of the centre line (left of the driving direction (tx, tz) is (tz, -tx)).
// The road is `W` wide; the barriers stand at `half` = W / 2 + wall on both sides.
// ============================================================
const Track = { id: '', S: null, N: 0, step: 3, W: 14, half: 8.5, len: 0, line: null, kap: null };
Track.use = function (id) {
    const T = TRACKDATA[id] || TRACKDATA[Object.keys(TRACKDATA)[0]]; Track.id = T.id; Track.name = T.name; Track.S = T.s; Track.N = T.s.length; Track.step = T.step; Track.W = T.width; Track.half = T.width / 2 + T.wall; Track.len = T.length; Track.marks = T.marks || {};
    Track.fastLine(); return T;
};
// the centre line at u: o = { x, y, z, tx, tz, bank }
Track.at = function (u, o) {
    const N = Track.N, S = Track.S; u = ((u % N) + N) % N; const i = Math.floor(u), f = u - i, a = S[i], b = S[(i + 1) % N];
    o.x = a[0] + (b[0] - a[0]) * f; o.y = a[1] + (b[1] - a[1]) * f; o.z = a[2] + (b[2] - a[2]) * f; const tx = a[3] + (b[3] - a[3]) * f, tz = a[4] + (b[4] - a[4]) * f, l = Math.hypot(tx, tz) || 1; o.tx = tx / l; o.tz = tz / l; o.bank = a[5] + (b[5] - a[5]) * f; return o;
};
// a spot (u, d) in the world: o = { x, y, z, tx, tz, bank }
Track.spot = function (u, d, o) { Track.at(u, o); o.x += o.tz * d; o.z -= o.tx * d; o.y -= d * o.bank; return o; };
// where a point is on the circuit: o.u, o.d. `hint` (the u it was at a moment ago) makes it a short look; without one the whole line is searched.
Track.locate = function (x, z, hint, o) {
    const N = Track.N, S = Track.S; let best = 1e18, bi = 0;
    if (hint === undefined || hint === null) { for (let i = 0; i < N; i++) { const s = S[i], d = (s[0] - x) * (s[0] - x) + (s[2] - z) * (s[2] - z); if (d < best) { best = d; bi = i; } } }
    else { const h = Math.floor(hint); for (let k = -6; k <= 10; k++) { const i = ((h + k) % N + N) % N, s = S[i], d = (s[0] - x) * (s[0] - x) + (s[2] - z) * (s[2] - z); if (d < best) { best = d; bi = i; } } }
    const a = S[bi], along = (x - a[0]) * a[3] + (z - a[2]) * a[4];
    o.u = ((bi + clamp(along / Track.step, -1, 1)) % N + N) % N; o.d = (x - a[0]) * a[4] - (z - a[2]) * a[3]; return o;
};
// how far u2 is ahead of u1 along the lap, in samples (-N/2 .. N/2)
Track.ahead = (u1, u2) => { const N = Track.N; let d = (u2 - u1) % N; if (d > N / 2) d -= N; if (d < -N / 2) d += N; return d; };
// THE FAST LINE: where a quick driver puts the car (line[i] = metres left of centre) and how tight that line is there
// (kap[i], 1 / radius, signed: + is a left-hander). Found the old way: every point of an elastic band, held inside the
// road, moves toward the middle of its neighbours until the band is as straight as the road allows.
Track.fastLine = function () {
    const N = Track.N, S = Track.S, lim = Track.W / 2 - 1.7, o = new Float32Array(N), px = new Float32Array(N), pz = new Float32Array(N);
    const put = i => { px[i] = S[i][0] + S[i][4] * o[i]; pz[i] = S[i][2] - S[i][3] * o[i]; };
    for (let i = 0; i < N; i++) put(i);
    for (const stride of [12, 6, 3, 1]) for (let it = 0; it < 140; it++) for (let i = 0; i < N; i++) {
        const a = (i - stride + N) % N, b = (i + stride) % N, mx = (px[a] + px[b]) / 2, mz = (pz[a] + pz[b]) / 2;
        o[i] = clamp(o[i] + ((mx - px[i]) * S[i][4] - (mz - pz[i]) * S[i][3]) * 0.5, -lim, lim); put(i);
    }
    const k = new Float32Array(N), G = 4;
    for (let i = 0; i < N; i++) { const a = (i - G + N) % N, b = (i + G) % N, h1 = Math.atan2(px[i] - px[a], pz[i] - pz[a]), h2 = Math.atan2(px[b] - px[i], pz[b] - pz[i]), l = (Math.hypot(px[i] - px[a], pz[i] - pz[a]) + Math.hypot(px[b] - px[i], pz[b] - pz[i])) / 2; k[i] = angDiff(h2, h1) / l; }
    Track.line = o; Track.kap = k;
};
// the speed a car with `grip` (sideways m/s2), `brake` and `accel` (m/s2) and `top` (m/s) can carry at each sample of the fast line
Track.speeds = function (grip, brake, accel, top) {
    const N = Track.N, v = new Float32Array(N), ds = Track.step;
    for (let i = 0; i < N; i++) v[i] = Math.min(top, Math.sqrt(grip / Math.max(1e-4, Math.abs(Track.kap[i]))));
    for (let pass = 0; pass < 2; pass++) for (let i = N - 1; i >= 0; i--) { const n = v[(i + 1) % N]; v[i] = Math.min(v[i], Math.sqrt(n * n + 2 * brake * ds)); }
    for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) { const p = v[(i - 1 + N) % N]; v[i] = Math.min(v[i], Math.sqrt(p * p + 2 * accel * ds)); }
    return v;
};

// ---- 15-save.js ----
// ============================================================
// What is kept between visits: one key, 'nightline_save'. v counts the shape: a newer game reads an older save and fills
// in what is missing, it never wipes one. (For the launcher to sync it, gv/core.js GAME_KEYS needs 'nightline_': release.)
// ============================================================
const Save = { KEY: 'nightline_save', data: null,
    fresh() { return { v: 1, car: 'kite', paint: {}, cars: { kite: 1 }, best: {}, medals: {}, wins: 0, races: 0, podiums: 0, km: 0, seen: {},
        settings: { circuit: 'quay', laps: 3, level: 0, cam: 0, sfx: 0.8, quality: 'auto', stats: false, mph: false, shake: true } }; },
    load() {
        let d = null; try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { }
        const f = this.fresh(); if (!d || typeof d !== 'object') d = f;
        for (const k in f) { if (d[k] === undefined) d[k] = f[k]; else if (f[k] && typeof f[k] === 'object' && !Array.isArray(f[k])) for (const j in f[k]) if (d[k][j] === undefined) d[k][j] = f[k][j]; }
        this.data = d; return d;

UI.settings = function () {
    const st = Save.data.settings, tog = (k, name, on, off) => '<div class="set"><span>' + name + '</span><div class="seg"><button data-set="' + k + '" class="' + (st[k] ? 'on' : '') + '">' + on + '</button><button data-set="' + k + '" class="' + (st[k] ? '' : 'on') + '">' + off + '</button></div></div>';
    UI.open('SETTINGS', '<div class="set"><span>SOUND</span><input type="range" min="0" max="100" value="' + Math.round(st.sfx * 100) + '" id="set-sfx"></div>' + tog('mph', 'SPEED IN', 'MPH', 'KM/H') + tog('shake', 'CAMERA SHAKE', 'ON', 'OFF') + '<div class="set"><span>PICTURE</span><div class="seg"><button data-set="quality" class="' + (st.quality !== 'low' ? 'on' : '') + '">FULL</button><button data-set="quality" class="' + (st.quality === 'low' ? 'on' : '') + '">PLAIN</button></div></div>' + tog('stats', 'FRAME COUNTER', 'ON', 'OFF') + '<p>PLAIN turns off the glow round the lights. The game also shrinks its picture by itself when frames are slow.</p>');
    $('set-sfx').oninput = e => { st.sfx = e.target.value / 100; Snd.setVol(st.sfx); Save.store(); };
};
UI.how = () => UI.open('HOW TO DRIVE', '<div class="keys"><span><kbd>W</kbd> <kbd>↑</kbd></span><span>Gas</span><span><kbd>S</kbd> <kbd>↓</kbd></span><span>Brake, then reverse</span><span><kbd>A</kbd> <kbd>D</kbd></span><span>Steer</span><span><kbd>Space</kbd></span><span>Handbrake: lets the back slide round a tight bend</span><span><kbd>C</kbd></span><span>Camera: close, far, bonnet</span><span><kbd>R</kbd></span><span>Put the car back on the road</span></div><p>Brake in a straight line before a bend, turn in, and come back on the gas as the road opens. Too much gas while the wheels are turned and the back steps out: ease off and steer into it.</p><p>The blue barrier is on your left and the pink one on your right, all the way round.</p><p>A gamepad works too: stick to steer, right trigger gas, left trigger brake.</p>');

// ---- 90-boot.js ----
// ---- start
// for tests and for looking around from the console
window.__nightline = { App, R, HG3D, keys, hit, Save, World, Track, Race, Car, Cars, CARS, PAINTS, LEVELS, UI, Snd, LOOK, TRACKDATA,
    step(n, dt) { for (let i = 0; i < (n || 1); i++) Race.step(dt || STEP); }, draw(dt) { tick(dt || 0.016); return App.calls; } };
if (!R) UI.fatal('This device cannot run WebGL2, so Nightline cannot start here.');
else {
    Save.load(); Snd.setVol(Save.data.settings.sfx); resize(); requestAnimationFrame(frame);
    // ?go=race or ?go=trial starts at once (tests), otherwise the menu
    if (Q.get('go')) { if (Q.get('car') && CARS[Q.get('car')]) { Save.data.car = Q.get('car'); Save.data.cars[Q.get('car')] = 1; } if (Q.get('level')) Save.data.settings.level = clamp(+Q.get('level'), 0, 2); UI.play(Q.get('go') === 'trial' ? 'trial' : 'race').then(ok => { window.__nightline.started = ok; }); }
    else UI.menu().then(() => { window.__nightline.started = true; });
}

</script>
