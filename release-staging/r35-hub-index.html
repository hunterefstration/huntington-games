<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntington Games Launcher</title>
<style>
:root { --bg: #0d1117; --card: #161b22; --line: #2b3440; --text: #e6edf3; --dim: #8b949e; --gold: #f1c40f; --blue: #58a6ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
#hub { max-width: 1100px; margin: 0 auto; padding: 26px 16px 60px; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: 1px; }
.sub { color: var(--dim); margin: 4px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.12s, border-color 0.12s; display: flex; flex-direction: column; text-align: left; color: var(--text); padding: 0; font: inherit; }
.game:hover { transform: translateY(-2px); border-color: var(--blue); }
.shot { aspect-ratio: 16 / 9; width: 100%; background: #0a0d12; position: relative; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--dim); padding: 10px; text-align: center; }
.info { padding: 10px 12px 12px; }
.name { font-weight: 800; font-size: 16px; }
.desc { color: var(--dim); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
.tags { margin-top: 7px; }
.tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,0.07); color: var(--dim); margin-right: 3px; }
.tag.new { background: rgba(241,196,15,0.18); color: var(--gold); }
#exp-btn { position: fixed; left: 8px; bottom: 6px; background: transparent; border: none; color: #3d4652; font-size: 11px; cursor: pointer; padding: 3px 5px; font-family: inherit; }
#exp-btn:hover { color: var(--dim); }
#offbar { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
#offbar.off { display: none; }
#offprog { display: none; width: 140px; height: 6px; background: #1f2630; border-radius: 3px; overflow: hidden; }
#offprog.on { display: inline-block; }
#offfill { display: block; height: 100%; width: 0; background: var(--blue); transition: width 0.3s; }
#offdl { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
#offdl:hover { color: var(--text); border-color: var(--blue); }
#offdl:disabled { opacity: 0.5; cursor: default; }
#offdlg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 6; }
#offdlg.open { display: flex; }
#offdlg .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; font-size: 14px; line-height: 1.5; }
#offdlg h2 { margin: 0 0 6px; font-size: 18px; }
#offdlg .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#offdlg .btns button { background: #1f2630; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
#exp { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 5; }
#exp.open { display: flex; }
#exp .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; }
#exp h2 { margin: 0 0 4px; font-size: 18px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: transparent; border: none; border-top: 1px solid var(--line); color: var(--text); padding: 10px 2px; text-align: left; cursor: pointer; font: inherit; }
.row:hover .rname { color: var(--blue); }
.rname { font-weight: 700; }
.rdesc { color: var(--dim); font-size: 12px; }
.close { float: right; background: #1f2630; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
#player.open { display: flex; }
#ptop { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: #11161d; border-bottom: 1px solid var(--line); }
#ptop button, #ptop a { background: #1f2630; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; }
#ptitle { flex: 1; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#frame { flex: 1; width: 100%; border: 0; background: #000; }
#ptop.hide { display: none; }
.note { color: #4b5563; font-size: 11px; margin-top: 26px; }
</style>
</head>
<body>
<div id="hub">
  <h1>HUNTINGTON GAMES LAUNCHER</h1>
  <div class="sub">Pick a game.</div>
  <div class="grid" id="grid"></div>
  <div id="offbar"><span id="offstat"></span><span id="offprog"><i id="offfill"></i></span><button id="offdl" title="Save one HTML file with every game inside, to play with no internet">Download offline copy</button></div>
  <div class="note" id="note"></div>
</div>
<div id="offdlg"><div class="box"><h2 id="offdlg-title">Offline copy</h2><div id="offdlg-text"></div><div class="btns"><button id="offdlg-again">Download again</button><button id="offdlg-tab">Open in a new tab</button><button id="offdlg-close">Close</button></div></div></div>
<button id="exp-btn" title="Prototypes and older games">experimental</button>
<div id="exp"><div class="box"><button class="close" id="exp-close">Close</button><h2>Experimental</h2><div class="rdesc" style="margin-bottom:8px">Prototypes, remixes and side projects.</div><div id="exp-list"></div></div></div>
<div id="player">
  <div id="ptop"><button id="back">&#8592; All games</button><span id="ptitle"></span><button id="full" title="Fullscreen">Fullscreen</button><button id="newtab">New tab</button></div>
  <iframe id="frame" allow="fullscreen; pointer-lock; autoplay; gamepad" allowfullscreen></iframe>
</div>

function findLatest(repo, floor, cb) {
  // Releases are git tags r1, r2, r3... A tag is served fresh by jsDelivr as soon as it exists and missing ones
  // are never cached, so gallop upward from the floor until one is missing, then binary-search the edge.

    return fetch('https://cdn.jsdelivr.net/gh/' + repo + '@r' + n + '/latest.json').then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  var lo = floor, step = 1;
  function bisect(a, b) {
    if (b - a <= 1) return cb(a);
    var m = (a + b) >> 1;
    exists(m).then(function (ok) { if (ok) bisect(m, b); else bisect(a, m); });
  }
  function gallop() {
    exists(lo + step).then(function (ok) { if (ok) { lo += step; step *= 2; gallop(); } else bisect(lo, lo + step); });
  }
  gallop();
}

      '<br><br>If nothing downloaded (some school browsers block it here), press <b>Open in a new tab</b>, then press <b>Ctrl+S</b> and choose "Webpage, HTML Only".' +
      '<br><br>Keep the file in your Files app and open it any time, with no internet. Online multiplayer (Frontline, Blocky Shooter) still needs internet.', true);
  } catch (e) {
    showOfflineDialog('Offline copy', 'Could not build the offline copy. Check your connection and try again.', false);
  }
  btn.disabled = false; btn.textContent = old;
}
function play(g) {
  var id = ++loadId;
  current = { game: g, html: null };
  document.getElementById('ptitle').textContent = g.name;
  document.getElementById('player').classList.add('open');
  try { history.replaceState(null, '', '#' + encodeURIComponent(g.dir)); } catch (e) {}
  if (local) { HG_set(g); frame.removeAttribute('srcdoc'); frame.src = path(g); return; }
  frame.srcdoc = message('Loading ' + g.name + '...');
  loadGameHtml(g).then(function (r) {
    if (id !== loadId) return;
    return prepare(r.html, g, r.base).then(function (h) {
      if (id !== loadId) return;
      current.html = h;
      frame.srcdoc = h;
    });
  }).catch(function () {
    if (id !== loadId) return;
    frame.srcdoc = message('Could not load ' + g.name + '.<br>' + (BUNDLE ? 'This game is missing from the offline copy.' : 'The game CDN (cdn.jsdelivr.net) may be blocked on this network, or you are offline and this game is not saved yet.'));
  });
}
function closePlayer() {
  loadId++; current = null;
  document.getElementById('player').classList.remove('open');
  frame.removeAttribute('srcdoc'); frame.src = 'about:blank';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
// New tab: a direct link when local, otherwise a copy of the downloaded game.
document.getElementById('newtab').onclick = function () {
  if (!current) return;
  if (local) { HG_set(current.game); window.open(path(current.game), '_blank'); return; }
  if (!current.html) return;
  try { window.open(URL.createObjectURL(new Blob([current.html], { type: 'text/html' })), '_blank'); } catch (e) {}
};
document.getElementById('back').onclick = closePlayer;
document.getElementById('full').onclick = function () { var p = document.getElementById('player'); if (document.fullscreenElement) document.exitFullscreen(); else if (p.requestFullscreen) p.requestFullscreen().catch(function () {}); };
document.addEventListener('fullscreenchange', function () { document.getElementById('ptop').classList.toggle('hide', !!document.fullscreenElement); });
document.getElementById('exp-btn').onclick = function () { document.getElementById('exp').classList.add('open'); };
document.getElementById('exp-close').onclick = function () { document.getElementById('exp').classList.remove('open'); };
document.getElementById('exp').onclick = function (e) { if (e.target.id === 'exp') e.target.classList.remove('open'); };
document.getElementById('note').textContent = BUNDLE ? 'Offline copy of release ' + BUNDLE.version + '. Online multiplayer (Frontline, Blocky Shooter) needs internet.' : local ? '' : 'Games load from the jsDelivr CDN.';
document.getElementById('offdl').onclick = downloadOffline;
document.getElementById('offdlg-close').onclick = function () { document.getElementById('offdlg').classList.remove('open'); };
document.getElementById('offdlg-again').onclick = saveOffline;
document.getElementById('offdlg-tab').onclick = function () { if (offlineUrl) { try { window.open(offlineUrl, '_blank'); } catch (e) {} } };
if (local || BUNDLE) document.getElementById('offbar').className = 'off';
function HG_dead(msg, sub) { document.documentElement.innerHTML = '<head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0e13;color:#e6edf3;font:16px \'Segoe UI\',system-ui,sans-serif;text-align:center;padding:24px"><div><div style="font-size:46px">&#128274;</div><div style="font-weight:800;font-size:22px;margin:12px 0 6px">' + msg + '</div><div style="color:#8b949e;max-width:440px;line-height:1.5">' + sub + '</div></div></body>'; }
function HG_guard() {
  var KEY = 'hg_lastok', DAY = 86400000, now = Date.now();
  if (BUNDLE) {
    var last = 0; try { last = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
    if (!last) { last = BUNDLE.builtAt || now; try { localStorage.setItem(KEY, last); } catch (e) {} }
    try { fetch(MIRROR_HOSTS[0] + REPO_NAME + '@main/gate.json', { cache: 'no-store' }).then(function (r) { if (r.ok) { try { localStorage.setItem(KEY, Date.now()); } catch (e) {} } }).catch(function () {}); } catch (e) {}
    if (now - last > 3 * DAY) { HG_dead('Offline copy expired', 'Connect to the internet to refresh this saved copy, then open it again.'); return false; }
    return true;
  }
  versionReady.then(function (v) {
    if (!MIRRORS.length) setVersion(v);
    try { fetch(MIRRORS[0] + 'gate.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.min && HG_build() < j.min) HG_dead('This version has been shut down', 'Reload the page to get the newest version.'); try { localStorage.setItem(KEY, Date.now()); } catch (e) {} }).catch(function () {}); } catch (e) {}
  });
  return true;
}
if (!HG_guard()) throw new Error('HG-expired');
render();
if (!local && !BUNDLE) startCache(); // download every game and library right away
var start = decodeURIComponent(location.hash.slice(1));
GAMES.concat(EXPERIMENTAL).forEach(function (g) { if (g.dir === start) play(g); });
</script>
