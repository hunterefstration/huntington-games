<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Steel Storm Remastered</title>
<style>
:root { --ember: #e8a020; --ember2: #ffd27a; --ash: #d9d2c6; --ink: #0a0b0e; --panel: rgba(16, 17, 21, .98); --line: rgba(255, 255, 255, .12); --dim: #8f8a82; --good: #7dff9a; --bad: #ff5a4a; }
html, body { margin: 0; height: 100%; background: var(--ink); color: #efe9df; font: 15px/1.45 Roboto, system-ui, 'Segoe UI', Arial, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
#view, #ash { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ash { z-index: 3; pointer-events: none; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 700 11px/1 Roboto, Arial, sans-serif; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: rgba(255, 255, 255, .06); margin-left: 6px; }
.logo { display: block; width: 100%; height: auto; overflow: visible; }
.logo text { font: 900 150px 'Arial Black', Roboto, Arial, sans-serif; }

/* ---- the intro: white letters typed onto black, then the name */
#intro { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; align-items: center; justify-content: center; padding: 8vw; }
#intro-text { font: 500 clamp(18px, 2.6vw, 34px)/1.7 'Courier New', Cousine, monospace; color: #fff; letter-spacing: .04em; text-align: center; white-space: pre-wrap; text-shadow: 0 0 12px rgba(255, 255, 255, .25); min-height: 1.7em; }
#intro-text .cut { color: #777; text-decoration: line-through; text-decoration-color: var(--ember); transition: color .4s; }
#intro-text .caret { display: inline-block; width: .6em; height: 1.05em; background: #fff; vertical-align: -0.15em; margin-left: 2px; animation: blink .7s steps(1) infinite; }
#intro-skip { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .2em; color: #555; text-transform: uppercase; }
#intro.name { background: radial-gradient(ellipse at 50% 60%, #2a1206 0%, #0a0503 55%, #000 100%); }
#intro.name #intro-text { width: min(86vw, 1100px); animation: slam .5s cubic-bezier(.2, 1.6, .3, 1) both; }
#intro .sub { font: 700 clamp(11px, 1.3vw, 16px)/1 Roboto, Arial, sans-serif; letter-spacing: .6em; color: var(--ember2); margin-top: 2.2vw; opacity: 0; animation: rise .8s .7s both; }
#intro .go { font: 700 13px/1 Roboto, Arial, sans-serif; letter-spacing: .35em; color: #fff; margin-top: 5vw; opacity: 0; animation: rise .6s 1.6s both, pulse 1.6s 2.2s infinite; }
#flash { position: fixed; inset: 0; z-index: 30; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .9s ease-out; }
body.shake { animation: shake .45s; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes slam { 0% { transform: scale(2.6); opacity: 0; filter: blur(14px); } 100% { transform: none; opacity: 1; filter: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
@keyframes shake { 10% { transform: translate(-9px, 6px); } 25% { transform: translate(8px, -7px); } 40% { transform: translate(-6px, -4px); } 55% { transform: translate(5px, 5px); } 70% { transform: translate(-3px, 2px); } 85% { transform: translate(2px, -2px); } }

/* ---- the main menu, over the slow fly-past of the map */
#menu { position: fixed; inset: 0; z-index: 10; background: linear-gradient(90deg, rgba(6, 6, 8, .93) 0%, rgba(6, 6, 8, .72) 34%, rgba(6, 6, 8, .1) 70%), linear-gradient(0deg, rgba(6, 6, 8, .8), rgba(6, 6, 8, 0) 35%); }
#menu-left { position: absolute; left: 5vw; top: 50%; transform: translateY(-50%); width: min(470px, 44vw, 62vh); animation: fadein .7s both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#menu-tag { font-size: 11.5px; letter-spacing: .34em; color: var(--ember2); margin: 4px 0 2.5vh 2px; }
#menu-nav button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 1.2vh 16px; margin: .4vh 0; transition: all .12s; position: relative; }
#menu-nav button b { display: block; font: 900 clamp(17px, 3.6vh, 30px)/1.05 'Arial Black', Roboto, Arial, sans-serif; letter-spacing: .08em; color: #cfc8bc; }
#menu-nav button span { font-size: 12px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
#menu-nav button:hover, #menu-nav button.sel { border-left-color: var(--ember); background: linear-gradient(90deg, rgba(255, 106, 26, .22), rgba(255, 106, 26, 0)); padding-left: 26px; }
#menu-nav button:hover b, #menu-nav button.sel b { color: #fff; text-shadow: 0 0 18px rgba(255, 120, 40, .7); }
#menu-card { position: absolute; right: 4vw; top: 5vh; text-align: right; font-size: 13px; letter-spacing: .08em; animation: rise .7s .15s both; }
#menu-card .rank { font: 900 22px/1.1 'Arial Black', Roboto, sans-serif; letter-spacing: .1em; }
#menu-card .xp { width: 220px; height: 5px; background: rgba(255, 255, 255, .14); margin: 8px 0 8px auto; } #menu-card .xp i { display: block; height: 100%; background: var(--ember); }
#menu-card .cr { color: var(--ember2); font-weight: 700; }
#menu-foot { position: absolute; left: 5vw; right: 4vw; bottom: 2.4vh; display: flex; justify-content: space-between; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }

/* ---- panels: armory, settings, match setup */
#panel { position: fixed; inset: 0; z-index: 12; background: rgba(4, 4, 6, .86); display: flex; align-items: center; justify-content: center; padding: 3vh 3vw; }
#panel-box { width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ember); box-shadow: 0 30px 90px rgba(0, 0, 0, .7); animation: rise .25s both; }
#panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid var(--line); }
#panel-head h2 { margin: 0; font: 900 22px/1 'Arial Black', Roboto, sans-serif; letter-spacing: .14em; }
#panel-x, .btn { background: rgba(255, 255, 255, .06); border: 1px solid var(--line); padding: 9px 14px; font-weight: 700; letter-spacing: .12em; font-size: 12.5px; }
#panel-x:hover, .btn:hover { background: rgba(255, 255, 255, .14); }
.btn.go { background: var(--ember); border-color: var(--ember); color: #160800; font-size: 15px; padding: 13px 26px; }
.btn.go:hover { background: #ff8a3d; } .btn:disabled { opacity: .4; cursor: default; }
#panel-body { padding: 18px 22px 22px; overflow-y: auto; }
.cols { display: flex; gap: 22px; flex-wrap: wrap; } .cols > * { flex: 1 1 300px; min-width: 0; }
.h3 { font-size: 11.5px; letter-spacing: .28em; color: var(--ember2); margin: 4px 0 10px; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.tile { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); padding: 12px 13px; text-align: left; position: relative; }
.tile:hover { border-color: rgba(255, 255, 255, .35); } .tile.sel { border-color: var(--ember); background: rgba(255, 106, 26, .12); }
.tile b { display: block; font-size: 15.5px; letter-spacing: .06em; padding-right: 58px; } .tile small { color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
.tile .lock { position: absolute; right: 10px; top: 10px; font-size: 11.5px; font-weight: 700; color: var(--ember2); }
.tile.locked b { color: #8d877d; }
.stat { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 6px 0; }
.stat span { width: 82px; } .stat div { flex: 1; height: 6px; background: rgba(255, 255, 255, .1); } .stat div i { display: block; height: 100%; background: #efe9df; } .stat div i.up { background: var(--good); }
.detail h3 { margin: 0 0 2px; font: 900 24px/1.1 'Arial Black', Roboto, sans-serif; letter-spacing: .08em; } .detail p { color: #b9b2a6; margin: 6px 0 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.row label { letter-spacing: .06em; } .row small { display: block; color: var(--dim); font-size: 12px; }
.row input[type=range] { width: 220px; accent-color: var(--ember); } .row select, .row input[type=text] { background: #1c1d22; color: #fff; border: 1px solid var(--line); padding: 7px 9px; font: inherit; }
.seg { display: inline-flex; } .seg button { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); padding: 7px 12px; font-size: 12.5px; letter-spacing: .08em; } .seg button.on { background: var(--ember); color: #160800; border-color: var(--ember); font-weight: 700; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; font-size: 13px; color: #c9c2b6; } .keys kbd { margin: 0 8px 0 0; }

/* ---- loading */
#loading { position: fixed; inset: 0; z-index: 15; background: radial-gradient(ellipse at 50% 55%, #1d0d05, #050302 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
#load-logo { width: min(520px, 60vw); } #load-map { font: 900 20px/1 'Arial Black', Roboto, sans-serif; letter-spacing: .3em; color: var(--ember2); }
#load-bar { width: min(420px, 60vw); height: 3px; background: rgba(255, 255, 255, .12); } #load-bar i { display: block; height: 100%; width: 0; background: var(--ember); transition: width .25s; }
#load-tip { color: #a59f94; font-size: 13px; letter-spacing: .06em; max-width: 520px; text-align: center; min-height: 2.6em; }

/* ---- in the game */
#stats { position: fixed; right: 8px; top: 8px; z-index: 9; font: 12px/1.35 ui-monospace, Consolas, monospace; background: rgba(0, 0, 0, .55); padding: 6px 9px; border-radius: 6px; white-space: pre; text-align: right; pointer-events: none; }
#vig { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .42) 100%); }
#hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; font-weight: 700; text-shadow: 0 1px 3px #000; }
#cross { position: absolute; left: 50%; top: 50%; --gap: 7px; }
#cross i { position: absolute; background: #fff; opacity: .9; box-shadow: 0 0 2px #000; }
#cross i:nth-child(1) { width: 2px; height: 8px; left: -1px; top: calc(-8px - var(--gap)); } #cross i:nth-child(2) { width: 2px; height: 8px; left: -1px; top: var(--gap); }
#cross i:nth-child(3) { height: 2px; width: 8px; top: -1px; left: calc(-8px - var(--gap)); } #cross i:nth-child(4) { height: 2px; width: 8px; top: -1px; left: var(--gap); }
#dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 5px 1px rgba(255, 60, 40, .8); opacity: 0; }
#hit { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; opacity: 0; transform: rotate(45deg);
  background: linear-gradient(#fff, #fff) 50% 0 / 2px 9px no-repeat, linear-gradient(#fff, #fff) 50% 100% / 2px 9px no-repeat, linear-gradient(#fff, #fff) 0 50% / 9px 2px no-repeat, linear-gradient(#fff, #fff) 100% 50% / 9px 2px no-repeat; }
#hit.kill { filter: drop-shadow(0 0 3px #ff3b30); background: linear-gradient(#ff5a4a, #ff5a4a) 50% 0 / 3px 11px no-repeat, linear-gradient(#ff5a4a, #ff5a4a) 50% 100% / 3px 11px no-repeat, linear-gradient(#ff5a4a, #ff5a4a) 0 50% / 11px 3px no-repeat, linear-gradient(#ff5a4a, #ff5a4a) 100% 50% / 11px 3px no-repeat; }
#hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(160, 0, 0, 0) 45%, rgba(170, 10, 0, .75) 100%); }
#dmg-dir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
#dmg-dir::after { content: ""; position: absolute; left: -46px; top: -150px; width: 92px; height: 26px; background: radial-gradient(ellipse at 50% 100%, rgba(255, 60, 40, .95), rgba(255, 60, 40, 0) 70%); }
#hud-bl { position: absolute; left: 26px; bottom: 22px; display: flex; align-items: flex-end; gap: 12px; }
#hp-n { font: 900 40px/0.9 'Arial Black', Roboto, sans-serif; } #hp-n.low { color: var(--bad); animation: pulse .7s infinite; }
#bars { width: 210px; } #hp, #ar { height: 9px; background: rgba(0, 0, 0, .5); margin-top: 4px; transform: skewX(-18deg); } #ar { height: 5px; }
#hp i { display: block; height: 100%; width: 100%; background: #efe9df; transition: width .15s; } #ar i { display: block; height: 100%; width: 0; background: #6ab8ff; transition: width .15s; }
#hud-br { position: absolute; right: 28px; bottom: 18px; text-align: right; }
#wname { font-size: 12px; letter-spacing: .24em; color: var(--ember2); } #ammo { font: 900 44px/1 'Arial Black', Roboto, sans-serif; } #ammo.low { color: var(--bad); } #reserve { font-size: 18px; opacity: .8; } #nades { font-size: 13px; letter-spacing: .14em; color: #cfc8bc; }
#hud-top { position: absolute; left: 0; right: 0; top: 12px; text-align: center; letter-spacing: .2em; font-size: 13px; }
#hud-tr { position: absolute; right: 22px; top: 44px; text-align: right; } #cash { font: 900 22px/1 'Arial Black', Roboto, sans-serif; color: var(--ember2); }
#feed { margin-top: 8px; font-size: 13px; letter-spacing: .04em; } #feed div { animation: feed 4s both; } #feed b { color: var(--ember2); }
#banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font: 900 clamp(34px, 6vw, 76px)/1 'Arial Black', Roboto, sans-serif; letter-spacing: .22em; opacity: 0; }
#banner small { display: block; font: 700 14px/2 Roboto, sans-serif; letter-spacing: .5em; color: var(--ember2); }
#banner.show { animation: banner 2.6s both; }
#callout { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font: 900 22px/1 'Arial Black', Roboto, sans-serif; letter-spacing: .2em; color: var(--ember2); opacity: 0; }
#callout.show { animation: callout 1.3s both; }
#msg { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 22px; letter-spacing: .12em; }
#prompt { position: absolute; left: 0; right: 0; bottom: 20%; text-align: center; font-size: 14px; letter-spacing: .14em; }
#scores { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); background: rgba(8, 8, 10, .82); border-top: 3px solid var(--ember); padding: 12px 18px; min-width: 420px; font-weight: 400; }
#scores table { width: 100%; border-collapse: collapse; } #scores td, #scores th { padding: 4px 10px; text-align: right; } #scores td:first-child, #scores th:first-child { text-align: left; } #scores tr.me { color: var(--ember2); font-weight: 700; }
@keyframes feed { 0% { opacity: 0; transform: translateX(20px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes banner { 0% { opacity: 0; transform: scale(1.5); letter-spacing: .6em; } 14% { opacity: 1; transform: none; letter-spacing: .22em; } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
@keyframes callout { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.12); } 30% { transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.tag { position: absolute; left: 0; top: 0; font-size: 12px; letter-spacing: .1em; color: #9fd0ff; white-space: nowrap; pointer-events: none; } .tag.foe { color: #ff9a7a; }
/* the tank: the cross is where you want the shell, the ring is where the gun would put it right now */
#gunmark { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; box-sizing: border-box; border: 2px solid #ffd27a; border-radius: 50%; display: none; }

/* a scope: the view through the glass fills the screen, everything else is black */
body.scoped #vig { background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 37vh, rgba(0, 0, 0, .96) 38vh, #000 39vh); }
body.scoped #hud::before { content: ""; position: absolute; left: 50%; top: 50%; width: 76vh; height: 76vh; margin: -38vh 0 0 -38vh; background: linear-gradient(#000, #000) 50% 50% / 100% 1px no-repeat, linear-gradient(#000, #000) 50% 50% / 1px 100% no-repeat; opacity: .8; }
/* ---- the supply crate (between waves), pause, the end of a run */
#shop, #pause, #results { position: fixed; inset: 0; z-index: 11; background: rgba(4, 4, 6, .74); display: flex; align-items: center; justify-content: center; padding: 3vh 3vw; }
#shop .box, #pause .box, #results .box { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ember); padding: 20px 24px; width: min(860px, 100%); max-height: 100%; overflow-y: auto; animation: rise .22s both; }
#pause .box { width: 320px; text-align: center; } #pause h2, #shop h2, #results h2 { margin: 0 0 14px; font: 900 24px/1 'Arial Black', Roboto, sans-serif; letter-spacing: .16em; }
#pause button { display: block; width: 100%; margin: 8px 0; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); padding: 12px; font-weight: 700; letter-spacing: .14em; } #pause button:hover { background: var(--ember); color: #160800; }
#results .big { font: 900 clamp(40px, 7vw, 84px)/1 'Arial Black', Roboto, sans-serif; letter-spacing: .1em; } #results .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 18px 0; }
#results .grid div { background: rgba(255, 255, 255, .05); padding: 12px; } #results .grid b { display: block; font: 900 26px/1.1 'Arial Black', Roboto, sans-serif; } #results .grid small { color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; }
#results .xp { height: 8px; background: rgba(255, 255, 255, .12); margin: 6px 0 16px; } #results .xp i { display: block; height: 100%; width: 0; background: var(--ember); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
#fatal { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 18px; }

/* ---- steel storm */
#menu-tag { color: #9fb4c8; }
#gunmark { display: block; will-change: transform; box-shadow: 0 0 3px rgba(0, 0, 0, .6); }
#gunmark.on { border-color: #7dff9a; }
#gunmark.stop { border-color: #ff8a7a; border-style: dashed; }
#hud[data-sight] #cross { --gap: 46px; }
#hud[data-sight] #cross i:nth-child(1), #hud[data-sight] #cross i:nth-child(2) { height: 60px; width: 1px; } #hud[data-sight] #cross i:nth-child(1) { top: calc(-60px - var(--gap)); }
#hud[data-sight] #cross i:nth-child(3), #hud[data-sight] #cross i:nth-child(4) { width: 60px; height: 1px; } #hud[data-sight] #cross i:nth-child(3) { left: calc(-60px - var(--gap)); }
#hud[data-sight]::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 40vh, rgba(0, 0, 0, .6) 62vh); }
.mark { position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid #ff6a5a; pointer-events: none; }
.mark b { position: absolute; left: 12px; top: -20px; transform: rotate(-45deg); transform-origin: 0 100%; font-size: 11px; letter-spacing: .08em; color: #ffb0a0; white-space: nowrap; }

/* ============ the remaster's own look: a steel bar along the top, pages under it, hangar doors for an opening ============ */
.sslogo { text-align: center; line-height: 1; user-select: none; }
.sslogo > div { display: flex; justify-content: center; font: italic 900 var(--fs, 28px)/1 'Arial Black', Roboto, Arial, sans-serif; letter-spacing: .01em; transform: skewX(-7deg); white-space: nowrap; }
.sslogo span { background: linear-gradient(180deg, #f6f9fb 0%, #a4b4c3 44%, #4d5964 54%, #c5d0da 78%, #e8a020 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .04em 0 rgba(0, 0, 0, .7)); }
.sslogo i { width: .32em; }
.sslogo em { display: inline-block; font: 800 calc(var(--fs, 28px) * .17)/1 Roboto, Arial, sans-serif; letter-spacing: .75em; color: #15171a; background: var(--ember); padding: .45em .3em .45em 1em; margin-top: .55em; transform: skewX(-14deg); }
.sslogo.small { --fs: 24px; } .sslogo.small em { display: none; }
.sslogo.big { --fs: clamp(40px, 9.6vw, 150px); }
.sslogo.big span { opacity: 0; transform: translateY(-.5em) scale(1.9); } .sslogo.big span.in { opacity: 1; transform: none; transition: transform .13s cubic-bezier(.2, 1.9, .4, 1), opacity .04s; }
.sslogo.big em { opacity: 0; transform: skewX(-14deg) translateX(-60px); transition: all .22s; } .sslogo.big.done em { opacity: 1; transform: skewX(-14deg); }
#intro { background: none; padding: 0; overflow: hidden; }
#intro .door { position: absolute; left: 0; right: 0; height: 50.2%; background: repeating-linear-gradient(90deg, #252a30 0 146px, #171a1e 146px 150px); box-shadow: inset 0 0 120px rgba(0, 0, 0, .75); transition: transform 1.25s cubic-bezier(.65, 0, .3, 1); }
#intro .door.a { top: 0; border-bottom: 12px solid; border-image: repeating-linear-gradient(-45deg, #e8a020 0 16px, #15171a 16px 32px) 12; }
#intro .door.b { bottom: 0; border-top: 12px solid; border-image: repeating-linear-gradient(-45deg, #e8a020 0 16px, #15171a 16px 32px) 12; }
#intro.open .door.a { transform: translateY(-101%); } #intro.open .door.b { transform: translateY(101%); }
#intro.open { background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, .15), rgba(0, 0, 0, .7)); }
#intro-text { position: relative; z-index: 2; width: min(92vw, 1250px); min-height: 0; font: 400 16px Roboto, Arial, sans-serif; text-shadow: none; white-space: normal; }

// ---- going over to another game of the family (its folder sits beside this one). Opened from a folder that is a plain
// page change; inside a loader page (jsfiddle) there is no address to go to, so this game shuts itself down and the
// other one is written into the same page, told where its files are the way the loader told this one.
async function leaveTo(dir) {
    if (!BASE) { location.href = '../' + dir + '/index.html'; return; }
    const base = BASE.replace(/[^\/]+\/$/, '') + dir + '/'; let html;
    try { const r = await fetch(base + 'index.html'); if (!r.ok) throw new Error('HTTP ' + r.status); html = await r.text(); } catch (e) { UI.fatal('Could not load it (' + e.message + ').', true); return; }
    App.dead = true; Music.stop(); clearInterval(Music.timer); try { if (typeof Net !== 'undefined') Net.reset(); } catch (e) { } try { if (Snd.ctx) Snd.ctx.close(); } catch (e) { } try { R.dispose(); } catch (e) { }
    const tag = '<script>window.HG_BASE = ' + JSON.stringify(base) + '; window.HG_PROOF = ' + JSON.stringify(window.HG_PROOF || 0) + ';<\/script>';
    document.open(); document.write(html.replace(/<head[^>]*>/i, m => m + tag)); document.close();
}

        const L = P.list, e = m.instanceMatrix.array, c = m.instanceColor.array, f = g.attributes.aFade.array; let n = 0;
        for (let i = 0; i < L.length; i++) {
            const p = L[i]; p.t += dt; if (p.t >= p.life) continue; L[n] = p;
            p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vx *= 1 - dt * 1.5; p.vz *= 1 - dt * 1.5;
            const s = p.size + p.grow * p.t, o = n * 16, k = p.t / p.life;

Net.rows = function (full) {

// where and how a vehicle that someone else drives was last said to be: [x, y, z, yaw, turret, gun, pitch, roll, speed]

// a guest's shell hit something (or it flew into the ground): the host decides what that does
Net.guestDamage = function (U, dmg, by, word) {
    const G = Game, P = G.P; if (U === P && !by) { Net.send(Net.peers.H, { t: 'hit', to: Net.me.id, dmg: 1e6, word: 'CRASHED' }); return; }

Net.killLocal = function (U) { if (U.dead) return; U.hp = 0; U.dead = true; U.deadT = 0; World.boom(U.x, U.y + 1.5, U.z, true); World.boom(U.x, U.y + 2.2, U.z, true); Game.heard(U.x, U.z, 1, 70, 1.2); };
// once a frame for everyone: the vehicles others drive glide to where they were last said to be; 15 times a second, say where ours is
Net.step = function (dt) {
    const G = Game, P = G.P; if (!Net.on || Net.state !== 'game' || !G.net) return; const f = Math.min(1, dt * 10);

// a guest takes the host's picture of the battle
Net.snapshot = function (m) {

        if (r.me) { if (life > Net.life && alive) { Net.life = life; const old = r.U; const U = Units.make(0, st[0], st[2], st[3], r.veh, G.mods); U.who = r; U.reload = 1; if (U.air) U.y = st[1]; r.U = G.P = U; G.aimYaw = st[3]; G.aimPitch = -0.04; if (old && old !== U && Units.list.indexOf(old) >= 0) Units.retire(old); HUD.set('msg', ''); }
            else if (r.U && life === Net.life) { if (alive) r.U.hp = Math.min(r.U.max, hp); else Net.killLocal(r.U); } continue; }

        Net.aim(U, st); U.hp = hp; if (!alive) Net.killLocal(U); }

// ---- joining a battle that is already running: the newcomer takes a bot's seat (its own old seat, if it dropped out of this battle)
Net.lateJoin = function (peer, id, name, veh) {
    const G = Game, no = why => Net.send(peer, { t: 'no', why }), humans = t => G.roster.filter(r => r.team === t && !r.bot).length;
    if (!App.game || !G.net || G.over) return no('That party is between battles. Try again in a moment.'); if (G.mode === 'ffa') return no('That party is in a free-for-all. Try again when it ends.');

    Net.roster.push({ id, name, veh, ready: false, team: Net.lt(seat.team) }); Net.all({ t: 'seat', from, to: id, name, veh }, false, id);
    Net.send(peer, { t: 'you', id }); Net.send(peer, { t: 'start', cfg: Net.cfg, late: true, roster: G.roster.map(r => ({ id: r.id, name: r.me ? Net.me.name : r.name, veh: r.veh, team: Net.lt(r.team), bot: !!r.bot && !r.held })) });

};
// the newcomer is in: the bot's vehicle goes, and the seat comes back as theirs
Net.seated = function (s) { s.held = false; s.bot = false; s.remote = true; const old = s.U; if (old && !old.dead) { old.dead = true; old.hp = 0; old.deadT = 0; old.counted = true; } s.back = 0.6; HUD.banner(s.name.toUpperCase() + ' JOINED', 'in place of a bot'); Net.all({ t: 'ban', a: s.name.toUpperCase() + ' JOINED', b: 'in place of a bot' }, false, s.id); };
// what this computer's player will come back in
Net.veh = function (id) { if (!Net.on || Net.state !== 'game') return; const e = Net.roster.find(x => x.id === Net.me.id); if (e) e.veh = id; if (Net.host) Net.all({ t: 'veh', id: Net.me.id, veh: id }); else if (Net.peers.H) Net.send(Net.peers.H, { t: 'veh', veh: id }); };
// chat: the host passes every line on

Net.sayMine = function () { const i = document.querySelector('[data-netin=chat]'), s = i ? i.value : ''; if (i) i.value = ''; Net.speak(s); };
// during a battle: T opens a line to type in (the vehicle lets go of its keys meanwhile), Enter sends it, Esc or an empty line closes it
Net.line = function (on) { const i = $('bchat'); if (!i) return; i.classList.toggle('hidden', !on); if (on) { for (const k in keys) keys[k] = false; mouse.down = mouse.right = false; i.value = ''; i.focus(); } else i.blur(); };

    if (e.target === i) { if (e.key === 'Enter') { e.preventDefault(); const s = i.value; Net.line(false); Net.speak(s); } else if (e.key === 'Escape') Net.line(false); return; }

// ---- the party page
Net.pageHTML = function () {

    if (!Net.on || Net.state === 'idle') return '<div class="sheet"><div class="h3">Your name</div><div class="row"><input type="text" data-netin="name" maxlength="14" value="' + esc(Save.data.name || '') + '" placeholder="Commander" style="width:220px"></div><div class="h3" style="margin-top:16px">Start a party</div><p>You get a 6-digit code. Friends type it in and you fight on the same field: no account needed. Bots fill the empty places on both sides.</p><button class="btn go" data-net="host">HOST A PARTY</button>' +
        '<div class="h3" style="margin-top:20px">Join a party</div><div class="row"><input type="text" data-netin="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="width:160px;font-size:22px;letter-spacing:.2em"><button class="btn go" data-net="join">JOIN</button></div>' + (Net.err ? '<p style="color:var(--bad)">' + esc(Net.err) + '</p>' : '') + '</div>';

        '<div class="h3">The ground</div><div class="seg">' + (maps.length ? maps : [UI.map]).map(id => '<button data-net="map" data-v="' + id + '" class="' + ((c.map || UI.map) === id ? 'on' : '') + '"' + dis + '>' + MAPS[id].name + '</button>').join('') + '</div>' +
        '<div class="pair"><div><div class="h3">Tanks a side</div><div class="seg">' + [3, 4, 5, 6].map(n => '<button data-net="size" data-v="' + n + '" class="' + (c.size === n ? 'on' : '') + '"' + dis + '>' + n + '</button>').join('') + '</div></div><div><div class="h3">The bots</div><div class="seg">' + Object.keys(BOT_SKILL).map(id => '<button data-net="skill" data-v="' + id + '" class="' + (c.skill === id ? 'on' : '') + '"' + dis + '>' + BOT_SKILL[id].name + '</button>').join('') + '</div></div></div>' +
        '<div class="h3">The weather</div><div class="seg">' + Object.keys(WEATHER).map(id => '<button data-net="wx" data-v="' + id + '" class="' + ((c.wx || 'clear') === id ? 'on' : '') + '"' + dis + '>' + WEATHER[id].name + '</button>').join('') + '</div>' +

        '<div class="roll"><button class="btn" data-net="leave">LEAVE</button>' + (host ? '<button class="btn go" data-net="start">START THE BATTLE' + (wait ? ' (' + wait + ' NOT READY)' : '') + '</button>' : '<span>' + (mine.ready ? 'WAITING FOR THE HOST' : 'SAY WHEN YOU ARE READY') + '</span>') + '</div></div>';
};
Net.click = function (d) {
    const a = d.net, c = Net.cfg; Snd.ui('click');
    if (a === 'host') Net.hostGame(); else if (a === 'join') { const i = document.querySelector('[data-netin=code]'); Net.join(i ? i.value : ''); } else if (a === 'leave') { Net.leave(); setTimeout(() => UI.page(), 80); }
    else if (a === 'start') Net.startMatch();
    else if (a === 'say') Net.sayMine();
    else if (a === 'team') { const t = +d.v ? 1 : 0; if (Net.host) { Net.roster[0].team = t; Net.lobby(); } else if (Net.peers.H) Net.send(Net.peers.H, { t: 'team', team: t }); }
    else if (a === 'ready') { if (!Net.host && Net.peers.H) Net.send(Net.peers.H, { t: 'ready' }); }
    else if (Net.host && (a === 'move' || a === 'kick' || a === 'shuffle' || a === 'balance')) {
        const L = Net.roster, e = L.find(x => x.id === d.v && x.id !== 'H'), cnt = t => L.filter(x => x.team === t).length;

        else if (a === 'kick') { const p = e && Net.peers[e.id]; if (p) { Net.send(p, { t: 'no', why: 'The host removed you from the party.' }); setTimeout(() => { try { p.conn.close(); } catch (x) { } Net.hostLost(p); }, 250); } return; }

        else for (let k = 0; k < 8 && Math.abs(cnt(0) - cnt(1)) > 1; k++) { const big = cnt(0) > cnt(1) ? 0 : 1, x = L.filter(y => y.team === big && y.id !== 'H').pop(); if (!x) break; x.team = 1 - big; }
        Net.lobby();
    }
    else if (Net.host) { if (a === 'mode') c.mode = d.v; else if (a === 'map') c.map = d.v; else if (a === 'size') c.size = +d.v; else if (a === 'skill') c.skill = d.v; else if (a === 'wx') c.wx = d.v; else if (a === 'len') c.len = d.v; else if (a === 'ff') c.ff = d.v === '1'; Net.lobby(); }
};
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button[data-net]'); if (b && !b.disabled) Net.click(b.dataset); });

// ---- start
// for tests and for looking around from the console
window.__ssr = { App, R, HG3D, keys, hit, mouse, Input, Save, World, Units, TD, Game, HUD, UI, Snd, VEHS, MODES, MODS, Beams, Air, Net, Train,

if (!R) UI.fatal('This device cannot run WebGL2, so Steel Storm Remastered cannot start here.');

    if (Q.get('go')) UI.play({ mode: Q.get('mode') || 'waves', cls: Q.get('cls') || 'medium', veh: Q.get('veh') || '', size: +Q.get('size') || 5, skill: Q.get('skill') || 'normal' }).then(ok => { window.__ssr.started = ok; });
    else if (Q.get('menu')) UI.menu();
    else UI.intro();
}
