// Fear 2: The Glass Tank -- Hold E to crack glass and escape drowning






class GlassTank extends FearBase {
    get name() { return 'THE GLASS TANK'; }
    get climbRate() { return 3.0; }
    get climbAccel() { return 0.18; }


    async setup() {
        await super.setup();
        this.waterLevel = 0;
        this.waterRiseSpeed = 0.15;
        this.crackProgress = 0;
        this.holdingE = false;
        this.crackThreshold = 1.0;
        this.shattered = false;
        this.controls.movementLocked = true;


        this.scene.background = new THREE.Color(0x020205);
        this.scene.fog = new THREE.Fog(0x020205, 1, 10);
        this.poundShake = 0;


        // Lighting
        this.addObject(new THREE.AmbientLight(0x4488aa, 0.3));
        const spotLight = new THREE.SpotLight(0x66ccff, 1, 20, Math.PI / 4);
        spotLight.position.set(0, 5, 0);
        this.addObject(spotLight);


        // Glass box
        const tankSize = 2.5;
        this.tankSize = tankSize;
        this.glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff, transparent: true, opacity: 0.15,
            roughness: 0.05, metalness: 0, transmission: 0.9,
            side: THREE.DoubleSide
        });
        this.shards = [];
        // Four walls
        const wallGeo = new THREE.PlaneGeometry(tankSize, 3);
        const positions = [
            { pos: [0, 1.5, -tankSize / 2], rot: [0, 0, 0] },
            { pos: [0, 1.5, tankSize / 2], rot: [0, Math.PI, 0] },
            { pos: [-tankSize / 2, 1.5, 0], rot: [0, Math.PI / 2, 0] },
            { pos: [tankSize / 2, 1.5, 0], rot: [0, -Math.PI / 2, 0] },
        ];
        this.walls = [];
        for (const w of positions) {
            const wall = new THREE.Mesh(wallGeo, this.glassMat.clone());
            wall.position.set(...w.pos);
            wall.rotation.set(...w.rot);
            this.addObject(wall);
            this.walls.push(wall);
        }


        // Front wall -- this is the one that cracks
        this.frontWall = this.walls[0];


        // Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(tankSize, tankSize),
            new THREE.MeshStandardMaterial({ color: 0x1a2a3a, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        this.addObject(floor);


        // Water plane
        const waterGeo = new THREE.PlaneGeometry(tankSize - 0.1, tankSize - 0.1, 16, 16);
        this.waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x0077aa, transparent: true, opacity: 0.5,
            roughness: 0.1, metalness: 0.2, side: THREE.DoubleSide
        });
        this.waterPlane = new THREE.Mesh(waterGeo, this.waterMat);
        this.waterPlane.rotation.x = -Math.PI / 2;
        this.waterPlane.position.y = 0.01;
        this.addObject(this.waterPlane);


        // Water volume (box that grows from bottom)
        this.waterVolGeo = new THREE.BoxGeometry(tankSize - 0.15, 0.01, tankSize - 0.15);
        this.waterVol = new THREE.Mesh(this.waterVolGeo, new THREE.MeshPhysicalMaterial({
            color: 0x005577, transparent: true, opacity: 0.3, side: THREE.DoubleSide
        }));
        this.addObject(this.waterVol);


        // Empty void beyond the glass - no buildings


        // Crack lines (initially invisible) on all walls
        this.crackLines = [];
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, linewidth: 2 });
        const crackPositions = [
            { pos: [0, 0, -tankSize / 2 + 0.02], rot: [0, 0, 0] },
            { pos: [0, 0, tankSize / 2 - 0.02], rot: [0, Math.PI, 0] },
            { pos: [-tankSize / 2 + 0.02, 0, 0], rot: [0, Math.PI / 2, 0] },
            { pos: [tankSize / 2 - 0.02, 0, 0], rot: [0, -Math.PI / 2, 0] }
        ];


        for (let i = 0; i < 24; i++) {
            for (const cp of crackPositions) {
                const pts = [new THREE.Vector3(0, 1.5, 0)]; // Start at center
                let p = pts[0].clone();
                for (let j = 0; j < 6; j++) {
                    p = p.clone().add(new THREE.Vector3(
                        (Math.random() - 0.5) * 1.5, // Wider spread across whole tank
                        (Math.random() - 0.5) * 1.5, 0.01
                    ));
                    pts.push(p);
                }
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const line = new THREE.Line(lineGeo, lineMat.clone());
                line.position.set(...cp.pos);
                line.rotation.set(...cp.rot);
                this.addObject(line);
                this.crackLines.push(line);
            }
        }


        // Bubbles
        this.bubbles = new ParticlePool(this.scene, this.perfMon.getParticleCount(80), {
            color: 0x88ccff, size: 0.05
        });
        this.objects.push(this.bubbles.points);


        this.camera.position.set(0, 1.6, 0.5);
        this._handleKeyDown = this._handleKeyDown.bind(this);
        document.addEventListener('keydown', this._handleKeyDown);
        this.requiredKey = this.getRandomKey();
        this.hud.setNarrative(`Press '${this.requiredKey.toUpperCase()}' to crack the glass!`);
    }


    getRandomKey() {
        const letters = "abcdefghijklmnopqrstuvwxyz";
        return letters[Math.floor(Math.random() * letters.length)];
    }


    _handleKeyDown(e) {
        if (!this.isActive || this.shattered) return;
        
        // Ignore key presses with modifiers
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        
        const keyPressed = e.key.toLowerCase();
        
        if (keyPressed === this.requiredKey) {
            // Visual & Audio feedback for pounding
            this.audio.playImpact();
            this.poundShake = 0.2;
            
            this.crackProgress += 0.25; // Increased from 0.15 so it takes fewer presses
            if (Math.random() < 0.6) this.audio.playGlassShatter();
            
            // Pick a new random key
            this.requiredKey = this.getRandomKey();
            this.hud.setNarrative(`Press '${this.requiredKey.toUpperCase()}' to crack the glass!`);
        }
    }


    update(deltaTime) {
        super.update(deltaTime);
        if (!this.isActive) return;


        // Ensure bubbles animate even after shattering
        if (this.bubbles) this.bubbles.update(deltaTime);


        if (this.shattered) {
            this.shatterTimer -= deltaTime;
            if (this.shatterTimer <= 0) {
                this.conquer();
            }
            
            // Update flying glass shards
            for (const s of this.shards) {
                s.position.x += s.vx * deltaTime;
                s.position.y += s.vy * deltaTime;
                s.position.z += s.vz * deltaTime;
                s.rotation.x += s.rx * deltaTime;
                s.rotation.y += s.ry * deltaTime;
                s.rotation.z += s.rz * deltaTime;
                s.vy -= 15 * deltaTime; // Gravity pulling shards down
            }
            return;
        }


        // Rise water
        const moveMultiplier = this.controls.isMoving() ? 1.5 : 1.0;
        this.waterLevel += this.waterRiseSpeed * deltaTime * moveMultiplier;
        this.waterPlane.position.y = this.waterLevel + 0.02; // Offset to fix glitchy shadow z-fighting


        // Water volume
        this.waterVol.scale.y = Math.max(0.01, this.waterLevel * 100);
        this.waterVol.position.y = this.waterLevel / 2;


        // Animate water surface
        const positions = this.waterPlane.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const z = positions.getZ(i);
            positions.setZ(i, Math.sin(x * 3 + this.elapsedTime * 2) * 0.02 +
                Math.cos(z * 2 + this.elapsedTime * 1.5) * 0.015);
        }
        positions.needsUpdate = true;


        // Underwater effects
        if (this.waterLevel > 1.4) {
            this.waterMat.opacity = 0.7;
            this.scene.fog.near = 1;
            this.scene.fog.far = 5;
            this.heartRate.spike(deltaTime * 3);
        }


        // Heart rate spike when water is above chest
        if (this.waterLevel > 1.0) {
            this.heartRate.spike(deltaTime * 1.5);
        }


        // Bubbles
        if (this.waterLevel > 0.5 && Math.random() < 0.15) {
            this.bubbles.emit(
                (Math.random() - 0.5) * 2, this.waterLevel,
                (Math.random() - 0.5) * 2,
                0, 0.5 + Math.random() * 0.5, 0, 1 + Math.random(), 0x88ddff
            );
        }


        // Cracks slowly heal if you stop pushing (adds pressure)
        this.crackProgress = Math.max(0, this.crackProgress - deltaTime * 0.1);


        // Apply crack visual updates
        const showCount = Math.floor((this.crackProgress / this.crackThreshold) * this.crackLines.length);
        for (let i = 0; i < this.crackLines.length; i++) {
            this.crackLines[i].material.opacity = i < showCount ? 0.8 : 0;
        }


        // Shatter check
        if (this.crackProgress >= this.crackThreshold && !this.shattered) {
            this.shattered = true;
            this.shatterTimer = 1.0; // 1 second later you pass the simulation
            this.audio.playGlassShatter();
            this.bubbles.emitBurst(0, 1.5, -1.2, 80, 2, 5, 2, 0xaaddff); // More bubbles!
            
            for (const w of this.walls) w.visible = false;
            for (const line of this.crackLines) line.visible = false;
            this.waterVol.visible = false;
            this.waterPlane.visible = false;


            // Flash effect for the visual shatter impact
            const flash = new THREE.PointLight(0xffffff, 5, 10);
            flash.position.set(0, 1.5, 0);
            this.addObject(flash);
            setTimeout(() => { flash.intensity = 0; }, 150);


            // Spawn highly visible glass shards exploding inward from all sides
            const shardGeo = new THREE.TetrahedronGeometry(0.1); // Slightly larger shards
            const shardMat = new THREE.MeshStandardMaterial({
                color: 0xffffff, transparent: true, opacity: 0.95, // Very opaque and white
                roughness: 0.05, metalness: 0.9
            });
            const shardPositions = [
                { pos: [0, -this.tankSize / 2], dir: [0, 1] }, // Front
                { pos: [0, this.tankSize / 2], dir: [0, -1] }, // Back
                { pos: [-this.tankSize / 2, 0], dir: [1, 0] }, // Left
                { pos: [this.tankSize / 2, 0], dir: [-1, 0] }, // Right
            ];


            for (const sp of shardPositions) {
                for (let i = 0; i < 50; i++) { // 200 total shards for massive effect
                    const shard = new THREE.Mesh(shardGeo, shardMat);
                    shard.scale.set(0.2 + Math.random() * 1.5, 0.5 + Math.random() * 2.5, 0.2 + Math.random() * 1.5);
                    
                    let sx = sp.dir[1] !== 0 ? (Math.random() - 0.5) * this.tankSize : sp.pos[0];
                    let sz = sp.dir[0] !== 0 ? (Math.random() - 0.5) * this.tankSize : sp.pos[1];
                    // Spread shards over the entire height of the wall (up to 3 units tall)
                    shard.position.set(sx, Math.random() * 3, sz);
                    
                    // Exploding violently inward and upward
                    shard.vx = sp.dir[0] * (Math.random() * 12 + 4) + (Math.random() - 0.5) * 6;
                    shard.vy = Math.random() * 10 + 4;
                    shard.vz = sp.dir[1] * (Math.random() * 12 + 4) + (Math.random() - 0.5) * 6; 
                    
                    shard.rx = (Math.random() - 0.5) * 30;
                    shard.ry = (Math.random() - 0.5) * 30;
                    shard.rz = (Math.random() - 0.5) * 30;
                    
                    this.addObject(shard);
                    this.shards.push(shard);
                }
            }
        }


        // Camera shake
        if (this.poundShake > 0) {
            this.poundShake -= deltaTime;
            const shake = this.poundShake * 0.1;
            this.camera.position.x = (Math.random() - 0.5) * shake;
            this.camera.position.y = 1.6 + (Math.random() - 0.5) * shake;
        } else {
            this.camera.position.x = 0;
            this.camera.position.y = 1.6;
        }


        // Fail if water fully submerges
        if (this.waterLevel > 2.8) {
            this.heartRate.spike(30);
        }
    }


    cleanup() {
        document.removeEventListener('keydown', this._handleKeyDown);
        if (this.bubbles) this.bubbles.dispose();
        super.cleanup();
    }
}




// --- js/fears/OceanRocks.js ---
// Fear 3: The Ocean -- Battered against rocks by violent waves
// Tris's fear of helplessness and the uncontrollable unknown.
// Environment: A stormy night ocean with jagged rocks. Player is in the water.
// Mechanic: Waves toss the player around. Struggling (moving) smashes you into rocks,
//           spiking HR. The Divergent solution: stop fighting. Stand still and
//           accept the helplessness. Stillness pauses climb and drops HR after 4s.
// Win: HR drops to 90.






class OceanRocks extends FearBase {
    get name() { return 'THE OCEAN'; }
    get climbRate() { return 1.2; }
    get climbAccel() { return 0.06; }


    async setup() {
        await super.setup();


        this.winThreshold = 90;
        this.stillTimer = 0;
        this.wavePhase = 0;
        this.swellPhase = 0;
        this.lightningTimer = 8 + Math.random() * 5;
        this.lightningFlash = 0;
        this.submergeTimer = 999; // trigger immediately
        this.isSubmerged = false;
        this.rockHitCooldown = 0;
        this.baseWaterLevel = 0.6; // camera sits low \u2014 in the water


        // --- Sky & Fog: Stormy night ---
        this.scene.background = new THREE.Color(0x040810);
        this.scene.fog = new THREE.FogExp2(0x040810, 0.02);


        // --- Lighting ---
        this.ambientLight = new THREE.AmbientLight(0x0a1525, 0.6);
        this.addObject(this.ambientLight);


        // Moonlight through clouds
        this.moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
        this.moonLight.position.set(-10, 20, -15);
        this.addObject(this.moonLight);


        // Lightning flash light (off by default)
        this.lightningLight = new THREE.DirectionalLight(0xddeeff, 0);
        this.lightningLight.position.set(5, 30, 5);
        this.addObject(this.lightningLight);


        // --- The Ocean Surface ---
        // A large plane with vertex displacement for waves
        const oceanSize = 200;
        const oceanSegments = 80;
        const oceanGeo = new THREE.PlaneGeometry(oceanSize, oceanSize, oceanSegments, oceanSegments);
        oceanGeo.rotateX(-Math.PI / 2);


        this.oceanMesh = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({
            color: 0x052040, // Clearly blue ocean
            emissive: 0x010515,
            roughness: 0.1, // Shiny surface
            metalness: 0.8, // Reflects the moonlight
            transparent: true,
            opacity: 0.9,
            flatShading: true
        }));
        this.oceanMesh.position.y = -0.5;
        this.addObject(this.oceanMesh);


        // --- The Abyss (Deep dark ocean floor) ---
        const abyssGeo = new THREE.PlaneGeometry(oceanSize * 2, oceanSize * 2);
        abyssGeo.rotateX(-Math.PI / 2);
        const abyssMesh = new THREE.Mesh(abyssGeo, new THREE.MeshBasicMaterial({ color: 0x000104 }));
        abyssMesh.position.y = -50; // much deeper so it's not visible when dunked
        this.addObject(abyssMesh);


        // Store original ocean vertex positions
        this._oceanPositions = new Float32Array(oceanGeo.attributes.position.array);


        // --- Rocks (Jagged, dangerous) ---
        this.rocks = [];
        const rockPositions = [
            // Close ring (dangerous)
            { x: 4, z: -3, s: 2.5 }, { x: -5, z: -2, s: 3.0 },
            { x: 6, z: 2, s: 2.0 }, { x: -3, z: 4, s: 2.8 },
            { x: 1, z: -6, s: 3.5 }, { x: -6, z: -5, s: 2.2 },
            { x: 7, z: -6, s: 2.0 }, { x: -2, z: -8, s: 2.8 },
            // Far ring (scenery)
            { x: 12, z: -10, s: 5 }, { x: -15, z: 8, s: 6 },
            { x: 18, z: 5, s: 4 }, { x: -10, z: -15, s: 7 },
            { x: 8, z: 15, s: 4 }, { x: -18, z: -8, s: 5 },
            { x: 20, z: -20, s: 8 }, { x: -22, z: 12, s: 6 },
        ];


        for (const rp of rockPositions) {
            const rock = this._buildRock(rp.s);
            rock.position.set(rp.x, -1 + rp.s * 0.3, rp.z);
            rock.rotation.y = Math.random() * Math.PI * 2;
            this.addObject(rock);
            this.rocks.push({
                mesh: rock,
                x: rp.x, z: rp.z,
                radius: rp.s * 0.4, // collision radius
                isDangerous: Math.abs(rp.x) < 10 && Math.abs(rp.z) < 10
            });
        }


        // --- Spray / Foam particles ---
        this.sprayParticles = new ParticlePool(this.scene, this.perfMon.getParticleCount(200), {
            color: 0xaaccdd, size: 0.08
        });


        // --- Underwater overlay (DOM) ---
        this.underwaterOverlay = document.createElement('div');
        this.underwaterOverlay.id = 'ocean-underwater';
        this.underwaterOverlay.style.cssText = `
            position:fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(ellipse at center, rgba(5,20,40,0.0) 30%, rgba(3,12,25,0.7) 100%);
            pointer-events:none; z-index:20; opacity:0;
            transition: opacity 0.3s;
        `;
        document.body.appendChild(this.underwaterOverlay);


        // Wave crash / distortion overlay
        this.waveOverlay = document.createElement('div');
        this.waveOverlay.id = 'ocean-wave-overlay';
        this.waveOverlay.style.cssText = `
            position:fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(180deg, rgba(10,30,55,0.0) 0%, rgba(10,30,55,0.8) 100%);
            pointer-events:none; z-index:19; opacity:0;
            transition: opacity 0.2s;
        `;
        document.body.appendChild(this.waveOverlay);


        // --- Camera: Start in the water ---
        this.camera.position.set(0, this.baseWaterLevel, 0);


        // Narrative
        this.hud.setNarrative("Try to escape.");
    }


    _buildRock(scale) {
        // Jagged, irregular rock using an icosahedron with vertex jitter
        const geo = new THREE.IcosahedronGeometry(1, 1);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            const z = pos.getZ(i);
            const jitter = 0.15 + Math.random() * 0.25;
            pos.setXYZ(i,
                x + (Math.random() - 0.5) * jitter,
                y * (0.5 + Math.random() * 0.8) + (Math.random() - 0.5) * jitter * 0.5,
                z + (Math.random() - 0.5) * jitter
            );
        }
        geo.computeVertexNormals();


        const mat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 1.0,
            metalness: 0.1,
            flatShading: true
        });


        // Add color variation
        const colorVariation = Math.random() * 0.05;
        mat.color.setRGB(0.1 + colorVariation, 0.1 + colorVariation, 0.1 + colorVariation * 0.5);


        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(scale, scale * (0.6 + Math.random() * 0.6), scale);
        return mesh;
    }


    update(deltaTime) {
        super.update(deltaTime);
        if (!this.isActive) return;


        const playerPos = this.camera.position;


        // === WAVE PHYSICS ===
        this.wavePhase += deltaTime;
        this.swellPhase += deltaTime * 0.3;


        // Main wave: big slow swell + choppy fast waves
        const bigSwell = Math.sin(this.swellPhase) * 1.5;
        const chop = Math.sin(this.wavePhase * 3) * 0.3 + Math.sin(this.wavePhase * 5.7) * 0.15;
        const waveHeight = bigSwell + chop;


        // Camera bobs with the ocean -- player is IN the water
        const targetY = this.baseWaterLevel + waveHeight * 0.4;
        playerPos.y = THREE.MathUtils.lerp(playerPos.y, targetY, deltaTime * 3);


        // Lateral wave push (current drags the player)
        const wavePushX = Math.sin(this.wavePhase * 0.8) * 1.2 * deltaTime;
        const wavePushZ = Math.cos(this.wavePhase * 0.6 + 1.5) * 0.8 * deltaTime;
        playerPos.x += wavePushX;
        playerPos.z += wavePushZ;


        // Camera tilt with waves (seasick effect)
        this.camera.rotation.z = Math.sin(this.wavePhase * 1.5) * 0.06 + Math.sin(this.wavePhase * 3.2) * 0.03;


        // === SUBMERSION ===
        // Periodically submerge the player (big wave crashes over)
        this.submergeTimer += deltaTime;
        const submergeInterval = 6 + Math.sin(this.elapsedTime * 0.2) * 2;


        if (this.submergeTimer > submergeInterval && !this.isSubmerged) {
            this.isSubmerged = true;
            this.submergeTimer = 0;
            this.heartRate.spike(5);
            this.audio.playWaterSplash();


            // Dunk the camera
            this._submergeDuration = 1.5 + Math.random() * 1.5;
            this._submergeTime = 0;
        }


        if (this.isSubmerged) {
            this._submergeTime += deltaTime;
            const submergeProgress = this._submergeTime / this._submergeDuration;


            // Push camera under
            const dunkDepth = Math.sin(submergeProgress * Math.PI) * 1.2;
            playerPos.y -= dunkDepth;


            // Underwater overlay
            this.underwaterOverlay.style.opacity = Math.min(1, dunkDepth * 1.5);
            this.underwaterOverlay.style.background = `radial-gradient(ellipse at center,
                rgba(5,20,40,${dunkDepth * 0.4}) 30%,
                rgba(3,12,25,${dunkDepth * 0.8}) 100%)`;


            // Spike HR while submerged
            this.heartRate.spike(deltaTime * 3);


            if (this._submergeTime >= this._submergeDuration) {
                this.isSubmerged = false;
                this.underwaterOverlay.style.opacity = '0';
            }
        }
        
        // Cache dunk depth to adjust lighting later
        const currentDunkDepth = this.isSubmerged ? Math.sin((this._submergeTime / this._submergeDuration) * Math.PI) * 1.2 : 0;


        // === OCEAN MESH WAVE ANIMATION ===
        const oceanPos = this.oceanMesh.geometry.attributes.position;
        for (let i = 0; i < oceanPos.count; i++) {
            const ox = this._oceanPositions[i * 3];
            const oz = this._oceanPositions[i * 3 + 2];
            const waveVal =
                Math.sin(ox * 0.3 + this.wavePhase * 1.5) * 0.6 +
                Math.sin(oz * 0.4 + this.wavePhase * 1.2) * 0.4 +
                Math.sin((ox + oz) * 0.15 + this.swellPhase) * 1.5;
            oceanPos.setY(i, this._oceanPositions[i * 3 + 1] + waveVal);
        }
        oceanPos.needsUpdate = true;


        // === ROCK COLLISION ===
        this.rockHitCooldown = Math.max(0, this.rockHitCooldown - deltaTime);


        for (const rock of this.rocks) {
            if (!rock.isDangerous) continue;
            const dx = playerPos.x - rock.x;
            const dz = playerPos.z - rock.z;
            const dist = Math.sqrt(dx * dx + dz * dz);


            if (dist < rock.radius && this.rockHitCooldown <= 0) {
                // SMASHED into a rock
                this.heartRate.spike(8);
                this.rockHitCooldown = 1.0;
                this.hud.triggerHit();
                this.audio.playImpact();


                // Push player away from rock
                const pushX = dx / (dist || 1);
                const pushZ = dz / (dist || 1);
                playerPos.x += pushX * 2;
                playerPos.z += pushZ * 2;


                // Rock impact spray
                this.sprayParticles.emitBurst(
                    rock.x, 0.8, rock.z,
                    12, 0.5, 3, 0.6, 0xaaddee
                );
            }
        }


        // === SPRAY PARTICLES (ambient) ===
        // Crashing wave foam around rocks
        if (Math.random() < 0.15) {
            const rock = this.rocks[Math.floor(Math.random() * this.rocks.length)];
            if (rock.isDangerous) {
                this.sprayParticles.emit(
                    rock.x + (Math.random() - 0.5) * 2,
                    0.3 + Math.random() * 0.5,
                    rock.z + (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    1 + Math.random() * 2,
                    (Math.random() - 0.5) * 2,
                    0.5 + Math.random() * 0.5,
                    0x88aabb
                );
            }
        }


        // Spray near player when waves hit
        if (Math.abs(chop) > 0.2 && Math.random() < 0.2) {
            this.sprayParticles.emit(
                playerPos.x + (Math.random() - 0.5) * 3,
                playerPos.y + 0.2,
                playerPos.z + (Math.random() - 0.5) * 3,
                (Math.random() - 0.5) * 1.5,
                0.5 + Math.random(),
                (Math.random() - 0.5) * 1.5,
                0.4, 0x99bbcc
            );
        }


        this.sprayParticles.update(deltaTime);


        // === WAVE OVERLAY (water splashing over camera) ===
        if (bigSwell > 1.0) {
            this.waveOverlay.style.opacity = String(Math.min(0.6, (bigSwell - 1.0) * 0.8));
        } else {
            this.waveOverlay.style.opacity = '0';
        }


        // === LIGHTNING ===
        this.lightningTimer -= deltaTime;
        if (this.lightningTimer <= 0) {
            this.lightningFlash = 1;
            this.lightningTimer = 5 + Math.random() * 10;
            this.heartRate.spike(2);
            // Thunder impact sound
            this.audio.playImpact();
        }
        if (this.lightningFlash > 0) {
            this.lightningFlash -= deltaTime * 3;
            this.lightningLight.intensity = Math.max(0, this.lightningFlash * 8);
            // Brief sky flash
            const flashAmount = Math.max(0, this.lightningFlash * 0.3);
            this.scene.background.setRGB(
                0.016 + flashAmount, 0.03 + flashAmount, 0.06 + flashAmount
            );
        } else {
            this.lightningLight.intensity = 0;
            this.scene.background.setRGB(0.016, 0.03, 0.06);
        }


        // === CORE MECHANIC: STILLNESS vs STRUGGLE ===
        if (this.controls.isStill()) {
            this.stillTimer += deltaTime;
            this.heartRate.climbPaused = true;


            // After 4 seconds of stillness, begin dropping HR
            if (this.stillTimer > 4) {
                const dropDuration = this.stillTimer - 4;
                const dropRate = 1.5 + Math.min(3.0, dropDuration * 0.4);
                this.heartRate.drop(deltaTime * dropRate);
            }
        } else {
            this.stillTimer = 0;
            this.heartRate.climbPaused = false;


            // Struggling makes it worse -- waves push you into rocks harder
            if (this.controls.isMoving()) {
                this.heartRate.spike(deltaTime * 2);
                // Moving increases wave push intensity
                playerPos.x += wavePushX * 1.5;
                playerPos.z += wavePushZ * 1.5;
            }
        }


        // === WIN CHECK ===
        if (this.heartRate.bpm <= this.winThreshold) {
            this.conquer();
            return;
        }


        // === ATMOSPHERE SHIFT (storm calms as HR drops) ===
        const stormIntensity = Math.max(0, (this.heartRate.bpm - 90) / 80);
        let targetFogDensity = 0.01 + stormIntensity * 0.02;
        let targetMoonIntensity = 0.2 + (1 - stormIntensity) * 0.5;
        let targetAmbientIntensity = 0.6;
        let targetFogColor = new THREE.Color(0x040810);


        // Override lighting if submerged
        if (currentDunkDepth > 0) {
            targetAmbientIntensity = THREE.MathUtils.lerp(0.6, 0.05, currentDunkDepth);
            targetMoonIntensity = THREE.MathUtils.lerp(targetMoonIntensity, 0.05, currentDunkDepth);
            targetFogDensity = THREE.MathUtils.lerp(targetFogDensity, 0.15, currentDunkDepth);
            targetFogColor.lerp(new THREE.Color(0x010306), currentDunkDepth);
        }


        this.scene.fog.density = targetFogDensity;
        this.scene.fog.color.copy(targetFogColor);
        this.moonLight.intensity = targetMoonIntensity;
        this.ambientLight.intensity = targetAmbientIntensity;
    }


    cleanup() {
        // Remove DOM overlays
        if (this.underwaterOverlay && this.underwaterOverlay.parentNode) {
            this.underwaterOverlay.parentNode.removeChild(this.underwaterOverlay);
        }
        if (this.waveOverlay && this.waveOverlay.parentNode) {
            this.waveOverlay.parentNode.removeChild(this.waveOverlay);
        }
        this.underwaterOverlay = null;
        this.waveOverlay = null;


        // Reset camera tilt
        this.camera.rotation.z = 0;


        // Particles
        if (this.sprayParticles) this.sprayParticles.dispose();


        this.rocks = [];
        super.cleanup();
    }
}




// --- js/fears/FireStake.js ---
// Fear 3: Burning at the Stake -- Breathing rhythm mechanic








class FireStake extends FearBase {
    get name() { return 'THE FIRE'; }
    get climbRate() { return 2.5; }
    get climbAccel() { return 0.15; }


    async setup() {
        await super.setup();
        this.controls.movementLocked = true;
        this.breathPhase = 'inhale'; // inhale, hold, exhale, pause
        this.breathTimer = 0;
        this.breathCycleDuration = { inhale: 3, hold: 2, exhale: 3, pause: 1 };
        
        // Active mechanics
        this.lungFill = 0.2;
        this.targetFill = 0.2;
        this.fireIntensity = 0.3;
        this.winThreshold = 90;


        this.scene.background = new THREE.Color(0x0a0505);
        this.scene.fog = new THREE.Fog(0x0a0505, 3, 20);


        // Lighting
        this.addObject(new THREE.AmbientLight(0x331100, 0.3));
        this.fireLight = new THREE.PointLight(0xff6600, 1, 15);
        this.fireLight.position.set(0, 1, 2);
        this.addObject(this.fireLight);
        this.fireLight2 = new THREE.PointLight(0xff3300, 0.5, 10);
        this.fireLight2.position.set(-2, 0.5, -1);
        this.addObject(this.fireLight2);


        // Ground
        const ground = createGroundPlane(30, 0x1a0e08, 0x120a05);
        this.addObject(ground);


        // Pyre
        const pyre = createPyre();
        this.addObject(pyre);


        // Arena walls (circular pillars)
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const pillar = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.25, 4, 6),
                new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.9 })
            );
            pillar.position.set(Math.cos(angle) * 8, 2, Math.sin(angle) * 8);
            this.addObject(pillar);
            // Torch on each pillar
            const torchLight = new THREE.PointLight(0xff8800, 0.3, 6);
            torchLight.position.set(Math.cos(angle) * 7.5, 3.5, Math.sin(angle) * 7.5);
            this.addObject(torchLight);
        }


        // Crowd silhouettes (Shadow Men)
        for (let i = 0; i < 20; i++) {
            const angle = (i / 20) * Math.PI * 2 + Math.random() * 0.2;
            const r = 6 + Math.random() * 2;
            const fig = this._buildShadowFigure();
            fig.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            fig.lookAt(0, 0, 0);
            
            // Randomly scale slightly for variety
            const scale = 0.9 + Math.random() * 0.3;
            fig.scale.set(scale, scale, scale);
            this.addObject(fig);
        }


        // Fire particles
        // NOTE: ParticlePool adds its own .points to the scene internally.
        // Do NOT push .points into this.objects -- cleanup() calls fireParticles.dispose()
        // which removes them. Double-tracking caused a double-dispose crash.
        this.fireParticles = new ParticlePool(this.scene, this.perfMon.getParticleCount(300), {
            color: 0xff6600, size: 0.15
        });


        // Ember particles
        this.embers = new ParticlePool(this.scene, this.perfMon.getParticleCount(100), {
            color: 0xff4400, size: 0.04
        });


        // Breathing guide
        this.breathGuide = document.getElementById('breathing-guide');
        this.breathCircle = document.querySelector('.breath-circle');
        this.breathRing = document.querySelector('.breath-ring');
        this.breathText = document.querySelector('.breath-text');
        this.breathFill = document.querySelector('.breath-timing-fill');
        
        // Disable automatic CSS transitions for precise JS-driven scaling
        this.breathCircle.style.transition = 'none';
        this.breathRing.style.transition = 'none';


        this.camera.position.set(0, 1.6, 0);
        this.hud.setNarrative("You're bound to a stake. Fire circles around you.");
        setTimeout(() => {
            this.hud.setNarrative("Control your breathing. The fire is not real.");
            this.breathGuide.classList.remove('hidden');
            this.hud.showPrompt("[SPACE] Breathe in rhythm with the guide");
        }, 4000);
    }


    _buildShadowFigure() {
        const group = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a10, emissive: 0x000000, emissiveIntensity: 0,
            roughness: 0.9
        });


        const body = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.2), bodyMat);
        body.position.y = 1.05;
        group.add(body);


        const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 4), bodyMat.clone());
        head.position.y = 1.7;
        group.add(head);


        for (const x of [-0.25, 0.25]) {
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 0.1), bodyMat.clone());
            arm.position.set(x, 1.0, -0.1);
            arm.rotation.x = -0.3;
            group.add(arm);
        }
        return group;
    }


    update(deltaTime) {
        super.update(deltaTime);
        if (!this.isActive) return;


        // Update breathing cycle
        this.breathTimer += deltaTime;
        const phase = this.breathPhase;
        const dur = this.breathCycleDuration[phase];


        if (this.breathTimer >= dur) {
            this.breathTimer = 0;
            if (phase === 'inhale') this.breathPhase = 'hold';
            else if (phase === 'hold') this.breathPhase = 'exhale';
            else if (phase === 'exhale') this.breathPhase = 'pause';
            else this.breathPhase = 'inhale';
        }


        // 1. Calculate Target Capacity
        // BUGFIX: re-read dur AFTER the phase may have changed above, so targetFill
        // is always computed against the *current* phase's duration, not the old one.
        const currentDur = this.breathCycleDuration[this.breathPhase];
        if (this.breathPhase === 'inhale') {
            this.targetFill = 0.2 + (this.breathTimer / currentDur) * 0.8;
        } else if (this.breathPhase === 'hold') {
            this.targetFill = 1.0;
        } else if (this.breathPhase === 'exhale') {
            this.targetFill = 1.0 - (this.breathTimer / currentDur) * 0.8;
        } else if (this.breathPhase === 'pause') {
            this.targetFill = 0.2;
        }


        // 2. Calculate Player Lung Capacity (Manual Input)
        const spacePressed = this._isSpacePressed();
        // Target fills at ~0.26/s. Player fills at 0.35/s (was 0.45), making it easier to track.
        const playerFillRate = 0.35; 
        if (spacePressed) {
            this.lungFill += deltaTime * playerFillRate;
        } else {
            this.lungFill -= deltaTime * playerFillRate;
        }
        this.lungFill = Math.max(0.05, Math.min(1.2, this.lungFill)); // Clamp


        // 3. Update Visuals
        // Target ring scale (base width is 160px)
        this.breathRing.style.transform = `scale(${this.targetFill})`;
        // Inner circle scale (base width is 60px, ring is 160px. 160/60 = 2.66 max scale)
        this.breathCircle.style.transform = `translate(-50%, -50%) scale(${this.lungFill * 2.66})`;
        
        const progress = this.breathTimer / dur;
        this.breathFill.style.width = `${progress * 100}%`;
        const labels = { inhale: 'BREATHE IN [HOLD SPACE]', hold: 'HOLD BREATH', exhale: 'BREATHE OUT [RELEASE]', pause: 'WAIT' };
        this.breathText.textContent = labels[this.breathPhase];


        // 4. Evaluate Sync
        const diff = Math.abs(this.lungFill - this.targetFill);
        const inSync = diff < 0.2; // 20% margin of error (was 15%)


        if (inSync) {
            // Good Breathing
            this.breathRing.style.borderColor = 'rgba(78,168,222,0.8)'; // Calm Blue
            this.breathCircle.style.borderColor = 'var(--color-secondary)';
            this.heartRate.climbPaused = true;
            this.heartRate.drop(deltaTime * 5); // Increased from 4
            this.fireIntensity = Math.max(0.1, this.fireIntensity - deltaTime * 0.2);
            
            // Clear any lingering camera shake
            this.camera.position.x = 0;
            this.camera.position.y = 1.6;
        } else {
            // Out of Sync (Desynced)
            this.breathRing.style.borderColor = 'rgba(230,57,70,0.8)'; // Panic Red
            this.breathCircle.style.borderColor = 'var(--color-danger)';
            this.heartRate.climbPaused = false;
            this.heartRate.spike(deltaTime * 2);
            this.fireIntensity = Math.min(1.5, this.fireIntensity + deltaTime * 0.4);
            
            // Screen shake
            this.camera.position.x = (Math.random() - 0.5) * 0.08;
            this.camera.position.y = 1.6 + (Math.random() - 0.5) * 0.08;
        }


        // Fire particles
        const fireRadius = 1.5 + this.fireIntensity * 2;
        for (let i = 0; i < Math.floor(5 * this.fireIntensity); i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 0.5 + Math.random() * fireRadius;
            this.fireParticles.emit(
                Math.cos(angle) * r, 0.1, Math.sin(angle) * r,
                (Math.random() - 0.5) * 0.5,
                1 + Math.random() * 2,
                (Math.random() - 0.5) * 0.5,
                0.5 + Math.random() * 0.8,
                Math.random() > 0.5 ? 0xff6600 : 0xff2200
            );
        }
        this.fireParticles.update(deltaTime);


        // Embers float up
        if (Math.random() < 0.1 * this.fireIntensity) {
            this.embers.emit(
                (Math.random() - 0.5) * 4, 0.5, (Math.random() - 0.5) * 4,
                (Math.random() - 0.5) * 0.3, 0.5 + Math.random(), (Math.random() - 0.5) * 0.3,
                2 + Math.random() * 2, 0xff4400
            );
        }
        this.embers.update(deltaTime);


        // Flicker lights
        this.fireLight.intensity = this.fireIntensity * (1.5 + Math.sin(this.elapsedTime * 10) * 0.3);
        this.fireLight2.intensity = this.fireIntensity * (0.8 + Math.sin(this.elapsedTime * 8 + 1) * 0.2);


        // Fire crackle sound
        if (Math.random() < 0.02 * this.fireIntensity) this.audio.playFireCrackle();


        // Check conquest
        if (this.heartRate.bpm <= this.winThreshold) {
            this.breathGuide.classList.add('hidden');
            this.conquer();
        }
    }


    _isSpacePressed() {
        // BUGFIX: store listener references so they can be removed in cleanup().
        // Previously, every new FireStake instance (on restart/retry) would add new
        // listeners without removing old ones, causing stacked duplicates.
        if (!this._spaceListener) {
            this._spaceDown = false;
            this._onKeyDown = (e) => { if (e.code === 'Space') this._spaceDown = true; };
            this._onKeyUp   = (e) => { if (e.code === 'Space') this._spaceDown = false; };
            document.addEventListener('keydown', this._onKeyDown);
            document.addEventListener('keyup',   this._onKeyUp);
            this._spaceListener = true;
        }
        return this._spaceDown;
    }


    cleanup() {
        if (this.breathGuide) this.breathGuide.classList.add('hidden');
        // Remove space key listeners to prevent stacking across restarts
        if (this._onKeyDown) document.removeEventListener('keydown', this._onKeyDown);
        if (this._onKeyUp)   document.removeEventListener('keyup',   this._onKeyUp);
        this._spaceListener = false;
        if (this.fireParticles) this.fireParticles.dispose();
        if (this.embers) this.embers.dispose();
        super.cleanup();
    }
}

        });


        // Impact flash particles
        this.impactParticles = new ParticlePool(this.scene, this.perfMon.getParticleCount(40), {
            color: 0x8844cc, size: 0.08
        });


        // Click handler -- stored so we can remove it
        this._onMouseDown = (e) => {

                this._pendingClick = true;
            }
        };
        document.addEventListener('mousedown', this._onMouseDown);
        this._pendingClick = false;


        // Raycaster (reuse, don't create per-frame)
        this._raycaster = new THREE.Raycaster();
        this._rayOrigin = new THREE.Vector2(0, 0);

        this.spawnWave();


        this.hud.setNarrative("Your old room. Something is wrong. The walls feel like they're breathing.");
        setTimeout(() => {

            this.hud.setNarrative("Shadows form into figures. They're reaching for you.");
        }, 4000);
        setTimeout(() => {
            if (!this.isActive) return;
            this.hud.setNarrative("One of them is different \u2014 glowing. Find it. Fight back.");
            this.hud.showPrompt("[CLICK] Attack the glowing figure");
        }, 8000);
    }


    _buildFigure(isLead) {
        const group = new THREE.Group();
        const bodyColor = isLead ? 0x1a0e2e : 0x0a0a10;
        const emissive = isLead ? 0x6633aa : 0x000000;
        const intensity = isLead ? 0.6 : 0;


        const bodyMat = new THREE.MeshStandardMaterial({
            color: bodyColor, emissive, emissiveIntensity: intensity,
            roughness: 0.9
        });


        // Body -- tall, thin, unsettling
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 0.9, 0.2),
            bodyMat
        );
        body.position.y = 1.05;
        group.add(body);


        // Head
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.13, 6, 4),
            bodyMat.clone()
        );
        head.position.y = 1.7;
        group.add(head);


        // Arms (slightly extended forward -- reaching)
        for (const x of [-0.25, 0.25]) {
            const arm = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 0.55, 0.1),
                bodyMat.clone()
            );
            arm.position.set(x, 1.0, -0.1);
            arm.rotation.x = -0.3; // reaching forward
            group.add(arm);
        }


        // Leader gets glowing "eyes"
        if (isLead) {
            for (const x of [-0.04, 0.04]) {
                const eye = new THREE.Mesh(
                    new THREE.SphereGeometry(0.015, 4, 4),
                    new THREE.MeshStandardMaterial({
                        color: 0xaa66ff, emissive: 0xaa66ff,
                        emissiveIntensity: 2.0
                    })
                );
                eye.position.set(x, 1.72, -0.12);
                group.add(eye);
            }


            // Subtle point light on leader so they glow
            const glow = new THREE.PointLight(0x6633aa, 0.4, 3);
            glow.position.set(0, 1.3, 0);
            group.add(glow);
        }


        return group;
    }


    spawnWave() {
        // Clear old figures from scene
        for (const f of this.figures) {
            this.scene.remove(f.mesh);
            this._disposeMesh(f.mesh);
        }
        this.figures = [];
        this.waveNum++;


        const count = Math.min(2 + this.waveNum, 6); // cap at 6
        this.leadIndex = Math.floor(Math.random() * count);


        for (let i = 0; i < count; i++) {
            const isLead = i === this.leadIndex;
            const group = this._buildFigure(isLead);


            // Spawn around room edges
            const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
            const r = 2.0 + Math.random() * 0.8;
            group.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            group.lookAt(this.camera.position.x, 0, this.camera.position.z);
            this.scene.add(group);


            this.figures.push({
                mesh: group,
                isLead,
                moveSpeed: 0.25 + Math.random() * 0.25 + this.waveNum * 0.04,
                bobPhase: Math.random() * Math.PI * 2,
                swayPhase: Math.random() * Math.PI * 2,
                alive: true
            });
        }
    }


    _disposeMesh(obj) {
        obj.traverse(c => {
            if (c.geometry) c.geometry.dispose();
            if (c.material) {
                if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                else c.material.dispose();
            }
        });
    }


    update(deltaTime) {
        super.update(deltaTime);
        if (!this.isActive) return;


        // --- Light flickering ---
        this.flickerTimer += deltaTime;
        if (Math.random() < 0.03 + this.waveNum * 0.01) {
            // Random flicker: sudden drop
            this.targetLightIntensity = Math.random() < 0.25 ? 0.03 : 0.5;
        }
        this.mainLight.intensity = THREE.MathUtils.lerp(
            this.mainLight.intensity, this.targetLightIntensity, deltaTime * 4
        );


        // Wave light grows with intensity
        this.waveLight.intensity = Math.min(1.0, this.waveNum * 0.15);


        // --- Dust particles ---
        if (Math.random() < 0.08) {
            this.dustParticles.emit(
                (Math.random() - 0.5) * 5, Math.random() * 2.5, (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 0.1, 0.05 + Math.random() * 0.1, (Math.random() - 0.5) * 0.1,
                3 + Math.random() * 2, 0x333344
            );
        }
        this.dustParticles.update(deltaTime);
        this.impactParticles.update(deltaTime);


        // --- Cooldown ---
        this.hitCooldown = Math.max(0, this.hitCooldown - deltaTime);


        const playerPos = this.camera.position;


        // --- Move figures toward player ---
        for (const f of this.figures) {
            if (!f.alive) continue;


            const dir = new THREE.Vector3().subVectors(playerPos, f.mesh.position);
            dir.y = 0;
            const dist = dir.length();
            if (dist > 0.01) dir.normalize();


            // Advance toward player
            f.mesh.position.addScaledVector(dir, f.moveSpeed * deltaTime);
            f.mesh.lookAt(playerPos.x, 0, playerPos.z);


            // Eerie bob + sway
            f.bobPhase += deltaTime * 2.5;
            f.swayPhase += deltaTime * 1.3;
            f.mesh.position.y = Math.sin(f.bobPhase) * 0.04;
            f.mesh.rotation.z = Math.sin(f.swayPhase) * 0.05;


            // Pulse leader glow
            if (f.isLead) {
                const pulse = 0.4 + Math.sin(this.elapsedTime * 4) * 0.3;
                f.mesh.children.forEach(c => {
                    if (c.material && c.material.emissiveIntensity !== undefined) {
                        // Don't overwrite eyes (they're at 2.0)
                        if (c.material.emissiveIntensity < 1.5) {
                            c.material.emissiveIntensity = pulse;
                        }
                    }
                });
            }


            // Contact damage -- figure touches player
            if (dist < 0.7 && this.hitCooldown <= 0) {
                this.heartRate.spike(4);
                this.hitCooldown = 0.8;
                this.audio.playImpact();
                this.hud.triggerHit();
                this.shakeIntensity = 0.15;


                // Push figure back (use a fresh copy of direction, not the mutated one)
                const pushDir = new THREE.Vector3().subVectors(f.mesh.position, playerPos);
                pushDir.y = 0;
                pushDir.normalize();
                f.mesh.position.addScaledVector(pushDir, 1.5);
            }
        }


        // --- Click detection (using our own listener, not controls.keys.click) ---
        if (this._pendingClick) {
            this._pendingClick = false;


            this._raycaster.setFromCamera(this._rayOrigin, this.camera);


            for (const f of this.figures) {
                if (!f.isLead || !f.alive) continue;


                const intersects = this._raycaster.intersectObjects(f.mesh.children, true);
                if (intersects.length > 0 && intersects[0].distance < 4.0) {
                    // HIT the leader!
                    f.alive = false;
                    this.totalKills++;
                    this.heartRate.drop(15);
                    this.heartRate.climbPaused = true;


                    // Re-enable climb after a brief respite
                    setTimeout(() => {
                        if (this.isActive) this.heartRate.climbPaused = false;
                    }, 1500);


                    this.audio.playImpact();


                    // Flash figure white then remove
                    f.mesh.children.forEach(c => {
                        if (c.material) {
                            c.material.emissive = new THREE.Color(0xffffff);
                            c.material.emissiveIntensity = 3;
                        }
                    });


                    // Impact burst particles
                    const fp = f.mesh.position;
                    this.impactParticles.emitBurst(fp.x, 1.2, fp.z, 15, 0.5, 3, 0.8, 0xaa66ff);


                    // Brief light flash
                    this.mainLight.intensity = 2.0;
                    this.targetLightIntensity = 0.5;


                    // Camera shake
                    this.shakeIntensity = 0.12;


                    // Delayed transition: check win or next wave
                    setTimeout(() => {
                        if (!this.isActive) return;


                        // Remove dead figure
                        this.scene.remove(f.mesh);
                        this._disposeMesh(f.mesh);


                        if (this.heartRate.bpm <= this.winThreshold) {
                            this.conquer();
                        } else {
                            this.spawnWave();
                            const messages = [
                                "Another wave. They won't stop coming.",
                                "More shadows. Find the leader.",
                                "They're getting faster. Stay focused.",
                                "The room is shrinking. Find the glowing one.",
                                "You can feel them everywhere. Fight back."
                            ];
                            this.hud.setNarrative(messages[Math.min(this.waveNum - 1, messages.length - 1)]);
                        }
                    }, 600);
                    break;
                }
            }
        }


        // --- Camera shake decay (offset-based so player movement is preserved) ---
        // Remove previous frame's offset
        this.camera.position.sub(this._shakeOffset);


        if (this.shakeIntensity > 0) {
            this.shakeIntensity -= deltaTime * 1.2;
            if (this.shakeIntensity < 0) this.shakeIntensity = 0;
            this._shakeOffset.set(
                (Math.random() - 0.5) * this.shakeIntensity,
                (Math.random() - 0.5) * this.shakeIntensity,
                0
            );
        } else {
            this._shakeOffset.set(0, 0, 0);
        }


        // Clamp player position to room bounds (room is 20x20, so limits are roughly +/- 9.5)
        const bounds = 9.5;
        this.camera.position.x = THREE.MathUtils.clamp(this.camera.position.x, -bounds, bounds);
        this.camera.position.z = THREE.MathUtils.clamp(this.camera.position.z, -bounds, bounds);


        // Apply new offset
        this.camera.position.add(this._shakeOffset);


        // --- Fog closes in over time (rising tension) ---
        this.scene.fog.far = Math.max(5, 10 - this.elapsedTime * 0.08);


        // --- Win check (in case HR drops from passive means too) ---
        if (this.heartRate.bpm <= this.winThreshold) {
            this.conquer();
        }
    }


    cleanup() {
        // Remove any lingering shake offset from camera
        if (this._shakeOffset) {
            this.camera.position.sub(this._shakeOffset);
            this._shakeOffset.set(0, 0, 0);
        }


        // Remove click listener
        if (this._onMouseDown) {
            document.removeEventListener('mousedown', this._onMouseDown);
            this._onMouseDown = null;
        }


        // Dispose figures
        for (const f of this.figures) {
            this.scene.remove(f.mesh);
            this._disposeMesh(f.mesh);
        }
        this.figures = [];


        // Dispose particles (not tracked in this.objects)
        if (this.dustParticles) this.dustParticles.dispose();
        if (this.impactParticles) this.impactParticles.dispose();


        super.cleanup();
    }
}

// Fear 5: The Sacrifice -- The Dauntless Pit
// A terrifying circular abyss. The family dangles on the opposite edge.
// You must jump into the pit after them.




class FamilySacrifice extends FearBase {
    get name() { return 'THE SACRIFICE'; }
    get climbRate() { return 1.8; }
    get climbAccel() { return 0.08; }


    async setup() {
        await super.setup();


        this.dropTimer = 5 + Math.random() * 8; // Random drop between 5 and 13 seconds
        this.hasDropped = false;
        this.dropTime = 0;
        this.windowDuration = 1.0; // 1 second window to jump
        this.jumpAttempted = false;
        this.resolved = false;
        this.fallVelocity = 0;
        this.pitRadius = 12;
        
        // --- Atmosphere: The Dauntless Pit ---
        this.scene.background = new THREE.Color(0x020305);
        this.scene.fog = new THREE.FogExp2(0x020305, 0.04);


        this.ambientLight = new THREE.AmbientLight(0x111a22, 0.4);
        this.addObject(this.ambientLight);


        // Faint lights far below in the pit
        const pitLight = new THREE.PointLight(0x224466, 0.6, 120);
        pitLight.position.set(0, -60, 0);
        this.addObject(pitLight);


        const pitLight2 = new THREE.PointLight(0x663322, 0.5, 150);
        pitLight2.position.set(0, -80, 0);
        this.addObject(pitLight2);


        // --- The Environment: Circular Chasm ---
        const stoneMat = new THREE.MeshStandardMaterial({ 
            color: 0x111115, roughness: 0.9, metalness: 0.1, flatShading: true 
        });


        // Create the ground with a hole in the middle
        const shape = new THREE.Shape();
        shape.moveTo(-100, -100);
        shape.lineTo(100, -100);
        shape.lineTo(100, 100);
        shape.lineTo(-100, 100);
        shape.lineTo(-100, -100);


        const holePath = new THREE.Path();
        holePath.absarc(0, 0, this.pitRadius, 0, Math.PI * 2, false);
        shape.holes.push(holePath);


        const extrudeSettings = { depth: 20, bevelEnabled: false, curveSegments: 32 };
        const groundGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        groundGeo.rotateX(Math.PI / 2); // Lay flat
        groundGeo.translate(0, -1, 0); // Ground level at y= -1
        
        const ground = new THREE.Mesh(groundGeo, stoneMat);
        this.addObject(ground);


        // --- The Light Figures (Edge) ---
        this.figures = new THREE.Group();
        // Place them on the near edge (-Z side of the pit)
        this.figures.position.set(0, -1, -this.pitRadius); 
        
        for (let i = 0; i < 3; i++) {
            const fig = this._buildHuman(0xcccccc);
            fig.position.set((i - 1) * 2.0, 0, 0);
            this.figures.add(fig);
            
            // Add a soft glow
            const glow = new THREE.PointLight(0xffffff, 0.8, 8);
            glow.position.y = 1;
            fig.add(glow);
        }
        
        this.addObject(this.figures);


        // --- Camera start ---
        // Player starts right behind the figures on the -Z side
        this.camera.position.set(0, 1.6, -this.pitRadius - 3.0); // z = -15
        this.camera.lookAt(0, 1.6, 0); // look towards the center of the pit


        // --- Narrative ---
        this.hud.setNarrative("They're going to fall.");
    }


    _buildHuman(colorHex) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ 
            color: colorHex, emissive: colorHex, emissiveIntensity: 0.2, roughness: 0.8 
        });


        // The origin (0,0,0) of this group will be the hands gripping the edge.
        // The body will hang down and slightly inward (towards positive Z).


        // Torso (hanging below hands)
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.7, 8), mat);
        torso.position.set(0, -0.8, 0.2);
        // Slight rotation to look like gravity is pulling them straight down while hands hold edge
        torso.rotation.x = -0.1;
        group.add(torso);


        // Head (hanging back slightly)
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), mat);
        head.position.set(0, -0.3, 0.35);
        head.rotation.x = -0.3; // looking up/back
        group.add(head);


        // Arms (reaching up to the origin/hands)
        for (const x of [-0.35, 0.35]) {
            // Capsule approx: radius 0.08, height 0.6 + 0.16 = 0.76
            const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.76, 8);
            // Translate geometry so origin is at the top (the hand)
            armGeo.translate(0, -0.3, 0); 
            const arm = new THREE.Mesh(armGeo, mat);
            // Place hands at origin, spread slightly
            arm.position.set(x, 0, 0);
            // Rotate arms to connect down to the torso
            arm.lookAt(x, -0.8, 0.2);
            group.add(arm);
        }
        
        // Legs (dangling below torso)
        for (const x of [-0.15, 0.15]) {
            // Capsule approx: radius 0.1, height 0.6 + 0.2 = 0.8
            const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
            legGeo.translate(0, -0.3, 0); // Origin at hip
            const leg = new THREE.Mesh(legGeo, mat);
            leg.position.set(x, -1.15, 0.2);
            // Dangle with slight sway
            leg.rotation.x = x > 0 ? 0.05 : -0.05;
            group.add(leg);
        }
        return group;
    }


    update(deltaTime) {
        if (!this.isActive || this.resolved) return;
        super.update(deltaTime);


        const playerPos = this.camera.position;


        // Mechanic: Drop logic
        if (!this.hasDropped) {
            this.dropTimer -= deltaTime;
            if (this.dropTimer <= 0) {
                this.hasDropped = true;
                this.hud.setNarrative("JUMP.");
                this.heartRate.spike(10);
            }
        } else {
            // Figures fall into the abyss
            this.dropTime += deltaTime;
            this.figures.position.y -= deltaTime * 35; // fall fast
            
            // Mechanic: Die if window expires and player hasn't jumped
            if (this.dropTime > this.windowDuration && !this.jumpAttempted && !this.failTriggered) {
                this.failTriggered = true;
                this.heartRate.spike(100); // Instant fail
                this.hud.setNarrative("You let them fall.");
            }
        }


        // Check if player is over the pit (x^2 + z^2 < R^2)
        const distFromCenterSq = playerPos.x * playerPos.x + playerPos.z * playerPos.z;
        const isOverPit = distFromCenterSq < (this.pitRadius * this.pitRadius);


        // Mechanic: Did the player jump off the edge?
        if (isOverPit && !this.jumpAttempted && !this.failTriggered) {
            // We just walked over the edge
            this.jumpAttempted = true;
            
            // Evaluate jump timing -- 1 second window
            if (this.hasDropped && this.dropTime <= this.windowDuration) {
                // SUCCESS
                // Initiate the fade sequence while falling
                this.isFading = true;
                this.hud.setNarrative("");
                
                // Attach a black plane to the camera to fade the screen
                const fadeGeo = new THREE.PlaneGeometry(10, 10);
                const fadeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
                this.fadePlane = new THREE.Mesh(fadeGeo, fadeMat);
                this.fadePlane.position.set(0, 0, -0.5);
                this.camera.add(this.fadePlane);
                
                // Make sure camera is in the scene so the plane renders
                if (!this.scene.children.includes(this.camera)) {
                    this.scene.add(this.camera);
                }
            } else {
                // FAIL: Jumped too early
                // Notice we do NOT spike heart rate here. We let them fall first!
                this.hud.setNarrative("You jumped too early.");
            }
        }
        
        // Handle success fade out
        if (this.isFading && !this.resolved) {
            this.fadeDelayTimer = (this.fadeDelayTimer || 0) + deltaTime;
            
            // Wait 0.25 seconds before starting the fade
            if (this.fadeDelayTimer >= 0.25) {
                this.fadePlane.material.opacity += deltaTime * 3.0; // Fades to black quickly (~0.3s)
                
                if (this.fadePlane.material.opacity >= 1.0) {
                    this.resolved = true;
                    
                    // Instant win
                    this.heartRate.bpm = 90; 
                    this.heartRate.targetBpm = 90;
                    this.heartRate.climbPaused = true;
                    
                    if (this.isActive) this.conquer();
                }
            }
        }


        // Falling physics if player is over the pit
        if (isOverPit || this.jumpAttempted) {
            this.fallVelocity += 30 * deltaTime; // Gravity
            playerPos.y -= this.fallVelocity * deltaTime;
        } else {
            // If they are safely on the ground, ensure they don't drift into the ground due to velocity
            this.fallVelocity = 0;
            playerPos.y = 1.6;


            // Outer bounds constraint (keep them within 20 units of center)
            if (distFromCenterSq > 400) {
                const angle = Math.atan2(playerPos.x, playerPos.z);
                playerPos.x = Math.sin(angle) * 20;
                playerPos.z = Math.cos(angle) * 20;
            }
        }
        
        // Let the player fall endlessly if they fail
        if (playerPos.y < -40 && !this.resolved && !this.failTriggered) {
            // Force death when hitting the bottom
            this.failTriggered = true;
            this.heartRate.spike(100);
        }
    }


    cleanup() {
        this.figures = null;
        super.cleanup();
    }
}

// Main Game Controller -- Crows Only (other fears stored for later)
// Bugs fixed: state machine flow, pointer lock stacking, onFearConquered
// called directly by fear (not HR threshold), proper cleanup
























class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.renderer = new THREE.WebGLRenderer({
            canvas: this.canvas,
            antialias: false,
            powerPreference: 'low-power'
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.0;


        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(
            70, window.innerWidth / window.innerHeight, 0.1, 100
        );
        this.camera.position.set(0, 1.6, 0);


        // Systems
        this.heartRate = new HeartRate();
        this.controls = new PlayerControls(this.camera, document.body);
        this.hud = new HUD(this.heartRate);
        this.audio = new AudioManager();
        this.perfMon = new PerformanceMonitor();


        // Fears
        this.fears = [new CrowAttack(this), new GlassTank(this), new OceanRocks(this), new FireStake(this), new ShadowMen(this), new FamilySacrifice(this)];
        this.currentFearIndex = 0;
        this.currentFear = null;


        // State
        this.state = 'loading';
        this.clock = new THREE.Clock();
        this.fearStats = [];
        this.lastHeartbeatUpdate = 0;
        this._pointerLockPending = false;


        // DOM refs
        this.loadingScreen = document.getElementById('loading-screen');
        this.cutsceneOverlay = document.getElementById('cutscene-overlay');
        this.cutsceneText = document.getElementById('cutscene-text');
        this.transitionOverlay = document.getElementById('transition-overlay');
        this.conqueredOverlay = document.getElementById('fear-conquered');
        this.resultsScreen = document.getElementById('results-screen');
        this.failScreen = document.getElementById('fail-screen');


        this.cutscenes = {
            intro: [
                "I am Four. I am your instincts. I am the part of you that knows when something is wrong before your brain catches up.",
                "Everybody's afraid of something. The Dauntless don't get rid of that. They just stop letting it win.",
                "Your heart is going to spike. That's the whole point. Bring it back down. Keep moving.",
                "Let's see what you've got."
            ],
            reenter: [
                "You survived. Barely.",
                "But survival isn't enough. The Dauntless demand perfection.",
                "We're sending you back in. Let's see if you learned anything."
            ],
            post_0: [
                "Feathers and claws. Not so bad, right? Don't get comfortable.",
                "The next one is tight. Small. Keep your breathing steady and don't let the walls get in your head."
            ],
            post_1: [
                "Small spaces. Conquered. Next up \u2014 water.",
                "The shore is close. I can see it from here. Swim for it. Don't stop moving."
            ],
            post_2: [
                "You swam, didn't you. Straight for that shore.",
                "How'd that work out for you?",
                "Next time, trust your gut less. The sim wants you to panic and move. Sometimes standing still is the hardest thing you can do \u2014 and the right one.",
                "Fire is coming. Don't run from it."
            ],
            post_3: [
                "Still here. Most people look a little different by now.",
                "This next one hits different. Just a warning. Keep your head \u2014 whatever you see, whatever they say to you, stay calm. Panic is what they want."
            ],
            post_4: [
                "Someone you love. That's what's at stake now. The hardest thing isn't facing death \u2014 it's deciding what you'd trade for someone else's life.",
                "This is the Dauntless pit. Your family is dangling over the edge. There is no pulling them up. You can't save them.",
                "When they fall, there is only one way to beat this simulation. You have to jump in after them. Do not hesitate."
            ],
            outro: [
                "Six fears. Six simulations. All of them yours.",
                "Dauntless."
            ]
        };


        this.init();
    }


    init() {
        // Resize
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // Loading -> Intro Cutscene
        this.introTimeout = setTimeout(() => {
            this.loadingScreen.classList.add('hidden');
            // User must interact for audio to start. We do it implicitly here if they click,
            // or just start and audio will unlock on first click.
            this.startCutscene('intro', () => {
                this.startGame(0);
            });
        }, 2500);


        // Retry / Restart Buttons
        document.getElementById('retry-btn').addEventListener('click', () => {
            this.failScreen.classList.add('hidden');
            this.startGame(this.currentFearIndex);
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            this.resultsScreen.classList.add('hidden');
            this.startCutscene('reenter', () => {
                this.startGame(0);
            });
        });


        // Re-lock pointer on canvas click when playing
        this.canvas.addEventListener('click', () => {
            if (this.state === 'playing' && !this.controls.isLocked) {
                this.controls.lock();
            }
        });


        // Fail callback
        this.heartRate.onFail = () => this.onFearFailed();


        // Start loop
        this.animate();
    }


    startCutscene(id, onComplete) {
        this.state = 'cutscene';
        this.cutsceneOverlay.classList.remove('hidden');
        this.cutsceneText.innerHTML = '';
        
        // Attempt to initialize audio if not already done
        if (this.audio && !this.audio.initialized) this.audio.init();


        const paragraphs = this.cutscenes[id];
        let pIndex = 0;
        let charIndex = 0;
        
        const typeChar = () => {
            if (this.state !== 'cutscene') return; // Cancelled/interrupted
            
            if (pIndex >= paragraphs.length) {
                setTimeout(() => {
                    this.cutsceneOverlay.classList.add('hidden');
                    onComplete();
                }, 1000);
                return;
            }
            
            const currentPara = paragraphs[pIndex];
            
            if (charIndex === 0 && pIndex > 0) {
                this.cutsceneText.innerHTML += '<br><br>';
            }
            
            if (charIndex < currentPara.length) {
                this.cutsceneText.innerHTML += currentPara.charAt(charIndex);
                charIndex++;
                setTimeout(typeChar, 30);
            } else {
                pIndex++;
                charIndex = 0;
                setTimeout(typeChar, 1000);
            }
        };
        this.cutsceneTimer = setTimeout(typeChar, 30);
    }


    jumpToSimulation(index) {
        if (this.introTimeout) clearTimeout(this.introTimeout);
        if (this.cutsceneTimer) clearTimeout(this.cutsceneTimer);
        this.state = 'playing';
        this.loadingScreen.classList.add('hidden');
        this.cutsceneOverlay.classList.add('hidden');
        if (this.audio && !this.audio.initialized) this.audio.init();
        this.startGame(index);
    }


    async startGame(index = 0) {
        this.currentFearIndex = index;
        this.fearStats = [];


        // Clean scene fully
        this.cleanScene();


        // Recreate fears (fresh instances to avoid stale state)
        this.fears = [new CrowAttack(this), new GlassTank(this), new OceanRocks(this), new FireStake(this), new ShadowMen(this), new FamilySacrifice(this)];


        this.heartRate.resetForNewFear(0);
        this.state = 'playing';
        await this.loadFear(index);
    }


    cleanScene() {
        const toRemove = [...this.scene.children];
        for (const obj of toRemove) {
            this.scene.remove(obj);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else if (obj.material.dispose) obj.material.dispose();
            }
        }
        this.scene.fog = null;
        this.scene.background = null;
    }


    async loadFear(index) {
        this.currentFear = this.fears[index];
        this.hud.setFear(index + 1, this.fears.length, this.currentFear.name);
        this.hud.show();


        const carryOver = index > 0 ? Math.max(0, (this.heartRate.bpm - 100) * 0.3) : 0;
        this.heartRate.resetForNewFear(carryOver);


        await this.currentFear.setup();
        this.controls.lock();


        this.audio.startHeartbeat(100);
        this.audio.startAmbient(40 + index * 10, 0.06);


        this.state = 'playing';
        this.clock.getDelta(); // flush stale delta
    }


    // Called by FearBase.conquer() -- this is the key fix
    onFearConquered() {
        if (this.state !== 'playing') return;
        this.state = 'conquered';
        this.heartRate.pause();
        this.controls.unlock();
        this.audio.stopHeartbeat();


        // Stats
        this.fearStats.push({
            name: this.currentFear.name,
            time: this.currentFear.elapsedTime,
            peakBpm: this.heartRate.peakBpm,
            finalBpm: this.heartRate.bpm
        });


        // Show overlay
        document.getElementById('conquered-time').textContent =
            `Time: ${this.currentFear.elapsedTime.toFixed(1)}s`;
        document.getElementById('conquered-peak-hr').textContent =
            `Peak HR: ${Math.round(this.heartRate.peakBpm)} BPM`;
        this.conqueredOverlay.classList.remove('hidden');
        this.audio.playSuccess();


        // Transition after delay
        setTimeout(() => {
            this.conqueredOverlay.classList.add('hidden');
            this.hud.hide();
            this.currentFear.cleanup();
            
            if (this.currentFearIndex < this.fears.length - 1) {
                const cutsceneId = 'post_' + this.currentFearIndex;
                this.startCutscene(cutsceneId, () => {
                    this.currentFearIndex++;
                    this.heartRate.resume();
                    this.loadFear(this.currentFearIndex);
                });
            } else {
                this.startCutscene('outro', () => {
                    this.showResults();
                });
            }
        }, 3000);
    }


    onFearFailed() {
        if (this.state !== 'playing') return;
        this.state = 'failed';
        this.heartRate.pause();
        this.controls.unlock();
        this.audio.playFail();
        this.audio.stopHeartbeat();
        this.audio.stopAmbient();
        this.hud.hide();
        if (this.currentFear) this.currentFear.cleanup();
        this.failScreen.classList.remove('hidden');
    }


    showResults() {
        this.state = 'results';
        this.hud.hide();
        this.audio.stopAmbient();
        if (this.currentFear) this.currentFear.cleanup();


        const statsEl = document.getElementById('results-stats');
        statsEl.innerHTML = '';
        let totalTime = 0;
        let avgPeak = 0;


        for (const s of this.fearStats) {
            totalTime += s.time;
            avgPeak += s.peakBpm;
            statsEl.innerHTML += `
                <div class="stat-card">
                    <div class="stat-value">${s.time.toFixed(1)}s</div>
                    <div class="stat-label">${s.name}</div>
                </div>`;
        }
        avgPeak /= this.fearStats.length || 1;


        statsEl.innerHTML += `
            <div class="stat-card">
                <div class="stat-value">${totalTime.toFixed(1)}s</div>
                <div class="stat-label">TOTAL TIME</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${Math.round(avgPeak)}</div>
                <div class="stat-label">AVG PEAK BPM</div>
            </div>`;


        this.resultsScreen.classList.remove('hidden');
    }


    animate() {
        requestAnimationFrame(() => this.animate());
        const delta = Math.min(this.clock.getDelta(), 0.05);


        this.perfMon.update(delta);


        if (this.state === 'playing' && this.currentFear) {
            this.controls.update(delta);
            this.heartRate.update(delta);
            this.hud.update(delta);
            this.currentFear.update(delta);


            // Sync heartbeat audio (throttled to avoid setInterval spam)
            const bpmR = Math.round(this.heartRate.bpm / 5) * 5;
            if (bpmR !== this.lastHeartbeatUpdate) {
                this.lastHeartbeatUpdate = bpmR;
                this.audio.updateHeartbeatRate(bpmR);
            }
        }


        this.renderer.render(this.scene, this.camera);
    }
}


// Boot
const game = new Game();
window.game = game;
})();
</script>
