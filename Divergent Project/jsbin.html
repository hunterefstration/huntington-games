/* ============================================
   DIVERGENT: Fear Landscape -- Master Stylesheet
   ============================================ */
:root {
    --color-bg: #07070d;
    --color-primary: #e63946;
    --color-primary-dim: rgba(230, 57, 70, 0.4);
    --color-primary-glow: rgba(230, 57, 70, 0.15);
    --color-secondary: #4ea8de;
    --color-accent: #f0eff4;
    --color-text: #f0eff4;
    --color-text-dim: rgba(240, 239, 244, 0.45);
    --color-success: #06d6a0;
    --color-warning: #ffd166;
    --color-danger: #ef476f;
    --color-glass: rgba(255, 255, 255, 0.04);
    --color-glass-border: rgba(255, 255, 255, 0.08);
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Inter', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
.hidden { display: none !important; }
#game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }


/* Screen Effects */
#screen-effects {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}
#screen-effects.danger { background: radial-gradient(ellipse at center, transparent 30%, rgba(230,57,70,0.3) 100%); }
#screen-effects.critical { background: radial-gradient(ellipse at center, transparent 20%, rgba(230,57,70,0.5) 100%); animation: criticalPulse 0.4s ease-in-out infinite; }
@keyframes criticalPulse { 0%,100% { box-shadow: inset 0 0 60px rgba(230,57,70,0.2); } 50% { box-shadow: inset 0 0 120px rgba(230,57,70,0.4); } }
#screen-effects.hit { animation: hitFlash 0.35s ease-out forwards; }
@keyframes hitFlash {
    0% { background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 0, 0, 0.7) 100%); box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.4); }
    100% { background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%); box-shadow: inset 0 0 0px transparent; }
}


/* Loading Screen */
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; align-items: center; justify-content: center; background: var(--color-bg); }
.loading-content { text-align: center; }
.loading-ring { width: 60px; height: 60px; margin: 0 auto 24px; border: 3px solid var(--color-glass-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--font-display); font-size: 14px; letter-spacing: 4px; color: var(--color-text-dim); margin-bottom: 20px; }
.loading-bar { width: 200px; height: 2px; background: var(--color-glass-border); border-radius: 2px; overflow: hidden; margin: 0 auto; }
.loading-fill { width: 0%; height: 100%; background: var(--color-primary); border-radius: 2px; animation: loadFill 2s ease-out forwards; }
@keyframes loadFill { to { width: 100%; } }


/* Cutscene System */
#cutscene-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    background: #000; padding: 20%; box-sizing: border-box; cursor: pointer;
}
#cutscene-text {
    font-family: 'Courier New', Courier, monospace;
    font-size: 24px; color: #fff; line-height: 1.5; white-space: pre-wrap;
    text-align: left; width: 100%; max-width: 800px; margin: 0 auto;
}


/* HUD */
#hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
#hud-top-left { position: absolute; top: 20px; left: 20px; background: rgba(7,7,13,0.7); backdrop-filter: blur(8px); border: 1px solid var(--color-glass-border); border-radius: 12px; padding: 16px 20px; min-width: 260px; }
#bpm-container { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
#heart-icon { font-size: 22px; color: var(--color-primary); animation: heartbeat 1s ease-in-out infinite; }
#heart-icon.fast { animation-duration: 0.5s; }
#heart-icon.critical { animation-duration: 0.3s; color: #ff2040; }
#bpm-value { font-family: var(--font-display); font-size: 42px; font-weight: 900; color: var(--color-text); line-height: 1; }
#bpm-value.calm { color: var(--color-success); }
#bpm-value.danger { color: var(--color-warning); }
#bpm-value.critical { color: var(--color-danger); }
.bpm-label { font-family: var(--font-display); font-size: 12px; letter-spacing: 3px; color: var(--color-text-dim); }
#hr-bar-container { position: relative; width: 100%; height: 4px; background: var(--color-glass-border); border-radius: 2px; margin-bottom: 10px; }
#hr-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--color-success), var(--color-warning), var(--color-danger)); width: 33%; }
#hr-bar-threshold { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--color-success); left: 25%; box-shadow: 0 0 6px var(--color-success); }
#ecg-canvas { display: block; width: 100%; height: 50px; opacity: 0.8; }
#hud-top-right { position: absolute; top: 20px; right: 20px; text-align: right; background: rgba(7,7,13,0.7); backdrop-filter: blur(8px); border: 1px solid var(--color-glass-border); border-radius: 12px; padding: 14px 20px; }
#fear-title { font-family: var(--font-display); font-size: 11px; letter-spacing: 5px; color: var(--color-text-dim); }
#fear-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 3px; color: var(--color-text); margin-top: 4px; }
#hud-bottom { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 600px; width: 90%; }
#narrative-text { font-size: 16px; color: var(--color-text); text-shadow: 0 2px 12px rgba(0,0,0,0.8); letter-spacing: 0.5px; line-height: 1.6; min-height: 24px; }
#interaction-prompt { margin-top: 12px; font-family: var(--font-display); font-size: 13px; letter-spacing: 3px; color: var(--color-secondary); animation: promptPulse 2s ease-in-out infinite; }
@keyframes promptPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
#crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 25; pointer-events: none; }
.crosshair-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.6); box-shadow: 0 0 4px rgba(255,255,255,0.3); }


/* Breathing Guide */
#breathing-guide { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 30; text-align: center; pointer-events: none; }
.breath-ring { width: 160px; height: 160px; border-radius: 50%; border: 2px solid rgba(78,168,222,0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.breath-circle { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(78,168,222,0.4), rgba(78,168,222,0.1)); border: 2px solid var(--color-secondary); transition: transform 2s ease-in-out; }
.breath-circle.inhale { transform: scale(2.2); }
.breath-circle.exhale { transform: scale(0.6); }
.breath-text { font-family: var(--font-display); font-size: 14px; letter-spacing: 5px; color: var(--color-secondary); }
.breath-timing-bar { width: 160px; height: 3px; margin: 12px auto 0; background: var(--color-glass-border); border-radius: 2px; overflow: hidden; }
.breath-timing-fill { height: 100%; width: 0%; background: var(--color-secondary); border-radius: 2px; }


/* Transitions & Overlays */
#transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: var(--color-bg); display: flex; align-items: center; justify-content: center; }
.transition-text { font-family: var(--font-display); font-size: 14px; letter-spacing: 6px; color: var(--color-text-dim); animation: glitchText 0.1s infinite; }
.glitch-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(230,57,70,0.03) 2px, rgba(230,57,70,0.03) 4px); animation: scanLines 0.5s linear infinite; }
@keyframes scanLines { to { background-position: 0 4px; } }
@keyframes glitchText { 0% { transform: translate(0); } 25% { transform: translate(-2px,1px); } 50% { transform: translate(1px,-1px); } 75% { transform: translate(-1px,-1px); } }


/* Fear Conquered */
#fear-conquered { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(7,7,13,0.85); animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.conquered-icon { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--color-success); display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--color-success); box-shadow: 0 0 40px rgba(6,214,160,0.3); margin-bottom: 20px; animation: scaleIn 0.6s ease-out; }
@keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.conquered-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 8px; color: var(--color-success); margin-bottom: 16px; }
.conquered-stats { display: flex; gap: 32px; font-size: 14px; color: var(--color-text-dim); letter-spacing: 2px; }


/* Results */
#results-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #07070d 0%, #0f1a2e 50%, #07070d 100%); }
.results-content { text-align: center; animation: fadeInUp 1s ease-out; }
.results-badge { font-family: var(--font-display); font-size: 11px; letter-spacing: 6px; color: var(--color-success); margin-bottom: 12px; }
.results-title { font-family: var(--font-display); font-size: 64px; font-weight: 900; letter-spacing: 8px; background: linear-gradient(180deg, var(--color-success) 0%, #06a07a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
.results-subtitle { font-size: 16px; color: var(--color-text-dim); letter-spacing: 2px; margin-bottom: 40px; }
#results-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 16px; max-width: 600px; margin: 0 auto 40px; }
.stat-card { background: var(--color-glass); border: 1px solid var(--color-glass-border); border-radius: 10px; padding: 16px; }
.stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--color-text); }
.stat-label { font-size: 11px; letter-spacing: 2px; color: var(--color-text-dim); margin-top: 4px; }
#results-rating { font-family: var(--font-display); font-size: 18px; letter-spacing: 4px; margin-bottom: 40px; }


/* Buttons */
.btn-primary {
    position: relative;
    background: transparent;
    border: 1px solid var(--color-success);

    font-family: var(--font-display);
    font-size: 14px;

}

}
.btn-text {

}
.btn-glow {

.btn-danger {

.btn-danger:hover {
    background: rgba(239, 71, 111, 0.1);

.btn-danger:hover .btn-glow {
    width: 250px;

    background: var(--color-danger);
}


/* Fail Screen */
#fail-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #07070d 0%, #1a0a0a 50%, #07070d 100%); }
.fail-content { text-align: center; animation: fadeInUp 0.8s ease-out; }
.fail-icon { width: 80px; height: 80px; margin: 0 auto 20px; border: 3px solid var(--color-danger); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--color-danger); box-shadow: 0 0 40px rgba(239,71,111,0.3); }
.fail-title { font-family: var(--font-display); font-size: 36px; font-weight: 900; letter-spacing: 8px; color: var(--color-danger); margin-bottom: 12px; }
.fail-subtitle { font-size: 16px; color: var(--color-text-dim); letter-spacing: 2px; margin-bottom: 8px; }
.fail-detail { font-size: 14px; color: var(--color-text-dim); font-style: italic; margin-bottom: 40px; }
</style>

// --- js/utils/shaders.js --`
// Shaders -- Custom post-processing and material shaders


// Simple vignette + color grading + heartbeat pulse post-processing
const PostProcessShader = {
    uniforms: {
        tDiffuse: { value: null },
        intensity: { value: 0.0 },
        tint: { value: new THREE.Color(1, 0.2, 0.15) },
        time: { value: 0 },
        vignetteStrength: { value: 0.5 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float intensity;
        uniform vec3 tint;
        uniform float time;
        uniform float vignetteStrength;
        varying vec2 vUv;
        void main() {
            vec4 color = texture2D(tDiffuse, vUv);
            // Vignette
            vec2 center = vUv - 0.5;
            float dist = length(center);
            float vignette = 1.0 - smoothstep(0.3, 0.9, dist) * vignetteStrength;
            color.rgb *= vignette;
            // Heartbeat red pulse
            color.rgb = mix(color.rgb, color.rgb * tint, intensity * 0.3);
            // Subtle film grain
            float grain = (fract(sin(dot(vUv * time, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.03;
            color.rgb += grain;
            gl_FragColor = color;
        }
    `
};


// Water shader for the glass tank
const WaterShaderMaterial = () => {
    return new THREE.ShaderMaterial({
        uniforms: {
            time: { value: 0 },
            waterLevel: { value: 0 },
            color1: { value: new THREE.Color(0x0a4a6e) },
            color2: { value: new THREE.Color(0x06d6a0) },
            opacity: { value: 0.6 }
        },
        vertexShader: `
            varying vec2 vUv;
            varying vec3 vPosition;
            uniform float time;
            void main() {
                vUv = uv;
                vec3 pos = position;
                pos.y += sin(pos.x * 3.0 + time * 2.0) * 0.03;
                pos.y += sin(pos.z * 2.0 + time * 1.5) * 0.02;
                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform vec3 color1;
            uniform vec3 color2;
            uniform float time;
            uniform float opacity;
            varying vec2 vUv;
            varying vec3 vPosition;
            void main() {
                vec3 color = mix(color1, color2, vUv.y + sin(time) * 0.1);
                float caustic = sin(vUv.x * 20.0 + time * 3.0) * sin(vUv.y * 20.0 + time * 2.0) * 0.1;
                color += caustic;
                gl_FragColor = vec4(color, opacity);
            }
        `,
        transparent: true,
        side: THREE.DoubleSide
    });
};




// --- js/utils/procedural.js ---
// Procedural Geometry -- Low-poly generators for game objects


// Create a simple low-poly bird (crow) shape
function createBirdGeometry() {
    const geo = new THREE.BufferGeometry();
    // Body + wings as a simple shape
    const verts = new Float32Array([
        // Body
        0, 0, -0.3,    0, 0.05, 0,    0, 0, 0.2,
        0, 0, -0.3,    0, -0.05, 0,   0, 0, 0.2,
        // Left wing
        0, 0.05, 0,    -0.5, 0.1, 0.1,  0, 0, 0.2,
        0, 0, -0.1,    -0.5, 0.1, 0.1,  0, 0.05, 0,
        // Right wing
        0, 0.05, 0,    0.5, 0.1, 0.1,   0, 0, 0.2,
        0, 0, -0.1,    0.5, 0.1, 0.1,   0, 0.05, 0,
        // Tail
        0, 0, 0.2,     -0.08, 0.02, 0.35, 0.08, 0.02, 0.35,
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.computeVertexNormals();
    return geo;
}


// Create instanced grass blades
function createGrassField(scene, count, radius, color1 = 0x8B7D3C, color2 = 0xA69040) {
    const bladeGeo = new THREE.BufferGeometry();
    const h = 0.3 + Math.random() * 0.2;
    const verts = new Float32Array([
        -0.02, 0, 0,   0.02, 0, 0,   0, h, 0,
    ]);
    bladeGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    bladeGeo.computeVertexNormals();


    const mat = new THREE.MeshBasicMaterial({
        color: color1, side: THREE.DoubleSide, transparent: true, opacity: 0.9
    });
    const mesh = new THREE.InstancedMesh(bladeGeo, mat, count);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * radius;
        dummy.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.scale.set(1, 0.6 + Math.random() * 0.8, 1);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        mesh.setColorAt(i, new THREE.Color().lerpColors(
            new THREE.Color(color1), new THREE.Color(color2), Math.random()
        ));
    }
    scene.add(mesh);
    return mesh;
}


// Simple humanoid silhouette
function createHumanoidGeometry() {
    const group = new THREE.Group();
    // Body
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.7, 0.25),
        new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
    );
    body.position.y = 1.05;
    group.add(body);
    // Head
    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 6),
        new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
    );

// Create a detailed wooden pyre/stake
function createPyre() {
    const group = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x2A1810, roughness: 1.0 });
    
    // Main stake (placed slightly behind center so player isn't inside it)

        new THREE.CylinderGeometry(0.12, 0.15, 3.5, 6),
        woodMat
    );
    post.position.set(0, 1.75, -0.4);

    for(let i=0; i<40; i++) {
        const log = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.08, 1.2 + Math.random() * 0.8, 5),
            woodMat
        );
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.3 + Math.random() * 0.9;
        log.position.set(Math.cos(angle) * radius, 0.1 + Math.random() * 0.5, Math.sin(angle) * radius);

        log.rotation.x += (Math.random() - 0.5) * 0.8;

    return group;
}


// Low-poly ground plane with vertex color variation
function createGroundPlane(size, color1 = 0x2a2a1e, color2 = 0x1e1e14, segments = 20) {
    const geo = new THREE.PlaneGeometry(size, size, segments, segments);
    geo.rotateX(-Math.PI / 2);
    const colors = [];
    const c1 = new THREE.Color(color1);
    const c2 = new THREE.Color(color2);
    for (let i = 0; i < geo.attributes.position.count; i++) {
        const c = new THREE.Color().lerpColors(c1, c2, Math.random());
        colors.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 1.0, metalness: 0
    });
    return new THREE.Mesh(geo, mat);
}




// --- js/utils/particles.js ---
// Particle System -- Object-pooled particles for performance


class ParticlePool {
    constructor(scene, maxParticles, options = {}) {
        this.scene = scene;
        this.max = maxParticles;
        this.particles = [];
        const color = options.color || 0xffffff;
        const size = options.size || 0.1;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(maxParticles * 3);
        const colors = new Float32Array(maxParticles * 3);
        const sizes = new Float32Array(maxParticles);
        const alphas = new Float32Array(maxParticles);
        for (let i = 0; i < maxParticles; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = -9999; // hidden
            positions[i * 3 + 2] = 0;
            const c = new THREE.Color(color);
            colors[i * 3] = c.r;
            colors[i * 3 + 1] = c.g;
            colors[i * 3 + 2] = c.b;
            sizes[i] = size;
            alphas[i] = 0;
            this.particles.push({
                active: false, life: 0, maxLife: 1,
                vx: 0, vy: 0, vz: 0, idx: i
            });
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));


        const mat = new THREE.PointsMaterial({
            size: size,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        this.points = new THREE.Points(geo, mat);
        scene.add(this.points);
    }


    emit(x, y, z, vx, vy, vz, life, color) {
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            if (!p.active) {
                p.active = true;
                p.life = life;
                p.maxLife = life;
                p.vx = vx; p.vy = vy; p.vz = vz;
                const pos = this.points.geometry.attributes.position.array;
                pos[p.idx * 3] = x;
                pos[p.idx * 3 + 1] = y;
                pos[p.idx * 3 + 2] = z;
                if (color) {
                    const c = new THREE.Color(color);
                    const cols = this.points.geometry.attributes.color.array;
                    cols[p.idx * 3] = c.r;
                    cols[p.idx * 3 + 1] = c.g;
                    cols[p.idx * 3 + 2] = c.b;
                    this.points.geometry.attributes.color.needsUpdate = true;
                }
                this.points.geometry.attributes.position.needsUpdate = true;
                return;
            }
        }
    }


    emitBurst(x, y, z, count, spread, speed, life, color) {
        for (let i = 0; i < count; i++) {
            const vx = (Math.random() - 0.5) * speed;
            const vy = Math.random() * speed * 0.5;
            const vz = (Math.random() - 0.5) * speed;
            this.emit(
                x + (Math.random() - 0.5) * spread,
                y + (Math.random() - 0.5) * spread,
                z + (Math.random() - 0.5) * spread,
                vx, vy, vz, life, color
            );
        }
    }


    update(deltaTime) {
        const pos = this.points.geometry.attributes.position.array;
        for (const p of this.particles) {
            if (!p.active) continue;
            p.life -= deltaTime;
            if (p.life <= 0) {
                p.active = false;
                pos[p.idx * 3 + 1] = -9999;
            } else {
                pos[p.idx * 3] += p.vx * deltaTime;
                pos[p.idx * 3 + 1] += p.vy * deltaTime;
                pos[p.idx * 3 + 2] += p.vz * deltaTime;
                p.vy -= 0.5 * deltaTime; // gravity
            }
        }
        this.points.geometry.attributes.position.needsUpdate = true;
    }


    dispose() {
        this.scene.remove(this.points);
        this.points.geometry.dispose();
        this.points.material.dispose();
    }
}




// --- js/heartrate.js ---
// Heart Rate System -- Core mechanic
// Bug fixes: removed onPass (fears call game directly), fire-once onFail,
// faster smoothing, proper climbPaused handling
class HeartRate {
    constructor() {
        this.bpm = 100;
        this.targetBpm = 100;
        this.minBpm = 60;
        this.maxBpm = 180;
        this.failThreshold = 175;
        this.baseClimbRate = 1.5;
        this.climbAcceleration = 0.1;
        this.currentClimbRate = this.baseClimbRate;
        this.timeInFear = 0;
        this.isPaused = false;
        this.climbPaused = false;
        this.onFail = null;
        this._failFired = false;
        this.peakBpm = 100;
        // ECG
        this.ecgData = new Array(200).fill(0);
        this.ecgPhase = 0;
        this.ecgSampleTimer = 0;
    }


    update(deltaTime) {
        if (this.isPaused) return;
        this.timeInFear += deltaTime;
        // Passive climb
        if (!this.climbPaused) {
            this.currentClimbRate = this.baseClimbRate + (this.timeInFear * this.climbAcceleration);
            this.targetBpm += this.currentClimbRate * deltaTime;
        }
        this.targetBpm = Math.max(this.minBpm, Math.min(this.maxBpm, this.targetBpm));
        // Smooth toward target (fast enough to feel responsive)
        const diff = this.targetBpm - this.bpm;
        this.bpm += diff * Math.min(1, 5.0 * deltaTime);
        this.bpm = Math.max(this.minBpm, Math.min(this.maxBpm, this.bpm));
        if (this.bpm > this.peakBpm) this.peakBpm = this.bpm;
        this.updateECG(deltaTime);
        // Fail check
        if (this.bpm >= this.failThreshold && !this._failFired && this.onFail) {
            this._failFired = true;
            this.onFail();
        }
    }


    updateECG(deltaTime) {
        const beatInterval = 60 / this.bpm;
        this.ecgPhase += (deltaTime / beatInterval);
        if (this.ecgPhase > 1) this.ecgPhase -= 1;
        this.ecgSampleTimer += deltaTime;
        if (this.ecgSampleTimer >= 0.016) {
            this.ecgSampleTimer = 0;
            const p = this.ecgPhase;
            let v = 0;
            if (p < 0.1) v = 0.15 * Math.sin(p / 0.1 * Math.PI);
            else if (p < 0.17) v = -0.1 * Math.sin((p - 0.15) / 0.02 * Math.PI);
            else if (p < 0.22) v = Math.sin((p - 0.17) / 0.05 * Math.PI);
            else if (p < 0.27) v = -0.2 * Math.sin((p - 0.22) / 0.05 * Math.PI);
            else if (p < 0.55) v = p > 0.35 ? 0.25 * Math.sin((p - 0.35) / 0.2 * Math.PI) : 0;
            v += (Math.random() - 0.5) * 0.02;
            this.ecgData.push(v);
            if (this.ecgData.length > 200) this.ecgData.shift();
        }
    }


    spike(amount) { this.targetBpm = Math.min(this.maxBpm, this.targetBpm + amount); }
    drop(amount) { this.targetBpm = Math.max(this.minBpm, this.targetBpm - amount); }


    setClimbRate(base, accel) {
        this.baseClimbRate = base;
        this.climbAcceleration = accel;
    }


    resetForNewFear(carryOver = 0) {
        this.targetBpm = 100 + carryOver;
        this.bpm = this.targetBpm;
        this.timeInFear = 0;
        this.baseClimbRate = 1.5;
        this.climbAcceleration = 0.1;
        this.currentClimbRate = this.baseClimbRate;
        this.peakBpm = this.bpm;
        this.climbPaused = false;
        this.isPaused = false;
        this._failFired = false;
    }


    pause() { this.isPaused = true; }
    resume() { this.isPaused = false; }
    getNormalized() { return (this.bpm - this.minBpm) / (this.maxBpm - this.minBpm); }
}




// --- js/controls.js ---
// Player Controls -- PointerLock FPS movement + interaction




class PlayerControls {
    constructor(camera, domElement) {
        this.camera = camera;
        this.controls = new PointerLockControls(camera, domElement);
        this.moveSpeed = 5;
        this.keys = { forward: false, backward: false, left: false, right: false, interact: false, click: false };
        this.velocity = new THREE.Vector3();
        this.direction = new THREE.Vector3();
        this.enabled = false;
        this.movementLocked = false; // some fears lock movement
        
        this._onKeyDown = this._onKeyDown.bind(this);
        this._onKeyUp = this._onKeyUp.bind(this);
        this._onClick = this._onClick.bind(this);
        this._clickHandlers = [];
        
        document.addEventListener('keydown', this._onKeyDown);
        document.addEventListener('keyup', this._onKeyUp);
        document.addEventListener('mousedown', this._onClick);
    }


    lock() {
        this.controls.lock();
        this.enabled = true;
    }


    unlock() {
        this.controls.unlock();
        this.enabled = false;
    }


    get isLocked() { return this.controls.isLocked; }


    onLock(fn) { this.controls.addEventListener('lock', fn); }
    onUnlock(fn) { this.controls.addEventListener('unlock', fn); }
    onClick(fn) { this._clickHandlers.push(fn); }


    _onKeyDown(e) {
        if (!this.enabled || !this.controls.isLocked) return;
        const code = e.code;
        const key = e.key ? e.key.toLowerCase() : '';
        
        if (code === 'KeyW' || code === 'ArrowUp' || key === 'w' || key === 'z') this.keys.forward = true;
        if (code === 'KeyS' || code === 'ArrowDown' || key === 's') this.keys.backward = true;
        if (code === 'KeyA' || code === 'ArrowLeft' || key === 'a' || key === 'q') this.keys.left = true;
        if (code === 'KeyD' || code === 'ArrowRight' || key === 'd') this.keys.right = true;
        if (code === 'KeyE' || key === 'e') this.keys.interact = true;
    }


    _onKeyUp(e) {
        const code = e.code;
        const key = e.key ? e.key.toLowerCase() : '';


        if (code === 'KeyW' || code === 'ArrowUp' || key === 'w' || key === 'z') this.keys.forward = false;
        if (code === 'KeyS' || code === 'ArrowDown' || key === 's') this.keys.backward = false;
        if (code === 'KeyA' || code === 'ArrowLeft' || key === 'a' || key === 'q') this.keys.left = false;
        if (code === 'KeyD' || code === 'ArrowRight' || key === 'd') this.keys.right = false;
        if (code === 'KeyE' || key === 'e') this.keys.interact = false;
    }


    _onClick(e) {
        if (e.button === 0) {
            this.keys.click = true;
            this._clickHandlers.forEach(fn => fn());
        }
    }


    isMoving() {
        return this.keys.forward || this.keys.backward || this.keys.left || this.keys.right;
    }


    isStill() {
        return !this.isMoving();
    }


    update(deltaTime) {
        if (!this.enabled || !this.controls.isLocked) return;
        
        if (this.movementLocked) {
            this.velocity.set(0, 0, 0);
            return;
        }


        const speed = this.moveSpeed * deltaTime;
        
        this.direction.set(0, 0, 0);
        if (this.keys.forward) this.direction.z -= 1;
        if (this.keys.backward) this.direction.z += 1;
        if (this.keys.left) this.direction.x -= 1;
        if (this.keys.right) this.direction.x += 1;
        
        if (this.direction.lengthSq() > 0) {
            this.direction.normalize();
            
            // Get camera's true looking direction
            const cameraForward = new THREE.Vector3();
            this.camera.getWorldDirection(cameraForward);
            
            // Flatten to ground plane to prevent flying/sinking
            cameraForward.y = 0;
            
            // Prevent NaN if looking straight down/up
            if (cameraForward.lengthSq() < 0.001) {
                // Fallback: extract Yaw from camera rotation
                const euler = new THREE.Euler().setFromQuaternion(this.camera.quaternion, 'YXZ');
                cameraForward.set(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
            } else {
                cameraForward.normalize();
            }
            
            // Calculate right vector safely
            const cameraRight = new THREE.Vector3();
            cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();
            
            // Scale by direction inputs and speed
            cameraForward.multiplyScalar(-this.direction.z * speed);
            cameraRight.multiplyScalar(this.direction.x * speed);
            
            // Apply movements
            this.camera.position.add(cameraForward);
            this.camera.position.add(cameraRight);
        }
        
        this.keys.click = false; 
    }


    resetKeys() {
        this.keys.forward = false;
        this.keys.backward = false;
        this.keys.left = false;
        this.keys.right = false;
        this.keys.interact = false;
        this.keys.click = false;
    }


    dispose() {
        document.removeEventListener('keydown', this._onKeyDown);
        document.removeEventListener('keyup', this._onKeyUp);
        document.removeEventListener('mousedown', this._onClick);
        this.controls.dispose();
    }
}




// --- js/hud.js ---
// HUD -- Heart rate display, ECG canvas, screen effects, narrative text
class HUD {
    constructor(heartRate) {
        this.hr = heartRate;
        this.bpmEl = document.getElementById('bpm-value');
        this.heartIcon = document.getElementById('heart-icon');
        this.hrBar = document.getElementById('hr-bar');
        this.ecgCanvas = document.getElementById('ecg-canvas');
        this.ecgCtx = this.ecgCanvas.getContext('2d');
        this.fearTitle = document.getElementById('fear-title');
        this.fearName = document.getElementById('fear-name');
        this.narrativeEl = document.getElementById('narrative-text');
        this.promptEl = document.getElementById('interaction-prompt');
        this.screenFx = document.getElementById('screen-effects');
        this.hud = document.getElementById('hud');
        this.crosshair = document.getElementById('crosshair');
        // Narrative typewriter
        this.narrativeQueue = [];
        this.currentText = '';
        this.targetText = '';
        this.typewriterTimer = 0;
        this.typewriterSpeed = 0.03;
        // Heartbeat pulse sync
        this.lastBeatTime = 0;
        this.beatInterval = 0.6;
        this.lastHRUpdateBPM = 100;
    }


    show() {
        this.hud.classList.remove('hidden');
        this.crosshair.classList.remove('hidden');
    }


    hide() {
        this.hud.classList.add('hidden');
        this.crosshair.classList.add('hidden');
    }


    setFear(num, total, name) {
        this.fearTitle.textContent = `FEAR ${num}/${total}`;
        this.fearName.textContent = name;
        this.setNarrative(""); // Clear old narrative text
        this.hidePrompt();     // Clear old prompt
    }


    setNarrative(text) {
        this.targetText = text;
        this.currentText = '';
        this.typewriterTimer = 0;
    }


    showPrompt(text) {
        this.promptEl.textContent = text;
        this.promptEl.classList.remove('hidden');
    }


    hidePrompt() {
        this.promptEl.classList.add('hidden');
    }


    triggerHit() {
        // Remove class to reset animation if it's already playing
        this.screenFx.classList.remove('hit');
        // Force reflow
        void this.screenFx.offsetWidth;
        // Add class to trigger animation
        this.screenFx.classList.add('hit');
    }


    update(deltaTime) {
        const bpm = Math.round(this.hr.bpm);
        this.bpmEl.textContent = bpm;


        // Color based on stress
        this.bpmEl.className = '';
        this.heartIcon.className = 'heart-icon';
        if (bpm <= 90) { this.bpmEl.classList.add('calm'); }
        else if (bpm >= 150) { this.bpmEl.classList.add('critical'); this.heartIcon.classList.add('critical'); }
        else if (bpm >= 120) { this.bpmEl.classList.add('danger'); this.heartIcon.classList.add('fast'); }


        // HR bar (60=0%, 180=100%)
        const pct = ((bpm - 60) / 120) * 100;
        this.hrBar.style.width = `${Math.max(0, Math.min(100, pct))}%`;


        // Screen effects
        this.screenFx.className = '';
        if (bpm >= 160) this.screenFx.classList.add('critical');
        else if (bpm >= 130) this.screenFx.classList.add('danger');


        // Heartbeat audio sync update (throttled)
        if (Math.abs(bpm - this.lastHRUpdateBPM) > 5) {
            this.lastHRUpdateBPM = bpm;
            this.beatInterval = 60 / bpm;
        }


        // ECG
        this.drawECG();


        // Typewriter
        if (this.currentText.length < this.targetText.length) {
            this.typewriterTimer += deltaTime;
            if (this.typewriterTimer >= this.typewriterSpeed) {
                this.typewriterTimer = 0;
                this.currentText = this.targetText.substring(0, this.currentText.length + 1);
                this.narrativeEl.textContent = this.currentText;
            }
        }
    }


    drawECG() {
        const canvas = this.ecgCanvas;
        const ctx = this.ecgCtx;
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);


        const data = this.hr.ecgData;
        const len = data.length;
        if (len < 2) return;


        // Determine color
        const bpm = this.hr.bpm;
        let color = '#06d6a0';
        if (bpm > 140) color = '#ef476f';
        else if (bpm > 110) color = '#ffd166';


        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = color;
        ctx.shadowBlur = 4;


        for (let i = 0; i < len; i++) {
            const x = (i / len) * w;
            const y = h / 2 - data[i] * (h * 0.4);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}




// --- js/audio.js ---
// Audio Manager -- Web Audio API synthesis for heartbeat, ambient, and SFX
class AudioManager {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.heartbeatInterval = null;
        this.ambientOsc = null;
        this.ambientGain = null;
        this.initialized = false;
    }


    init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);
        this.initialized = true;
    }


    // Heartbeat: two-tone "lub-dub" synced to BPM
    startHeartbeat(bpm) {
        if (!this.initialized) this.init();
        this.stopHeartbeat();
        const beat = () => {
            this._playTone(60, 0.08, 0.3);
            setTimeout(() => this._playTone(50, 0.06, 0.2), 120);
        };
        beat();
        this.heartbeatInterval = setInterval(beat, 60000 / bpm);
    }


    updateHeartbeatRate(bpm) {
        // Only restart if interval exists and BPM actually changed meaningfully
        if (this.heartbeatInterval && Math.abs(bpm - this._lastBpm) >= 5) {
            this._lastBpm = bpm;
            this.stopHeartbeat();
            const beat = () => {
                this._playTone(60, 0.08, 0.3);
                setTimeout(() => this._playTone(50, 0.06, 0.2), 120);
            };
            beat();
            this.heartbeatInterval = setInterval(beat, 60000 / bpm);
        }
    }


    stopHeartbeat() {
        if (this.heartbeatInterval) {
            clearInterval(this.heartbeatInterval);
            this.heartbeatInterval = null;
        }
    }


    _playTone(freq, duration, volume = 0.3) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.05);
    }


    // Ambient drone for atmosphere
    startAmbient(freq = 55, volume = 0.08) {
        if (!this.initialized) this.init();
        this.stopAmbient();
        this.ambientOsc = this.ctx.createOscillator();
        this.ambientGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 200;
        this.ambientOsc.type = 'sawtooth';
        this.ambientOsc.frequency.value = freq;
        this.ambientGain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.ambientGain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 2);
        this.ambientOsc.connect(filter);
        filter.connect(this.ambientGain);
        this.ambientGain.connect(this.masterGain);
        this.ambientOsc.start();
    }


    stopAmbient() {
        if (this.ambientOsc) {
            try { this.ambientOsc.stop(); } catch(e) {}
            this.ambientOsc = null;
        }
    }


    // SFX methods
    playCrowCaw() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 800 + Math.random() * 600;
        filter.Q.value = 5;
        gain.gain.value = 0.15;
        src.buffer = buffer;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        src.start();
    }


    playWaterSplash() { this._playNoiseBurst(0.2, 400, 0.12); }
    playGlassShatter() { this._playNoiseBurst(0.3, 3000, 0.2); }
    playFireCrackle() { this._playNoiseBurst(0.1, 1200, 0.08); }
    playImpact() { this._playTone(40, 0.15, 0.4); }
    playSuccess() {
        this._playTone(440, 0.2, 0.2);
        setTimeout(() => this._playTone(554, 0.2, 0.2), 150);
        setTimeout(() => this._playTone(659, 0.3, 0.2), 300);
    }
    playFail() {
        this._playTone(200, 0.3, 0.3);
        setTimeout(() => this._playTone(150, 0.5, 0.3), 200);
    }


    _playNoiseBurst(duration, filterFreq, volume) {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
        }
        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = filterFreq; filter.Q.value = 2;
        gain.gain.value = volume;
        src.buffer = buffer;
        src.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
        src.start();
    }


    setMasterVolume(v) { if (this.masterGain) this.masterGain.gain.value = v; }
    dispose() { this.stopHeartbeat(); this.stopAmbient(); if (this.ctx) this.ctx.close(); }
}




// --- js/performance.js ---
// Performance Monitor -- FPS tracking and dynamic quality scaling
class PerformanceMonitor {
    constructor() {
        this.fps = 60;
        this.frameTimes = [];
        this.maxSamples = 60;
        this.qualityLevel = 2; // 0=low, 1=med, 2=high
        this.checkInterval = 2000;
        this.lastCheck = 0;
        this.particleMultiplier = 1.0;
        this.shadowsEnabled = false; // always off for Chromebook perf
        this.postProcessing = true;
    }


    update(deltaTime) {
        this.frameTimes.push(deltaTime);
        if (this.frameTimes.length > this.maxSamples) this.frameTimes.shift();
        const avg = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length;
        this.fps = 1 / avg;
        const now = performance.now();
        if (now - this.lastCheck > this.checkInterval) {
            this.lastCheck = now;
            this.adjustQuality();
        }
    }


    adjustQuality() {
        if (this.fps < 20 && this.qualityLevel > 0) {
            this.qualityLevel--;
            this.applyQuality();
        } else if (this.fps > 50 && this.qualityLevel < 2) {
            this.qualityLevel++;
            this.applyQuality();
        }
    }


    applyQuality() {
        switch (this.qualityLevel) {
            case 0:
                this.particleMultiplier = 0.3;
                this.postProcessing = false;
                break;
            case 1:
                this.particleMultiplier = 0.6;
                this.postProcessing = true;
                break;
            case 2:
                this.particleMultiplier = 1.0;
                this.postProcessing = true;
                break;
        }
    }


    getParticleCount(base) {
        return Math.floor(base * this.particleMultiplier);
    }
}




// --- js/fears/FearBase.js ---
// FearBase -- Abstract base class for fear scenarios
// Key fix: conquer() calls game.onFearConquered() directly instead of
// relying on HR threshold, preventing the freeze bug


class FearBase {
    constructor(game) {
        this.game = game;
        this.scene = game.scene;
        this.camera = game.camera;
        this.heartRate = game.heartRate;
        this.controls = game.controls;
        this.audio = game.audio;
        this.hud = game.hud;
        this.perfMon = game.perfMon;
        this.objects = [];
        this.isActive = false;
        this.elapsedTime = 0;
        this.conquered = false;
    }


    get name() { return 'UNKNOWN'; }
    get climbRate() { return 1.5; }
    get climbAccel() { return 0.1; }


    async setup() {
        this.isActive = true;
        this.conquered = false;
        this.elapsedTime = 0;
        this.heartRate.setClimbRate(this.climbRate, this.climbAccel);
        this.camera.position.set(0, 1.6, 0);
        this.camera.rotation.set(0, 0, 0, 'YXZ');
        this.controls.movementLocked = false;
        this.controls.resetKeys();
    }


    update(deltaTime) {
        if (!this.isActive) return;
        this.elapsedTime += deltaTime;
    }


    conquer() {
        if (this.conquered) return;
        this.conquered = true;
        this.isActive = false;
        this.heartRate.climbPaused = true;
        this.audio.playSuccess();
        // Directly tell the game we're done -- this is the fix for the freeze bug
        this.game.onFearConquered();
    }


    cleanup() {
        this.isActive = false;
        this.heartRate.climbPaused = false;
        // Dispose all tracked objects
        for (const obj of this.objects) {
            this.scene.remove(obj);
            this._dispose(obj);
        }
        this.objects = [];
        // Clear remaining scene children
        const toRemove = [...this.scene.children];
        for (const child of toRemove) {
            this.scene.remove(child);
            this._dispose(child);
        }
    }


    _dispose(obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else if (obj.material.dispose) obj.material.dispose();
        }
        if (obj.children) {
            for (const child of obj.children) this._dispose(child);
        }
    }


    addObject(obj) {
        this.scene.add(obj);
        this.objects.push(obj);
        return obj;
    }
}




// --- js/fears/CrowAttack.js ---
// Fear 1: The Crows -- Stand still to calm down, HR drops. Win when HR <= 90.
// No hints -- player must figure it out themselves.








class CrowAttack extends FearBase {
    get name() { return 'THE CROWS'; }
    get climbRate() { return 1.0; }
    get climbAccel() { return 0.04; }


    async setup() {
        await super.setup();
        this.crowHitCooldown = 0;
        this.winThreshold = 90;
        this.stillTimer = 0;
        this.crowsFled = 0;


        // Sky - give it a moodier sunset/dusk look
        this.scene.background = new THREE.Color(0x2a1520);
        this.scene.fog = new THREE.FogExp2(0x2a1520, 0.025);


        // Lighting
        this.addObject(new THREE.AmbientLight(0x997755, 0.6));
        const dir = new THREE.DirectionalLight(0xff6622, 1.0); // More orange/red sunset
        dir.position.set(8, 5, -5);
        this.addObject(dir);
        const back = new THREE.DirectionalLight(0x4444aa, 0.3);
        back.position.set(-3, 5, 5);
        this.addObject(back);


        // Ground - larger and more detailed
        const ground = createGroundPlane(100, 0x2e2518, 0x1e1508);
        this.addObject(ground);


        // Grass - thicker and more widespread
        const grassCount = this.perfMon.getParticleCount(2500);
        this.grass = createGrassField(this.scene, grassCount, 30, 0x5B4D2C, 0x766030);
        this.objects.push(this.grass);


        // Barn
        const barnGroup = new THREE.Group();
        barnGroup.position.set(12, 0, -22); // Placed outside the playable area
        barnGroup.rotation.y = -Math.PI / 4;


        const barnMat = new THREE.MeshStandardMaterial({ color: 0x4a1515, roughness: 0.9, metalness: 0.1 });
        const barnBody = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 14), barnMat);
        barnBody.position.y = 3;
        barnGroup.add(barnBody);


        const roofMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        // Simple pyramid roof
        const roofGeo = new THREE.CylinderGeometry(0, 8.5, 4, 4);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 8;
        roof.rotation.y = Math.PI / 4;
        barnGroup.add(roof);


        // Barn door
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
        const door = new THREE.Mesh(new THREE.PlaneGeometry(4, 4.5), doorMat);
        door.position.set(0, 2.25, 7.01);
        barnGroup.add(door);
        
        this.addObject(barnGroup);


        // Fence (Playable Area Limit)
        this.fenceRadius = 15;
        const fenceGroup = new THREE.Group();
        const postGeo = new THREE.BoxGeometry(0.25, 2.5, 0.25);
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x2a1c12, roughness: 1.0 });


        const numPosts = 24;
        for (let i = 0; i < numPosts; i++) {
            const angle = (i / numPosts) * Math.PI * 2;
            const px = Math.cos(angle) * this.fenceRadius;
            const pz = Math.sin(angle) * this.fenceRadius;


            const post = new THREE.Mesh(postGeo, woodMat);
            post.position.set(px, 1.25, pz);
            post.rotation.y = Math.random();
            post.rotation.z = (Math.random() - 0.5) * 0.1;
            fenceGroup.add(post);


            // Rails connecting posts
            const nextAngle = ((i + 1) / numPosts) * Math.PI * 2;
            const nx = Math.cos(nextAngle) * this.fenceRadius;
            const nz = Math.sin(nextAngle) * this.fenceRadius;


            const dist = Math.hypot(nx - px, nz - pz);
            const railGeoInst = new THREE.BoxGeometry(0.1, 0.2, dist + 0.3);
            
            // Top rail
            const rail1 = new THREE.Mesh(railGeoInst, woodMat);
            rail1.position.set((px + nx) / 2, 1.8 + (Math.random()-0.5)*0.2, (pz + nz) / 2);
            rail1.lookAt(nx, rail1.position.y, nz);
            fenceGroup.add(rail1);


            // Bottom rail
            const rail2 = new THREE.Mesh(railGeoInst, woodMat);
            rail2.position.set((px + nx) / 2, 0.8 + (Math.random()-0.5)*0.2, (pz + nz) / 2);
            rail2.lookAt(nx, rail2.position.y, nz);
            fenceGroup.add(rail2);
        }
        this.addObject(fenceGroup);


        // Dead Trees scattered outside fence
        const treeGeo = new THREE.CylinderGeometry(0.1, 0.4, 5, 5);
        for (let i=0; i<8; i++) {
            const tree = new THREE.Mesh(treeGeo, woodMat);
            const tAngle = Math.random() * Math.PI * 2;
            const tRadius = this.fenceRadius + 3 + Math.random() * 10;
            tree.position.set(Math.cos(tAngle) * tRadius, 2.5, Math.sin(tAngle) * tRadius);
            tree.rotation.z = (Math.random() - 0.5) * 0.4;
            tree.rotation.x = (Math.random() - 0.5) * 0.4;
            this.addObject(tree);
        }


        // Build crows
        this.crowCount = 20;
        this.crows = [];
        for (let i = 0; i < this.crowCount; i++) {
            const crow = this._buildCrow();
            const angle = Math.random() * Math.PI * 2;
            const radius = 8 + Math.random() * 10;
            const height = 5 + Math.random() * 6;
            crow.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
            this.scene.add(crow);
            this.objects.push(crow);
            this.crows.push({
                mesh: crow, angle, radius, height,
                speed: 0.4 + Math.random() * 0.5,
                wingPhase: Math.random() * Math.PI * 2,
                state: 'circling',
                diveTimer: 4 + Math.random() * 5,
                diveProgress: 0,
                diveStart: new THREE.Vector3(),
                diveTarget: new THREE.Vector3(),
                returnTarget: new THREE.Vector3()
            });
        }


        // Feather particles
        this.feathers = new ParticlePool(this.scene, this.perfMon.getParticleCount(100), {
            color: 0x222222, size: 0.05
        });
        this.objects.push(this.feathers.points);


        this.camera.position.set(0, 1.6, 0);
        // No instructions -- player figures it out
    }


    _buildCrow() {
        const group = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.6, metalness: 0.3 });
        // CapsuleGeometry(radius, length) -> approximated by CylinderGeometry(radius, radius, height)
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 6), bodyMat);
        body.rotation.x = Math.PI / 2;
        group.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), bodyMat.clone());
        head.position.set(0, 0.04, -0.22);
        group.add(head);
        const beak = new THREE.Mesh(
            new THREE.ConeGeometry(0.02, 0.08, 3),
            new THREE.MeshStandardMaterial({ color: 0x333320 })
        );
        beak.rotation.x = Math.PI / 2;
        beak.position.set(0, 0.03, -0.3);
        group.add(beak);
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(0.35, 0.06);
        wingShape.lineTo(0.3, -0.08);
        wingShape.lineTo(0, -0.04);
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.01, bevelEnabled: false });
        const leftWing = new THREE.Mesh(wingGeo, bodyMat.clone());
        leftWing.position.set(-0.05, 0.02, 0);
        leftWing.name = 'wing_l';
        group.add(leftWing);
        const rightWing = new THREE.Mesh(wingGeo, bodyMat.clone());
        rightWing.position.set(0.05, 0.02, 0);
        rightWing.scale.x = -1;
        rightWing.name = 'wing_r';
        group.add(rightWing);
        const tail = new THREE.Mesh(
            new THREE.ConeGeometry(0.04, 0.12, 3), bodyMat.clone()
        );
        tail.rotation.x = -Math.PI / 2.5;
        tail.position.set(0, 0.02, 0.18);
        group.add(tail);
        group.scale.setScalar(2.0);
        return group;
    }


    update(deltaTime) {
        super.update(deltaTime);
        if (!this.isActive) return;


        const playerPos = this.camera.position;


        // Keep player inside the fence
        const playerDist = Math.hypot(playerPos.x, playerPos.z);
        if (playerDist > this.fenceRadius - 1.0) { // 1.0 margin
            const angle = Math.atan2(playerPos.z, playerPos.x);
            playerPos.x = Math.cos(angle) * (this.fenceRadius - 1.0);
            playerPos.z = Math.sin(angle) * (this.fenceRadius - 1.0);
        }


        // Darken sky over time
        const darkness = Math.min(0.8, this.elapsedTime / 50);
        this.scene.background.lerpColors(
            new THREE.Color(0x2a1520), new THREE.Color(0x050508), darkness
        );


        // Update crows
        this.crowHitCooldown = Math.max(0, this.crowHitCooldown - deltaTime);


        for (let i = 0; i < this.crows.length; i++) {
            const c = this.crows[i];
            const mesh = c.mesh;


            // Wing flap
            c.wingPhase += deltaTime * 9;
            const wingAngle = Math.sin(c.wingPhase) * 0.5;
            mesh.traverse(child => {
                if (child.name === 'wing_l') child.rotation.z = wingAngle;
                if (child.name === 'wing_r') child.rotation.z = -wingAngle;
            });


            if (c.state === 'circling') {
                c.angle += c.speed * deltaTime;
                const tightenedRadius = Math.max(2.5, c.radius - this.elapsedTime * 0.1);
                const targetHeight = Math.max(2, c.height - this.elapsedTime * 0.06);
                const tx = playerPos.x + Math.cos(c.angle) * tightenedRadius;
                const tz = playerPos.z + Math.sin(c.angle) * tightenedRadius;
                const ty = targetHeight + Math.sin(c.wingPhase * 0.2) * 0.4;
                mesh.position.x += (tx - mesh.position.x) * deltaTime * 2;
                mesh.position.y += (ty - mesh.position.y) * deltaTime * 2;
                mesh.position.z += (tz - mesh.position.z) * deltaTime * 2;
                const nextAngle = c.angle + c.speed * 0.2;
                mesh.lookAt(
                    playerPos.x + Math.cos(nextAngle) * tightenedRadius,
                    mesh.position.y,
                    playerPos.z + Math.sin(nextAngle) * tightenedRadius
                );
                c.diveTimer -= deltaTime;
                if (c.diveTimer <= 0 && this.elapsedTime > 3) {
                    c.state = 'diving';
                    c.diveProgress = 0;
                    c.diveStart.copy(mesh.position);
                    c.diveTarget.set(
                        playerPos.x + (Math.random() - 0.5) * 1.5,
                        1.5,
                        playerPos.z + (Math.random() - 0.5) * 1.5
                    );
                }
            } else if (c.state === 'diving') {
                c.diveProgress += deltaTime * 1.5;
                const t = Math.min(c.diveProgress, 1);
                mesh.position.lerpVectors(c.diveStart, c.diveTarget, t * t);
                mesh.lookAt(c.diveTarget);
                if (t > 0.7 && this.crowHitCooldown <= 0) {
                    const dist = mesh.position.distanceTo(playerPos);
                    if (dist < 2.5) {
                        this.heartRate.spike(4);
                        this.crowHitCooldown = 0.8;
                        this.audio.playCrowCaw();
                        this.hud.triggerHit();
                        this.feathers.emitBurst(playerPos.x, 1.8, playerPos.z, 3, 0.5, 1, 1.0, 0x1a1a1a);
                    }
                }
                if (t >= 1) {
                    c.state = 'returning';
                    c.diveProgress = 0;
                    c.diveStart.copy(mesh.position);
                    const retAngle = Math.random() * Math.PI * 2;
                    const retR = 6 + Math.random() * 8;
                    c.returnTarget.set(
                        playerPos.x + Math.cos(retAngle) * retR,
                        5 + Math.random() * 4,
                        playerPos.z + Math.sin(retAngle) * retR
                    );
                }
            } else if (c.state === 'returning') {
                c.diveProgress += deltaTime * 1.2;
                const t = Math.min(c.diveProgress, 1);
                mesh.position.lerpVectors(c.diveStart, c.returnTarget, t);
                mesh.lookAt(c.returnTarget);
                if (t >= 1) {
                    c.state = 'circling';
                    c.angle = Math.atan2(mesh.position.z - playerPos.z, mesh.position.x - playerPos.x);
                    c.radius = 6 + Math.random() * 8;
                    c.height = 4 + Math.random() * 4;
                    c.diveTimer = 2 + Math.random() * 4;
                }
            } else if (c.state === 'fleeing') {
                c.angle += c.speed * deltaTime;
                mesh.position.y += deltaTime * 8; // fly upwards
                mesh.position.x += Math.cos(c.angle) * deltaTime * 6;
                mesh.position.z += Math.sin(c.angle) * deltaTime * 6;
                const nextAngle = c.angle + c.speed * 0.2;
                mesh.lookAt(
                    mesh.position.x + Math.cos(nextAngle) * 5,
                    mesh.position.y + 8,
                    mesh.position.z + Math.sin(nextAngle) * 5
                );
            }
        }


        // Ambient caws
        if (Math.random() < 0.006) this.audio.playCrowCaw();


        // === CORE MECHANIC ===
        // Standing still = crows begin to flee after 3s, heart rate drops after 5s
        if (this.controls.isStill()) {
            this.stillTimer += deltaTime;
            this.heartRate.climbPaused = true;
            
            // Crows flee logic (2 crows flee per second after 3 seconds)
            const expectedFled = this.stillTimer > 3 ? Math.floor((this.stillTimer - 3) * 2) : 0;
            if (expectedFled > this.crowsFled) {
                let activeCrows = this.crows.filter(c => c.state !== 'fleeing');
                while (this.crowsFled < expectedFled && activeCrows.length > 0) {
                    const c = activeCrows.pop();
                    c.state = 'fleeing';
                    this.crowsFled++;
                }
            }
            
            // Only start dropping HR after standing still for 5 seconds
            if (this.stillTimer > 5) {
                // Accelerating drop rate: starts at 1.5, maxes out at 4.5 after 10 more seconds
                const dropDuration = this.stillTimer - 5;
                const dropRate = 1.5 + Math.min(3.0, dropDuration * 0.3);
                this.heartRate.drop(deltaTime * dropRate);
            }
        } else {
            this.stillTimer = 0; // Reset timer if player moves
            this.heartRate.climbPaused = false;
            // Moving makes it worse
            if (this.controls.isMoving()) {
                this.heartRate.spike(deltaTime * 1.5);
            }
        }


        // WIN: heart rate drops to 90 or below
        if (this.heartRate.bpm <= this.winThreshold) {
            this.conquer();
            return;
        }


        this.feathers.update(deltaTime);
    }


    cleanup() {
        if (this.feathers) this.feathers.dispose();
        this.crows = [];
        super.cleanup();
    }
}
