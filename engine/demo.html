<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HG3D demo</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#info{position:fixed;right:8px;top:6px;font:12px/1.4 monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;white-space:pre}</style>
</head>
<body>
<canvas id="gl"></canvas><div id="info"></div>
<!-- A whole scene with the HG3D engine alone: no three.js is loaded on this page.
     ?n=3000 sets how many boxes move (default 1500), ?shadow=0 turns the shadow map off, ?scale=0.75 the render scale. -->
<script src="hg3d.js"></script>
<script>
(function () {
    const Q = new URLSearchParams(location.search), N = Math.max(1, +(Q.get('n') || 1500)), SHADOW = Q.get('shadow') !== '0', SCALE = +(Q.get('scale') || 1);
    const canvas = document.getElementById('gl'), R = HG3D.createRenderer({ canvas });
    if (!R) { document.getElementById('info').textContent = 'WebGL2 is not available here'; return; }
    R.shadowMap.enabled = SHADOW; R.shadowMap.type = 2;
    const M4 = HG3D.M4, scene = HG3D.node(), cam = HG3D.camera(60, 1, 0.5, 600);
    scene.fog = HG3D.fog(0xbfe6ff, 80, 320); scene.background = HG3D.color(0xbfe6ff);
    const sun = HG3D.light.sun(0xfff2d9, 2.2, [40, 70, 25], { shadow: 1024, size: 70, far: 220 });
    scene.add(HG3D.light.hemi(0xdff3ff, 0x8a7fa0, 1.2), sun, sun.target);
    // ground: one merged mesh of 400 coloured tiles (one draw call), receives the shadows
    const tiles = [], tile = HG3D.geo.box(9.6, 1, 9.6), tm = new Float32Array(16);
    for (let i = 0; i < 20; i++) for (let j = 0; j < 20; j++) tiles.push({ geo: tile, matrix: M4.compose(new Float32Array(16), (i - 9.5) * 10, -0.5, (j - 9.5) * 10, 0, 0, 0, 1, 1, 1, 1), color: (i + j) % 2 ? 0xe8e0f4 : 0xd2c4ec });
    const ground = HG3D.mesh(HG3D.geo.merge(tiles), HG3D.material({ vertexColors: true })); ground.receiveShadow = true; scene.add(ground);
    // moving boxes: one instanced mesh, per-instance colour, casts shadows
    const boxes = HG3D.instanced(HG3D.geo.box(1.6, 1.6, 1.6), HG3D.material({ color: 0xffffff }), N, { colors: true }); boxes.castShadow = true; boxes.count = N; scene.add(boxes);
    const PAL = [0xff5fa2, 0xffd23f, 0x3fb8ff, 0x7ee23a, 0xff8a2b, 0x9a5cff, 0x52f2c2], seed = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) { const c = HG3D.color(PAL[i % PAL.length]); boxes.instanceColor.array.set([c.r, c.g, c.b], i * 3); seed.set([Math.random() * 180 - 90, Math.random() * 180 - 90, Math.random() * 6.28, 0.5 + Math.random()], i * 4); }
    // a few shiny balls (per-pixel highlight) and a see-through wall
    const ball = HG3D.geo.sphere(3, 24, 16), balls = [];
    for (let i = 0; i < 6; i++) { const b = HG3D.mesh(ball, HG3D.material({ color: PAL[i], roughness: 0.2, metalness: 0.3 })); b.castShadow = true; scene.add(b); balls.push(b); }
    const wall = HG3D.mesh(HG3D.geo.box(60, 14, 0.6), HG3D.material({ color: 0x66ccff, transparent: true, opacity: 0.35, depthWrite: false })); M4.compose(wall.matrixWorld.elements, 0, 7, -30, 0, 0, 0, 1, 1, 1, 1); scene.add(wall);
    function resize() { R.setPixelRatio(Math.min(devicePixelRatio || 1, 1.25) * SCALE); R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjection(); }
    addEventListener('resize', resize); resize();
    const info = document.getElementById('info'); let last = 0, acc = 0, n = 0, t0 = performance.now();
    function frame(ts) {
        requestAnimationFrame(frame);
        const t = (ts - t0) / 1000, im = boxes.instanceMatrix.array;
        for (let i = 0; i < N; i++) {           // straight into the instance buffer: no objects, nothing allocated
            const s = i * 4, x = seed[s] + Math.sin(t * seed[s + 3] + seed[s + 2]) * 6, z = seed[s + 1] + Math.cos(t * seed[s + 3] * 0.8 + seed[s + 2]) * 6, y = 0.8 + Math.abs(Math.sin(t * 2 * seed[s + 3] + seed[s + 2])) * 3;
            const a = t * seed[s + 3] + seed[s + 2], c = Math.cos(a), sn = Math.sin(a), o = i * 16;
            im[o] = c; im[o + 1] = 0; im[o + 2] = -sn; im[o + 3] = 0; im[o + 4] = 0; im[o + 5] = 1; im[o + 6] = 0; im[o + 7] = 0; im[o + 8] = sn; im[o + 9] = 0; im[o + 10] = c; im[o + 11] = 0; im[o + 12] = x; im[o + 13] = y; im[o + 14] = z; im[o + 15] = 1;
        }
        boxes.instanceMatrix.needsUpdate = true;
        balls.forEach((b, i) => M4.compose(b.matrixWorld.elements, Math.cos(t * 0.3 + i) * 30, 3 + Math.sin(t + i) * 1.5, Math.sin(t * 0.3 + i) * 30, 0, 0, 0, 1, 1, 1, 1));
        cam.lookFrom(Math.sin(t * 0.1) * 95, 38, Math.cos(t * 0.1) * 95, 0, 2, 0);
        R.render(scene, cam);
        if (last) { acc += ts - last; n++; if (acc > 500) { info.textContent = 'HG3D ' + HG3D.VERSION + '\n' + Math.round(n * 1000 / acc) + ' FPS\n' + R.info.render.calls + ' draw calls\n' + Math.round(R.info.render.triangles / 1000) + 'k triangles\n' + N + ' moving boxes'; acc = 0; n = 0; } }
        last = ts;
    }
    requestAnimationFrame(frame);
    window.__hgdemo = { R, scene, cam, boxes, get failed() { return R.failed; } };
})();
</script>
</body>
</html>
