    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Brew Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .log-entry { animation: fade-in-up 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .work-progress { transition: width 0.1s linear; }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen flex flex-col">


    <header class="bg-amber-900 text-amber-50 p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>☕</span> Bean & Brew Tycoon
            </h1>
            <div class="text-xl font-bold bg-amber-800 px-4 py-2 rounded-lg border border-amber-700 shadow-inner">
                Balance: <span id="ui-money" class="text-green-400">$50.00</span>
            </div>
        </div>
    </header>


    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="space-y-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">📦 Inventory</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center">
                        <span class="text-2xl mb-1">🫘</span>
                        <span id="ui-beans" class="text-xl font-bold">0</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center">
                        <span class="text-2xl mb-1">🥛</span>
                        <span id="ui-milk" class="text-xl font-bold">0</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col items-center">
                        <span class="text-2xl mb-1">🥤</span>
                        <span id="ui-cups" class="text-xl font-bold">0</span>
                    </div>
                    <div class="bg-amber-100 p-3 rounded-lg border border-amber-200 flex flex-col items-center">
                        <span class="text-2xl mb-1">☕</span>
                        <span id="ui-brewed" class="text-xl font-bold text-amber-900">0</span>
                    </div>
                </div>
            </section>


            <section class="bg-white rounded-xl shadow-sm border border-blue-200 p-5">
                <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2">🔨 Shift Work</h2>
                <div class="space-y-3">
                    <button id="btn-work" onclick="doWork()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-md transition-all active:scale-95">
                        Grind Beans for Tips
                    </button>
                    <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden border border-slate-200">
                        <div id="work-bar" class="work-progress h-full bg-blue-400 w-0"></div>
                    </div>
                    <div class="text-center text-xs font-mono text-blue-600">Tip: +$<span id="ui-work-value">0.50</span></div>
                </div>
            </section>
        </div>


        <div class="space-y-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">🛒 Supplies</h2>
                <div class="space-y-3">
                    <button id="btn-buy-beans" onclick="buyItem('beans')" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <span class="font-bold">🫘 Beans x20</span>
                        <span class="text-slate-600 font-mono">-$10.00</span>
                    </button>
                    <button id="btn-buy-milk" onclick="buyItem('milk')" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <span class="font-bold">🥛 Milk x20</span>
                        <span class="text-slate-600 font-mono">-$5.00</span>
                    </button>
                    <button id="btn-buy-cups" onclick="buyItem('cups')" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <span class="font-bold">🥤 Cups x20</span>
                        <span class="text-slate-600 font-mono">-$5.00</span>
                    </button>
                </div>
            </section>


            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">🧑‍🍳 Kitchen</h2>
                <button id="btn-brew" onclick="brewCoffee()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl disabled:opacity-50">
                    Brew Coffee (1 of each)
                </button>
            </section>
        </div>


        <div class="space-y-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">📈 Upgrades</h2>
                <div class="space-y-3">
                    <button id="btn-upg-barista" onclick="buyUpgrade('barista')" class="w-full p-3 bg-blue-50 border border-blue-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <div class="text-left">
                            <div class="font-bold">Hire Barista (<span id="ui-baristas">0</span>)</div>
                            <div class="text-xs text-slate-500">Auto-brews</div>
                        </div>
                        <span id="cost-barista" class="font-bold text-red-600">-$100.00</span>
                    </button>
                    <button id="btn-upg-marketing" onclick="buyUpgrade('marketing')" class="w-full p-3 bg-purple-50 border border-purple-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <div class="text-left">
                            <div class="font-bold">Marketing (Lvl <span id="ui-marketing">0</span>)</div>
                            <div class="text-xs text-slate-500">Sell faster</div>
                        </div>
                        <span id="cost-marketing" class="font-bold text-red-600">-$75.00</span>
                    </button>
                    <button id="btn-upg-premium" onclick="buyUpgrade('premium')" class="w-full p-3 bg-yellow-50 border border-yellow-200 rounded-lg flex justify-between items-center disabled:opacity-50">
                        <div class="text-left">
                            <div class="font-bold">Premium (Lvl <span id="ui-premium">0</span>)</div>
                            <div class="text-xs text-slate-500">Price: $<span id="ui-price">4.00</span></div>
                        </div>
                        <span id="cost-premium" class="font-bold text-red-600">-$150.00</span>
                    </button>
                </div>
            </section>


            <section class="bg-slate-800 rounded-xl p-5 text-slate-300 h-64 flex flex-col">
                <h2 class="text-sm font-bold text-slate-400 mb-2 uppercase">Activity Log</h2>
                <div id="log-container" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-sm pr-2"></div>
            </section>
        </div>
    </main>


    <script>
        let state = {
            money: 50.00,
            beans: 0, milk: 0, cups: 0, brewed: 0,
            baristas: 0, marketingLevel: 0, premiumLevel: 0,
            pricePerCoffee: 4.00,
            workProgress: 0,
            workPower: 0.50,
            costs: { beans: 10, milk: 5, cups: 5, barista: 100, marketing: 75, premium: 150 }
        };


        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let color = type === 'success' ? 'text-green-400' : (type === 'error' ? 'text-red-400' : 'text-slate-300');
            entry.innerHTML = `<span class="${color}">${message}</span>`;
            const container = document.getElementById('log-container');
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }


        function updateUI() {
            document.getElementById('ui-money').innerText = `$${state.money.toFixed(2)}`;
            document.getElementById('ui-beans').innerText = state.beans;
            document.getElementById('ui-milk').innerText = state.milk;
            document.getElementById('ui-cups').innerText = state.cups;
            document.getElementById('ui-brewed').innerText = state.brewed;
            
            // Update Upgrade Stats
            document.getElementById('ui-baristas').innerText = state.baristas;
            document.getElementById('ui-marketing').innerText = state.marketingLevel;
            document.getElementById('ui-premium').innerText = state.premiumLevel;
            document.getElementById('ui-price').innerText = state.pricePerCoffee.toFixed(2);
            document.getElementById('ui-work-value').innerText = (state.workPower + (state.marketingLevel * 0.25)).toFixed(2);


            // UPDATE PRICES ON BUTTONS
            document.getElementById('cost-barista').innerText = `-$${state.costs.barista.toFixed(2)}`;
            document.getElementById('cost-marketing').innerText = `-$${state.costs.marketing.toFixed(2)}`;
            document.getElementById('cost-premium').innerText = `-$${state.costs.premium.toFixed(2)}`;
            
            // Disable buttons if not enough money
            document.getElementById('btn-brew').disabled = (state.beans < 1 || state.milk < 1 || state.cups < 1);
            document.getElementById('btn-buy-beans').disabled = state.money < state.costs.beans;
            document.getElementById('btn-buy-milk').disabled = state.money < state.costs.milk;
            document.getElementById('btn-buy-cups').disabled = state.money < state.costs.cups;
            document.getElementById('btn-upg-barista').disabled = state.money < state.costs.barista;
            document.getElementById('btn-upg-marketing').disabled = state.money < state.costs.marketing;
            document.getElementById('btn-upg-premium').disabled = state.money < state.costs.premium;
        }


        function doWork() {
            if (state.workProgress >= 100) return;
            state.workProgress += 20;
            document.getElementById('work-bar').style.width = state.workProgress + '%';
            if (state.workProgress >= 100) {
                let earnings = state.workPower + (state.marketingLevel * 0.25);
                state.money += earnings;
                setTimeout(() => {
                    state.workProgress = 0;
                    document.getElementById('work-bar').style.width = '0%';
                    updateUI();
                }, 150);
            }
            updateUI();
        }


        function buyItem(item) {
            if (state.money >= state.costs[item]) {
                state.money -= state.costs[item];
                state[item] += 20;
                log(`Restocked ${item}!`, 'info');
                updateUI();
            }
        }


        function brewCoffee() {
            if (state.beans >= 1 && state.milk >= 1 && state.cups >= 1) {
                state.beans--; state.milk--; state.cups--;
                state.brewed++;
                updateUI();
            }
        }


        function buyUpgrade(type) {
            if (state.money >= state.costs[type]) {
                state.money -= state.costs[type];
                
                if (type === 'barista') {
                    state.baristas++;
                    state.costs.barista = Math.floor(state.costs.barista * 1.6); // Price jumps 60%
                } else if (type === 'marketing') {
                    state.marketingLevel++;
                    state.costs.marketing = Math.floor(state.costs.marketing * 1.5);
                } else if (type === 'premium') {
                    state.premiumLevel++;
                    state.pricePerCoffee += 1.50; // Big price increase for customers
                    state.costs.premium = Math.floor(state.costs.premium * 2.2); // Big cost increase
                }
                
                log(`Upgraded ${type}! Next one is more expensive.`, 'success');
                updateUI();
            }
        }


        // Game Loop
        setInterval(() => {
            if (state.baristas > 0) {
                for (let i = 0; i < state.baristas; i++) {
                    if (state.beans >= 1 && state.milk >= 1 && state.cups >= 1) {
                        state.beans--; state.milk--; state.cups--;
                        state.brewed++;
                    }
                }
            }
            if (state.brewed > 0) {
                let demand = 1 + state.marketingLevel;
                let toSell = Math.min(state.brewed, demand);
                state.money += toSell * state.pricePerCoffee;
                state.brewed -= toSell;
                if(toSell > 0) log(`Sold ${toSell} cups.`, 'success');
            }
            updateUI();
        }, 2000);


        updateUI();
    </script>
</body>
</html>
