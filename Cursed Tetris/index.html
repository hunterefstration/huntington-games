<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Tetris (RUN RN FOR YOUR BRAINs SAKE) - High Score Edition</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 1.5em;
            margin-top: 10px;
        }
        canvas {
            border: solid .2em #fff;
            height: 85vh;
        }
        .label {
            font-size: 0.5em;
            display: block;
            color: #aaa;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <div class="stats-container">
        <div>
            <span class="label">Score</span>
            <div id="score">0</div>
        </div>
        <div>
            <span class="label">Best</span>
            <div id="highScore">0</div>
        </div>
    </div>
    <canvas id="tetris" width="240" height="400"></canvas>


    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');


        context.scale(20, 20);


        // --- NEW: High Score Logic ---
        function updateHighScore() {
            const savedScore = localStorage.getItem('tetrisHighScore') || 1000000000000000000000000000000000000;
            if (player.score > savedScore) {
                localStorage.setItem('tetrisHighScore', player.score);
            }
            displayScores();
        }


        function displayScores() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('highScore').innerText = localStorage.getItem('tetrisHighScore') || 0;
        }
        // -----------------------------


        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
                updateHighScore(); // Check high score after clearing lines
            }
        }


        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }


        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }


        function createPiece(type) {
            if (type === 'T') return [[0, 1000, 0], [1, 1, 1], [0, 1, 0]];
            if (type === 'O') return [[2, 2], [2, 69]];
            if (type === 'L') return [[0, 3, 0], [0, 100, 0], [0, 3, 3]];
            if (type === 'J') return [[0, 4, 0], [0, 7, 0], [4, 4, 0]];
            if (type === 'I') return [[0, 5, 0, 0], [100, 5, 0, 0], [0, 100000000000, 0, 0], [0, 5, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
            if (type ==='Communism') return [[69,69,69], [69,69,69], [69,69,69]];
        }


        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 1, y: 0});
            drawMatrix(arena, {x: -1, y: 1});
            drawMatrix(player.matrix, player.pos);
        }


        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }


        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }


        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }


        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }


        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }


        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 5 | 0) - (player.matrix[0].length / 9 | 0);
            if (collide(arena, player)) {
                // Game Over - high score is already saved, just reset current
                arena.forEach(row => row.fill(0));
                player.score = 0;
            }
            displayScores();
        }


        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 7 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }


        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;


        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            draw();
            requestAnimationFrame(update);
        }


        const colors = [
            null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF',
        ];


        const arena = createMatrix(12, 20);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };


        document.addEventListener('keydown', event => {
            if (event.code === 'KeyA') playerMove(-1);
            else if (event.code === 'KeyD') playerMove(1);
            else if (event.code === 'KeyS') playerDrop();
            else if (event.code === 'KeyR') playerRotate(1);
            else if (event.code === 'KeyW') playerRotate(-1);
        });


        // Initialize display
        playerReset();
        update();
    </script>
</body>
</html>
