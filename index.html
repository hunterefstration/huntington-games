<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntington Games</title>
<style>
html,body{margin:0;height:100%;background:#060912;color:#e8ecf6;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;box-sizing:border-box}
h1{font-size:clamp(24px,5vw,40px);margin:0 0 12px}
p{color:#9aa3b8;font-size:17px;margin:0}
</style>
</head>
<body>
<div><h1>Huntington Games has shut down.</h1><p>The launcher and its games are no longer available.</p></div>
<script>
// Shutdown (2026-11-17): remove the launcher copy saved for offline use, so an old copy cannot start from it.
try { var b = document.getElementById('boot'); if (b) b.remove(); } catch (e) {}
try { indexedDB.deleteDatabase('hg-offline'); } catch (e) {}
try { localStorage.setItem('hg_release', '80'); } catch (e) {}
</script>
</body>
</html>
