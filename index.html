<!DOCTYPE html>
<html lang="en" data-base="dark" data-flavor="amber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntington Games Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --sans: "IBM Plex Sans", system-ui, "Segoe UI", Tahoma, sans-serif;
  /* the launcher's older names, mapped onto the theme so every dialog and button follows it */
  --bg: var(--ground); --card: var(--panel); --gold: var(--signal); --blue: var(--signal);
}
/* ---- Grapevine's themes, copied from the app: 18 flavors x dark / light / oled. The launcher wears whatever you chose
   in Grapevine's settings (see applyGvTheme in the script). ---- */
:root, html[data-flavor="amber"]{
  --tint:#8a7c62; --sig-d:#f0a02c; --sig-l:#b96b00; --sig2-d:#ff6a3d; --sig2-l:#c2410c;
  --live-d:#4fd1a5; --live-l:#0f8a63; --dng-d:#e5484d; --dng-l:#c8232a;
  --text-d:#ececf0; --dim-d:#63636e; --dimmer-d:#3a3a42; --text-l:#17171c; --dim-l:#6a6a76; --dimmer-l:#a2a2ae;
}
html[data-flavor="midnight"]{ --tint:#3556ff; --sig-d:#7aa2f7; --sig-l:#1d4ed8; --sig2-d:#c4b5fd; --sig2-l:#6d28d9; --live-d:#4fd1a5; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="slate"]{    --tint:#7c8aa5; --sig-d:#c9d1d9; --sig-l:#334155; --sig2-d:#7aa2f7; --sig2-l:#1d4ed8; --live-d:#4fd1a5; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="forest"]{   --tint:#1f8a3f; --sig-d:#7bc47f; --sig-l:#1f7a2e; --sig2-d:#e0b44a; --sig2-l:#8a6d00; --live-d:#4fd1a5; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="plum"]{     --tint:#8a2be2; --sig-d:#c98bff; --sig-l:#6f3ccf; --sig2-d:#ff6b9d; --sig2-l:#be185d; --live-d:#5ad1c0; --live-l:#0e8a7a; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="ember"]{    --tint:#ff3d1a; --sig-d:#ff8f5e; --sig-l:#c2410c; --sig2-d:#ffd166; --sig2-l:#a16207; --live-d:#e0b44a; --live-l:#8a6d00; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="ocean"]{    --tint:#0077cc; --sig-d:#4fc3f7; --sig-l:#0b6fb5; --sig2-d:#39d1a0; --sig2-l:#0f8a63; --live-d:#39d1a0; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="velvet"]{   --tint:#d1176a; --sig-d:#ff5fa8; --sig-l:#ad1457; --sig2-d:#c98bff; --sig2-l:#6f3ccf; --live-d:#c98bff; --live-l:#6f3ccf; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="paper"]{    --tint:#c9a46a; --sig-d:#e0b44a; --sig-l:#a2560d; --sig2-d:#7bc47f; --sig2-l:#3f7a4a; --live-d:#7bc47f; --live-l:#3f7a4a; --dng-d:#ff5c52; --dng-l:#b3302c;
  --text-l:#241f18; --dim-l:#6f675b; --dimmer-l:#a79d8c }
html[data-flavor="glacier"]{  --tint:#38a3e8; --sig-d:#7cc4ff; --sig-l:#1272b8; --sig2-d:#b8f5ff; --sig2-l:#0e7490; --live-d:#4fd1a5; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a;
  --text-l:#15202a; --dim-l:#5e7284; --dimmer-l:#9db0c0 }
html[data-flavor="terminal"]{ --tint:#22ff55; --sig-d:#33ff66; --sig-l:#1b7a2f; --sig2-d:#b8f5c4; --sig2-l:#0f5132; --live-d:#33ff66; --live-l:#1b7a2f; --dng-d:#ff4444; --dng-l:#c8232a;
  --text-d:#b8f5c4; --dim-d:#4d8a58; --dimmer-d:#26502e; --text-l:#0f2e17; --dim-l:#3e6b49; --dimmer-l:#8fb79a }
html[data-flavor="mono"]{     --tint:#808080; --sig-d:#ffffff; --sig-l:#111111; --sig2-d:#8a8a8a; --sig2-l:#555555; --live-d:#ffffff; --live-l:#111111; --dng-d:#ffffff; --dng-l:#111111;
  --text-d:#ffffff; --dim-d:#8a8a8a; --dimmer-d:#4d4d4d; --text-l:#000000; --dim-l:#666666; --dimmer-l:#a8a8a8 }
html[data-flavor="neon"]{     --tint:#00d5ff; --sig-d:#00e5ff; --sig-l:#0891b2; --sig2-d:#ff2bd6; --sig2-l:#be185d; --live-d:#39ff88; --live-l:#0f8a63; --dng-d:#ff2b5c; --dng-l:#c8232a;
  --text-d:#e8fbff; --dim-d:#5c8a96; --dimmer-d:#2f4d55 }
html[data-flavor="sunset"]{   --tint:#ff5e3a; --sig-d:#ff7a45; --sig-l:#c2410c; --sig2-d:#ff3d8f; --sig2-l:#be185d; --live-d:#ffd166; --live-l:#8a6d00; --dng-d:#ff2b5c; --dng-l:#c8232a }
html[data-flavor="aurora"]{   --tint:#20c997; --sig-d:#4ef0b0; --sig-l:#0f8a63; --sig2-d:#9b6bff; --sig2-l:#6d28d9; --live-d:#4ef0b0; --live-l:#0f8a63; --dng-d:#ff5c52; --dng-l:#c8232a }
html[data-flavor="cherry"]{   --tint:#c8102e; --sig-d:#ff3355; --sig-l:#b3122e; --sig2-d:#ff9fb0; --sig2-l:#7f1d1d; --live-d:#ff9fb0; --live-l:#7f1d1d; --dng-d:#ff3355; --dng-l:#b3122e }
html[data-flavor="gold"]{     --tint:#8a6d1a; --sig-d:#f5c542; --sig-l:#8a6d00; --sig2-d:#fff1b8; --sig2-l:#a16207; --live-d:#f5c542; --live-l:#8a6d00; --dng-d:#ff5c52; --dng-l:#c8232a;
  --text-d:#f7f1de; --dim-d:#8a7d55; --dimmer-d:#4d4630 }
html[data-flavor="cyber"]{    --tint:#6a00ff; --sig-d:#f5f31a; --sig-l:#7c6f00; --sig2-d:#b34dff; --sig2-l:#6d28d9; --live-d:#39ff88; --live-l:#0f8a63; --dng-d:#ff2b5c; --dng-l:#c8232a }

/* the bases */
:root, html[data-base="dark"]{
  --ground:color-mix(in srgb, var(--tint) 7%, #070708);
  --panel:color-mix(in srgb, var(--tint) 9%, #0c0c0e);
  --raise:color-mix(in srgb, var(--tint) 12%, #111114);
  --line:color-mix(in srgb, var(--tint) 15%, #1b1b20);
  --line2:color-mix(in srgb, var(--tint) 20%, #26262d);
  --text:var(--text-d); --dim:var(--dim-d); --dimmer:var(--dimmer-d);
  --signal:var(--sig-d); --signal2:var(--sig2-d); --live:var(--live-d); --danger:var(--dng-d);
  --on-signal:#0a0a0c;
  color-scheme:dark;
}
html[data-base="oled"]{
  --ground:#000000; --panel:#000000;
  --raise:color-mix(in srgb, var(--tint) 12%, #0e0e10);
  --line:color-mix(in srgb, var(--tint) 16%, #1a1a1e);
  --line2:color-mix(in srgb, var(--tint) 22%, #2a2a30);
  --text:var(--text-d); --dim:var(--dim-d); --dimmer:var(--dimmer-d);
  --signal:var(--sig-d); --signal2:var(--sig2-d); --live:var(--live-d); --danger:var(--dng-d);
  --on-signal:#0a0a0c;
  color-scheme:dark;
}
html[data-base="light"]{
  --ground:color-mix(in srgb, var(--tint) 4%, #fbfbfc);
  --panel:color-mix(in srgb, var(--tint) 2%, #ffffff);
  --raise:color-mix(in srgb, var(--tint) 6%, #f2f2f5);
  --line:color-mix(in srgb, var(--tint) 8%, #e3e3e9);
  --line2:color-mix(in srgb, var(--tint) 12%, #d0d0da);
  --text:var(--text-l); --dim:var(--dim-l); --dimmer:var(--dimmer-l);
  --signal:var(--sig-l); --signal2:var(--sig2-l); --live:var(--live-l); --danger:var(--dng-l);
  --on-signal:#ffffff;
  color-scheme:light;
}
/* mono on oled is the one place a tint would be a lie */
html[data-base="oled"][data-flavor="mono"]{ --raise:#121212; --line:#1f1f1f; --line2:#2e2e2e }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
#hub { max-width: 1100px; margin: 0 auto; padding: 26px 16px 60px; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: 1px; }
.sub { color: var(--dim); margin: 4px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.12s, border-color 0.12s; display: flex; flex-direction: column; text-align: left; color: var(--text); padding: 0; font: inherit; }
.game:hover { transform: translateY(-2px); border-color: var(--blue); }
.shot { aspect-ratio: 16 / 9; width: 100%; background: var(--ground); position: relative; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--dim); padding: 10px; text-align: center; }
.info { padding: 10px 12px 12px; }
.name { font-weight: 800; font-size: 16px; }
.desc { color: var(--dim); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
.tags { margin-top: 7px; }
.tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,0.07); color: var(--dim); margin-right: 3px; }
.tag.new { background: rgba(241,196,15,0.18); color: var(--gold); }
#exp-btn { position: fixed; left: 8px; bottom: 6px; background: transparent; border: none; color: var(--dimmer); font-size: 11px; cursor: pointer; padding: 3px 5px; font-family: inherit; }
#exp-btn:hover { color: var(--dim); }
#offbar { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
#offbar.off { display: none; }
#offprog { display: none; width: 140px; height: 6px; background: var(--raise); border-radius: 3px; overflow: hidden; }
#offprog.on { display: inline-block; }
#offfill { display: block; height: 100%; width: 0; background: var(--blue); transition: width 0.3s; }
#offdl { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
#offdl:hover { color: var(--text); border-color: var(--blue); }
#offdl:disabled { opacity: 0.5; cursor: default; }
#offdlg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 6; }
#offdlg.open { display: flex; }
#offdlg .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; font-size: 14px; line-height: 1.5; }
#offdlg h2 { margin: 0 0 6px; font-size: 18px; }
#offdlg .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#offdlg .btns button { background: var(--raise); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
#exp { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 5; }
#exp.open { display: flex; }
#exp .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; }
#exp h2 { margin: 0 0 4px; font-size: 18px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: transparent; border: none; border-top: 1px solid var(--line); color: var(--text); padding: 10px 2px; text-align: left; cursor: pointer; font: inherit; }
.row:hover .rname { color: var(--blue); }
.rname { font-weight: 700; }
.rdesc { color: var(--dim); font-size: 12px; }
.close { float: right; background: var(--raise); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
#player.open { display: flex; }
#ptop { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
#ptop button, #ptop a { background: var(--raise); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; }
#ptitle { flex: 1; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#frame { flex: 1; width: 100%; border: 0; background: #000; }
#ptop.hide { display: none; }
#chathint { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.note { color: var(--dimmer); font-size: 11px; margin-top: 26px; }

/* ---- the Grapevine look: amber on warm black, mono labels, square corners ---- */
h1 { font-family: var(--mono); font-weight: 600; font-size: clamp(13px, 2.6vw, 18px); letter-spacing: .28em; text-transform: uppercase; color: var(--signal); background: linear-gradient(90deg, var(--signal), var(--signal2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
html[data-base] { --dim: color-mix(in srgb, var(--text) 62%, var(--ground)); }
#hub { padding-top: 14px; }
#tour { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.66); display: flex; align-items: center; justify-content: center; padding: 16px; }
#tour[hidden] { display: none; }
#tour .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; width: min(460px, 100%); padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
#tour .k { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--signal); }
#tour h2 { margin: 6px 0 8px; font-size: 20px; }
#tour p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
#tour .dots { display: flex; gap: 6px; margin: 16px 0 14px; }
#tour .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
#tour .dots i.on { background: var(--signal); }
#tour .btns { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#tour button { background: var(--raise); border: 1px solid var(--line2); color: var(--text); border-radius: 3px; padding: 8px 16px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
#tour button.go { background: linear-gradient(100deg, var(--signal), var(--signal2)); color: var(--on-signal); border: 0; font-weight: 600; }
#tour button.skip { background: none; border: 0; color: var(--dim); }
#topbar { display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 20px; padding-bottom: 0; }
#topbar h1 { padding: 10px 0; }
#tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 12px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--signal); border-bottom-color: var(--signal); }
#chip { display: none; align-items: center; gap: 8px; background: var(--raise); border: 1px solid var(--line2); border-radius: 3px; padding: 5px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--text); cursor: pointer; max-width: 200px; }
#chip.on { display: inline-flex; }
#chip:hover { border-color: var(--signal); color: var(--signal); }
#chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--dimmer); flex: none; }
.cdot.on { background: var(--live); box-shadow: 0 0 8px color-mix(in srgb, var(--live) 60%, transparent); }
.cdot.wait { background: var(--signal); }
.sub { font-size: 13px; }
.game { border-radius: 4px; }
.game:hover { box-shadow: 0 8px 26px color-mix(in srgb, var(--signal) 14%, transparent); }
.name { font-weight: 600; }
.tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; border-radius: 2px; padding: 1px 7px; }
.tag.new { background: color-mix(in srgb, var(--signal) 18%, transparent); color: var(--signal); }
#offdl, #offdlg .btns button, .close, #ptop button, #ptop a, #exp .box, #offdlg .box { border-radius: 3px; }
#ptop button, #ptop a, .close, #offdlg .btns button, #offdl { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
#view-acct { padding-bottom: 40px; }
#view-acct[hidden], #view-games[hidden], #view-chat[hidden], #gate[hidden] { display: none; }
/* the Grapevine tab is the whole app, edge to edge under the top bar */
#view-chat { position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 4; padding-top: var(--topbar, 49px); background: var(--ground); }
#gvapp { width: 100%; height: 100%; border: 0; display: block; background: var(--ground); }
body.chat #hub { position: relative; z-index: 6; pointer-events: none; padding-bottom: 0; }
body.chat #topbar { pointer-events: auto; }
@media (max-width: 760px) { #topbar { gap: 0 12px; } #tabs { order: 3; flex: 1 1 100%; overflow-x: auto; } .tab { padding: 10px 10px; letter-spacing: .1em; } #chip { margin-left: auto; } }
body.chat #hub > #view-games, body.chat #hub > #view-acct { display: none; }
body.chat { overflow: hidden; }
#gate { position: fixed; inset: 0; z-index: 40; background: var(--ground); overflow-y: auto; display: flex; padding: 20px 16px; }
#gate-box { margin: auto; width: 100%; max-width: 640px; }
.credit { margin-top: 7px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
</style>
</head>
<body>
<div id="hub">
  <div id="topbar">
    <h1>HUNTINGTON GAMES LAUNCHER</h1>
    <nav id="tabs"><button class="tab on" id="tab-games">Games</button><button class="tab" id="tab-chat">Grapevine</button><button class="tab" id="tab-acct">Account</button></nav>
    <button id="chip" title="Grapevine"><span class="cdot" id="chip-dot"></span><span class="nm" id="chip-nm"></span></button>
  </div>
  <div id="view-games">
  <div class="sub">Pick a game.</div>
  <div class="grid" id="grid"></div>
  <div id="offbar"><span id="offstat"></span><span id="offprog"><i id="offfill"></i></span><button id="offdl" title="Save one HTML file with every game inside, to play with no internet">Download offline copy</button></div>
  <div class="note" id="note"></div>
  </div>
  <div id="view-acct" hidden></div>
</div>
<div id="view-chat" hidden><iframe id="gvapp" title="Grapevine" allow="clipboard-write"></iframe></div>
<div id="gate" hidden><div id="gate-box"></div></div>
<div id="tour" hidden><div class="box"></div></div>
<div id="offdlg"><div class="box"><h2 id="offdlg-title">Offline copy</h2><div id="offdlg-text"></div><div class="btns"><button id="offdlg-again">Download again</button><button id="offdlg-tab">Open in a new tab</button><button id="offdlg-close">Close</button></div></div></div>
<button id="exp-btn" title="Prototypes and older games">experimental</button>
<div id="exp"><div class="box"><button class="close" id="exp-close">Close</button><h2>Experimental</h2><div class="rdesc" style="margin-bottom:8px">Prototypes, remixes and side projects.</div><div id="exp-list"></div></div></div>
<div id="player">
  <div id="ptop"><button id="back">&#8592; All games</button><span id="ptitle"></span><span id="chathint"></span><button id="full" title="Fullscreen">Fullscreen</button><button id="newtab">New tab</button></div>
  <iframe id="frame" allow="fullscreen; pointer-lock; autoplay; gamepad" allowfullscreen></iframe>
</div>
<script>
// Where the games live. Opened from the website (or the folder on your computer) the games load directly.
// Anywhere else (jsbin, a copy from the Google Doc...) the game code is fetched from the jsDelivr CDN mirror of
// the GitHub repo and written into the frame, so the browser never navigates to github.io (school Chromebooks
// often block that). Same trick as the Hollow Knight web port.
// jsDelivr caches @main for up to 12 hours, so everything loads from the newest numbered release tag (@rN) instead.

  if (current && current.game === g) { try { wins.push(frame.contentWindow); } catch (e) {} }
  if (popup && !popup.closed && popupGame === g) wins.push(popup);
  for (var i = 0; i < wins.length; i++) { try { if (wins[i].__hgJoin) { pendingJoin = null; wins[i].__hgJoin(code); return; } } catch (e) {} }
  play(g);
}
document.addEventListener('fullscreenchange', function () { var h = document.getElementById('hgt-host'); if (h) toastHost(document); });

// The chat window. `gdoc` is the page the game is in (the launcher's game frame, or the New-tab copy). The window is a small frame of
// its own, so keys typed in it never reach the game (a game that listens to every key would otherwise react to what is being typed).
function openChatBox(gdoc, convId) {
  var fr = gdoc.getElementById('hgc-box');
  if (fr) { if (convId && fr.__pick) fr.__pick(convId); try { fr.contentWindow.focus(); fr.contentDocument.querySelector('input').focus(); } catch (e) {} return; }
  try { gdoc.exitPointerLock && gdoc.exitPointerLock(); } catch (e) {}
  fr = hgEl(gdoc, 'iframe'); fr.id = 'hgc-box';
  fr.style.cssText = 'position:fixed;left:12px;bottom:12px;width:min(360px,calc(100vw - 24px));height:min(330px,calc(100vh - 24px));border:0;z-index:2147483001;background:transparent';
  gdoc.body.appendChild(fr);
  var doc = fr.contentDocument; doc.open(); doc.write('<!DOCTYPE html><html><body style="margin:0;background:transparent"></body></html>'); doc.close();
  var box = hgSkin(doc, hgEl(doc, 'div', 'hgc')), hd = hgEl(doc, 'div', 'hd'), sel = hgEl(doc, 'select'), x = hgEl(doc, 'button', '', 'Close'),
      ls = hgEl(doc, 'div', 'ls'), ft = hgEl(doc, 'div', 'ft'), inp = hgEl(doc, 'input'), go = hgEl(doc, 'button', 'go', 'Send'), cur = convId || '';
  box.style.cssText += ';position:static;width:100%;height:100%;left:auto;bottom:auto';
  inp.placeholder = 'Say something'; inp.maxLength = 500; inp.setAttribute('autocomplete', 'off');
  hd.appendChild(sel); hd.appendChild(x); ft.appendChild(inp); ft.appendChild(go);
  box.appendChild(hd); box.appendChild(ls); box.appendChild(ft); box.appendChild(hgEl(doc, 'div', 'tip', 'Esc closes. Messages go to the same chats as the Grapevine tab.'));
  doc.body.appendChild(box);
  function close() { try { fr.remove(); } catch (e) {} gdoc.__hgchatOpen = false; try { gdoc.defaultView.focus(); } catch (e) {} }
  function paint() {
    var api = chatApi();
    if (!api) { ls.textContent = ''; ls.appendChild(hgEl(doc, 'div', 'none', 'Connecting to Grapevine...')); return; }
    var cs = api.convs();
    if (!sel.options.length || sel.__n !== cs.length) {
      sel.textContent = ''; sel.__n = cs.length;
      cs.forEach(function (c) { var o = hgEl(doc, 'option', '', (c.kind === 'dm' ? '@ ' : '') + c.title + (c.unread ? ' (' + c.unread + ')' : '')); o.value = c.id; sel.appendChild(o); });
      if (!cur || !cs.some(function (c) { return c.id === cur; })) cur = cs.length ? cs[0].id : '';
      sel.value = cur;
    }
    ls.textContent = '';
    var ms = cur ? api.msgs(cur, 40) : [];
    if (!ms.length) ls.appendChild(hgEl(doc, 'div', 'none', cur ? 'No messages yet.' : 'You are not in any chats yet.'));
    ms.forEach(function (m) { var d = hgEl(doc, 'div', m.mine ? 'me' : ''); d.appendChild(hgEl(doc, 'b', '', m.from + ': ')); d.appendChild(doc.createTextNode(m.text)); ls.appendChild(d); });
    ls.scrollTop = ls.scrollHeight;
    gdoc.__hgchatConv = cur;
    if (cur) api.read(cur);
  }
  fr.__pick = function (id) { cur = id; sel.value = id; paint(); };
  function send() { var api = chatApi(); if (!api || !cur) return; if (api.send(cur, inp.value)) { inp.value = ''; setTimeout(paint, 50); } }
  sel.onchange = function () { cur = sel.value; paint(); inp.focus(); };
  x.onclick = close; go.onclick = send;
  doc.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); close(); } else if (e.key === 'Enter' && e.target === inp) { e.preventDefault(); send(); } });
  gdoc.__hgchatOpen = true;
  if (!chatApi()) gvStartApp();
  // live: refresh when a message arrives; while the app is still connecting, look again every second
  var iv = setInterval(function () { if (!fr.isConnected) { clearInterval(iv); return; } var api = chatApi(); if (!api) { paint(); return; } if (!fr.__live) { fr.__live = 1; api.on(function (c, m) { if (fr.isConnected && m.convId === cur) paint(); }); paint(); } }, 1000);
  paint(); try { fr.contentWindow.focus(); } catch (e) {} inp.focus();
}
// T opens the chat while a game is running. Games that need every key, and Frontline (which uses plain T for its tech tree), are handled by flags.
function attachChat(doc, g) {
  if (!doc || doc.__hgchat || !g || g.noChat) return;
  var L = window.HGGrapevine; if (!(L && L.me())) return;
  doc.__hgchat = 1;
  doc.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || String(e.key).toLowerCase() !== 't' || !!g.chatShift !== !!e.shiftKey) return;
    var t = e.target; if (t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;
    e.preventDefault(); e.stopPropagation();

frame.addEventListener('load', function () {

});
document.getElementById('tab-games').onclick = function () { showTab('games'); };
document.getElementById('tab-chat').onclick = function () { showTab('chat'); };
document.getElementById('tab-acct').onclick = function () { showTab('acct'); };
document.getElementById('chip').onclick = function () { showTab('acct'); };
window.addEventListener('resize', function () { if (document.body.className === 'chat') document.getElementById('view-chat').style.setProperty('--topbar', Math.ceil(document.getElementById('topbar').getBoundingClientRect().bottom + 1) + 'px'); });
// Saves follow the account: before a game opens (so it starts from the newest save), and again after it closes.
// A game reads its save the moment it starts, so the account's saves have to be on this device BEFORE that. The first time in a
// visit this waits (up to 25 s, with a button to skip) for the sign-in and the first sync; afterwards it only refreshes if the last
// sync is more than a minute old. Anything newer that arrives while a game is open waits until it closes.
function gvBeforePlay(g, go) {
  var L = window.HGGrapevine;
  if (!(L && L.me())) return go();
  var s0 = L.sync.status(), recent = L.online() && s0.synced && Date.now() - (s0.at || 0) < 60000;
  if (recent) { L.sync.setGameOpen(true); return go(); }
  var id = ++loadId, done = false;
  function start() { if (done) return; done = true; skipWait = null; if (id !== loadId) return; L.sync.setGameOpen(true); go(); }
  document.getElementById('ptitle').textContent = g.name;
  document.getElementById('chathint').textContent = '';
  document.getElementById('player').classList.add('open');
  current = { game: g, html: null };
  var first = !s0.synced;
  frame.srcdoc = message(first ? 'Getting your saved progress...' : 'Checking for newer saves...');
  var late = setTimeout(function () { if (!done && id === loadId) frame.srcdoc = message('Still getting your saved progress...<br><br><button onclick="parent.HG_skipWait()" style="font:inherit;padding:8px 16px;cursor:pointer">Play without waiting</button><br><br><small>(Your account\'s saves load when you leave the game.)</small>'); }, 5000);
  skipWait = start;
  var p = first ? L.sync.whenSynced(25000) : Promise.race([L.sync.run().catch(function () {}), new Promise(function (r) { setTimeout(r, 3000); })]);
  p.then(function () { clearTimeout(late); start(); });
}
function gvAfterPlay() { var L = window.HGGrapevine; if (L && L.me()) setTimeout(function () { L.sync.setGameOpen(false); }, 500); }
document.addEventListener('visibilitychange', function () { var L = window.HGGrapevine; if (document.hidden && L && L.me() && L.online()) L.sync.run().catch(function () {}); });
if (!BUNDLE) {
  if (hasSavedKey()) { paintChip(); loadGV().then(function (L) { L.resume(); }, function () {}); }   // signed in before: bring the account up quietly
  else { closePlayer(); showGate(); }
}
if (start === 'chat') showTab('chat'); else if (start === 'account') showTab('acct');
