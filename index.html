<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntington Games</title>
<style>
:root { --bg: #0d1117; --card: #161b22; --line: #2b3440; --text: #e6edf3; --dim: #8b949e; --gold: #f1c40f; --blue: #58a6ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
#hub { max-width: 1100px; margin: 0 auto; padding: 26px 16px 60px; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: 1px; }
.sub { color: var(--dim); margin: 4px 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.12s, border-color 0.12s; display: flex; flex-direction: column; text-align: left; color: var(--text); padding: 0; font: inherit; }
.game:hover { transform: translateY(-2px); border-color: var(--blue); }
.shot { aspect-ratio: 16 / 9; width: 100%; background: #0a0d12; position: relative; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--dim); padding: 10px; text-align: center; }
.info { padding: 10px 12px 12px; }
.name { font-weight: 800; font-size: 16px; }
.desc { color: var(--dim); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
.tags { margin-top: 7px; }
.tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,0.07); color: var(--dim); margin-right: 3px; }
.tag.new { background: rgba(241,196,15,0.18); color: var(--gold); }
#exp-btn { position: fixed; left: 8px; bottom: 6px; background: transparent; border: none; color: #3d4652; font-size: 11px; cursor: pointer; padding: 3px 5px; font-family: inherit; }
#exp-btn:hover { color: var(--dim); }
#exp { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 5; }
#exp.open { display: flex; }
#exp .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; }
#exp h2 { margin: 0 0 4px; font-size: 18px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: transparent; border: none; border-top: 1px solid var(--line); color: var(--text); padding: 10px 2px; text-align: left; cursor: pointer; font: inherit; }
.row:hover .rname { color: var(--blue); }
.rname { font-weight: 700; }
.rdesc { color: var(--dim); font-size: 12px; }
.close { float: right; background: #1f2630; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
#player.open { display: flex; }
#ptop { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: #11161d; border-bottom: 1px solid var(--line); }
#ptop button, #ptop a { background: #1f2630; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; }
#ptitle { flex: 1; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#frame { flex: 1; width: 100%; border: 0; background: #000; }
#ptop.hide { display: none; }
.note { color: #4b5563; font-size: 11px; margin-top: 26px; }
</style>
</head>
<body>
<div id="hub">
  <h1>HUNTINGTON GAMES</h1>
  <div class="sub">Pick a game.</div>
  <div class="grid" id="grid"></div>
  <div class="note" id="note"></div>
</div>
<button id="exp-btn" title="Prototypes and older games">experimental</button>
<div id="exp"><div class="box"><button class="close" id="exp-close">Close</button><h2>Experimental</h2><div class="rdesc" style="margin-bottom:8px">Prototypes, remixes and side projects.</div><div id="exp-list"></div></div></div>
<div id="player">
  <div id="ptop"><button id="back">&#8592; All games</button><span id="ptitle"></span><button id="full" title="Fullscreen">Fullscreen</button><button id="newtab">New tab</button></div>
  <iframe id="frame" allow="fullscreen; pointer-lock; autoplay; gamepad" allowfullscreen></iframe>
</div>
<script>
// Where the games live. Opened from the website (or the folder on your computer) the games load directly.
// Anywhere else (jsbin, a copy from the Google Doc...) the game code is fetched from the jsDelivr CDN mirror of
// the GitHub repo and written into the frame, so the browser never navigates to github.io (school Chromebooks
// often block that). Same trick as the Hollow Knight web port.
// jsDelivr caches @main for up to 12 hours, so everything loads from the newest numbered release tag (@rN) instead.
var REPO_NAME = 'hunterefstration/huntington-games';
function findLatest(repo, floor, cb) {
  // Releases are git tags r1, r2, r3... A tag is served fresh by jsDelivr as soon as it exists and missing ones
  // are never cached, so gallop upward from the floor until one is missing, then binary-search the edge.
  function exists(n) {
    return fetch('https://cdn.jsdelivr.net/gh/' + repo + '@r' + n + '/latest.json').then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  var lo = floor, step = 1;
  function bisect(a, b) {
    if (b - a <= 1) return cb(a);
    var m = (a + b) >> 1;
    exists(m).then(function (ok) { if (ok) bisect(m, b); else bisect(a, m); });
  }
  function gallop() {
    exists(lo + step).then(function (ok) { if (ok) { lo += step; step *= 2; gallop(); } else bisect(lo, lo + step); });
  }
  gallop();
}
var MIRROR_HOSTS = ['https://cdn.jsdelivr.net/gh/', 'https://fastly.jsdelivr.net/gh/', 'https://gcore.jsdelivr.net/gh/', 'https://testingcf.jsdelivr.net/gh/'];
var MIRRORS = [];
function setVersion(v) { MIRRORS = MIRROR_HOSTS.map(function (m) { return m + REPO_NAME + '@' + (v || 'main') + '/'; }); }
var versionReady = window.HG_VERSION ? Promise.resolve(window.HG_VERSION) : new Promise(function (done) {
  var floor = 1;
  try { floor = Math.max(1, parseInt(localStorage.getItem('hg_release'), 10) || 1); } catch (e) {}
  findLatest(REPO_NAME, floor, function (n) { try { localStorage.setItem('hg_release', n); } catch (e) {} done('r' + n); });
});
var local = location.protocol === 'file:' || /github\.io$/.test(location.hostname) || location.hostname === '127.0.0.1' || location.hostname === 'localhost';

var GAMES = [
  { dir: 'Frontline', name: 'Frontline: Command', img: 'frontline', tags: ['New', '3D', 'Multiplayer'], desc: '3D war strategy, from rifles to mechs: capture flags, build up, command your army. Play the AI or a friend with a 6-digit code.' },
  { dir: 'Blocky Shooter V2', name: 'Blocky Shooter', img: 'blocky', tags: ['3D', 'Multiplayer'], desc: 'Zombie wave shooter: 8 maps, ranks, an armory, and online co-op or PvP with 6-digit party codes.' },
  { dir: 'Tower Defense 2.0', name: 'Tower Defense 2.4', img: 'td', tags: ['New', 'Strategy'], desc: 'Two modes: Tower Mode (40+ towers with specialties) or Troop Mode (8 barracks, contractors, command your army). 1900 to the future.' },
  { dir: 'Coffee Shop NEW', name: 'Bean & Brew Tycoon', img: 'coffee', tags: ['Tycoon'], desc: 'Build, staff and grow a chain of coffee shops.' },
  { dir: 'Tetris', name: 'Tetris Surge', img: 'tetris', tags: ['New', 'Puzzle'], desc: 'Power blocks, perks and bosses in a rogue-lite run, plus Marathon, Sprint, Ultra and Zen.' },
  { dir: 'Market Life 1.9', name: 'Market & Life', img: 'market', tags: ['Sim'], desc: 'Climb the career ladder, start businesses and play the market.' },
  { dir: '50 Levels Of Spikes 1.2', name: '50 Levels of Spikes', img: 'spikes', tags: ['Platformer'], desc: 'A precision platformer that gets harder every level.' },
  { dir: 'Brown E Clicker', name: 'Brown E Clicker', img: 'clicker', tags: ['Clicker'], desc: 'Click the E. Buy upgrades. Ascend.' },
  { dir: 'Coffee Shop Tycoon Legacy', name: 'Bean & Brew Classic', img: 'legacy', tags: ['Tycoon'], desc: 'The original coffee shop tycoon.' }
];
var EXPERIMENTAL = [
  { dir: 'Divergent Project', file: 'jsbin.html', name: 'Divergent: Fear Landscape', desc: '3D. Face your fears in Tris\'s simulation.' },
  { dir: 'Tower Jumper', name: 'Tower Jumper', desc: 'Endless, level, flight and boss modes.' },
  { dir: 'Neon Drift By Levi Beta 1.9', name: 'Neon Drift: Shadow Reign', desc: 'By Levi.' },
  { dir: 'Levi Dash By Levi 2.0', name: 'Neon Dash 2.0', desc: 'By Levi.' },
  { dir: 'Hunters Fork', name: 'Neon Dash: Hunter\'s Fork', desc: 'A remix of Neon Dash.' },
  { dir: 'Cursed Dash', name: 'Cursed Dash', desc: 'Neon Dash, but cursed.' },
  { dir: 'Cursed Tetris', name: 'Cursed Tetris', desc: 'Run, for your brain\'s sake.' },
  { dir: 'Battle Mechanic', name: 'Undertale Battle Prototype', desc: 'An Undertale-style battle test.' },
  { dir: 'Battle Mechanic 2', name: 'The Dummy\'s Patience', desc: 'Undertale-style battle against a very patient dummy.' }
];

function path(g) { return encodeURI(g.dir) + '/' + (local ? 'index.html' : (g.file || 'index.html')); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function render() {
  if (!local && !MIRRORS.length) { versionReady.then(function (v) { setVersion(v); render(); }); return; }
  var grid = document.getElementById('grid');
  GAMES.forEach(function (g) {
    var b = el('button', 'game'), shot = el('div', 'shot'), img = new Image();
    var m = 0;
    img.alt = g.name; img.loading = 'lazy'; img.src = (local ? '' : MIRRORS[0]) + 'hub/' + g.img + '.jpg';
    img.onerror = function () {
      if (!local && ++m < MIRRORS.length) { img.src = MIRRORS[m] + 'hub/' + g.img + '.jpg'; return; }
      shot.innerHTML = ''; shot.appendChild(el('div', 'fallback', g.name));
    };
    shot.appendChild(img); b.appendChild(shot);
    b.appendChild(el('div', 'info', '<div class="name">' + g.name + '</div><div class="desc">' + g.desc + '</div><div class="tags">' + g.tags.map(function (t) { return '<span class="tag' + (t === 'New' ? ' new' : '') + '">' + t + '</span>'; }).join('') + '</div>'));
    b.onclick = function () { play(g); };
    grid.appendChild(b);
  });
  var list = document.getElementById('exp-list');
  EXPERIMENTAL.forEach(function (g) {
    var r = el('button', 'row', '<span><span class="rname">' + g.name + '</span><br><span class="rdesc">' + g.desc + '</span></span><span class="rdesc">Play &#8250;</span>');
    r.onclick = function () { document.getElementById('exp').classList.remove('open'); play(g); };
    list.appendChild(r);
  });
}
var frame = document.getElementById('frame'), current = null, loadId = 0;
function message(text) {
  return '<!DOCTYPE html><html><body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#8b949e;font:16px Segoe UI,sans-serif;text-align:center;padding:20px;box-sizing:border-box">' + text + '</body></html>';
}
// Try each CDN mirror until one answers. Resolves to { html, base }.
function fetchGame(g) {
  var i = 0;
  function next() {
    if (i >= MIRRORS.length) return Promise.reject(new Error('all mirrors failed'));
    var base = MIRRORS[i++];
    // no-cache: the CDN tells browsers to keep files for 7 days; always revalidate so updates show up.
    return fetch(base + path(g), { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (html) { return { html: html, base: base }; }, next);
  }
  return versionReady.then(function (v) { if (!MIRRORS.length) setVersion(v); return next(); });
}
function withBase(html, href) {
  var tag = '<base href="' + href + '">';
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
}
function play(g) {
  var id = ++loadId;
  current = { game: g, html: null };
  document.getElementById('ptitle').textContent = g.name;
  document.getElementById('player').classList.add('open');
  try { history.replaceState(null, '', '#' + encodeURIComponent(g.dir)); } catch (e) {}
  if (local) { frame.removeAttribute('srcdoc'); frame.src = path(g); return; }
  frame.srcdoc = message('Loading ' + g.name + '...');
  fetchGame(g).then(function (r) {
    if (id !== loadId) return;
    current.html = withBase(r.html, r.base + encodeURI(g.dir) + '/');
    frame.srcdoc = current.html;
  }, function () {
    if (id !== loadId) return;
    frame.srcdoc = message('Could not download ' + g.name + '.<br>The game CDN (cdn.jsdelivr.net) may be blocked on this network.');
  });
}
function closePlayer() {
  loadId++; current = null;
  document.getElementById('player').classList.remove('open');
  frame.removeAttribute('srcdoc'); frame.src = 'about:blank';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
// New tab: a direct link when local, otherwise a copy of the downloaded game.
document.getElementById('newtab').onclick = function () {
  if (!current) return;
  if (local) { window.open(path(current.game), '_blank'); return; }
  if (!current.html) return;
  try { window.open(URL.createObjectURL(new Blob([current.html], { type: 'text/html' })), '_blank'); } catch (e) {}
};
document.getElementById('back').onclick = closePlayer;
document.getElementById('full').onclick = function () { var p = document.getElementById('player'); if (document.fullscreenElement) document.exitFullscreen(); else if (p.requestFullscreen) p.requestFullscreen().catch(function () {}); };
document.addEventListener('fullscreenchange', function () { document.getElementById('ptop').classList.toggle('hide', !!document.fullscreenElement); });
document.getElementById('exp-btn').onclick = function () { document.getElementById('exp').classList.add('open'); };
document.getElementById('exp-close').onclick = function () { document.getElementById('exp').classList.remove('open'); };
document.getElementById('exp').onclick = function (e) { if (e.target.id === 'exp') e.target.classList.remove('open'); };
document.getElementById('note').textContent = local ? '' : 'Games load from the jsDelivr CDN.';
render();
var start = decodeURIComponent(location.hash.slice(1));
GAMES.concat(EXPERIMENTAL).forEach(function (g) { if (g.dir === start) play(g); });
</script>
</body>
</html>
