    // ===================== EDUCATION =====================
    function hasTok(t) {
        if (t === 'bach' || t === 'assoc' || t === 'grad') return L.degrees.some(d => PROGRAMS[d] && PROGRAMS[d].lvl === t);
        return L.degrees.includes(t);
    }
    function meets(req) { return !req || !req.length || req.some(hasTok); }
    function tokName(t) {
        if (t === 'bach') return "any Bachelor's";
        if (t === 'assoc') return "any Associate's";
        if (t === 'grad') return 'a graduate degree';
        return PROGRAMS[t] ? PROGRAMS[t].name : t;
    }
    function reqText(req) { return !req || !req.length ? 'No degree needed' : req.map(tokName).join(' or '); }
    function inSchool() { return !!L.school; }

    function canEnroll(id) {
        const P = PROGRAMS[id];
        if (id === 'hs' || L.school || L.degrees.includes(id)) return false;
        if (!meets(P.req)) return false;
        if (P.minHealth && L.health < P.minHealth) return false;
        return true;
    }
    function enroll(id, useLoan) {
        const P = PROGRAMS[id];
        if (!P || !canEnroll(id) || L.phase !== 'play') return;
        if (!useLoan && P.cost > cash) return;
        L.school = { id, d: 0, total: P.years * YEAR_DAYS, gpa: L.trait === 'brainy' ? 3.4 : 3.0, loan: !!useLoan, paid: 0 };
        if (L.loans.student) L.loans.student.n = 0; // payments pause while you are a student
        chargeTuition();
        logMessage(`🎓 Enrolled: ${P.name} (${P.years} yr${P.years > 1 ? 's' : ''})`, 'boost-alert');
        toast(`${P.icon} Enrolled in ${P.name}!`, 'good');
        addTimeline(P.icon, 'Started ' + P.name);
        if (L.job) logMessage('Your job is part-time while you study (half pay, slower promotions).');
        changed();
    }
    function chargeTuition() {
        const s = L.school, P = PROGRAMS[s.id];
        if (!P.cost) return;
        if (s.loan) {
            const l = L.loans.student || (L.loans.student = { bal: 0, pay: 0, n: 0, rate: STUDENT_LOAN.rate, label: 'Student Loan' });
            l.bal += P.cost; l.n = 0; l.pay = 0;
            logMessage(`🎓 Tuition ${money(P.cost)} added to your student loan`, 'tax-alert');
        } else {
            cash -= P.cost;
            logMessage(`🎓 Tuition paid: -${money(P.cost)}`, 'tax-alert');
        }
        s.paid += P.cost;
    }
    function startLoanRepayment() {
        const l = L.loans.student;
        if (!l || l.bal <= 0 || L.school) return;
        l.n = STUDENT_LOAN.n; l.pay = loanPayment(l.bal, l.rate, l.n);
        logMessage(`🏦 Student loan repayment starts: ${money(l.pay)}/mo for ${l.n} months`, 'tax-alert');
    }
    function schoolDay() {
        const s = L.school; if (!s) return;
        s.d++;
        let drift = L.job ? -0.0012 : 0.0006;
        if (L.style === 0) drift += 0.0015; else if (L.style === 2) drift -= 0.004;
        if (L.happy < 30) drift -= 0.003;
        s.gpa = clamp(s.gpa + drift, 0, 4);
        if (s.d >= s.total) graduate();
        else if (s.d % YEAR_DAYS === 0) chargeTuition();
    }
    function graduate() {
        const s = L.school, P = PROGRAMS[s.id];
        if (s.gpa < 2.0) {
            s.d = Math.max(0, s.total - YEAR_DAYS); s.gpa = 2.3;
            logMessage(`📉 GPA too low to graduate! You must repeat your final year of ${P.school}.`, 'tax-alert');
            toast('GPA too low: repeating the final year', 'bad');
            chargeTuition();
            return;
        }
        const honors = s.gpa >= 3.5;
        L.degrees.push(s.id);
        if (honors) L.honors.push(s.id);
        const pts = Math.round(P.score * (honors ? 1.25 : 1));
        addScore(pts); boostHappy(12);
        L.school = null;
        logMessage(`🎓 GRADUATED: ${P.name}${honors ? ' with honors' : ''}! +${pts} Life Score`, 'boost-alert');
        toast(`🎓 You earned your ${P.name}${honors ? ' with honors!' : '!'}`, 'good');
        addTimeline('🎓', `Graduated: ${P.name}${honors ? ' (honors)' : ''}`);
        startLoanRepayment();
        markDirty();
    }
    function dropOut() {
        if (!L.school || L.school.id === 'hs') return;
        const P = PROGRAMS[L.school.id];
        confirmBox('🚪', 'Drop out?', `You will lose your progress in ${P.name}. Any student loan stays.`, 'Drop out', () => {
            L.school = null; boostHappy(-8);
            logMessage(`🚪 Dropped out of ${P.name}`, 'tax-alert');
            addTimeline('🚪', 'Dropped out of ' + P.name);
            startLoanRepayment(); changed();
        });
    }
    function doStudy() {
        if (!L.school || L.phase !== 'play') return;
        studyProgress += 12.5;
        if (studyProgress >= 100) {
            studyProgress = 0;
            const g = L.trait === 'brainy' ? 0.075 : 0.05;
            L.school.gpa = clamp(L.school.gpa + g, 0, 4);
            boostHappy(-0.2);
            logMessage(`📖 Studied hard: GPA ${L.school.gpa.toFixed(2)}`);
        }
        updateUI();
    }

    // ===================== CAREERS =====================
    function rankOf(job) { return CAREERS[job.c].ranks[job.r]; }
    function jobTitle() { return L.job ? rankOf(L.job)[0] : (L.school ? 'Student' : 'Unemployed'); }
    function canJoin(c) {
        const C = CAREERS[c];
        if (L.age < (C.minAge || 16)) return false;
        if (C.maxJoin && L.age > C.maxJoin) return false;
        if (C.minHealth && L.health < C.minHealth - (L.trait === 'athletic' ? 10 : 0)) return false;
        return meets(C.ranks[0][2]);
    }
    function joinProblems(c) {
        const C = CAREERS[c], out = [];
        if (L.age < (C.minAge || 16)) out.push('age ' + (C.minAge || 16) + '+');
        if (C.maxJoin && L.age > C.maxJoin) out.push('age ' + C.maxJoin + ' or younger');
        if (C.minHealth) out.push('health ' + (C.minHealth - (L.trait === 'athletic' ? 10 : 0)) + '+');
        if (C.ranks[0][2]) out.push(reqText(C.ranks[0][2]));
        return out.length ? out.join(', ') : 'No requirements';
    }
    // the rank you would start at if you joined career c today
    function startRank(c) {
        const C = CAREERS[c]; let r = 0;
        for (const [req, rank] of (STARTS[c] || [])) if (rank > r && meets(req) && meets(C.ranks[rank][2])) r = rank;
        const back = Math.max(0, (L.best[c] || 0) - 1);   // returning to an old career: one step below your best
        for (let i = r + 1; i <= back; i++) { if (meets(C.ranks[i][2])) r = i; else break; }
        return Math.min(r, C.ranks.length - 1);
    }
    function weeklyWage() {
        if (!L.job) return 0;
        let pay = rankOf(L.job)[1] * (1 + L.payBonus) * STYLES[L.style].pay;
        if (L.school) pay *= 0.5;
        return Math.round(pay);
    }
    function insured() { return L.age < 18 || !!(L.job && CAREERS[L.job.c].benefits); }   // kids are on their parents' plan
    function billCost(c) { return Math.round(insured() ? c * 0.25 : c); }

    function hire(c, r, bonus, quiet) {
        const C = CAREERS[c];
        if (L.best[c] === undefined) addScore(50);   // first job in a new career
        L.job = { c, r, perf: 0, days: 0 };
        L.payBonus = bonus || 0;
        L.jobsHeld++;
        L.best[c] = Math.max(L.best[c] || 0, r);
        addTimeline(C.icon, `Hired as ${C.ranks[r][0]}`);
        if (!quiet) {
            logMessage(`💼 Hired: ${C.ranks[r][0]} (${money(weeklyWage())}/wk)`, 'boost-alert');
            toast(`${C.icon} New job: ${C.ranks[r][0]}!`, 'good');
        }
        markDirty();
    }
    function applyJob(c) {
        if (!CAREERS[c] || !canJoin(c) || (L.job && L.job.c === c) || L.phase !== 'play') return;
        const go = () => { hire(c, startRank(c), 0); changed(); };
        const C = CAREERS[c], sr = C.ranks[startRank(c)];
        if (L.job) confirmBox(C.icon, 'Switch careers?', `You will leave your job as ${jobTitle()} (${money(weeklyWage())}/wk) and start as <b>${sr[0]}</b> in ${C.name} (${money(sr[1])}/wk${L.school ? ', half while studying' : ''}).`, 'Switch', go);
        else go();
    }
    function loseJob(why) {
        if (!L.job) return;
        const t = jobTitle();
        logMessage(`📦 ${why}: you are no longer ${t}`, 'tax-alert');
        addTimeline('📦', `${why} (${t})`);
        L.job = null; L.payBonus = 0;
        markDirty();
    }
    function quitJob() {
        if (!L.job) return;
        confirmBox('🚪', 'Quit your job?', `You will stop earning a salary as ${jobTitle()}.`, 'Quit', () => { loseJob('Quit'); boostHappy(3); changed(); });
    }
    function askRaise() {
        if (!L.job || !cdReady('raise')) return;
        setCd('raise', YEAR_DAYS);
        if (luck(0.15 + L.job.perf / 150 + charm())) {
            const b = Math.round(rnd(0.05, 0.1) * 100) / 100;
            L.payBonus = Math.round((L.payBonus + b) * 100) / 100;
            boostHappy(5);
            logMessage(`🤝 Raise approved! +${Math.round(b * 100)}% pay (${money(weeklyWage())}/wk)`, 'boost-alert');
            toast('Raise approved!', 'good');
        } else {
            boostHappy(-4); L.job.perf = Math.max(0, L.job.perf - 10);
            logMessage('🙅 Your raise was denied. Boost your performance and try again next year.', 'tax-alert');
            toast('Raise denied', 'bad');
        }
        changed();
    }
    function perfGain() {
        const j = L.job; if (!j) return 0;
        const C = CAREERS[j.c];
        // balanced pace at 70 happiness: about 2 years for the first promotion, 5+ years per step near the top
        let g = 0.9 * STYLES[L.style].perf * (0.6 + L.happy / 250);
        if (L.health < 30) g *= 0.6;
        if (L.school) g *= 0.5;
        if (L.trait === 'brainy') g *= 1.1;
        if (!L.car && L.age >= 18) g *= 0.9;
        if (C.trade && L.car && L.car.id === 'pickup') g *= 1.15;
        if (j.c === 'athlete' && L.health < 50) g *= 0.2;
        return g / (1 + j.r * 0.35);
    }
    function nextRankBlocked() {
        const j = L.job; if (!j) return null;
        const C = CAREERS[j.c];
        if (j.r >= C.ranks.length - 1) return null;
        const req = C.ranks[j.r + 1][2];
        return meets(req) ? null : req;
    }
    function checkPromotion() {
        const j = L.job; if (!j || j.perf < 100) return;
        const C = CAREERS[j.c];
        j.perf = 100;
        if (j.r >= C.ranks.length - 1) return;
        const block = nextRankBlocked();
        if (block) {
            if (!j.noted) { j.noted = true; logMessage(`🔒 Ready for promotion, but ${C.ranks[j.r + 1][0]} needs: ${reqText(block)}`, 'tax-alert'); toast('Promotion blocked: you need more education', 'bad'); markDirty(); }
            return;
        }
        promote();
    }
    function promote() {
        const j = L.job; if (!j) return;
        const C = CAREERS[j.c];
        if (j.r >= C.ranks.length - 1) return;
        j.r++; j.perf = 0; j.noted = false;
        L.stats.promos++; promotionCount = L.stats.promos;
        L.best[j.c] = Math.max(L.best[j.c] || 0, j.r);
        addScore(250 + 50 * j.r);
        boostHappy(8);
        logMessage(`🎊 PROMOTED to ${C.ranks[j.r][0]}! New Salary: ${money(weeklyWage())}/wk`, 'boost-alert');
        toast(`🎊 Promoted to ${C.ranks[j.r][0]}!`, 'good');
        addTimeline('📈', 'Promoted to ' + C.ranks[j.r][0]);
        if (j.r === C.ranks.length - 1) {
            addScore(1000);
            logMessage(`👑 You reached the top of ${C.name}! +1000 Life Score`, 'boost-alert');
            addTimeline('👑', `Reached the top of ${C.name}`);
        }
        markDirty();
    }
    function setStyle(i) { if (STYLES[i]) { L.style = i; changed(); } }

    // ===================== MONEY: LOANS, PAY, BILLS =====================
    function loanPayment(bal, rate, n) { return Math.round(bal * rate / (1 - Math.pow(1 + rate, -n))); }
    function makeLoan(bal, T, label) { return { bal: bal, rate: T.rate, n: T.n, pay: loanPayment(bal, T.rate, T.n), label }; }
    function loanMonth(l) {
        if (!l || l.n <= 0) return 0;
        const interest = l.bal * l.rate;
        let pay = Math.min(l.pay, l.bal + interest);
        l.bal = l.bal + interest - pay; l.n--;
        if (l.bal < 1 || l.n <= 0) { pay += Math.max(0, l.bal); l.bal = 0; l.n = 0; }
        return pay;
    }
    // expected weekly business income (for forecasts): the corporation track plus each business at its current settings
    function weeklyBiz() {
        let t = corpProfit(true);
        for (const f of L.firms) t += firmCalc(f).net;
        return Math.round(t);
    }
    function spousePay() { return L.rel.s === 'married' && L.rel.p ? L.rel.p.pay : 0; }
    function stipend() { return L.school && PROGRAMS[L.school.id].stipend || 0; }
    function weeklyIncome() { return weeklyWage() + spousePay() + stipend() + weeklyBiz(); }

    function payday() {
        let wage = 0;
        if (L.job) {
            wage = weeklyWage();
            if (CAREERS[L.job.c].volatile) wage = Math.round(wage * rnd(0.3, 1.8));
            if (L.skipPay) { wage = 0; L.skipPay = 0; logMessage('🏖️ Unpaid week off: no salary this week'); }
        }
        const corp = corpProfit(false), firms = firmsWeek(), sp = spousePay(), st = stipend();
        const pay = wage + corp + sp + st;
        cash += pay + firms;
        L.monthIncome += wage + corp + firms + st;
        L.stats.earned += Math.max(0, pay + firms);
        if (pay > 0) logMessage(`💰 WEEKLY PAY: +${money(pay)}${sp ? ` (incl. ${L.rel.p.name} ${money(sp)})` : ''}`, 'salary-alert');
        if (L.firms.length) logMessage(`🏪 Businesses this week: ${firms >= 0 ? '+' : ''}${money(firms)}`, firms >= 0 ? 'salary-alert' : 'tax-alert');
    }

    // ===================== BUSINESSES (2.0) =====================
    // how the economy treats a sector right now (bull/bear market and sector news): about 0.65x to 1.35x
    function econ(sec) { const M = L.mkt; return clamp(1 + REGIMES[M.reg].econ + (M.sec[sec] || 0) * 8, 0.65, 1.35); }
    function biz1Profit() { return BIZ1_INIT_PROFIT + (biz1Level - 1) * BIZ1_LVL_PROFIT; }
    function biz2Profit() { return BIZ2_INIT_PROFIT + (biz2Level - 1) * BIZ2_LVL_PROFIT; }
    // the 1.x corporation track (passive). roll = this week's actual result, otherwise the expected one
    function corpProfit(exp) {
        let p = 0;
        if (hasBiz1) p += biz1Profit() * econ('tech') * (exp ? 1 : rnd(0.85, 1.15));
        if (hasBiz2) p += biz2Profit() * econ('finance') * (exp ? 1 : rnd(0.85, 1.15));
        return Math.round(p);
    }
    function emptyMo() { return { sales: 0, wages: 0, mgr: 0, rent: 0, mkt: 0, extra: 0, net: 0, cust: 0, lost: 0, wks: 0 }; }
    function maxEmp(f) { return Math.round(BIZ[f.t].per * 1.6 * Math.pow(1.5, f.lvl - 1)); }
    function upgCost(f) { return Math.round(BIZ[f.t].cost * 0.8 * Math.pow(1.6, f.lvl - 1) / 10) * 10; }
    function degBonus(T) { return T.deg && T.deg.some(hasTok) ? 1.25 : 1; }
    function fixFirm(f) {
        const T = BIZ[f.t];
        f.lvl = clamp(Math.floor(+f.lvl || 1), 1, T.maxL);
        f.emp = clamp(Math.floor(+f.emp || 0), 0, maxEmp(f));
        f.mk = clamp(Math.floor(+f.mk || 0), 0, MKT_TIERS.length - 1);
        f.mgr = !!f.mgr;
        f.rep = clamp(Number.isFinite(+f.rep) ? +f.rep : 50, 0, 100);
        f.inv = Math.max(0, +f.inv || T.cost);
        if (!f.mo || typeof f.mo !== 'object') f.mo = emptyMo();
        for (const k in emptyMo()) if (!Number.isFinite(+f.mo[k])) f.mo[k] = 0;
        if (!Array.isArray(f.hist)) f.hist = [];
        if (!f.wk || typeof f.wk !== 'object') f.wk = null;
        if (!f.last || typeof f.last !== 'object') f.last = null;
        if (f.fx && !(f.fx.w > 0 && f.fx.m > 0)) f.fx = null;
        if (!f.nm) f.nm = T.name;
        return f;
    }
    // one week of a business. Demand comes from size, marketing, reputation and the economy;
    // you can only serve as many customers as your staff can handle (you count as a worker without a manager).
    function firmCalc(f, roll) {
        const T = BIZ[f.t], lv = f.lvl, mk = MKT_TIERS[f.mk];
        let dem = T.dem * Math.pow(1.5, lv - 1) * (1 + mk.boost / (1 + 0.1 * (lv - 1))) * (0.5 + f.rep / 100) * econ(T.sec);
        if (f.fx) dem *= f.fx.m;
        if (roll) dem *= rnd(1 - T.vol, 1 + T.vol);
        const cap = (f.emp + (f.mgr ? 0 : 1)) * T.cap;
        const served = Math.min(dem, cap);
        const sales = served * T.mar * Math.pow(1.08, lv - 1) / (1 + 0.075 * (lv - 1)) * (f.mgr ? 1.2 : 1) * degBonus(T);   // big firms hit diminishing returns (competition, overhead)
        const scale = 1 + 0.06 * (lv - 1), wages = f.emp * T.wage * scale, mgr = f.mgr ? T.mgrW * scale : 0, rent = T.rent * (1 + 0.6 * (lv - 1)), mkt = T.mkU * mk.cost;
        return { dem, cap, served, sales, wages, mgr, rent, mkt, net: sales - wages - mgr - rent - mkt };
    }
    // reputation drifts toward how well you serve customers (long lines hurt, a manager helps)
    function repTarget(f, r) { const ratio = r.dem > 0 ? r.served / r.dem : 1; return clamp(25 + 55 * ratio * ratio + (f.mgr ? 10 : 0) + f.lvl * 2, 0, 100); }
    function firmWeek(f) {
        const r = firmCalc(f, true);
        f.rep = clamp(f.rep + (repTarget(f, r) - f.rep) * 0.25, 0, 100);
        if (f.fx && --f.fx.w <= 0) f.fx = null;
        f.wk = { net: Math.round(r.net), cust: Math.round(r.served), dem: Math.round(r.dem) };
        const m = f.mo;
        m.sales += r.sales; m.wages += r.wages; m.mgr += r.mgr; m.rent += r.rent; m.mkt += r.mkt; m.net += r.net;
        m.cust += r.served; m.lost += r.dem - r.served; m.wks++;
        return r.net;
    }
    function firmsWeek() {
        let t = 0;
        for (const f of L.firms) t += firmWeek(f);
        if (L.firms.length) dirty.biz = true;
        return Math.round(t);
    }
    // monthly report for every business (with the bills)
    function firmsReport() {
        for (const f of L.firms) {
            const m = f.mo; if (!m.wks) continue;
            const T = BIZ[f.t];
            f.last = { sales: Math.round(m.sales), wages: Math.round(m.wages), mgr: Math.round(m.mgr), rent: Math.round(m.rent), mkt: Math.round(m.mkt), extra: Math.round(m.extra), net: Math.round(m.net + m.extra), cust: Math.round(m.cust), lost: Math.round(m.lost), wks: m.wks, rep: Math.round(f.rep), age: L.age };
            f.hist.push(f.last.net); if (f.hist.length > 12) f.hist.shift();
            if (f.last.net > L.stats.bestMonth) L.stats.bestMonth = f.last.net;
            f.mo = emptyMo();
            logMessage(`📊 ${T.icon} ${f.nm} report: ${f.last.net >= 0 ? '+' : ''}${money(f.last.net)} profit, ${num(f.last.cust)} customers${f.last.lost >= 1 ? `, ${num(f.last.lost)} turned away` : ''}`, f.last.net >= 0 ? 'salary-alert' : 'tax-alert');
            L.bizNew = true;
        }
        if (L.firms.length) dirty.biz = true;
    }
    // what a buyer would pay: 60% of what you put in plus ~15 weeks of recent profit
    function firmValue(f) {
        let s = 0, n = 0;
        for (let i = Math.max(0, f.hist.length - 3); i < f.hist.length; i++) { s += f.hist[i]; n++; }
        const wk = n ? s / n / 4.3 : (f.wk ? f.wk.net : 0);
        return Math.round((0.6 * f.inv + Math.max(0, wk) * 15) / 10) * 10;
    }
    function firmsValue() { let v = 0; for (const f of L.firms) v += firmValue(f); return v; }
    function staffCount() { let n = 0; for (const f of L.firms) n += f.emp + (f.mgr ? 1 : 0); return n; }
    function unmanaged() { let n = 0; for (const f of L.firms) if (!f.mgr) n++; return n; }
    function firmProblems(t) {
        const T = BIZ[t], out = [];
        if (L.age < T.minAge) out.push(`age ${T.minAge}+`);
        if (T.req && !meets(T.req)) out.push(reqText(T.req));
        return out;
    }
    function canStartFirm(t) { return L.phase === 'play' && L.firms.length < MAX_FIRMS && !L.firms.some(f => f.t === t) && !firmProblems(t).length; }
    function startFirm(t) {
        const T = BIZ[t]; if (!T || !canStartFirm(t) || cash < T.cost) return;
        cash -= T.cost;
        const f = fixFirm({ t, nm: `${L.name}'s ${T.name}`, lvl: 1, emp: 0, mgr: false, mk: 0, rep: 50, inv: T.cost, d0: day });
        f.emp = clamp(Math.ceil(firmCalc(f).dem / T.cap) - 1, 0, maxEmp(f));   // a starting crew that roughly matches demand
        L.firms.push(f);
        L.stats.firms++;
        const key = 'biz:' + t, first = !L.ownedTypes[key];
        if (first) { L.ownedTypes[key] = 1; addScore(T.score); }
        boostHappy(6);
        logMessage(`🏪 Opened ${f.nm} with ${plural(f.emp, 'employee')}!${first ? ` +${num(T.score)} Life Score` : ''}`, 'boost-alert');
        toast(`${T.icon} Your ${T.name} is open for business!`, 'good');
        addTimeline(T.icon, `Opened a ${T.name}`);
        changed();
    }
    function hireEmp(i) { const f = L.firms[+i]; if (!f || f.emp >= maxEmp(f)) return; f.emp++; changed(); }
    function fireEmp(i) {
        const f = L.firms[+i]; if (!f || f.emp <= 0) return;
        const sev = BIZ[f.t].wage;
        f.emp--; cash -= sev; f.mo.extra -= sev;
        logMessage(`👋 Let an employee go at ${f.nm} (severance ${money(sev)})`);
        changed();
    }
    function toggleMgr(i) {
        const f = L.firms[+i]; if (!f) return;
        f.mgr = !f.mgr;
        logMessage(f.mgr ? `🧑‍💼 Hired a manager for ${f.nm} (${money(BIZ[f.t].mgrW)}/wk)` : `🧑‍💼 You run ${f.nm} yourself again`);
        changed();
    }
    function setMkt(arg) {
        const p = String(arg).split(':'), f = L.firms[+p[0]], t = +p[1];
        if (!f || !MKT_TIERS[t] || f.mk === t) return;
        f.mk = t;
        logMessage(`📣 ${f.nm} marketing: ${MKT_TIERS[t].icon} ${MKT_TIERS[t].name}${t ? ` (${money(BIZ[f.t].mkU * MKT_TIERS[t].cost)}/wk)` : ''}`);
        changed();
    }
    function upgradeFirm(i) {
        const f = L.firms[+i]; if (!f) return;
        const T = BIZ[f.t];
        if (f.lvl >= T.maxL) return;
        const c = upgCost(f); if (cash < c) return;
        cash -= c; f.lvl++; f.inv += c;
        const pts = Math.round(T.score * 0.3);
        addScore(pts);
        logMessage(`🏗️ ${f.nm} upgraded to level ${f.lvl}! +${num(pts)} Life Score`, 'boost-alert');
        toast(`🏗️ ${T.name} is now level ${f.lvl}`, 'good');
        changed();
    }
    function sellFirm(i) {
        const f = L.firms[+i]; if (!f) return;
        const v = firmValue(f), T = BIZ[f.t];
        confirmBox(T.icon, `Sell ${esc(f.nm)}?`, `A buyer will pay <b>${money(v)}</b> (60% of the ${money(f.inv)} you put in, plus about 15 weeks of recent profit). Your staff stay with the new owner.`, 'Sell it', () => {
            const j = L.firms.indexOf(f); if (j < 0) return;
            L.firms.splice(j, 1); cash += v;
            logMessage(`🏷️ Sold ${f.nm} for ${money(v)}`, 'salary-alert');
            addTimeline('🏷️', `Sold the ${T.name}`);
            changed();
        });
    }

    function residence() {
        const p = L.props.find(x => x.live);
        return p ? { own: true, p, d: HOMES[p.id] } : { own: false, id: L.rent, d: RENTALS[L.rent] || RENTALS.parents };
    }
    function livingWithParents() { return !L.props.some(x => x.live) && L.rent === 'parents'; }
    function kidsHome() { let n = 0; for (const k of L.rel.kids) if (!k.grown) n++; return n; }
    function roomsNeeded() { return 1 + Math.ceil(kidsHome() / 2); }
    function crowded() { return roomsNeeded() > residence().d.rooms; }
    function homePrice(id) { return Math.round(HOMES[id].price * L.hIdx / 10) * 10; }
    function rentIncome(p) { return Math.round(p.value * 0.007); }
    function carValue() { return L.car ? Math.round(L.car.value * (0.5 + L.car.cond / 200)) : 0; }
    function carEquity() { return L.car ? carValue() - (L.car.loan ? L.car.loan.bal : 0) : 0; }
    function repairCost() { return L.car ? Math.round((100 - L.car.cond) * CARS[L.car.id].price * 0.0006 + 20) : 0; }

    // one month's bills; tax is based on what you actually earned this month (estimate for the forecast)
    function billLines(income) {
        const out = [];
        const add = (k, v) => { v = Math.round(v); if (v) out.push([k, v]); };
        if (L.age >= 18 && income > 0) add('Taxes', 0.10 * income + Math.min(MONTHLY_TAX * 0.5, 0.10 * income));
        if (!L.props.some(p => p.live) && L.rent) add('Rent', RENTALS[L.rent].rent);
        let mort = 0, upkeep = 0, rentIn = 0;
        for (const p of L.props) { if (p.loan) mort += p.loan.pay; upkeep += p.value * 0.003; if (!p.live) rentIn += rentIncome(p); }
        add('Mortgage', mort); add('Home upkeep', upkeep); add('Rental income', -rentIn);
        if (L.car) { add('Car upkeep', CARS[L.car.id].upkeep); if (L.car.loan) add('Car loan', L.car.loan.pay); }
        else if (L.age >= 16) add('Bus pass', 30);
        add('Food & living', livingWithParents() ? 20 : 60);
        add('Kids', kidsHome() * 80);
        let pets = 0; for (const p of L.rel.pets) pets += PETS[p.t].cost; add('Pets', pets);
        let subs = 0; for (const k in L.subs) if (L.subs[k] && SUBS[k]) subs += SUBS[k].cost; add('Subscriptions', subs);
        if (L.loans.student && L.loans.student.n > 0) add('Student loan', L.loans.student.pay);
        return out;
    }
    function sumLines(lines) { let t = 0; for (const l of lines) t += l[1]; return t; }

    function payBills() {
        bankMonth();      // interest first, so it is taxed with this month's income
        firmsReport();
        const lines = billLines(L.monthIncome);
        // loans are paid through loanMonth so balances go down (forecast lines used the flat payment)
        let total = 0;
        for (const [k, v] of lines) if (k !== 'Mortgage' && k !== 'Car loan' && k !== 'Student loan') total += v;
        for (const p of L.props) if (p.loan) {
            total += loanMonth(p.loan);
            if (p.loan.bal <= 0) { p.loan = null; logMessage(`🏠 Mortgage on your ${HOMES[p.id].name} is PAID OFF!`, 'boost-alert'); addTimeline('🔑', 'Paid off the ' + HOMES[p.id].name); addScore(300); L.stats.paidOff = (L.stats.paidOff || 0) + 1; markDirty(); }
        }
        if (L.car && L.car.loan) { total += loanMonth(L.car.loan); if (L.car.loan.bal <= 0) { L.car.loan = null; logMessage('🚗 Car loan paid off!', 'boost-alert'); markDirty(); } }
        const sl = L.loans.student;
        if (sl && sl.n > 0) { total += loanMonth(sl); if (sl.bal <= 0) { L.loans.student = null; logMessage('🎓 Student loan PAID OFF!', 'boost-alert'); addTimeline('🎉', 'Paid off student loans'); addScore(200); markDirty(); } }
        total = Math.round(total);
        cash -= total;
        L.monthIncome = 0;
        const tax = (lines.find(l => l[0] === 'Taxes') || [0, 0])[1];
        logMessage(`⚖️ MONTHLY BILLS: -${money(total)}${tax ? ` (taxes ${money(tax)})` : ''}`, 'tax-alert');
        if (cash < 0 && L.bank.sav > 0) {   // overdraft protection from your savings account
            const t = Math.min(L.bank.sav, -cash);
            L.bank.sav -= t; L.bank.min = Math.min(L.bank.min, L.bank.sav); cash += t;
            logMessage(`🏦 Moved ${money(t, 2)} from savings to cover your bills`, 'boost-alert');
        }
        if (cash < 0) {
            L.debtMonths++;
            logMessage(`⚠️ You are in debt (${money(cash)}). Cut costs or sell something! (${L.debtMonths}/4)`, 'tax-alert');
            if (L.debtMonths >= 4) bankruptcy();
        } else L.debtMonths = 0;
        markDirty();
    }
    function bankruptcy() {
        // the bank sells your investments first; if that covers the debt, you keep your car and home
        const inv = liquidate();
        if (inv > 0) {
            logMessage(`💸 The bank sold your savings, bonds and investments (${money(inv)}) to cover your debts.`, 'tax-alert');
            if (cash >= 0) { L.debtMonths = 0; boostHappy(-8); toast('💸 Your investments were sold to pay your debts', 'bad'); markDirty(); return; }
        }
        let raised = 0;
        if (L.car) { raised += carEquity(); L.car = null; }
        for (let i = L.props.length - 1; i >= 0; i--) { const p = L.props[i]; raised += Math.round(p.value * 0.85) - (p.loan ? p.loan.bal : 0); }
        L.props = [];
        cash += raised;
        if (!RENTALS[L.rent] || L.rent !== 'parents') L.rent = L.age >= 25 ? 'room' : 'parents';
        if (cash < 0) {
            // the leftover debt becomes a bank loan (carried in the loan slot) instead of vanishing
            const d = Math.ceil(-cash), l = L.loans.student;
            if (l && l.bal > 0) { l.bal += d; l.n = Math.max(l.n, 120); l.pay = loanPayment(l.bal, l.rate, l.n); }
            else L.loans.student = makeLoan(d, STUDENT_LOAN, 'Bank Debt');
            cash = 0;
            logMessage(`🏦 The bank turned your leftover ${money(d)} debt into a loan.`, 'tax-alert');
        }
        L.debtMonths = 0;
        addScore(-500); boostHappy(-25);
        logMessage('💥 BANKRUPT! Your car and properties were sold to pay your debts. -500 Life Score', 'tax-alert');
        addTimeline('💥', 'Went bankrupt');
        toast('💥 Bankruptcy! Assets sold to cover debts.', 'bad');
        markDirty();
    }

    function netWorth() {
        let nw = cash;
        for (const s of stocks) nw += s.price * s.owned;
        nw += indexStock.price * indexStock.owned;
        nw += L.bank.sav + bondValue() + firmsValue();
        for (const p of L.props) nw += p.value - (p.loan ? p.loan.bal : 0);
        nw += carEquity();
        if (L.loans.student) nw -= L.loans.student.bal;
        return nw;
    }

    // ===================== MARKET ENGINE (2.0) =====================
    // Every price wanders around a "fair value" that grows (or shrinks) a little each day. News, booms and
    // crashes push prices away from it and they drift back, so a 50-year life never runs off to infinity.
    function rp(p) { return p >= 100 ? Math.round(p * 10) / 10 : p >= 1 ? Math.round(p * 100) / 100 : +p.toPrecision(3); }
    function px(p) { return p >= 1000 ? money(p) : p >= 1 ? money(p, 2) : '$' + (p >= 0.01 ? p.toFixed(4) : p.toPrecision(2)); }
    function pct(a, b) { return b > 0 ? (a / b - 1) * 100 : 0; }
    function pctTxt(v) { return (v >= 0 ? '▲ ' : '▼ ') + Math.abs(v).toFixed(Math.abs(v) < 10 ? 2 : 1) + '%'; }
    function isCrypto(s) { return SDEF[s.id] && SDEF[s.id].sec === 'crypto'; }
    function secOf(s) { return SDEF[s.id] ? SDEF[s.id].sec : 'tech'; }
    function unitWord(s, n) { return isCrypto(s) ? (n === 1 ? 'coin' : 'coins') : (n === 1 ? 'share' : 'shares'); }

    // a few years of made-up history so charts are never empty (walks backwards from today's price)
    function backfill(s) {
        const D = SDEF[s.id];
        const v = (D.v || 0.025) * 0.45, g = D.sec === 'fund' ? 0.0003 : D.gd;
        const h = new Array(H_DAYS), hl = new Array(40);
        let x = Math.log(s.price);
        for (let i = H_DAYS - 1; i >= 0; i--) { h[i] = rp(Math.exp(x)); x -= g + (Math.random() - 0.5) * 2 * v; }
        x = Math.log(s.price);
        const vl = v * Math.sqrt(HL_STEP) * 0.7;
        for (let i = hl.length - 1; i >= 0; i--) { hl[i] = rp(Math.exp(x)); x -= g * HL_STEP + (Math.random() - 0.5) * 2 * vl; }
        s.h = h; s.hl = hl;
    }
    function fixStock(s) {
        let D = SDEF[s.id];
        if (!D) D = SDEF[s.id] = { id: s.id, name: String(s.name || s.id), sec: 'tech', p: +s.price || 10, v: clamp(+s.volatility || 0.03, 0.005, 0.3), g: 0.5, y: 0, d: 'A stock from an older version of the game.', gd: 0.00017 };
        s.name = D.name;
        if (D.sec !== 'fund') s.volatility = D.v;
        if (!(s.price > 0) || !Number.isFinite(s.price)) s.price = D.p;
        if (!(s.prevPrice > 0) || !Number.isFinite(s.prevPrice)) s.prevPrice = s.price;
        s.owned = Math.max(0, Math.floor(+s.owned || 0));
        if (!(s.fv > 0) || !Number.isFinite(s.fv)) { s.fv = s.price; s.trend = 0; }   // 1.x trends were permanent; now trend is a short news drift
        if (!Number.isFinite(+s.trend)) s.trend = 0;
        if (!(s.cost >= 0) || !s.owned) s.cost = s.owned ? s.owned * s.price : 0;    // unknown cost basis: today's price
        if (!Array.isArray(s.h) || s.h.length < 2 || !Array.isArray(s.hl) || !s.hl.length) backfill(s);
        if (s.tip && !(s.tip.days > 0)) delete s.tip;
        while (s.price >= SPLIT_AT && D.sec !== 'crypto') split(s, true);
        return s;
    }
    // make sure every asset exists (old saves had 10 stocks), in catalogue order; unknown stocks are kept
    function fixMarket() {
        if (!indexStock || typeof indexStock !== 'object') indexStock = { id: 'TOP2', name: 'TOP2 Index', price: 450, prevPrice: 450, owned: 0 };
        indexStock.id = 'TOP2'; indexStock.isIndex = true;
        fixStock(indexStock);
        const old = Array.isArray(stocks) ? stocks.filter(s => s && typeof s === 'object' && s.id && s.id !== 'TOP2') : [];
        const out = [];
        for (const a of STOCK_DEFS) {
            if (a[0] === 'TOP2') continue;
            const i = old.findIndex(s => s.id === a[0]);
            out.push(fixStock(i >= 0 ? old.splice(i, 1)[0] : { id: a[0], price: a[3], prevPrice: a[3], owned: 0, volatility: a[4], trend: 0 }));
        }
        for (const s of old) if (!out.some(x => x.id === s.id)) out.push(fixStock(s));
        stocks = out;
    }
    function split(s, quiet) {
        s.price /= 10; s.prevPrice /= 10; s.fv /= 10; s.owned *= 10;
        for (let i = 0; i < s.h.length; i++) s.h[i] = rp(s.h[i] / 10);
        for (let i = 0; i < s.hl.length; i++) s.hl[i] = rp(s.hl[i] / 10);
        if (L && L.mkt) for (const o of L.mkt.orders) if (o.id === s.id) { o.px = rp(o.px / 10); o.n *= 10; }
        if (!quiet) addNews('📣', `${s.name} splits its stock 10-for-1 (now ${px(s.price)})`, 0, s.id, s.owned > 0);
    }

    function addNews(icon, text, up, ref, loud) {
        const M = L.mkt;
        M.news.unshift([day, icon, text, up, ref || '']);
        if (M.news.length > 12) M.news.length = 12;
        // only log what matters to you: your holdings, the whole market, or big moments
        let mine = !!loud || ref === '*';
        if (!mine && ref) {
            if (SDEF[ref]) { const s = stockById(ref); mine = !!(s && s.owned > 0); }
            else for (const x of stocks) if (x.owned > 0 && secOf(x) === ref) { mine = true; break; }
        }
        if (mine) logMessage(`📰 ${icon} ${text}`, 'news-alert');
        dirty.market = true;
    }
    function nextRegime() {
        const M = L.mkt, r = Math.random();
        const next = M.reg === 'bull' ? (r < 0.6 ? 'calm' : 'bear') : M.reg === 'bear' ? (r < 0.5 ? 'calm' : 'bull') : (r < 0.55 ? 'bull' : 'bear');
        const R = REGIMES[next];
        M.reg = next; M.regD = rint(R.days[0], R.days[1]);
        addNews(R.icon, next === 'bull' ? 'Analysts say a bull market has begun' : next === 'bear' ? 'Stocks slide into a bear market' : 'Markets calm down after a wild run', next === 'bull' ? 1 : next === 'bear' ? -1 : 0, '*');
    }
    function crash() {
        const M = L.mkt;
        M.reg = 'bear'; M.regD = rint(60, 150); M.crashes++;
        for (const s of stocks) {
            const D = SDEF[s.id]; if (D.sec === 'fund') continue;
            const hit = D.haven ? rnd(0.03, 0.08) : D.sec === 'crypto' ? -rnd(0.3, 0.5) : -rnd(0.15, 0.3);
            s.price = Math.max(D.sec === 'crypto' ? 0.0001 : 0.5, s.price * (1 + hit));
            s.fv *= 1 + hit * 0.4;
        }
        if (assetValue('stocks') > 0) M.dh = day + 30;
        addNews('💥', 'MARKET CRASH! Panic selling everywhere', -1, '*', true);
        toast('💥 Market crash! Stocks are tumbling', 'bad');
    }
    function marketNews() {
        const M = L.mkt, N = pick(NEWS), sec = N[0], up = N[2], cr = sec === 'crypto';
        if (N[1]) {
            const pool = [];
            for (const s of stocks) { const k = secOf(s); if (k !== 'fund' && (sec === '*' ? k !== 'crypto' : k === sec)) pool.push(s); }
            if (!pool.length) return;
            const s = pick(pool), j = up * rnd(0.05, 0.13) * (cr ? 2 : 1);
            s.price = Math.max(cr ? 0.0001 : 0.5, s.price * (1 + j));
            s.fv *= 1 + j * 0.6;
            s.trend += up * (cr ? 0.012 : 0.006);
            addNews(SECTORS[secOf(s)].icon, N[3].replace('{N}', s.name), up, s.id);
        } else {
            for (const s of stocks) {
                const k = secOf(s);
                if (k === 'fund' || (sec === '*' ? k === 'crypto' || SDEF[s.id].haven : k !== sec)) continue;
                const j = up * rnd(0.015, 0.045) * (cr ? 2.5 : 1);
                s.price = Math.max(cr ? 0.0001 : 0.5, s.price * (1 + j));
                s.fv *= 1 + j * 0.5;
            }
            if (sec === '*') { for (const k of STOCK_SECTORS) M.sec[k] = (M.sec[k] || 0) + up * 0.002; }
            else M.sec[sec] = (M.sec[sec] || 0) + up * (cr ? 0.01 : 0.004);
            addNews(sec === '*' ? '🌎' : SECTORS[sec].icon, N[3], up, sec);
        }
    }
    function recordHist(s) {
        if (s.price >= SPLIT_AT && !isCrypto(s)) split(s);
        s.h.push(rp(s.price)); if (s.h.length > H_DAYS) s.h.shift();
        if (day % HL_STEP === 0) { s.hl.push(rp(s.price)); if (s.hl.length > HL_MAX) s.hl.shift(); }
    }
    // one market day (called from simDay)
    function stepMarket() {
        const M = L.mkt;
        indexStock.prevPrice = indexStock.price;
        for (const s of stocks) s.prevPrice = s.price;
        if (--M.regD <= 0) nextRegime();
        if (day > 30 && M.reg !== 'bear' && Math.random() < 1 / 900) crash();
        else if (Math.random() < 0.16) marketNews();
        const R = REGIMES[M.reg];
        let sum = 0, n = 0, a = null, b = null;
        for (const s of stocks) {
            const D = SDEF[s.id];
            if (D.sec === 'fund') continue;
            const cr = D.sec === 'crypto';
            const mult = Math.random() > 0.98 ? 1.4 : (Math.random() < 0.02 ? 0.6 : 1);
            let ch = (Math.random() - 0.5) * 2 * s.volatility * mult * R.vol;
            ch += (cr ? 0.02 : 0.03) * Math.log(s.fv / s.price);
            ch += s.trend + (M.sec[D.sec] || 0);
            if (s.tip) {
                ch += s.tip.dir > 0 ? 0.08 : -0.07;
                s.fv *= s.tip.dir > 0 ? 1.06 : 0.95;
                if (--s.tip.days <= 0) { logMessage(s.tip.dir > 0 ? `📈 That tip on ${s.name} was RIGHT!` : `📉 That tip on ${s.name} was bogus!`, s.tip.dir > 0 ? 'salary-alert' : 'tax-alert'); delete s.tip; }
            }
            s.price = Math.max(cr ? 0.0001 : 0.5, s.price * (1 + ch));
            let g = D.gd + (D.haven ? -R.drift * 0.6 : R.drift * (cr ? 2 : 1));
            if (cr) g += (Math.random() - 0.5) * 0.05;
            s.fv = Math.max(cr ? 0.0001 : 0.5, s.fv * (1 + g));
            s.trend = Math.abs(s.trend) < 1e-5 ? 0 : s.trend * 0.85;
            if (!cr) {
                s.cf = (s.cf > 0 ? s.cf : 1) * (s.price / s.prevPrice); sum += s.cf; n++;
                // rank by yesterday's price so today's move can't pick the winners
                if (!a || s.prevPrice > a.prevPrice) { b = a; a = s; } else if (!b || s.prevPrice > b.prevPrice) b = s;
            }
        }
        for (const k in M.sec) M.sec[k] = Math.abs(M.sec[k]) < 1e-5 ? 0 : M.sec[k] * 0.88;
        const mk = stockById('MKT');
        // the fund is a price level: base price x average split-adjusted growth of its stocks (no daily-rebalancing compounding)
        if (mk && n) { if (!(mk.mb > 0)) { mk.mb = mk.price; for (const s of stocks) if (SDEF[s.id].sec !== 'fund' && SDEF[s.id].sec !== 'crypto') s.cf = 1; sum = n; } mk.price = Math.max(0.5, mk.mb * sum / n); }
        // TOP2 follows the daily moves of the two most expensive stocks (so it never jumps when they change)
        if (a && b) indexStock.price = Math.max(0.5, indexStock.price * (1 + (a.price / a.prevPrice + b.price / b.prevPrice - 2) / 2));
        recordHist(indexStock);
        for (const s of stocks) recordHist(s);
        checkOrders();
        bondsDay();
        if (day % 30 === 15) payDividends();
        if (M.dh && day >= M.dh) { M.dh = 0; if (assetValue('stocks') > 0) M.held = true; }
    }

    function divYield(s) { return SDEF[s.id] ? SDEF[s.id].y : 0; }
    function payDividends() {
        let tot = 0, n = 0;
        const add = s => { if (s.owned > 0 && divYield(s) > 0) { tot += s.owned * s.price * divYield(s) / 100; n++; } };
        add(indexStock);
        for (const s of stocks) add(s);
        tot = Math.round(tot * 100) / 100;
        if (tot < 0.01) return;
        cash += tot; L.monthIncome += tot; L.mkt.divs += tot; L.stats.earned += tot;
        logMessage(`💵 DIVIDENDS: +${money(tot, 2)} from ${plural(n, 'holding')}`, 'salary-alert');
    }

    // ---------- trading ----------
    function feeRate(s) { return isCrypto(s) ? CRYPTO_FEE : 0; }
    function maxBuy(s) { return Math.floor(Math.max(0, cash) / (s.price * (1 + feeRate(s))) + 1e-9); }
    function tradeN(s, buy) { const q = L.mkt.qty; return buy ? Math.min(q || Infinity, maxBuy(s)) : Math.min(q || s.owned, s.owned); }
    function assetValue(kind) {   // undefined = stocks + crypto, 'crypto', or 'stocks' (stocks and funds)
        let v = kind === 'crypto' ? 0 : indexStock.price * indexStock.owned;
        for (const s of stocks) {
            if (!s.owned) continue;
            const cr = isCrypto(s);
            if (kind === 'crypto' ? cr : kind === 'stocks' ? !cr : true) v += s.price * s.owned;
        }
        return v;
    }
    function sectorsHeld() {
        let n = 0; const seen = {};
        for (const s of stocks) if (s.owned > 0) { const k = secOf(s); if (STOCK_SECTORS.includes(k) && !seen[k]) { seen[k] = 1; n++; } }
        return n;
    }

    // ---------- limit orders ----------
    const ORDER_TYPES = {
        buy: { name: 'Limit buy', icon: '🟢', verb: 'Buy', help: 'Buys when the price drops to your price or lower.' },
        tp:  { name: 'Take profit', icon: '🎯', verb: 'Sell', help: 'Sells when the price climbs to your price or higher.' },
        sl:  { name: 'Stop loss', icon: '🛡️', verb: 'Sell', help: 'Sells when the price falls to your price or lower, to limit a loss.' }
    };
    function orderHit(o, s) { return o.k === 'tp' ? s.price >= o.px : s.price <= o.px; }
    function checkOrders() {
        const O = L.mkt.orders;
        for (let i = O.length - 1; i >= 0; i--) {
            const o = O[i], s = stockById(o.id);
            if (!s) { O.splice(i, 1); continue; }
            if (!orderHit(o, s)) continue;
            O.splice(i, 1);
            dirty.market = true;
            const T = ORDER_TYPES[o.k];
            const n = o.k === 'buy' ? buyStock(o.id, o.n, true) : sellStock(o.id, o.n, true);
            if (!n) { logMessage(`📝 ${T.name} on ${s.id} cancelled: ${o.k === 'buy' ? 'not enough cash' : 'no shares left to sell'}`, 'tax-alert'); continue; }
            L.mkt.fills++;
            if (o.k === 'sl') L.mkt.stops++;
            const msg = `${T.icon} ${T.name} filled: ${T.verb.toLowerCase()} ${num(n)} ${s.id} at ${px(s.price)}`;
            logMessage(msg, o.k === 'buy' ? 'boost-alert' : 'salary-alert');
            toast(msg, o.k === 'sl' ? 'bad' : 'good');
        }
    }
    function cancelOrder(i) {
        const o = L.mkt.orders[+i]; if (!o) return;
        L.mkt.orders.splice(+i, 1);
        logMessage(`📝 Cancelled ${ORDER_TYPES[o.k].name.toLowerCase()} on ${o.id}`);
        changed();
    }
    let ordSel = null;
    function orderDefaults(k, s) {
        const p = rp(k === 'buy' ? s.price * 0.95 : k === 'tp' ? s.price * 1.1 : s.price * 0.9);
        const n = k === 'buy' ? Math.max(1, Math.min(L.mkt.qty || Infinity, Math.floor(Math.max(0, cash) / p) || 1)) : Math.max(1, Math.min(L.mkt.qty || s.owned, s.owned));
        return { px: p, n: n === Infinity ? 1 : n };
    }
    function openOrder(id) {
        const s = stockById(id); if (!s || L.phase !== 'play') return;
        if (L.mkt.orders.length >= MAX_ORDERS) { toast(`You can have ${MAX_ORDERS} open orders at most`, 'bad'); return; }
        const k = s.owned > 0 ? 'tp' : 'buy', d = orderDefaults(k, s);
        ordSel = { id, k };
        let h = `<div class="ev-icon">📝</div><h2>Order: ${esc(s.name)}</h2>
            <p class="center muted">${s.id} is at <b>${px(s.price)}</b> · you own ${num(s.owned)} · cash ${money(cash)}</p>
            <label class="lbl">Order type</label><div class="style-pick">`;
        for (const t in ORDER_TYPES) { const T = ORDER_TYPES[t]; h += `<button data-act="ordType" data-arg="${t}" class="${t === k ? 'on' : ''}"${t !== 'buy' && !s.owned ? ' disabled' : ''}><b>${T.icon} ${T.name}</b><small>${T.help}</small></button>`; }
        h += `</div><label class="lbl" for="ord-px">Trigger price ($)</label><input id="ord-px" type="number" min="0" step="any" value="${d.px}">
            <div class="pct-row">${[-20, -10, -5, -1, 1, 5, 10, 20].map(p => `<button class="btn gray" data-act="ordPct" data-arg="${p}">${p > 0 ? '+' : ''}${p}%</button>`).join('')}</div>
            <label class="lbl" for="ord-n">How many ${unitWord(s, 2)}</label><input id="ord-n" type="number" min="1" step="1" value="${d.n}">
            <p class="outcome" id="ord-say" style="margin-top:10px"></p>
            <div class="choices"><button class="choice" data-act="placeOrder" id="ord-go">Place order</button><button class="choice" data-act="modalOk">Cancel</button></div>`;
        openModal(h);
        orderSay();
    }
    function orderInputs() {
        const s = ordSel && stockById(ordSel.id), a = $('ord-px'), b = $('ord-n');
        if (!s || !a || !b) return null;
        return { s, px: +a.value, n: Math.floor(+b.value) };
    }
    function orderSay() {
        const o = orderInputs(); if (!o) return;
        const { s, px: p, n } = o, T = ORDER_TYPES[ordSel.k];
        const ok = p > 0 && n >= 1 && (ordSel.k === 'buy' || n <= s.owned);
        let t;
        if (!(p > 0)) t = 'Enter a trigger price above $0.';
        else if (!(n >= 1)) t = 'Enter how many to trade (1 or more).';
        else if (ordSel.k !== 'buy' && n > s.owned) t = `You only own ${num(s.owned)} ${unitWord(s, s.owned)}.`;
        else {
            t = `${T.icon} <b>${T.verb} ${num(n)} ${s.id}</b> when the price ${ordSel.k === 'tp' ? 'rises to' : 'drops to'} <b>${px(p)}</b> or ${ordSel.k === 'tp' ? 'higher' : 'lower'} (about ${money(n * p)}). Now ${px(s.price)}.`;
            if (orderHit({ k: ordSel.k, px: p }, s)) t += ' <span class="gold">The price is already there, so it fills on the next market day.</span>';
            if (ordSel.k === 'buy' && n * p > cash) t += ' <span class="bad">You do not have that much cash right now; it buys what you can afford when it fills.</span>';
        }
        $('ord-say').innerHTML = t;
        $('ord-go').disabled = !ok;
    }
    function ordType(k) {
        const s = ordSel && stockById(ordSel.id); if (!s || !ORDER_TYPES[k]) return;
        ordSel.k = k;
        document.querySelectorAll('#modal-box [data-act="ordType"]').forEach(b => b.classList.toggle('on', b.dataset.arg === k));
        const d = orderDefaults(k, s);
        $('ord-px').value = d.px; $('ord-n').value = d.n;
        orderSay();
    }
    function ordPct(p) {
        const s = ordSel && stockById(ordSel.id); if (!s) return;
        $('ord-px').value = rp(s.price * (1 + p / 100));
        orderSay();
    }
    function placeOrder() {
        const o = orderInputs(); if (!o) return;
        const { s, px: p, n } = o;
        if (!(p > 0) || !(n >= 1) || (ordSel.k !== 'buy' && n > s.owned) || L.mkt.orders.length >= MAX_ORDERS) return;
        L.mkt.orders.push({ k: ordSel.k, id: s.id, n, px: rp(p), d: day });
        logMessage(`📝 ${ORDER_TYPES[ordSel.k].name} placed: ${num(n)} ${s.id} at ${px(p)}`);
        closeModal(); changed();
    }

    // ---------- bank: savings, bonds, donations ----------
    function savRate() { return Math.max(0.05, Math.round((L.bank.rate - 0.25) * 100) / 100); }
    function bondRate(k) { return Math.round((L.bank.rate + BONDS[k].prem) * 100) / 100; }
    function bondValue() { let v = 0; for (const b of L.bank.bonds) v += b.amt; return v; }
    function bankAmt(max) { const a = L.mkt.amt; return Math.floor(Math.max(0, a ? Math.min(a, max) : max)); }
    function deposit() {
        const a = bankAmt(cash); if (a < 1 || L.phase !== 'play') return;
        cash -= a; L.bank.sav += a;
        logMessage(`🏦 Deposited ${money(a)} into savings (earns interest from next month)`);
        changed();
    }
    function withdraw() {
        const B = L.bank; let a = bankAmt(B.sav);
        if (a >= Math.floor(B.sav)) a = B.sav;
        if (a <= 0) return;
        B.sav = Math.max(0, B.sav - a); B.min = Math.min(B.min, B.sav); cash += a;
        logMessage(`🏦 Withdrew ${money(a, 2)} from savings`);
        changed();
    }
    function buyBond(k) {
        const D = BONDS[k]; if (!D || L.phase !== 'play' || L.bank.bonds.length >= MAX_BONDS) return;
        const a = bankAmt(cash); if (a < BOND_MIN) return;
        cash -= a;
        L.bank.bonds.push({ k, amt: a, rate: bondRate(k), d0: day, last: day, end: day + D.days, paid: 0 });
        L.bank.bought++;
        logMessage(`${D.icon} Bought a ${D.name}: ${money(a)} at ${bondRate(k).toFixed(2)}%/mo`, 'boost-alert');
        toast(`${D.icon} Bond bought: ${money(a)}`, 'good');
        changed();
    }
    function sellBond(i) {
        const b = L.bank.bonds[+i]; if (!b) return;
        const back = Math.round(b.amt * (1 - BOND_EARLY));
        confirmBox(BONDS[b.k].icon, 'Sell this bond early?', `You get <b>${money(back)}</b> back (a ${BOND_EARLY * 100}% penalty on ${money(b.amt)}) and stop earning ${b.rate.toFixed(2)}%/mo.`, 'Sell the bond', () => {
            const j = L.bank.bonds.indexOf(b); if (j < 0) return;
            L.bank.bonds.splice(j, 1); cash += back;
            logMessage(`📜 Sold your ${BONDS[b.k].name} early for ${money(back)}`);
            changed();
        });
    }
    function bondCoupon(b, upTo) {
        const to = Math.min(upTo, b.end), days = Math.max(0, to - b.last);
        b.last = Math.max(b.last, to);
        const c = b.amt * b.rate / 100 * days / 30;
        b.paid += c;
        return c;
    }
    function bondsDay() {
        const B = L.bank;
        for (let i = B.bonds.length - 1; i >= 0; i--) {
            const b = B.bonds[i]; if (day < b.end) continue;
            const c = bondCoupon(b, b.end);
            B.bonds.splice(i, 1);
            cash += b.amt + c; B.int += c; L.monthIncome += c;
            logMessage(`📜 Your ${BONDS[b.k].name} matured: +${money(b.amt + c)} back`, 'salary-alert');
            dirty.market = true;
        }
    }
    // with the monthly bills: savings interest (on the lowest balance this month) and bond interest
    function bankMonth() {
        const B = L.bank;
        const si = Math.round(Math.min(B.min, B.sav) * savRate()) / 100;
        B.sav += si; B.int += si; B.min = B.sav;
        let cp = 0;
        for (let i = B.bonds.length - 1; i >= 0; i--) {
            const b = B.bonds[i], D = BONDS[b.k];
            if (D.risk && Math.random() < D.risk) {
                const back = Math.round(b.amt * 0.4);
                B.bonds.splice(i, 1); cash += back;
                logMessage(`💥 The company behind your ${D.name} went bust! You got back ${money(back)} of ${money(b.amt)}.`, 'tax-alert');
                toast('💥 One of your bonds defaulted', 'bad');
                continue;
            }
            cp += bondCoupon(b, day);
        }
        cp = Math.round(cp * 100) / 100;
        cash += cp; B.int += cp;
        L.monthIncome += si + cp;
        if (si + cp >= 0.01) logMessage(`🏦 INTEREST: +${money(si + cp, 2)}${si && cp ? ` (savings ${money(si, 2)}, bonds ${money(cp, 2)})` : ''}`, 'salary-alert');
        if (si + cp > 0) dirty.market = true;
    }
    // once a year the central bank moves interest rates; banks like hikes, growth stocks do not
    function rateYear() {
        const B = L.bank, old = B.rate;
        B.rate = clamp(Math.round((B.rate + pick([-0.1, -0.05, 0, 0, 0.05, 0.1])) * 100) / 100, 0.2, 1);
        if (B.rate === old) return;
        const up = B.rate > old;
        for (const s of stocks) { const k = secOf(s); if (STOCK_SECTORS.includes(k)) s.trend += (k === 'finance' ? 1 : -1) * (up ? 0.003 : -0.003); }
        addNews('🏛️', `Central bank ${up ? 'raises' : 'cuts'} interest rates to ${B.rate.toFixed(2)}%/mo`, up ? -1 : 1, '*');
    }
    function donate() {
        const a = bankAmt(cash); if (a < 10 || L.phase !== 'play') return;
        const pts = Math.round(a * 0.15);
        confirmBox('🤝', 'Donate to charity?', `Give <b>${money(a)}</b> to a good cause. You get +${num(pts)} Life Score and feel great.`, 'Donate', () => {
            if (cash < a) return;
            cash -= a; L.stats.charity += a; addScore(pts); boostHappy(Math.min(12, 3 + a / 1000));
            logMessage(`🤝 Donated ${money(a)} to charity. +${num(pts)} Life Score`, 'life-alert');
            addTimeline('🤝', `Donated ${money(a)} to charity`);
            changed();
        });
    }
    // when the bank has to step in: sell investments before anything else
    function liquidate() {
        let raised = L.bank.sav; L.bank.sav = 0; L.bank.min = 0;
        for (const b of L.bank.bonds) raised += Math.round(b.amt * (1 - BOND_EARLY));
        L.bank.bonds = [];
        const sellAll = s => { if (s.owned > 0) { raised += s.owned * s.price * (1 - feeRate(s)); s.owned = 0; s.cost = 0; } };
        sellAll(indexStock);
        for (const s of stocks) sellAll(s);
        L.mkt.orders = [];
        cash += raised;
        return raised;
    }

    // ===================== HEALTH & HAPPINESS =====================
    // Both stats drift toward a target built from your life; purchases and events push them temporarily.
    function healthTarget(out) {
        let t = 0;
        const f = (k, v) => { t += v; if (out && Math.round(v)) out.push([k, Math.round(v)]); };
        t += 82;
        if (L.age > 30) f('Age ' + L.age, -(L.age - 30) * 0.7);
        if (L.trait === 'athletic') f('Athletic', 8);
        if (L.job || L.school) f(STYLES[L.style].name + ' pace', STYLES[L.style].health);
        if (L.subs.gym) f('Gym', 10);
        if (L.subs.meals) f('Healthy meals', 6);
        if (L.rel.pets.some(p => PETS[p.t].dog)) f('Dog walks', 3);
        const C = L.job && CAREERS[L.job.c];
        if (C && C.danger) f('Risky job', -C.danger);
        if (L.happy < 25 && !L.subs.therapy) f('Stress', -6);
        if (crowded()) f('Crowded home', -3);
        return clamp(Math.round(t), 5, 100);
    }
    function happyTarget(out) {
        let t = 0;
        const f = (k, v) => { t += v; if (out && Math.round(v)) out.push([k, Math.round(v)]); };
        t += 46;
        const res = residence();
        if (livingWithParents()) f("Parents' house", L.age < 21 ? 3 : -6);
        else f(res.d.name, res.d.hap);
        if (crowded()) f('Crowded home', -8);
        if (L.car) { f(CARS[L.car.id].name, CARS[L.car.id].hap); if (L.car.cond < 30) f('Car falling apart', -3); if (L.car.id === 'suv' && kidsHome()) f('Room for the kids', 2); }
        else if (L.age >= 18 && (L.job || L.school)) f('Bus commute', -4);
        if (L.job) { f(CAREERS[L.job.c].name + ' job', CAREERS[L.job.c].sat); f(STYLES[L.style].name + ' pace', STYLES[L.style].hap); }
        else if (L.school) f('Student life', 3);
        else if (L.age >= 18) f('Unemployed', -10);
        const R = L.rel;
        if (R.p) {
            const base = R.s === 'married' ? 5 + R.p.love / 12 : R.s === 'engaged' ? 4 + R.p.love / 15 : 3 + R.p.love / 20;
            f(R.s === 'married' ? 'Married' : R.s === 'engaged' ? 'Engaged' : 'Dating', base);
        }
        const kids = R.kids.length; if (kids) f('Kids', Math.min(12, kids * 4));
        const little = R.kids.filter(k => k.age < 5).length; if (little) f('Sleepless nights', -2 * little);
        let pets = 0; for (const p of R.pets) pets += PETS[p.t].hap; if (pets) f('Pets', Math.min(8, pets));
        if (R.friends > 0) f('Friends', Math.min(8, R.friends * 1.5)); else f('Lonely', -5);
        f('Parents', (R.parents - 50) / 10);
        f('Health', (L.health - 60) / 4);
        if (cash < 0) f('Debt', -12);
        if (L.subs.stream) f('Streaming', 3);
        if (L.subs.therapy) f('Therapy', 7);
        const nw = netWorth();
        if (nw >= 1000000) f('Rich', 6); else if (nw >= 100000) f('Comfortable', 3);
        return clamp(Math.round(t), 5, 100);
    }

    // ===================== HOUSING =====================
    function rentHome(id) {
        const R = RENTALS[id];
        if (!R || L.phase !== 'play') return;
        const res = residence();
        if (!res.own && L.rent === id) return;
        if (cash < R.rent) return;
        cash -= R.rent;
        for (const p of L.props) p.live = false;
        L.rent = id;
        boostHappy(id === 'parents' ? -3 : 4);
        logMessage(`📦 Moved into ${R.name}${R.rent ? ` (deposit ${money(R.rent)}, then ${money(R.rent)}/mo)` : ''}`, 'life-alert');
        addTimeline(R.icon, 'Moved into ' + R.name);
        if (res.own) logMessage(`🏠 Your ${res.d.name} is now rented out (+${money(rentIncome(res.p))}/mo)`);
        changed();
    }
    function buyHome(id, mortgage) {
        const H = HOMES[id]; if (!H || L.phase !== 'play' || L.props.length >= MAX_PROPS) return;
        if (L.age < 18) return;
        const price = homePrice(id);
        const down = mortgage ? Math.round(price * MORTGAGE.down) : price;
        if (cash < down) return;
        cash -= down;
        const prev = residence();
        for (const p of L.props) p.live = false;
        L.rent = null;
        L.props.push({ id, value: price, loan: mortgage ? makeLoan(price - down, MORTGAGE, 'Mortgage') : null, live: true, bought: L.age });
        L.stats.homes++;
        let pts = 0;
        if (!L.ownedTypes[id]) { L.ownedTypes[id] = 1; pts = H.score; addScore(pts); }
        boostHappy(12);
        logMessage(`🔑 Bought ${H.name} for ${money(price)}${mortgage ? ` (mortgage ${money(L.props[L.props.length - 1].loan.pay)}/mo)` : ''}${pts ? ` +${pts} Life Score` : ''}`, 'boost-alert');
        toast(`${H.icon} Welcome home! You bought a ${H.name}`, 'good');
        addTimeline(H.icon, 'Bought a ' + H.name);
        if (prev.own) logMessage(`🏠 Your ${prev.d.name} is now rented out (+${money(rentIncome(prev.p))}/mo)`);
        changed();
    }
    function sellProp(i, mult) {
        const p = L.props[i]; if (!p) return;
        const H = HOMES[p.id];
        const price = Math.round(p.value * (mult || 0.94));
        const proceeds = price - (p.loan ? Math.round(p.loan.bal) : 0);
        cash += proceeds;
        L.props.splice(i, 1);
        logMessage(`🏷️ Sold ${H.name} for ${money(price)} (you keep ${money(proceeds)})`, 'salary-alert');
        addTimeline('🏷️', 'Sold the ' + H.name);
        if (p.live) {
            if (L.props.length) { L.props[0].live = true; logMessage(`📦 Moved into your ${HOMES[L.props[0].id].name}`); }
            else { L.rent = L.age >= 25 ? 'studio' : 'parents'; logMessage(`📦 Moved into ${RENTALS[L.rent].name} for now`); }
        }
        markDirty();
    }
    function askSellProp(i) {
        const p = L.props[i]; if (!p) return;
        const price = Math.round(p.value * 0.94), proceeds = price - (p.loan ? Math.round(p.loan.bal) : 0);
        confirmBox(HOMES[p.id].icon, `Sell your ${HOMES[p.id].name}?`, `Sale price ${money(price)} after 6% fees${p.loan ? `, minus the ${money(p.loan.bal)} mortgage` : ''}. You get <b>${money(proceeds)}</b>.${p.live ? ' You will have to move out.' : ''}`, 'Sell', () => { sellProp(i); changed(); });
    }
    function moveIn(i) {
        const p = L.props[i]; if (!p || p.live) return;
        for (const q of L.props) q.live = false;
        p.live = true; L.rent = null;
        logMessage(`📦 Moved into your ${HOMES[p.id].name}`, 'life-alert');
        changed();
    }
    function payMortgage(i) {
        const p = L.props[i]; if (!p || !p.loan || cash < p.loan.bal) return;
        cash -= Math.round(p.loan.bal); p.loan = null; L.stats.paidOff = (L.stats.paidOff || 0) + 1;
        addScore(300);
        logMessage(`🔑 Paid off the mortgage on your ${HOMES[p.id].name}! +300 Life Score`, 'boost-alert');
        addTimeline('🔑', 'Paid off the ' + HOMES[p.id].name);
        changed();
    }

    // ===================== CARS =====================
    function buyCar(id, finance) {
        const C = CARS[id]; if (!C || L.phase !== 'play' || L.age < 16) return;
        if (L.car && L.car.id === id && L.car.cond > 60) return;

        if (L.car) logMessage(`🔁 Traded in your ${CARS[L.car.id].name} (worth ${money(carEquity())})`);
        cash -= down;
        const loanAmt = finance ? Math.max(0, net - down) : 0;
        L.car = { id, value: C.price, cond: 100, loan: loanAmt > 0 ? makeLoan(loanAmt, CAR_LOAN, 'Car loan') : null };
        L.stats.cars++;
        let pts = 0;
        if (!L.carTypes[id]) { L.carTypes[id] = 1; pts = C.score; addScore(pts); }

        logMessage(`🚗 Bought a ${C.name}${L.car.loan ? ` (loan ${money(L.car.loan.pay)}/mo)` : ''}${pts ? ` +${pts} Life Score` : ''}`, 'boost-alert');
        toast(`${C.icon} You got a ${C.name}!`, 'good');
        addTimeline(C.icon, 'Bought a ' + C.name);
        changed();

    function buyShop(id) {
        const item = SHOP.find(i => i.id === id); if (!item || L.phase !== 'play') return;
        let price = item.price;
        if (item.insured && insured()) price = Math.round(price * 0.25);

        if (item.pet) { if (L.rel.pets.length >= MAX_PETS) return; cash -= price; addPet(item.pet, null, true); addScore(item.boost - PETS[item.pet].score); logMessage(`Bought ${item.name}!`, 'boost-alert'); changed(); return; }
        cash -= price; addScore(item.boost);
        // repeated purchases within 20 days give less happiness
        const r = L.recent[id] || { d: -99, n: 0 };
        r.n = day - r.d < 20 ? r.n + 1 : 0; r.d = day; L.recent[id] = r;
        const m = 1 / (1 + r.n);
        if (item.hap) boostHappy(item.hap * m);
        if (item.health) boostHealth(item.health * m);
        if (item.love) { if (L.rel.p) L.rel.p.love = clamp(L.rel.p.love + item.love * m, 0, 100); else if (item.parents) L.rel.parents = clamp(L.rel.parents + item.parents * m, 0, 100); }

        changed();
    }

    const EVBYID = {};
    for (const e of EVENTS) EVBYID[e.id] = e;

    function growKid(i) { const k = L.rel.kids[i]; if (k) { k.grown = true; addTimeline('🎒', `${k.name} left for college`); } markDirty(); }
    function queueEvent(id, d) { if (!L.queue.some(q => q.id === id) && !(L.pending && L.pending.id === id)) L.queue.push({ id, d: d || {} }); }
    function maybeEvent() {
        if (L.pending || L.phase !== 'play' || modalOpen) return;
        if (L.queue.length) { const q = L.queue.shift(); openEvent(q.id, q.d); return; }
        if (window.__market && window.__market.noEvents) return;
        if (day - L.lastEv < 12 || Math.random() > 0.07) return;
        L.lastEv = day;
        let total = 0; const cands = [];
        for (const ev of EVENTS) {
            if (ev.forced || ev.id === L.lastEvId) continue;
            const w = ev.w ? ev.w() : 1;
            if (w > 0) { cands.push([ev, w]); total += w; }
        }
        let r = Math.random() * total;
        for (const [ev, w] of cands) {
            r -= w;
            if (r <= 0) { const d = ev.make ? ev.make() : {}; if (d) openEvent(ev.id, d); return; }
        }
    }
    function openEvent(id, d) {
        L.pending = { id, d: d || {} };
        L.lastEvId = id; L.stats.events++;
        showEventModal();
    }
    function showEventModal() {
        const ev = EVBYID[L.pending.id], d = L.pending.d;
        const ch = ev.choices(d);
        let h = `<div class="ev-icon">${ev.icon}</div><h2>${ev.title}</h2><p class="center">${ev.text(d)}</p><div class="choices">`;
        ch.forEach((c, i) => { h += `<button class="choice" data-act="evChoice" data-arg="${i}" ${c.ok === false ? 'disabled' : ''}>${c.t}${c.sub ? `<small>${c.sub}</small>` : ''}</button>`; });
        h += `</div><div class="tiny muted center" style="margin-top:10px">Age ${L.age} · Cash ${money(cash)} · Time is paused</div>`;
        openModal(h);
    }
    function resolveEvent(i) {
        if (!L.pending) return;
        const ev = EVBYID[L.pending.id], d = L.pending.d;
        const c = ev.choices(d)[+i];
        if (!c || c.ok === false) return;
        L.pending = null;
        let msg = '';
        try { msg = c.run() || ''; } catch (e) { msg = 'Life moves on.'; if (window.console) console.warn('event', ev.id, e); }
        logMessage(`${ev.icon} ${ev.title}: ${msg.replace(/<[^>]+>/g, '')}`, 'life-alert');
        openModal(`<div class="ev-icon">${ev.icon}</div><h2>${ev.title}</h2><p class="outcome">${msg}</p><button class="btn big" data-act="modalOk">OK</button>`);
        changed();
    }

    // ===================== DAILY / YEARLY LIFE =====================
    function lifeDay() {
        // collapsed from overwork, illness or injuries: checked before the daily recovery
        if (L.health < 5) queueEvent('hospital', { cost: Math.round(1500 * (1 + L.age / 40)) });
        schoolDay();
        if (L.job) { L.job.days++; L.job.perf = Math.min(100, L.job.perf + perfGain()); checkPromotion(); }
        L.health = clamp(L.health + (healthTarget() - L.health) * 0.02, 0, 100);
        L.happy = clamp(L.happy + (happyTarget() - L.happy) * 0.03, 0, 100);
        L.stats.hapSum += L.happy; L.stats.hapDays++;
        const R = L.rel;
        if (R.p) {
            let decay = 0.06 * STYLES[L.style].love * (L.trait === 'charming' ? 0.6 : 1);
            if (L.happy > 65) decay -= 0.04;
            R.p.love = clamp(R.p.love - decay, 0, 100);
            if (R.p.love <= 0) { endRelationship(); toast('💔 Your relationship fell apart', 'bad'); }
        }
        R.parents = clamp(R.parents - 0.02, 0, 100);
        if (L.car) L.car.cond = Math.max(0, L.car.cond - CARS[L.car.id].wear);
        if (L.health < 25 && Math.random() < 0.05) {
            if (L.job) L.job.perf = Math.max(0, L.job.perf - 3);
            logMessage('🤒 You called in sick. Low health slows you down.', 'tax-alert');
        }
        if (L.iou && day >= L.iou.due) {
            if (L.iou.ok) { const back = Math.round(L.iou.amt * 1.25); cash += back; logMessage(`🤲 Vinny paid you back ${money(back)} with interest!`, 'salary-alert'); }
            else logMessage(`🤲 Vinny's food truck went under. Your ${money(L.iou.amt)} is gone.`, 'tax-alert');
            L.iou = null;
        }
        L.yday++;
        if (L.yday >= YEAR_DAYS) { L.yday = 0; birthday(); }
        if (L.phase === 'play') maybeEvent();
    }

    function birthday() {
        L.age++;
        rateYear();
        const bonus = Math.round((L.health + L.happy) / 4);
        addScore(bonus);
        logMessage(`🎂 Happy birthday! You are ${L.age}. +${bonus} Life Score`, 'boost-alert');
        // housing market moves once a year
        const ch = rnd(-0.05, 0.09);
        L.hTrend = ch; L.hIdx *= 1 + ch;
        for (const p of L.props) p.value = Math.round(p.value * (1 + ch + rnd(-0.02, 0.02)));
        if (L.props.length) logMessage(`🏠 Housing market ${ch >= 0 ? 'up' : 'down'} ${Math.abs(ch * 100).toFixed(1)}% this year`);
        if (L.car) L.car.value = Math.round(L.car.value * 0.88);
        L.rel.kids.forEach((k, i) => { k.age++; if (k.age === 18 && !k.grown) queueEvent('kidGrown', { i, name: k.name, cost: 4000 }); });
        for (let i = L.rel.pets.length - 1; i >= 0; i--) {
            const pet = L.rel.pets[i]; pet.age++;
            if (pet.age >= PETS[pet.t].life) {
                L.rel.pets.splice(i, 1); boostHappy(-8);
                logMessage(`🌈 ${pet.name} lived a long, happy life and crossed the rainbow bridge.`, 'life-alert');
                addTimeline('🌈', `Said goodbye to ${pet.name}`);
            }
        }
        const C = L.job && CAREERS[L.job.c];
        if (C && C.endAge && L.age >= C.endAge) {
            addScore(300 * L.job.r);
            loseJob('Retired from pro sports');
            toast('🏅 Your sports career is over. Time for a new career!');
        }
        if (L.age === 18) toast('🎉 You are 18! More careers and schools are open to you.', 'good');
        if (L.age >= RETIRE_AGE) { retire(false); return; }
        if (L.age >= RETIRE_AGE - 3) toast(`🎂 ${L.age}! ${RETIRE_AGE - L.age} year${RETIRE_AGE - L.age > 1 ? 's' : ''} until retirement`);
        else toast(`🎂 Happy ${L.age}th birthday! +${bonus} Life Score`);
        markDirty();
    }

    // ===================== RETIREMENT & HALL OF LIVES =====================
    function loadHall() { try { const h = JSON.parse(localStorage.getItem('marketLifeHall') || '[]'); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
    function bestCareer() {
        let best = null, bestPay = -1;
        for (const c in L.best) { const C = CAREERS[c]; if (!C) continue; const r = Math.min(L.best[c], C.ranks.length - 1); if (C.ranks[r][1] > bestPay) { bestPay = C.ranks[r][1]; best = { c, r }; } }
        return best;
    }
    function retireBonuses(nw) {
        const b = {};
        b.wealth = Math.min(12000, Math.round(3000 * Math.log10(1 + Math.max(0, nw) / 1000)));   // caps at $10M
        let career = 0;
        for (const c in L.best) { const C = CAREERS[c]; if (!C) continue; const v = L.best[c] * 400 + (L.best[c] >= C.ranks.length - 1 ? 2000 : 0); if (v > career) career = v; }
        b.career = career;
        b.education = L.degrees.length * 200;
        b.family = (L.rel.s === 'married' ? 1500 : 0) + L.rel.kids.length * 1000 + L.rel.pets.length * 200 + L.rel.friends * 50;
        const avg = L.stats.hapDays ? L.stats.hapSum / L.stats.hapDays : L.happy;
        b.avgHappy = Math.round(avg);
        b.wellbeing = Math.round(avg * 30 + L.health * 10);
        return b;
    }
    function retire(early) {
        if (L.phase !== 'play') return;
        const nw = netWorth();
        const b = retireBonuses(nw);
        const before = lifeScore;
        const bonus = b.wealth + b.career + b.education + b.family + b.wellbeing;
        addScore(bonus);
        const bc = bestCareer();
        L.final = {
            score: lifeScore, before, b, nw: Math.round(nw), age: L.age, early: !!early,
            title: L.job ? jobTitle() : (bc ? CAREERS[bc.c].ranks[bc.r][0] : 'a free spirit'),
            pb: lifeScore > pbScore, prevPb: pbScore
        };
        L.phase = 'retired';
        L.pending = null; L.queue = [];
        L.legacy = Math.min(5000, Math.round(Math.max(0, nw) * 0.05));
        addTimeline('🏖️', early ? 'Retired early' : 'Retired');
        const hall = loadHall();
        hall.push({ n: L.name, a: L.avatar, s: lifeScore, w: Math.round(nw), t: L.final.title, age: L.age });
        hall.sort((x, y) => y.s - x.s);
        try { localStorage.setItem('marketLifeHall', JSON.stringify(hall.slice(0, 10))); } catch (e) {}
        logMessage(`🏆 RETIRED at ${L.age}! Final Life Score: ${num(lifeScore)}`, 'boost-alert');
        saveGame(nw);
        markDirty();
        updateUI();
        showSummary();
    }
    function askRetire() {
        if (L.age < EARLY_RETIRE_AGE || L.phase !== 'play') return;
        confirmBox('🏖️', 'Retire early?', 'Your life ends here and you get your final Life Score summary. You cannot undo this.', 'Retire now', () => retire(true));
    }

    let confirmFn = null;

        const box = $('modal-box');

        $('modal').classList.add('hidden');

        if (L.phase === 'retired') showSummary();

    function confirmBox(icon, title, text, yes, fn) {
        confirmFn = fn;
        openModal(`<div class="ev-icon">${icon}</div><h2>${title}</h2><p class="center">${text}</p><div class="choices"><button class="choice" data-act="confirmYes">${yes}</button><button class="choice" data-act="modalOk">Cancel</button></div>`);
    }

    function toast(msg, kind) {
        const box = $('toasts');
        while (box.children.length >= 3) box.removeChild(box.firstChild);
        const t = document.createElement('div');
        t.className = 'toast' + (kind ? ' ' + kind : '');
        t.textContent = msg;
        box.appendChild(t);
        setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
    }

    function newLife() { L.phase = 'setup'; saveGame(netWorth()); showSetup(); }

    // ===================== CORE ACTIONS (1.x functions kept) =====================
    function handleBusiness1() {
        if (!hasBiz1) {
            if (cash >= BIZ1_INIT_COST) { cash -= BIZ1_INIT_COST; hasBiz1 = true; lifeScore += 500; addTimeline('🚀', 'Founded Startup Inc.'); changed(); logMessage("🚀 Startup Founded!"); }
        } else {
            let cost = Math.floor(1500 * Math.pow(1.5, biz1Level - 1));
            if (cash >= cost) { cash -= cost; biz1Level++; lifeScore += 200; changed(); logMessage(`📈 Startup to LVL ${biz1Level}!`); }
        }
    }

    function handleBusiness2() {
        if (!hasBiz2) {
            if (cash >= BIZ2_INIT_COST) { cash -= BIZ2_INIT_COST; hasBiz2 = true; lifeScore += 2500; addTimeline('🏢', 'Founded Conglomerate Corp.'); changed(); logMessage("🏢 Conglomerate Founded!"); }
        } else {
            let cost = Math.floor(10000 * Math.pow(1.6, biz2Level - 1));
            if (cash >= cost) { cash -= cost; biz2Level++; lifeScore += 1000; changed(); logMessage(`🏙️ Corp to LVL ${biz2Level}!`); }
        }
    }

    function doOvertime() {
        if (L.phase !== 'play') return;
        workProgress += 12.5;
        if (workProgress >= 100) {
            const base = L.job ? rankOf(L.job)[1] : 60;
            let bonus = Math.round(base * (0.2 + Math.random() * 0.3)); cash += bonus; workProgress = 0; totalWorkCompleted++;
            L.monthIncome += bonus;
            boostHealth(-0.5); boostHappy(-0.25);
            logMessage(L.job ? `🛠️ Overtime: +${money(bonus)}` : `🧹 Odd job: +${money(bonus)}`);
            if (L.job) { L.job.perf = Math.min(100, L.job.perf + 1); checkPromotion(); }
        }
        updateUI();
    }

    // 1.x bought/sold one share per click; 2.0 uses the trade size picked in the Market tab (n = how many, quiet = no redraw)
    function buyStock(id, n, quiet) {
        const s = stockById(id); if (!s) return 0;
        if (n === undefined || n === null) n = L.mkt.qty || Infinity;
        n = Math.min(Math.floor(n), maxBuy(s));
        if (!(n >= 1)) return 0;
        const fee = n * s.price * feeRate(s), total = n * s.price + fee;
        cash -= total; s.owned += n; s.cost = (s.cost || 0) + total;
        L.mkt.buys++; L.mkt.fees += fee;
        if (!quiet) { checkAch(); updateUI(); }
        return n;
    }

    function sellStock(id, n, quiet) {
        const s = stockById(id); if (!s || s.owned <= 0) return 0;
        if (n === undefined || n === null) n = L.mkt.qty || s.owned;
        n = Math.min(Math.floor(n), s.owned);
        if (!(n >= 1)) return 0;
        const basis = (s.cost || 0) * n / s.owned;
        const gross = n * s.price, fee = gross * feeRate(s), got = gross - fee;
        cash += got; s.owned -= n; s.cost = s.owned ? Math.max(0, (s.cost || 0) - basis) : 0;
        const pl = got - basis;
        L.mkt.real += pl; L.mkt.sells++; L.mkt.fees += fee;
        if (basis > 0 && got >= basis * 2) L.mkt.x2 = true;
        if (pl > L.mkt.best) L.mkt.best = pl;
        if (!quiet) { checkAch(); updateUI(); }
        return n;
    }

    function logMessage(msg, type = '') {
        const log = $('log'); if (!log) return;
        const entry = document.createElement('div');
        if (type) entry.className = type;
        entry.innerText = `[D${day}] ${msg}`;
        log.prepend(entry);
        while (log.childNodes.length > 80) log.removeChild(log.lastChild);
    }

    // one simulated day (market + life). marketTick only runs it when the game is not paused.
    function simDay() {
        day++;
        if (day % 7 === 0) payday();
        if (day % 30 === 0) payBills();
        stepMarket();
        if (L.phase === 'play') lifeDay();
        if (L.phase === 'play') { dailyStats(); checkAch(); }
        if (L.tab === 'market' && L.mkt.view === 'port') dirty.market = true;   // portfolio profit/loss table follows prices
    }
    function isPaused() { return L.phase !== 'play' || modalOpen || L.speed === 0; }
    function marketTick() {
        if (isPaused()) return;
        simDay();
        updateUI();
    }
    function setSpeed(s, quiet) {
        if (![0, 1, 2, 4, 8].includes(s)) s = 1;
        L.speed = s;
        if (tickTimer) clearInterval(tickTimer);
        tickTimer = s ? setInterval(marketTick, BASE_TICK_MS / s) : null;
        updateSpeedUI();
        if (!quiet) updateUI();
    }
    function updateSpeedUI() {
        const sp = $('speed'); if (!sp || !L) return;
        for (const b of sp.children) b.classList.toggle('on', +b.dataset.arg === L.speed);
        sp.classList.toggle('paused', isPaused());
    }

    // ===================== UI: TABS & PANELS =====================
    function buildTabs() {
        let h = '';
        for (const t of TABS) h += `<button data-act="tab" data-arg="${t.id}" id="tab-${t.id}">${t.icon} ${t.name}<span class="dot"></span></button>`;

    }
    function setTab(t) {
        if (!TABS.some(x => x.id === t)) return;

        updateUI();
    }

    function bar(pct, cls, bind) { return `<div class="bar ${cls || ''}"><i ${bind ? `data-w="${bind}"` : ''} style="width:${clamp(pct, 0, 100).toFixed(1)}%"></i></div>`; }
    function chipList(list) { return list.map(([k, v]) => `<span class="chip ${v > 0 ? 'pos' : 'neg'}">${v > 0 ? '+' : ''}${v} ${esc(k)}</span>`).join(''); }
    // data-cost: disabled while cash < cost; data-cd: disabled until that day; data-lock="1": always disabled
    function btn(label, act, arg, o) {
        o = o || {};
        return `<button class="btn ${o.cls || ''}" data-act="${act}"${arg !== undefined && arg !== null ? ` data-arg="${arg}"` : ''}${o.cost ? ` data-cost="${Math.ceil(o.cost)}"` : ''}${o.cd ? ` data-cd="${o.cd}"` : ''}${o.lock ? ' data-lock="1" disabled' : ''}${o.title ? ` title="${esc(o.title)}"` : ''}>${label}${o.cd ? `<span data-b="cd:${o.cd}"></span>` : ''}</button>`;
    }

    const PANELS = {
        life: buildLife, career: buildCareer, school: buildSchool, market: buildMarket,

    };

    function buildLife() {
        const R = L.rel, hf = [], pf = [];

        const res = residence();
        const trait = TRAITS[L.trait];
        const status = [L.school ? 'Student' : '', L.job ? jobTitle() + (L.school ? ' (part-time)' : '') : (!L.school ? 'Unemployed' : '')].filter(Boolean).join(' · ');
        const inc = weeklyIncome() * 30 / 7;
        const bills = billLines(inc);
        let budget = `<div class="kv"><span>Income (≈${money(weeklyIncome())}/wk)</span><b class="ok">+${money(inc)}</b></div>`;
        for (const [k, v] of bills) budget += `<div class="kv"><span>${k}</span><b class="${v < 0 ? 'ok' : 'bad'}">${v < 0 ? '+' + money(-v) : '-' + money(v)}</b></div>`;
        const net = inc - sumLines(bills);
        budget += `<div class="kv total"><span>Left over each month</span><b class="${net >= 0 ? 'ok' : 'bad'}">${net >= 0 ? '+' : ''}${money(net)}</b></div>`;

        const tips = [];
        if (cash < 0) tips.push('⚠️ You are in debt! Cut costs or sell something before the bank does it for you.');
        if (L.school && L.school.id === 'hs') tips.push('🏫 Finish high school at 18. Hit STUDY to keep your GPA up (3.5+ = honors).');
        if (L.school && L.school.gpa < 2.3) tips.push('📉 Your GPA is dangerously low. Study, or you will repeat a year.');
        if (!L.job && L.age >= 16) tips.push('💼 Get a job in the Career tab.');

        const blk = nextRankBlocked();
        if (blk && L.job.perf >= 100) tips.push(`🔒 Promotion blocked: you need ${reqText(blk)}.`);
        if (livingWithParents() && L.age >= 20) tips.push('🏢 Time to move out! Rent an apartment in the Home tab.');

        if (!hasBiz1 && cash >= BIZ1_INIT_COST) tips.push('🚀 You can found a startup in the Business tab.');
