<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Lucky Goon</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b2e; --panel:#1d2238; --panel2:#262c47; --line:#343b5c; --ink:#eef0f8; --mute:#9aa1c2;
  --gold:#f6c446; --gold2:#ffdf7e; --red:#e2434b; --green:#2fbf71; --blue:#4c8dff; --felt:#0f6b47; --felt2:#0b5237;
  --win:#3ee08a; --lose:#ff6b6b; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:grid;grid-template-rows:48px 1fr 22px;height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.45}
input{font:inherit}
.hidden{display:none!important}
b{font-weight:700}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(#1a1f36,#12152a);border-bottom:1px solid #2b3150;position:relative;z-index:5}
.tb-back{padding:6px 12px;border-radius:8px;background:var(--panel2);font-weight:600;white-space:nowrap}
.tb-back:hover{background:#323a5e}
body.at-lobby .tb-back{visibility:hidden}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.lg-ico{font-size:22px;filter:drop-shadow(0 0 6px #3f3)}
.lg-t{font-size:17px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.pr-tag{background:#ff8a00;color:#211;font-size:11px;font-weight:900;padding:2px 7px;border-radius:5px;letter-spacing:1px}
.bal{display:flex;align-items:center;gap:8px;margin-left:auto}
.bal-c,.bal-g{display:flex;align-items:baseline;gap:5px;background:#0b0e1b;border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.bal-c b{color:var(--gold2);font-size:17px;min-width:3ch;text-align:right;transition:color .3s}
.bal-c b.up{color:var(--win)} .bal-c b.down{color:var(--lose)}
.bal-g b{font-size:15px}
.bal small{color:var(--mute);font-size:11px}
.chipi{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ffd65a 35%,#c8921a 36%,#c8921a 55%,#fff 56%,#fff 62%,#c8921a 63%);align-self:center}
.tb-btn{padding:6px 11px;border-radius:8px;background:var(--panel2);font-weight:600;white-space:nowrap}
.tb-btn.buy{background:linear-gradient(#f8cf55,#d9a521);color:#2a1d00}
.tb-btn:hover{filter:brightness(1.12)}
.tb-r{display:flex;gap:4px}
.tb-ico{width:32px;height:32px;border-radius:8px;background:var(--panel2);font-size:15px;font-weight:800}
.tb-ico.on{background:#3b4a8a;color:var(--gold2)}
#main{position:relative;overflow:hidden;min-height:0}
#foot{font-size:11px;color:var(--mute);text-align:center;line-height:22px;background:#0b0d18;border-top:1px solid #222842;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}

/* toasts and modal */
#toasts{position:fixed;left:50%;top:58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{background:#22284a;border:1px solid #475088;padding:8px 16px;border-radius:10px;box-shadow:0 6px 20px #0008;animation:tin .25s ease-out;font-weight:600;max-width:80vw;text-align:center}
.toast.err{background:#4a1f28;border-color:#a33a4b}
.toast.win{background:linear-gradient(#1e5c3c,#164a30);border-color:#3ee08a}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:320px;max-width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px #000c}
.mbox h2{margin:0 0 10px;font-size:20px}
.mbox p{color:#cfd3e8;margin:6px 0}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{padding:8px 14px;border-radius:9px;background:var(--panel2);font-weight:700;border:1px solid #3a4268}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.gold{background:linear-gradient(#f8cf55,#d39c18);color:#2a1d00;border-color:#f8d97a}
.btn.green{background:linear-gradient(#36c77b,#1f9a58);border-color:#5be39a;color:#04210f}
.btn.red{background:linear-gradient(#ee5960,#b8323a);border-color:#ff8a8f}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:11px 22px;font-size:17px}
.btn.sel{outline:2px solid var(--gold);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.inp{background:#0b0e1b;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;width:110px}

/* entrance / sign-in screen */
.gate{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#21305a 0,#0f1220 70%)}
.gate .card{max-width:560px;text-align:center;background:#171c33cc;border:1px solid var(--line);border-radius:18px;padding:26px 30px;box-shadow:0 20px 60px #0009}
.gate h1{margin:0 0 6px;font-size:32px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate .big-ico{font-size:56px}
.gate .warn{background:#2a2f4f;border-radius:10px;padding:10px 12px;color:#dfe3ff;margin:14px 0;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.switch i{width:44px;height:24px;border-radius:12px;background:#3a4166;position:relative;transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{background:#ff8a00}.switch.on i:after{left:23px}

/* chips */
.chip{--c:#2b6fe0;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #0009;
  background:radial-gradient(circle,var(--c) 52%,transparent 53%),repeating-conic-gradient(var(--c) 0 30deg,#fff 30deg 45deg);border:2px solid #0004;box-shadow:0 2px 3px #0007,inset 0 0 0 4px #ffffff22;flex:none;position:relative}
.chip.s{width:24px;height:24px;font-size:8px}
.chip.xs{width:18px;height:18px;font-size:7px;border-width:1px}
.chip.v5{--c:#d23a3a}.chip.v10{--c:#2b6fe0}.chip.v25{--c:#1c9a55}.chip.v100{--c:#222}.chip.v500{--c:#8a3bd1}.chip.v1k{--c:#d9951a}.chip.vmax{--c:#c2185b}
.chip.sel{transform:translateY(-5px);box-shadow:0 0 0 3px var(--gold),0 6px 10px #000a}

/* playing cards */
.pcard{width:var(--cw,64px);height:calc(var(--cw,64px)*1.4);border-radius:calc(var(--cw,64px)*.09);background:#fdfdfb;color:#222;position:relative;flex:none;box-shadow:0 3px 8px #0007;perspective:600px;transform-style:preserve-3d;transition:transform .35s}
.pcard .f,.pcard .b{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden}
.pcard .b{background:repeating-linear-gradient(45deg,#b0263a 0 6px,#8f1d2f 6px 12px);border:3px solid #fff;transform:rotateY(180deg)}
.pcard.down{transform:rotateY(180deg)}
.pcard .tl{position:absolute;left:6%;top:3%;font-weight:800;font-size:calc(var(--cw,64px)*.27);line-height:1;text-align:center}
.pcard .tl small{display:block;font-size:.8em}
.pcard .md{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw,64px)*.55)}
.pcard .br{position:absolute;right:6%;bottom:3%;transform:rotate(180deg);font-weight:800;font-size:calc(var(--cw,64px)*.27);line-height:1;text-align:center}
.pcard .br small{display:block;font-size:.8em}
.pcard.red{color:#c8202f}
.pcard.deal{animation:deal .35s ease-out}
@keyframes deal{from{transform:translate(120px,-140px) rotate(-20deg);opacity:0}}
.pcard.held:after{content:"HELD";position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--gold);color:#221;font-size:11px;font-weight:900;padding:1px 6px;border-radius:4px}
.pcard.dim{filter:brightness(.55)}
.pcard.glow{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}

.small{font-size:12px;color:var(--mute)}
.gold{color:var(--gold2)}
.center{text-align:center;justify-content:center}
.mrow.end{justify-content:flex-end;margin-top:14px}
.cg-out{min-height:22px;font-size:15px}
.warn{background:#2a2f4f;border-left:4px solid var(--gold);border-radius:8px;padding:9px 12px;color:#dfe3ff;margin:10px 0;font-size:13px}
body.busy .lockable{pointer-events:none;opacity:.55}

/* lobby */
.lobby{height:100%;display:flex;flex-direction:column;min-height:0}
.ticker{display:flex;align-items:center;gap:10px;background:#0b0e1b;border-bottom:1px solid #232945;height:30px;padding:0 10px;flex:none;overflow:hidden}
.tk-l{font-weight:800;color:var(--gold2);white-space:nowrap;font-size:13px}
.tk-w{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk-in{display:inline-flex;gap:34px;padding-left:100%;animation:tick 40s linear infinite;font-size:13px}
@keyframes tick{to{transform:translateX(-100%)}}
.fi b{color:#fff}.fi b.gold{color:var(--gold2)}
.lb-cols{flex:1;min-height:0;display:flex;gap:14px;padding:12px 14px;overflow:auto}
.lb-left{flex:1;min-width:0}
.lb-right{width:290px;flex:none;display:flex;flex-direction:column;gap:10px}
.grp{margin:4px 0 8px;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:#c9cef0}
.grp small{text-transform:none;letter-spacing:0;color:var(--mute);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-bottom:14px}
.tile{position:relative;text-align:left;padding:10px 11px 9px;border-radius:12px;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid #ffffff22;min-height:92px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 12px #0006;transition:transform .12s,box-shadow .12s;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px #000a,0 0 0 2px var(--gold)}
.tile:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:#ffffff12}
.tl-ico{font-size:28px;line-height:1.1}
.tl-t{font-weight:800;font-size:15px}
.tl-s{font-size:11.5px;color:#ffffffb8}
.tl-live{position:absolute;right:8px;top:8px;background:#e2434b;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;letter-spacing:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.tl-st{font-size:11.5px;font-weight:700;color:#ffd9a0;margin-top:2px;font-variant-numeric:tabular-nums}
.tl-st.open{color:#9dffc4}
.tl-st:empty{display:none}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#3a2f0a,#2a2410);border:1px solid #8a7020;border-radius:10px;padding:8px 12px;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.panel h3{margin:0 0 6px;font-size:14px}
.panel p{margin:4px 0 8px;font-size:12.5px;color:#c9cdea}
.panel.daily.ready{background:linear-gradient(135deg,#3b2a6e,#1d2238);border-color:#7d5cd6;box-shadow:0 0 18px #7d5cd655}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#141830;border-radius:8px;padding:5px 8px}
.stat small{display:block;color:var(--mute);font-size:11px}
.stat b{font-size:16px}
.feedp{flex:1;min-height:120px;overflow:hidden}
.feedl div{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 0;border-bottom:1px solid #2a3050}
.feedl small{color:var(--mute);white-space:nowrap}
.dwrap{position:relative;width:320px;max-width:100%;margin:0 auto}
.dwheel{width:100%;display:block}
.dptr,.wptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:var(--gold);font-size:28px;text-shadow:0 2px 4px #000}

/* odds page */
.odds{height:100%;overflow:auto;padding:16px}
.odds-in{max-width:980px;margin:0 auto}
.odds h2{margin:0 0 8px}
.odds li{margin:4px 0;color:#d5d9f0}
.otab{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.otab th{text-align:left;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
.otab td{padding:6px;border-bottom:1px solid #262c47;vertical-align:top}
.otab td:nth-child(2){color:#ffb0a0;white-space:nowrap}.otab td:nth-child(3){color:#9dffc4;white-space:nowrap}

@media (max-width:980px){
  .lb-right{width:240px}
  .tb-r .tb-ico#b-set{display:none}
}
@media (max-width:860px){
  .lg-t{display:none}
  .lb-cols{flex-direction:column}
  .lb-right{width:auto;flex-direction:row;flex-wrap:wrap}
  .lb-right .panel{flex:1 1 220px}
}

/* the frame every game sits in */
.game{height:100%;display:flex;flex-direction:column;min-height:0}
.gtop{display:flex;align-items:center;gap:10px;padding:5px 12px;height:40px;flex:none;border-bottom:1px solid #232945;background:#12152a}
.gtop h2{margin:0;font-size:17px;white-space:nowrap}
.g-ico{font-size:20px}
.g-edge{font-size:11.5px;color:var(--mute);background:#1b2036;border:1px solid #2c3354;border-radius:20px;padding:2px 9px;white-space:nowrap}
.g-hint{font-size:12px;color:#8a91b4;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-info{display:none}
.gbody{flex:1;min-height:0;display:flex;gap:10px;padding:8px 10px;position:relative}
.gmain{flex:1;min-width:0;min-height:0;position:relative;display:flex}
.gside{width:250px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.gbar{flex:none;padding:0 10px 8px}
.ptab h3{margin:0 0 6px;font-size:14px;color:var(--gold2)}
.ptab table{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab td{padding:4px 4px;border-bottom:1px solid #2b3150}
.ptab td:last-child{text-align:right;color:#ffe9a8;font-weight:700;white-space:nowrap}
.ptab tr.lit td{background:#f6c44633;color:#fff}
.pnote{font-size:11.5px;color:var(--mute);margin:8px 0 0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:1000px){
  .g-info{display:inline-block;margin-left:6px}
  .g-hint{display:none}
  .gside{position:absolute;right:10px;top:8px;bottom:8px;z-index:6;box-shadow:0 10px 30px #000c;display:none}
  .game.show-side .gside:not(.hidden){display:block}
}

/* the bet bar */
.betbar{display:flex;align-items:center;gap:10px;background:linear-gradient(#1c2140,#151932);border:1px solid #2f3660;border-radius:14px;padding:7px 10px;min-height:62px;flex-wrap:wrap}
.bb-amt{display:flex;flex-direction:column;min-width:86px}
.bb-l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.bb-v{font-size:21px;color:var(--gold2);line-height:1.1}
.bb-chips{display:flex;gap:4px}
.bb-chip{padding:2px;border-radius:50%;transition:transform .1s}
.bb-chip:hover{transform:translateY(-3px)}
.bb-chip.sel .chip{box-shadow:0 0 0 3px var(--gold),0 4px 8px #000a;transform:translateY(-4px)}
.bb-tools{display:flex;gap:4px}
.bb-extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end}
.bb-extra:empty{display:block}
.bb-go{min-width:130px}
.seg{display:flex;align-items:center;gap:4px;background:#0f1328;border-radius:10px;padding:3px 6px}
.seg>span{font-size:11px;color:var(--mute);margin-right:3px;text-transform:uppercase}
.seg .inp{width:76px;padding:4px 6px}
.acts{display:flex;gap:6px}
.btn.act{padding:10px 16px;font-size:15px;background:linear-gradient(#3a4a9a,#273274);border-color:#5868c0}
.btn.act[data-a=stand]{background:linear-gradient(#b8323a,#8a1f26);border-color:#e0646b}
.btn.act[data-a=double]{background:linear-gradient(#d39c18,#a97506);color:#211;border-color:#f8d97a}
.btn.act[data-a=split]{background:linear-gradient(#1f9a58,#127041);border-color:#5be39a}
@media (max-width:1100px){.bb-tools .btn{padding:5px 7px}.chip{width:32px;height:32px}.bb-go{min-width:100px}}

/* felt and shared table bits */
.felt{flex:1;min-width:0;min-height:0;border-radius:20px;background:radial-gradient(ellipse at 50% 35%,#178a5c 0,#0d5a3b 55%,#083a26 100%);border:6px solid #4a2c12;box-shadow:inset 0 0 40px #0009,0 6px 18px #0008;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:10px 14px;overflow:hidden;position:relative}
.lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#d9f5e6aa;display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:5px}
.vbadge{background:#000a;color:#fff;border-radius:12px;padding:1px 9px;font-size:13px;letter-spacing:0;min-width:24px;text-align:center}
.vbadge:empty{display:none}
.crow{display:flex;gap:6px;min-height:calc(var(--cw,64px)*1.4);justify-content:center}
.tmsg{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;min-height:22px;text-align:center}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;text-align:center;padding:12px 28px;border-radius:16px;background:#000c;border:2px solid #fff3;animation:bin .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.banner b{display:block;font-size:42px;line-height:1.1}
.banner small{display:block;font-size:14px;color:#ddd;margin-top:2px}
.banner.win{border-color:var(--win);box-shadow:0 0 40px #3ee08a66}.banner.win b{color:var(--win)}
.banner.lose b{color:#ff9a9a}.banner.part b{color:var(--gold2)}
.banner.out{opacity:0;transition:opacity .45s}
@keyframes bin{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}

/* blackjack */
.bjfelt{--cw:clamp(48px,9vh,76px)}
.bj-d{text-align:center}
.bj-arc{font-size:11px;letter-spacing:2px;color:#f6c44699;font-weight:800}
.hands{display:flex;gap:30px;justify-content:center}
.hand{padding:6px;border-radius:12px;border:2px solid transparent;text-align:center}
.hand.active{border-color:var(--gold);background:#0003}
.hand.bust .crow{opacity:.6}
.hinfo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.hbet{display:flex;align-items:center;gap:4px;font-weight:700}

/* roulette */
.rfelt{flex-direction:row;gap:14px;justify-content:center}
.rw{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex:none}
.rwheel{width:min(46vh,30vw,340px);height:auto;aspect-ratio:1;filter:drop-shadow(0 8px 14px #0009)}
.rres{position:absolute;left:50%;top:min(23vh,15vw,170px);transform:translate(-50%,-50%);font-size:30px;font-weight:900;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #f6c446;pointer-events:none}
.rres:empty{display:none}
.rres.r{background:#c8202f}.rres.b{background:#161616}.rres.g{background:#14894f}
.rhist{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:min(46vh,30vw,340px)}
.rn{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid #fff5}
.rn.r{background:#c8202f}.rn.b{background:#161616}.rn.g{background:#14894f}
.rt{flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.rtable{display:grid;grid-template-columns:1.1fr repeat(12,1fr) 1.2fr;grid-template-rows:repeat(3,minmax(30px,7vh)) minmax(28px,5.5vh) minmax(28px,5.5vh);gap:2px;background:#f2e6c9aa;padding:2px;border-radius:6px}
.rs{position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;color:#fff;font-size:clamp(11px,1.6vh,15px);background:#0d5a3b;transition:filter .1s}
.rs:hover{filter:brightness(1.3)}
.rs.num.r{background:#b81f2c}.rs.num.b{background:#1b1b1b}.rs.zero{background:#14894f;border-radius:20px 0 0 20px}
.rs.out{font-size:clamp(10px,1.5vh,13px)}
.rs.redd .rl:before{content:"";display:inline-block;width:18px;height:18px;transform:rotate(45deg);background:#c8202f;border:1px solid #fff8}
.rs.blackd .rl:before{content:"";display:inline-block;width:18px;height:18px;transform:rotate(45deg);background:#111;border:1px solid #fff8}
.rs.hit{box-shadow:inset 0 0 0 3px var(--gold);animation:hitp 1s ease-in-out 3}
@keyframes hitp{50%{filter:brightness(1.7)}}
.stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stack.placed{justify-content:flex-start;padding-left:2px}
.stack.placed .chip{outline:2px solid #fff;outline-offset:-1px}
.stack.two{justify-content:flex-end;padding-right:2px}
.felt.live .rt .lclock{margin-bottom:2px}

/* baccarat */
.bacfelt{--cw:clamp(46px,8.5vh,70px);background:radial-gradient(ellipse at 50% 35%,#1e5a8a 0,#123a5c 60%,#0a2238 100%)}
.bac-hands{display:flex;gap:40px;justify-content:center}
.bac-h{text-align:center;min-width:220px}
.bac-spots{display:flex;gap:12px;width:100%;max-width:720px}
.bspot{flex:1;min-height:min(19vh,130px);border:2px dashed #ffffff55;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;gap:2px;transition:background .15s}
.bspot:hover{background:#ffffff12}
.bspot b{font-size:20px;letter-spacing:2px}.bspot small{color:#cfe}
.bspot.b-p{border-color:#6aa8ff}.bspot.b-b{border-color:#ff7a7a}.bspot.b-t{border-color:#7dffb0;flex:.7}
.bspot.hit{background:#f6c44633;box-shadow:0 0 0 3px var(--gold)}
.sc{min-height:40px;display:flex;align-items:center}

/* dice */
.die{width:var(--ds,64px);height:var(--ds,64px);border-radius:14%;background:linear-gradient(145deg,#fff,#e4e4ea);box-shadow:0 5px 10px #0008,inset 0 -3px 0 #0002;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%;gap:4%;flex:none}
.die i{border-radius:50%}.die i.p{background:radial-gradient(circle at 35% 35%,#555,#000)}
.die.rolling{animation:tumble .18s linear infinite}
@keyframes tumble{25%{transform:rotate(14deg) translateY(-6px)}75%{transform:rotate(-12deg) translateY(3px)}}
.die.mini{--ds:26px;padding:10%}
.dicebox{display:flex;gap:16px;align-items:center;justify-content:center;--ds:clamp(48px,10vh,76px)}

/* craps */
.crfelt{background:radial-gradient(ellipse at 50% 35%,#5a3a9a 0,#36206a 60%,#1e1040 100%)}
.points{display:flex;gap:6px}
.pt{width:62px;height:44px;border:2px solid #fff5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;position:relative}
.pt.on{border-color:var(--gold);background:#f6c44633}
.pt.on:after{content:"ON";position:absolute;top:-12px;right:-12px;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #000a}
.rolls{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:80%;min-height:26px}
.rolls .rl{background:#0005;border-radius:6px;padding:2px 7px;font-weight:700}
.rolls .rl.seven{background:#b8323a}.rolls .rl.point{background:#d39c18;color:#211}
.csides{display:flex;gap:12px;width:100%;max-width:640px}
.cside{flex:1;border:2px solid #ffffff55;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.cside b{display:block;font-size:20px;letter-spacing:2px}.cside small{color:#ddd}
.cside.sel{border-color:var(--gold);background:#f6c44626;box-shadow:0 0 16px #f6c44655}

/* sic bo */
.sbfelt{background:radial-gradient(ellipse at 50% 30%,#8a3a1a 0,#5a200c 60%,#320f04 100%);gap:6px}
.sbtot{font-size:34px;font-weight:900;color:var(--gold2);min-width:50px}
.sbtable{width:100%;max-width:820px;display:flex;flex-direction:column;gap:4px}
.sbrow{display:grid;gap:4px}
.sbrow.r1{grid-template-columns:1fr 1fr 1.2fr 1fr 1fr}.sbrow.r2{grid-template-columns:repeat(14,1fr)}.sbrow.r3{grid-template-columns:repeat(6,1fr)}
.sbs{border:1.5px solid #ffe2b077;border-radius:8px;min-height:min(9vh,64px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;background:#0002}
.sbs:hover{background:#ffffff14}
.sbs b{font-size:15px}.sbs small{font-size:10.5px;color:#ffdcc0}
.sbs.trip{background:#f6c44622}
.sbs.hit{background:#f6c44640;box-shadow:inset 0 0 0 2px var(--gold)}
.sbs .sc{position:absolute;right:2px;top:2px;min-height:0}

/* video poker */
.vpfelt{background:linear-gradient(#10195a,#060b30);border-color:#2a2f50}
.vpscreen{display:flex;flex-direction:column;align-items:center;gap:22px;--cw:clamp(64px,13vh,110px)}
.vprank{font-size:24px;font-weight:900;color:#ffe46a;text-shadow:0 0 12px #ffe46a88;min-height:30px}
.vprow{display:flex;gap:12px}
.vprow .pcard{cursor:pointer}

/* slots */
.cabinet{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 20%,#5a1838,#24081a 70%);border-radius:20px;border:6px solid #8a5a1a;box-shadow:inset 0 0 50px #000a}
.cab-top{font-size:22px;font-weight:900;letter-spacing:3px;color:#ffdf7e;text-shadow:0 0 12px #ff9a3b}
.reels{position:relative;display:flex;gap:8px;background:#100410;padding:10px;border-radius:14px;border:4px solid #d9a63a;box-shadow:0 0 30px #ff3b8a55}
.reel{width:min(18vh,13vw,140px);height:min(48vh,39vw,400px);max-height:calc(min(18vh,13vw,140px)*3);overflow:hidden;background:linear-gradient(#ddd,#fff 20%,#fff 80%,#ccc);border-radius:8px;position:relative}
.strip{will-change:transform}
.cell{height:calc(min(18vh,13vw,140px));display:flex;align-items:center;justify-content:center;border-bottom:1px solid #0001}
.cell.lit{background:#ffe46a;animation:hitp .6s ease-in-out 4}
.sym{font-size:calc(min(18vh,13vw,140px)*.55);line-height:1}
.sym.s7{font-weight:900;color:#d0102a;font-family:Georgia,serif;text-shadow:2px 2px 0 #ffcc33}
.ptab .sym{font-size:15px}
.slines{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none}
.slines .ln{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.85;filter:drop-shadow(0 0 4px #fff)}
.ln.l0{stroke:#ff3b5c}.ln.l1{stroke:#3bb5ff}.ln.l2{stroke:#3be08a}.ln.l3{stroke:#ffb43b}.ln.l4{stroke:#c36bff}
.slwin{font-size:18px;font-weight:800;color:#fff;min-height:24px}

/* plinko */
.pbox{flex:1;background:radial-gradient(ellipse at 50% 0,#3a1a6a,#140a2a 75%);border-radius:20px;border:2px solid #4a2c8a;display:flex;overflow:hidden}
.pcv{flex:1;width:100%;height:100%;display:block}

/* lucky wheel */
.wbox{flex:1;display:flex;align-items:center;justify-content:center;gap:30px;background:radial-gradient(ellipse at 50% 50%,#3a2a0a,#120c02 75%);border-radius:20px}
.wwrap{position:relative}
.wcv{width:min(60vh,50vw,460px);height:auto;aspect-ratio:1;display:block}
.wptr{top:-14px;font-size:36px}
.wout{font-size:54px;font-weight:900;min-width:150px;text-align:center}

/* keno */
.kfelt{background:radial-gradient(ellipse at 50% 30%,#0f6b6b,#063a3a 70%);gap:8px}
.kgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%;max-width:640px}
.kc{aspect-ratio:1.25;max-height:7.5vh;border-radius:8px;background:#0a2a2a;border:1px solid #2a6a6a;font-weight:800;font-size:15px;transition:transform .1s}
.kc:hover{transform:scale(1.06)}
.kc.on{background:#2b6fe0;border-color:#8ab4ff}
.kc.drawn{background:#555b70}.kc.on.drawn{background:#2b6fe0}
.kc.hit{background:var(--gold)!important;color:#221;box-shadow:0 0 14px var(--gold)}
.kballs{display:flex;gap:6px;min-height:38px}
.kb{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bbb);color:#222;font-weight:900;display:flex;align-items:center;justify-content:center;animation:bin2 .3s}
.kb.hit{background:radial-gradient(circle at 35% 30%,#fff6c4,#f6c446)}
@keyframes bin2{from{transform:translateY(-40px);opacity:0}}

/* scratch cards */
.sbox{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#1d3a2a,#0b1810 75%);border-radius:20px}
.scard{width:min(62vh,90%,460px);border-radius:18px;padding:14px;background:linear-gradient(135deg,#c77d3a,#8a4a12);box-shadow:0 12px 30px #000a;display:flex;flex-direction:column;gap:8px;align-items:center}
.scard.t1{background:linear-gradient(135deg,#9aa3b8,#5a6378)}.scard.t2{background:linear-gradient(135deg,#f6c446,#b8861b)}
.sc-t{font-size:24px;font-weight:900;letter-spacing:4px;color:#fff;text-shadow:0 2px 0 #0006}
.sc-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.scell{position:relative;aspect-ratio:1;max-height:15vh;background:#fffbe9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:min(7vh,46px);overflow:hidden;touch-action:none}
.scell canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;transition:opacity .4s}
.scell.open canvas{opacity:0;pointer-events:none}
.scell.lit{box-shadow:0 0 0 4px #3ee08a,0 0 18px #3ee08a}
.sc-m{font-weight:800;color:#fff;min-height:20px}

/* mines */
.mfelt{background:radial-gradient(ellipse at 50% 30%,#22406a,#0c1a30 75%)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(calc(100vh - 230px),90%,470px);aspect-ratio:1}
.mt{border-radius:12px;background:linear-gradient(145deg,#3a4c78,#24304e);border:1px solid #5a6c9a;font-size:min(5.5vh,36px);box-shadow:0 4px 0 #141c30;transition:transform .1s}
.mgrid.live .mt:not(.gem):hover{transform:translateY(-2px);filter:brightness(1.25)}
.mt.gem{background:linear-gradient(145deg,#1f7a58,#0f4a34);animation:bin .3s}
.mt.bomb{background:#4a1a22}.mt.hit{background:#e2434b;animation:hitp .3s 3}
.mt.dim{opacity:.4}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mstat div,.dstats div,.potinfo div{background:#141830;border-radius:8px;padding:5px 8px}
.mstat small,.dstats small,.potinfo small{display:block;color:var(--mute);font-size:11px}
.mstat b,.dstats b,.potinfo b{font-size:18px}
.mn{min-width:26px;text-align:center;font-size:16px}

/* hi-lo */
.hlfelt{background:radial-gradient(ellipse at 50% 30%,#1e6a86,#0a2a36 75%)}
.hlmid{display:flex;align-items:center;gap:30px}
.hlc{display:flex;flex-direction:column;align-items:center;gap:10px;--cw:clamp(90px,20vh,150px)}
.hlmult{font-size:28px;font-weight:900;color:var(--gold2)}
.hlb{min-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hlb small{font-size:13px;font-weight:600;opacity:.9}
.hlb.hi{background:linear-gradient(#36c77b,#1f9a58);color:#04210f}.hlb.lo{background:linear-gradient(#ee5960,#b8323a)}
.hltrail{display:flex;gap:6px;min-height:70px;align-items:flex-end;--cw:40px}
.ht{display:flex;flex-direction:column;align-items:center;font-size:12px}

/* dice game */
.dfelt{background:radial-gradient(ellipse at 50% 30%,#2a3a9a,#0e1440 75%);justify-content:center;gap:16px}
.dnum{font-size:min(14vh,96px);font-weight:900;color:#fff;text-shadow:0 4px 18px #000}
.dnum.w{color:var(--win)}.dnum.l{color:var(--lose)}
.dtrack{position:relative;width:min(90%,640px);height:20px;border-radius:10px;background:#e2434b}
.dfill{position:absolute;top:0;bottom:0;background:#2fbf71;border-radius:10px}
.drange{position:absolute;inset:-6px 0;width:100%;margin:0;opacity:0;cursor:pointer;height:32px}
.dmark{position:absolute;top:-30px;transform:translateX(-50%);background:#fff;color:#111;font-weight:900;border-radius:6px;padding:0 6px;font-size:12px;pointer-events:none;transition:left .1s}
.dmark:empty{display:none}
.dmark.w,.dmark.l{width:6px;height:44px;top:-12px;padding:0;border-radius:3px}
.dmark.w{background:#fff;box-shadow:0 0 12px #3ee08a}.dmark.l{background:#fff;box-shadow:0 0 12px #ff6b6b}
.dticks{display:flex;justify-content:space-between;width:min(90%,640px);font-size:12px;color:var(--mute)}

// a canvas that keeps its backing store matched to its box
function fitCanvas(cv, draw) {
  const fit = () => { const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); if (!r.width || !r.height) return; const w = Math.round(r.width * d), hh = Math.round(r.height * d); if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; } draw && draw(); };
  const ro = new ResizeObserver(fit); ro.observe(cv); requestAnimationFrame(fit);
  return () => ro.disconnect();
}

// ---------- Plinko ----------
const pColor = m => (m >= 10 ? '#ff3b5c' : m >= 3 ? '#ff7a3b' : m >= 1.5 ? '#ffb43b' : m >= 1 ? '#e8d23b' : m >= 0.5 ? '#7fd36b' : '#3bb5a8');
defGame({ id: 'plinko', title: 'Plinko', group: 'machine', icon: '🔻', c1: '#7a2fbf', c2: '#2a0f45', blurb: 'Drop the ball, pick the risk',
  mount() {

    const cv = h('canvas', { class: 'pcv' }); F.main.append(h('div', { class: 'pbox' }, cv));
    let ball = null, lit = -1;
    function geo() { const W = cv.width, H = cv.height, gap = Math.min(W / (rows + 3), (H - 50) / (rows + 1.5)), top = gap * 0.9; return { W, H, gap, top, x0: W / 2 }; }

      const c = cv.getContext('2d'), G = geo(); c.clearRect(0, 0, G.W, G.H);
      for (let i = 0; i < rows; i++) for (let j = 0; j <= i + 2; j++) { const [x, y] = pegXY(i, j, G); c.beginPath(); c.arc(x, y, Math.max(2, G.gap * 0.09), 0, 7); c.fillStyle = '#dfe3ff'; c.fill(); }
      const T = tab(), by = G.top + rows * G.gap - G.gap * 0.3;
      T.forEach((m, k) => { const x = G.x0 + (k - rows / 2) * G.gap, w = G.gap * 0.92, hh = G.gap * 0.8; c.fillStyle = pColor(m); c.globalAlpha = lit === k ? 1 : 0.85; c.beginPath(); c.roundRect ? c.roundRect(x - w / 2, by + (lit === k ? 6 : 0), w, hh, 5) : c.rect(x - w / 2, by, w, hh); c.fill(); c.globalAlpha = 1; c.fillStyle = '#1a1020'; c.font = 'bold ' + Math.round(Math.min(G.gap * 0.3, 14 * (cv.width / cv.clientWidth || 1))) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(m >= 100 ? Math.round(m) : m, x, by + hh / 2 + (lit === k ? 6 : 0)); });
      if (ball) { c.beginPath(); c.arc(ball.x, ball.y, G.gap * 0.22, 0, 7); c.fillStyle = '#ff4fa3'; c.shadowColor = '#ff4fa3'; c.shadowBlur = 14; c.fill(); c.shadowBlur = 0; }
    }

    const segR = seg([8, 12, 16], rows, v => { rows = v; store.set('plinko:rows', v); lit = -1; draw(); paintSide(); }, 'Rows');
    const segK = seg(['low', 'med', 'high'], risk, v => { risk = v; store.set('plinko:risk', v); lit = -1; draw(); paintSide(); }, 'Risk');
    function paintSide() { side.innerHTML = ''; side.append(payTable('Pays (' + rows + ' rows, ' + risk + ')', tab().map((m, k) => ['Slot ' + (k + 1), fmtX(m)]), 'Middle slots are the most likely; the edges pay the most.')); }

// ---------- Lucky Wheel ----------
const WCOL = { 0: '#3a3f55', 1.2: '#2b6fe0', 1.5: '#1c9a55', 2: '#d9b21a', 3: '#e2731a', 5: '#8a3bd1', 10: '#e2434b' };
defGame({ id: 'wheel', title: 'Lucky Wheel', group: 'machine', icon: '🎡', c1: '#d9951a', c2: '#4a2c05', blurb: '60 slices, up to 10x',
  mount() {
    const def = this, WH = (S.tables && S.tables.wheel) || [], counts = {};
    WH.forEach(m => counts[m] = (counts[m] || 0) + 1);
    const F = gameFrame(def, payTable('The wheel', Object.keys(counts).sort((a, b) => b - a).map(m => [`<i class="sw" style="background:${WCOL[m] || '#555'}"></i>${fmtX(+m)}`, counts[m] + ' of ' + WH.length + ' slices']), 'Each slice is equally likely.'));
    // show the slices mixed around the rim (the server's index i is drawn at position pos[i])
    const N = WH.length || 60, order = []; { const by = {}; WH.forEach((m, i) => (by[m] = by[m] || []).push(i)); const ks = Object.keys(by).sort((a, b) => a - b); let left = N; const take = ks.map(k => by[k].slice()); let t = 0; while (left) { const m = take[t % take.length]; if (m.length) { order.push(m.shift()); left--; } t++; } }
    const pos = []; { const zeros = [], other = []; order.forEach(i => (WH[i] === 0 ? zeros : other).push(i)); const seq = []; let z = 0, o = 0; for (let p = 0; p < N; p++) { const wantZero = z < zeros.length && (o >= other.length || (p * zeros.length / N) >= z); seq.push(wantZero ? zeros[z++] : other[o++]); } seq.forEach((i, p) => pos[i] = p); }
    const cv = h('canvas', { class: 'wcv', width: 460, height: 460 }), out = h('div', { class: 'wout' }, '');
    F.main.append(h('div', { class: 'wbox' }, h('div', { class: 'wwrap' }, cv, h('div', { class: 'wptr' }, '▼')), out));
    let rot = 0, hit = -1;
    function draw() {
      const c = cv.getContext('2d'), W = cv.width, R = W / 2 - 8, st = 2 * Math.PI / N; c.clearRect(0, 0, W, W); c.save(); c.translate(W / 2, W / 2); c.rotate(rot);
      for (let i = 0; i < N; i++) { const p = pos[i], a0 = -Math.PI / 2 + (p - 0.5) * st; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, a0, a0 + st); c.closePath(); c.fillStyle = WCOL[WH[i]] || '#555'; c.fill(); c.strokeStyle = hit === i ? '#fff' : '#0006'; c.lineWidth = hit === i ? 4 : 1; c.stroke();
        c.save(); c.rotate(a0 + st / 2); c.fillStyle = '#fff'; c.font = 'bold 12px system-ui'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(WH[i] ? WH[i] + 'x' : '', R - 6, 0); c.restore(); }
      c.beginPath(); c.arc(0, 0, R * 0.22, 0, 7); c.fillStyle = '#15192e'; c.fill(); c.strokeStyle = '#f6c446'; c.lineWidth = 4; c.stroke(); c.restore();
      c.beginPath(); c.arc(W / 2, W / 2, R + 3, 0, 7); c.strokeStyle = '#f6c446'; c.lineWidth = 6; c.stroke();
    }
    draw();
    const bar = betBar(def, { label: 'Spin', go: spin }); F.bar.append(bar.el);
    async function spin() {
      await act(async () => {
        const rep = await call('wheel', { bet: bar.bet }, { hold: true }), r = rep.r; hit = -1; out.textContent = '';
        const st = 2 * Math.PI / N, r0 = rot; let r1 = -pos[r.slice] * st + (Math.random() - 0.5) * st * 0.7; while (r1 < r0 + 2 * Math.PI * 5) r1 += 2 * Math.PI;
        sfx.spin(); let lt = 0;
        await animate(() => tween(4600, e => { rot = r0 + (r1 - r0) * e; const k = Math.floor(rot / st); if (k !== lt) { lt = k; sfx.tick(); } draw(); }, p => 1 - Math.pow(1 - p, 4)));
        hit = r.slice; draw(); out.innerHTML = r.mult ? `<b style="color:${WCOL[r.mult]}">${fmtX(r.mult)}</b>` : 'Zero';
        finish('wheel', r.bet, r.win, fmtX(r.mult), F.main);
      });
    }
    return { root: F.root, primary: spin };
  } });

    function paint() {
      store.set('keno:picks', [...picks]); $$('.kc', grid).forEach(c => c.classList.toggle('on', picks.has(+c.dataset.n)));

      c.beginPath(); c.arc(0, 0, R * 0.36, 0, 7); c.fillStyle = '#15192e'; c.fill(); c.strokeStyle = '#f6c446'; c.lineWidth = 4; c.stroke(); c.restore();

// ---------- Duels ----------

// Start-up: the launcher (signed in, online) or the practice mock; the entrance screen; keys; the debug hook.
const forcePractice = /[?&]practice=1\b/.test(location.search);

  const prSw = sw('Practice mode (pretend chips)', false, v => { if (v) boot(true); });
  $('#main').append(h('div', { class: 'gate' }, h('div', { class: 'card' },
    h('div', { class: 'big-ico' }, '🍀🎰'), h('h1', null, 'The Lucky Goon'),
    h('p', null, reason || 'Open the casino from the Huntington Games launcher and sign in to play.'),
    waiting ? h('p', { class: 'small' }, 'Waiting for the Grapevine connection…') : null,
    h('div', { class: 'warn' }, h('b', null, 'Play money only. '), 'Goons and chips are not worth anything outside Huntington Games: they cannot be bought, sold or cashed out for real money or anything else.'),
    h('p', { class: 'small' }, 'Want to look around first? Practice mode plays every game with pretend chips and never talks to the server.'),

function welcome() {
  if (store.get('welcomed', false) || S.practice) return;
  modal(h('h2', null, '🍀 Welcome to The Lucky Goon'),
    h('p', null, 'Swap goons for chips at the cage (', h('b', { class: 'gold' }, '1 goon = ' + S.limits.rate + ' chips'), ') and play tables, machines and live games with everyone in the casino.'),
    h('div', { class: 'warn' }, h('b', null, 'Play money only. '), 'Goons and chips have no real-money value and cannot be bought, sold or cashed out for anything outside Huntington Games.'),
    h('p', { class: 'small' }, 'Every game keeps a small house edge (listed on the ? page), so over time the house wins. Play for fun.'),
    h('div', { class: 'mrow end' }, h('button', { class: 'btn', onclick: () => { closeModal(); openOdds(); } }, 'See the odds'), h('button', { class: 'btn gold', onclick: () => { store.set('welcomed', true); closeModal(); } }, 'Let\'s play')));
}

let booting = false;
async function boot(practice) {
  if (booting) return; booting = true;
  try {
    if (practice == null) practice = forcePractice;
    if (!practice && mockApi) mockApi.eco.casino('leave').catch(() => {});
    S.ready = false; setApi(practice);
    $('#foot-x').textContent = practice ? '· PRACTICE: pretend chips, nothing is saved.' : '';
    if (!practice) {
      const L = S.api;
      if (!L) return gate();
      if (!L.me || !L.me()) return gate('Sign in to Grapevine in the launcher to play.', false);
      if (L.online && !L.online()) { gate('Connecting to the casino…', true); waitOnline(); return; }
    }
    try { await enter(); } catch (e) { return gate(e.message || 'The casino did not answer.'); }
    openLobby(); welcome();
  } finally { booting = false; }
}

  const iv = setInterval(() => { tries++; if (S.practice || S.ready || !L || S.api !== L) return clearInterval(iv); if (L.online()) { clearInterval(iv); boot(false); } else if (tries > 60) { clearInterval(iv); gate('The casino is offline right now. Try again in a minute.'); } }, 1000);
}
