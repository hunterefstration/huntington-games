<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Lucky Goon</title>
<!--@css-->
</head>
<body>
<header id="top">
  <button class="tb-back" id="b-back" title="Back to the lobby (Esc)">&#8592; Lobby</button>
  <div class="logo" id="logo"><span class="lg-ico">&#127808;</span><span class="lg-t">The Lucky Goon</span><span class="pr-tag hidden" id="pr-tag">PRACTICE</span></div>
  <div class="bal" id="bal">
    <div class="bal-c" title="Your chips"><i class="chipi"></i><b id="bal-chips">0</b><small>chips</small></div>
    <div class="bal-g" title="Your goons"><span>&#129689;</span><b id="bal-goons">0</b><small>goons</small></div>
    <button class="tb-btn buy" id="b-buy">Buy chips</button>
    <button class="tb-btn" id="b-cash">Cash out</button>
  </div>
  <div class="tb-r">
    <button class="tb-ico" id="b-odds" title="How it works / the odds">?</button>
    <button class="tb-ico" id="b-fast" title="Fast animations (F)">&#9193;</button>
    <button class="tb-ico" id="b-mute" title="Sound (M)">&#128266;</button>
    <button class="tb-ico" id="b-set" title="Settings">&#9881;</button>
  </div>
</header>
<main id="main"></main>
<footer id="foot">Play money only. Goons and chips are not worth anything outside Huntington Games. <span id="foot-x"></span></footer>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<!--@js-->
</body>
</html>
