<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Element Lab</title>
<!--@css-->
</head>
<body>
<div id="app">
  <aside id="bench">
    <div id="brand"><div class="flask"><i></i></div><div><b>Element Lab</b><small id="ver">lab bench</small></div></div>
    <div class="searchbox"><input id="search" type="search" placeholder="Search elements..." autocomplete="off" spellcheck="false"><span id="search-n"></span></div>
    <div id="palette"></div>
    <div id="selinfo"></div>
  </aside>
  <main id="lab">
    <div id="bar">
      <div class="seg" id="tools"></div>
      <div class="seg" id="brushseg">
        <div class="shapes" id="shapes"></div>
        <label class="sz" title="Brush size ([ and ])"><input id="size-r" type="range" min="0" max="24" value="4"><span id="size-v">4</span></label>
        <div class="facing" id="facing" title="Which way new machines face (fans, pumps, pistons, conveyors, spouts, lasers)"></div>
      </div>
      <div class="seg" id="sim"></div>
      <div class="seg" id="views"></div>
      <div class="seg" id="acts"></div>
    </div>
    <section id="stage">
      <div id="wrap">
        <canvas id="view"></canvas><canvas id="glow"></canvas><canvas id="ov"></canvas><div id="cursor"></div>
      </div>
    </section>
    <div id="readout">
      <div class="ro" id="ro-el"><i id="ro-sw"></i><b id="ro-name">-</b></div>
      <div class="ro"><span>temp</span><b id="ro-t">-</b></div>
      <div class="ro"><span>charge</span><b id="ro-c">-</b></div>
      <div class="ro"><span>pressure</span><b id="ro-p">-</b></div>
      <div class="ro wide"><span id="ro-x">-</span></div>
      <div class="ro right"><span id="ro-perf">-</span></div>
    </div>
  </main>
</div>
<div id="toast"></div>

<div id="title" class="screen">
  <div class="tbg" id="tbg"></div>
  <div class="logo"><span class="l1">Element</span><span class="l2">Lab</span><span class="l3" id="t-ver">2.0</span></div>
  <div class="tag">Build reactors, circuits and cities. 300 elements, every one reacts.</div>
  <div class="menu">
    <button class="btn big" id="t-play">Enter the lab</button>
    <button class="btn" id="t-scenes">Example scenes</button>
    <button class="btn" id="t-cont">Continue</button>
    <button class="btn" id="t-chal">Challenges</button>
    <button class="btn" id="t-how">Lab guide</button>
    <button class="btn" id="t-set">Settings</button>
  </div>
  <div class="foot">Huntington Games</div>
</div>

<div id="dlg" class="screen dim hidden">
  <div class="card"><h2 id="dlg-t"></h2><div id="dlg-b"></div><div class="row"><button class="btn small" id="dlg-x">Close</button></div></div>
</div>

<!--@data-->
<!--@js-->
</body>
</html>
