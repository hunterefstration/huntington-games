<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Element Lab</title>
<style>
:root { --bg: #0b0e17; --panel: #121827; --panel2: #1a2236; --line: #2a3550; --txt: #e8edf8; --dim: #8b97b5; --acc: #ff9d3c; --acc2: #ffd36b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-size: 14px; user-select: none; -webkit-user-select: none; }
.hidden { display: none !important; }
#app { display: flex; flex-direction: column; height: 100%; }
#top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#brand { font-weight: 800; letter-spacing: .06em; font-size: 17px; text-transform: uppercase; color: var(--txt); }
#brand b { color: var(--acc); }
.grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tb { font: inherit; font-weight: 700; font-size: 13px; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 9px; cursor: pointer; }
.tb:hover { border-color: var(--acc); }
.tb.on { background: var(--acc); color: #1b1004; border-color: var(--acc2); }
#size label { color: var(--dim); font-size: 12px; }
#size input { width: 90px; accent-color: var(--acc); }
#size-v { min-width: 18px; color: var(--acc2); font-weight: 700; }
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 4px; }
#wrap { position: relative; background: #0e121e; box-shadow: 0 0 0 1px var(--line), 0 8px 30px rgba(0,0,0,.5); touch-action: none; cursor: crosshair; }
#wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
#glow { image-rendering: auto !important; mix-blend-mode: screen; opacity: .85; }
#cursor { position: absolute; border: 1px solid rgba(255,255,255,.75); border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
#hover { position: absolute; left: 8px; bottom: 6px; padding: 3px 9px; font-size: 12px; background: rgba(10,14,24,.78); border: 1px solid var(--line); border-radius: 6px; color: var(--txt); pointer-events: none; }
#side { width: 276px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); padding: 6px; gap: 6px; min-height: 0; }
#cats { display: flex; flex-wrap: wrap; gap: 3px; }
#cats .tb { padding: 3px 7px; font-size: 12px; }
#search { font: inherit; padding: 6px 8px; background: #0d1220; color: var(--txt); border: 1px solid var(--line); border-radius: 7px; user-select: text; -webkit-user-select: text; }
#els { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; align-content: start; padding-right: 2px; }
.el { font: inherit; font-weight: 800; font-size: 12px; border: 2px solid rgba(0,0,0,.35); border-radius: 8px; padding: 9px 2px; cursor: pointer;
  text-shadow: 0 1px 2px rgba(0,0,0,.45); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.el:hover { filter: brightness(1.15); }
.el.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--acc), 0 0 12px rgba(255,157,60,.6); }
#toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(12,16,28,.95); border: 1px solid var(--acc); color: var(--txt);
  padding: 8px 16px; border-radius: 10px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 80; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }

.screen { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#title { background: radial-gradient(ellipse at 50% 100%, rgba(255,120,30,.35), rgba(8,10,20,.82) 60%), rgba(8,10,20,.55); }
.tbg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tbg i { position: absolute; bottom: -10px; width: 6px; height: 6px; background: var(--acc); border-radius: 1px; opacity: 0; animation: rise 4s linear infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-80vh) translateX(30px); opacity: 0; } }
.logo { position: relative; text-align: center; line-height: .9; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
.logo .l1 { display: block; font-size: min(11vw, 84px); color: #f4f7ff; text-shadow: 0 4px 0 #2a3550, 0 0 30px rgba(120,170,255,.4); }
.logo .l2 { display: block; font-size: min(14vw, 110px); background: linear-gradient(180deg, #fff1c4, #ff9d3c 55%, #e5421b); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #6b2a0c); }
.tag { position: relative; margin: 10px 14px 18px; color: var(--dim); font-size: 16px; text-align: center; }
.menu { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; }
.foot { position: absolute; bottom: 10px; color: var(--dim); font-size: 12px; letter-spacing: .1em; }
.btn { font: inherit; font-weight: 800; color: #2b1a05; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 20px; min-width: 150px; font-size: 16px;
  background: linear-gradient(180deg, #fff1c4, #ffd36b 45%, #f0a43a); box-shadow: 0 4px 0 #a8611c, 0 6px 16px rgba(255,170,60,.3); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8611c; }
.btn.big { font-size: 22px; padding: 14px 40px; min-width: 100%; }
.btn.small { min-width: 0; font-size: 13px; padding: 7px 14px; }
.dim { background: rgba(5,7,14,.78); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; width: min(94vw, 640px); max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.card h2 { margin: 0 0 10px; color: var(--acc2); letter-spacing: .05em; text-transform: uppercase; font-size: 18px; }
.card p, .card li { color: var(--txt); line-height: 1.45; margin: 4px 0; }
.card ul { padding-left: 18px; margin: 6px 0; }
.card kbd { background: #0d1220; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.opt { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.opt span { color: var(--dim); font-size: 12px; display: block; }
.scn, .chal { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); font: inherit; cursor: pointer; }
.scn:hover { border-color: var(--acc); }
.scn b, .chal b { color: var(--acc2); } .scn span, .chal span { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.chal { cursor: default; } .chal.done { border-color: #4fcf6a; } .chal.done b::after { content: "  done"; color: #4fcf6a; font-size: 12px; }
textarea { width: 100%; min-height: 90px; background: #0d1220; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px monospace; user-select: text; -webkit-user-select: text; resize: vertical; }

@media (max-width: 760px) {
  #main { flex-direction: column; }
  #side { width: 100%; height: 38%; border-left: 0; border-top: 1px solid var(--line); }
  #els { grid-template-columns: repeat(4, 1fr); }
  #brand { display: none; }
  .tb { padding: 5px 7px; font-size: 12px; }
}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">Element <b>Lab</b></div>
    <div id="tools" class="grp"></div>
    <div id="size" class="grp"><label for="size-r">Size</label><input id="size-r" type="range" min="0" max="20" value="4"><span id="size-v">4</span></div>
    <div id="sim" class="grp"></div>
    <div id="acts" class="grp"></div>
  </header>
  <main id="main">
    <section id="stage">
      <div id="wrap">
        <canvas id="view"></canvas><canvas id="glow"></canvas><canvas id="ov"></canvas><div id="cursor"></div>
      </div>
      <div id="hover">Move the mouse over the lab</div>
    </section>
    <aside id="side">
      <div id="cats"></div>
      <input id="search" type="search" placeholder="Search elements..." autocomplete="off">
      <div id="els"></div>
    </aside>
  </main>
</div>
<div id="toast"></div>

<div id="title" class="screen">
  <div class="tbg" id="tbg"></div>
  <div class="logo"><span class="l1">Element</span><span class="l2">Lab</span></div>
  <div class="tag">Mix, melt, burn and blow things up. Everything reacts.</div>
  <div class="menu">
    <button class="btn big" id="t-play">Play</button>
    <button class="btn" id="t-scenes">Scenes</button>
    <button class="btn" id="t-cont">Continue</button>
    <button class="btn" id="t-chal">Challenges</button>
    <button class="btn" id="t-how">How to play</button>
    <button class="btn" id="t-set">Settings</button>
  </div>
  <div class="foot">Huntington Games</div>
</div>

<div id="dlg" class="screen dim hidden">
  <div class="card"><h2 id="dlg-t"></h2><div id="dlg-b"></div><div class="row"><button class="btn small" id="dlg-x">Close</button></div></div>

// ---- 00-core.js ----
// ==========================================
// ELEMENT LAB - core: helpers, saves, settings, sound
// ==========================================
const AMB = 20;                                   // room temperature, degrees C
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);

// small xorshift random: fast and (with seedRnd) repeatable for tests
let rs = 2463534242;
function rnd() { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return (rs >>> 0) / 4294967296; }
const rndi = n => (rnd() * n) | 0;
function seedRnd(s) { rs = (s | 0) || 1; }

// ---------- saves (every key starts with elementlab_) ----------
const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const QUAL = [{ n: 'Low', w: 160, h: 90 }, { n: 'Medium', w: 240, h: 135 }, { n: 'High', w: 320, h: 180 }];
const SETTINGS = Object.assign({ quality: 1, sound: true, overlay: false, glow: true, fx: true, replace: false, seenHelp: false },
    LS.get('elementlab_settings', {}) || {});
if (!(SETTINGS.quality >= 0 && SETTINGS.quality < QUAL.length)) SETTINGS.quality = 1;
function saveSettings() { LS.set('elementlab_settings', SETTINGS); }

// ---------- sound (WebAudio, short synthesized effects; silent until the first click) ----------
let AC = null, NOISE = null;
const SFX_GAP = { sizzle: 140, boom: 60, splash: 160, zap: 120, pop: 80, ding: 200 };
const sfxLast = {};
function audioUnlock() {
    try {
        if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
        if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
}
function noiseBuffer() {
    if (NOISE) return NOISE;
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return NOISE;
}
function sfx(kind, vol) {
    if (!AC || !SETTINGS.sound || AC.state !== 'running') return;
    vol = vol === undefined ? 1 : vol;
    const now = performance.now();
    if (now - (sfxLast[kind] || 0) < (SFX_GAP[kind] || 80)) return;
    sfxLast[kind] = now;
    try {
        const t = AC.currentTime, g = AC.createGain();
        g.connect(AC.destination);
        const env = (peak, dur, atk) => {
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * vol), t + (atk || 0.01));
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        };
        const noise = (dur, type, f0, f1, q) => {
            const s = AC.createBufferSource(); s.buffer = noiseBuffer(); s.loop = true;
            const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
            f.frequency.setValueAtTime(f0, t);
            if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
            s.connect(f); f.connect(g); s.start(t); s.stop(t + dur + 0.05);
        };
        const tone = (type, f0, f1, dur) => {
            const o = AC.createOscillator(); o.type = type;
            o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            o.connect(g); o.start(t); o.stop(t + dur + 0.05);
        };
        if (kind === 'sizzle') { env(0.09, 0.4, 0.03); noise(0.4, 'highpass', 3200, 5000, 0.7); }
        else if (kind === 'boom') { env(0.5, 0.7, 0.005); noise(0.7, 'lowpass', 900, 70, 0.8); tone('sine', 110, 28, 0.6); }
        else if (kind === 'splash') { env(0.14, 0.28, 0.02); noise(0.28, 'bandpass', 700, 1800, 1.2); }
        else if (kind === 'zap') { env(0.12, 0.18, 0.003); tone('sawtooth', 1400, 90, 0.18); }
        else if (kind === 'pop') { env(0.12, 0.1, 0.002); tone('square', 420, 120, 0.09); }
        else if (kind === 'ding') { env(0.12, 0.5, 0.01); tone('triangle', 660, 990, 0.35); }
    } catch (e) { /* audio is optional */ }
}

        for (let s = 1; s < stops.length; s++) { if (t <= stops[s][0]) { a = stops[s - 1]; b = stops[s]; break; } a = stops[s - 1]; b = stops[s]; }

        HEATLUT[k] = pack((a[1] + (b[1] - a[1]) * f) | 0, (a[2] + (b[2] - a[2]) * f) | 0, (a[3] + (b[3] - a[3]) * f) | 0);

let cv, ctx, img, buf, gcv, gctx, gimg, gbuf, GWID = 0, GHEI = 0, gacc, ocv, octx, fr = 0;
let preview = null;                                // {type: 'line' | 'rect', x0, y0, x1, y1} drawn while dragging

function initRender() {
    cv = $('view'); cv.width = W; cv.height = H;
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(W, H); buf = new Uint32Array(img.data.buffer);
    GWID = Math.max(2, W >> 2); GHEI = Math.max(2, H >> 2);

function layoutStage() {
    const st_ = $('stage'), wrap = $('wrap');

    let s = Math.min(aw / W, ah / H);

function heatTint(c, t) {

        case 2: return pack(255, 255, 150 + ((rnd() * 105) | 0));

function render() {

    }

    }

}

function drawOverlay() {
    const g = octx;
    g.clearRect(0, 0, W, H);
    if (preview) {
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1;
        if (preview.type === 'line') lineCells(preview.x0, preview.y0, preview.x1, preview.y1, (x, y) => g.fillRect(x, y, 1, 1));
        else {
            const a = Math.min(preview.x0, preview.x1), b = Math.min(preview.y0, preview.y1);
            g.strokeRect(a + 0.5, b + 0.5, Math.abs(preview.x1 - preview.x0), Math.abs(preview.y1 - preview.y0));
        }
    }
    if (SETTINGS.fx) for (let q = flashes.length - 1; q >= 0; q--) {
        const f = flashes[q], p = f.t / f.max;
        if (p >= 1) { flashes.splice(q, 1); continue; }
        const rad = f.r * (0.6 + p * 1.1);
        const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
        gr.addColorStop(0, 'rgba(255,240,200,' + (0.85 * (1 - p)).toFixed(2) + ')');
        gr.addColorStop(0.5, 'rgba(255,170,60,' + (0.45 * (1 - p)).toFixed(2) + ')');
        gr.addColorStop(1, 'rgba(255,100,20,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, rad, 0, 6.283); g.fill();
        f.t++;
    } else flashes.length = 0;
    for (let q = bolts.length - 1; q >= 0; q--) {
        const b = bolts[q];
        if (--b.t <= 0) { bolts.splice(q, 1); continue; }
        g.strokeStyle = 'rgba(230,240,255,' + (b.t / 7).toFixed(2) + ')'; g.lineWidth = 1.4;

    const stg = $('wrap');
    if (shakeT > 0 && SETTINGS.fx) { shakeT--; stg.style.transform = 'translate(' + ((rnd() - 0.5) * shakeT * 0.8).toFixed(1) + 'px,' + ((rnd() - 0.5) * shakeT * 0.8).toFixed(1) + 'px)'; }
    else if (stg.style.transform) stg.style.transform = '';
}

// ==========================================
// ELEMENT LAB - mouse / touch input and keyboard shortcuts
// ==========================================
const ptr = { gx: -1, gy: -1, inside: false };
let drag = null, holdFrames = 0;
let paused = false, speed = 1;
let onToolChange = null, onUiRefresh = null;

function toGrid(ev) {
    const r = $('wrap').getBoundingClientRect();
    return { x: Math.floor((ev.clientX - r.left) / r.width * W), y: Math.floor((ev.clientY - r.top) / r.height * H) };
}
function placeCursor() {
    const c = $('cursor'), wrap = $('wrap');
    if (!c) return;
    if (!ptr.inside || tool === 'zap' || (drag && (tool === 'line' || tool === 'rect'))) { c.style.display = 'none'; return; }
    const cell = wrap.clientWidth / W, d = (brushR * 2 + 1) * cell;
    c.style.display = 'block'; c.style.width = c.style.height = d + 'px';
    c.style.left = ((ptr.gx + 0.5) * cell - d / 2) + 'px'; c.style.top = ((ptr.gy + 0.5) * cell - d / 2) + 'px';
}
function applyHold() {                             // runs every frame while the button is down
    if (!drag) return;
    holdFrames++;
    const x = drag.lx, y = drag.ly;
    if (tool === 'brush' || tool === 'erase') paintAt(x, y);
    else if (tool === 'heat') heatAt(x, y, 45);
    else if (tool === 'cool') heatAt(x, y, -45);
    else if (tool === 'zap' && holdFrames % 14 === 0) zapAt(x, y);
    dirtySave = true;
}
function pDown(ev) {
    if (drag) return;
    audioUnlock();
    if (ev.button !== undefined && ev.button > 0 && ev.pointerType === 'mouse') return;
    ev.preventDefault();
    try { $('wrap').setPointerCapture(ev.pointerId); } catch (e) { }
    const g = toGrid(ev);
    ptr.gx = g.x; ptr.gy = g.y; ptr.inside = true;
    drag = { id: ev.pointerId, x0: g.x, y0: g.y, lx: g.x, ly: g.y };
    holdFrames = 0;
    if (tool !== 'zap') pushUndo();
    if (tool === 'brush' || tool === 'erase') { paintAt(g.x, g.y); if (curEl === ID.water && tool === 'brush') sfx('splash', 0.6); }
    else if (tool === 'zap') { zapAt(g.x, g.y); holdFrames = 1; }
    else if (tool === 'line' || tool === 'rect') preview = { type: tool, x0: g.x, y0: g.y, x1: g.x, y1: g.y };
    dirtySave = true; placeCursor();
}
function pMove(ev) {
    const g = toGrid(ev);
    ptr.gx = g.x; ptr.gy = g.y; ptr.inside = g.x >= 0 && g.y >= 0 && g.x < W && g.y < H;

        if (tool === 'brush' || tool === 'erase') strokeTo(px, py, g.x, g.y);
        else if (tool === 'heat') heatAt(g.x, g.y, 30);
        else if (tool === 'cool') heatAt(g.x, g.y, -30);
        else if (tool === 'wind') windAt(g.x, g.y, (g.x - px) * 1.2, (g.y - py) * 1.2);
        else if (preview) { preview.x1 = g.x; preview.y1 = g.y; }

        dirtySave = true;
    }
    placeCursor();
}
function pUp(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    if (preview) {

        else fillRect(preview.x0, preview.y0, preview.x1, preview.y1, tool === 'erase' ? 0 : curEl);

    }

}
function pLeave() { if (!drag) { ptr.inside = false; placeCursor(); } }
function setTool(t) { tool = t; preview = null; if (onToolChange) onToolChange(); placeCursor(); }
function setBrush(r) { brushR = clamp(r | 0, 0, 30); if (onToolChange) onToolChange(); placeCursor(); }
function togglePause() { paused = !paused; if (onUiRefresh) onUiRefresh(); }
function doUndo() { if (undo()) toast('Undone'); else toast('Nothing to undo'); }

function initInput() {
    const w = $('wrap');
    w.addEventListener('pointerdown', pDown);
    w.addEventListener('pointermove', pMove);
    w.addEventListener('pointerup', pUp);
    w.addEventListener('pointercancel', pUp);
    w.addEventListener('pointerleave', pLeave);
    w.addEventListener('contextmenu', e => e.preventDefault());
    w.addEventListener('wheel', e => { e.preventDefault(); setBrush(brushR + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    window.addEventListener('keydown', ev => {
        if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) && ev.key !== 'Escape') return;
        if (!$('title').classList.contains('hidden') || !$('dlg').classList.contains('hidden')) { if (ev.key === 'Escape') closeDlg(); return; }
        const k = ev.key.toLowerCase();
        if (ev.ctrlKey || ev.metaKey) { if (k === 'z') { ev.preventDefault(); doUndo(); } return; }
        const map = { b: 'brush', l: 'line', r: 'rect', e: 'erase', h: 'heat', c: 'cool', w: 'wind', z: 'zap' };

        else if (k === '.') stepOnce();
        else if (k === '[') setBrush(brushR - 1);
        else if (k === ']') setBrush(brushR + 1);
        else if (k === 'u') doUndo();
    });
}

// ---------- share code: run-length encoded element ids, base64. "EL1.<w>x<h>.<data>" ----------
function encodeScene() {
    const out = [];
    let run = 0, prev = -1;
    const flush = () => { if (run) { out.push(prev); let r = run; while (r >= 128) { out.push((r & 127) | 128); r >>= 7; } out.push(r); } };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const e = el[ix(x, y)];
        if (e === prev) run++; else { flush(); prev = e; run = 1; }
    }
    flush();
    let s = ''; for (let i = 0; i < out.length; i++) s += String.fromCharCode(out[i]);
    return 'EL1.' + W + 'x' + H + '.' + btoa(s).replace(/=+$/, '');
}
function decodeScene(code) {
    const m = /^EL1\.(\d+)x(\d+)\.([A-Za-z0-9+/]*)$/.exec(String(code).replace(/\s+/g, ''));
    if (!m) return false;
    const w = +m[1], h = +m[2];
    if (w < 8 || h < 8 || w > 1000 || h > 1000) return false;
    let bin; try { bin = atob(m[3]); } catch (e) { return false; }
    const cells = new Uint8Array(w * h);
    let n = 0, p = 0;
    while (p < bin.length && n < cells.length) {
        const e = bin.charCodeAt(p++);
        let r = 0, sh = 0, b;
        do { if (p >= bin.length) return false; b = bin.charCodeAt(p++); r |= (b & 127) << sh; sh += 7; } while (b & 128);
        if (e >= NE) return false;
        for (let k = 0; k < r && n < cells.length; k++) cells[n++] = e;
    }
    if (n !== cells.length) return false;
    pushUndo(); clearGrid();
    for (let y = 0; y < H; y++) {
        const sy = Math.min(h - 1, Math.floor(y * h / H));
        for (let x = 0; x < W; x++) {
            const e = cells[sy * w + Math.min(w - 1, Math.floor(x * w / W))];
            if (e) setUser(ix(x, y), e);
        }
    }
    wakeAll();
    return true;
}

// ---------- screenshot: the scene, glow included, scaled up 4x, saved as a PNG ----------

    const s = 4, c = document.createElement('canvas');
    c.width = W * s; c.height = H * s;

    g.imageSmoothingEnabled = false; g.drawImage(cv, 0, 0, c.width, c.height);
    if (SETTINGS.glow) { g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.8; g.drawImage(gcv, 0, 0, c.width, c.height); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    g.imageSmoothingEnabled = false; g.drawImage(ocv, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'element-lab.png';
    document.body.appendChild(a); a.click(); a.remove();
    return url.length;
}

// ---- 90-main.js ----
// ==========================================
// ELEMENT LAB - start up, main loop, debug hook (window.__elementlab)
// ==========================================
let lastT = 0, acc = 0, simMs = 0, drawMs = 0, frameCount = 0, slowFrames = 0, hintShown = false;
const frameLog = [];

function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, t - lastT || 16); lastT = t;
    const f0 = performance.now();
    const title = !$('title').classList.contains('hidden');
    if (!paused) {
        acc += dt * speed * 0.06;
        let n = Math.floor(acc); acc -= n;
        if (n > 3) n = 3;
        if (simMs > 12 && n > 1) n = 1;            // a slow machine: slow the simulation down instead of freezing the page
        const s0 = performance.now();
        for (let k = 0; k < n; k++) step();
        simMs = simMs * 0.8 + (performance.now() - s0) * 0.2;
    }
    if (!title) applyHold();
    const r0 = performance.now();
    render();
    drawMs = drawMs * 0.8 + (performance.now() - r0) * 0.2;
    if (!title) updateHover();
    frameCount++;
    if (frameCount % 20 === 0) { recount(); checkChallenges(); }
    if (frameCount % 600 === 0) autosave();
    frameLog.push(dt); if (frameLog.length > 120) frameLog.shift();
    if (!title && !hintShown && frameLog.length >= 100 && SETTINGS.quality > 0) {
        const avg = frameLog.reduce((a, b) => a + b, 0) / frameLog.length;
        if (avg > 30) { hintShown = true; toast('Running slowly? Try Low quality in Settings.'); }
    }
}

function init() {
    allocGrid(QUAL[SETTINGS.quality].w, QUAL[SETTINGS.quality].h);
    initRender(); buildTop(); buildPalette(); initInput(); initTitle();
    curEl = ID.sand;
    SCENES.lab.build();                            // something to watch behind the title screen
    wakeAll(); refreshUi();
    onChallenge = c => toast('Challenge complete: ' + c.name);
    window.addEventListener('resize', layoutStage);
    window.addEventListener('pagehide', () => { dirtySave = true; autosave(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { dirtySave = true; autosave(); } });
    requestAnimationFrame(frame);
}

window.__elementlab = {
    ID, DEFS, STAT, MADE, SETTINGS,
    get W() { return W; }, get H() { return H; }, get tick() { return tickN; },
    get el() { return el; }, get tp() { return tp; }, get life() { return life; }, get aux() { return aux; },
    get chainMax() { return chainMax; }, get particles() { return nParts; },
    start() { startPlay(); },
    seed(n) { seedRnd(n); },
    clear() { clearGrid(); },
    idx: (x, y) => ix(x, y),
    place(x, y, name, temp) { if (!inb(x, y)) return false; const i = ix(x, y); if (name === 'empty') clr(i); else setUser(i, ID[name]); if (temp !== undefined) tp[i] = temp; wk(x, y); return true; },
    fill(x0, y0, x1, y1, name, temp) { fillRect(x0, y0, x1, y1, ID[name], true); if (temp !== undefined) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (el[ix(x, y)]) tp[ix(x, y)] = temp; },
    paint(name, x, y, r) { paintCircle(x, y, r === undefined ? brushR : r, ID[name], 1); },
    get(x, y) { const i = ix(x, y); return { el: DEFS[el[i]].name, t: tp[i], life: life[i], aux: aux[i] }; },
    heat(x, y, r, d) { const o = brushR; brushR = r; heatAt(x, y, d); brushR = o; },
    step(n) { const t0 = performance.now(); for (let k = 0; k < (n || 1); k++) step(); return performance.now() - t0; },
    render() { const t0 = performance.now(); render(); return performance.now() - t0; },
    count(name) { recount(); if (name) return CNT[ID[name]]; const o = {}; for (let e = 1; e < NE; e++) if (CNT[e]) o[DEFS[e].name] = CNT[e]; return o; },
    total() { recount(); let n = 0; for (let e = 1; e < NE; e++) n += CNT[e]; return n; },
    scene(name) { return loadScene(name); },
    scenes: () => Object.keys(SCENES),
    setQuality(q) { changeQuality(q); },
    explode(x, y, r) { queueBoom(x, y, r, 1, 0); },
    lightning(x, y) { lightning(x, y); },
    shareCode: () => encodeScene(), loadCode: c => decodeScene(c),
    challenges: () => CHALLENGES.map(c => ({ id: c.id, done: !!DONE[c.id] })),
    checkChallenges, undo: () => undo(), pushUndo, activeChunks,
    setTool, setBrush, selectElement: n => selectElement(ID[n]),
    pause(v) { paused = v === undefined ? !paused : v; refreshUi(); },
    perf: () => ({ simMs, drawMs, frames: frameLog.slice(), active: activeChunks(), chunks: act.length })
};

init();
