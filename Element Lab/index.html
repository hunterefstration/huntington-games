<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Element Lab</title>
<style>
:root { --bg: #05070f; --glass: rgba(16, 24, 44, .86); --glass2: rgba(28, 40, 68, .7); --line: rgba(120, 220, 255, .16); --line2: rgba(120, 220, 255, .32);
  --txt: #e6f3ff; --dim: #7f93b8; --neon: #3ff0ff; --neon2: #ff4fd8; --lime: #9dff6a; --warn: #ffb347; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--txt); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 13px;
  user-select: none; -webkit-user-select: none;
  background: radial-gradient(1200px 600px at 75% -10%, rgba(63, 240, 255, .10), transparent 60%), radial-gradient(900px 600px at -10% 110%, rgba(255, 79, 216, .10), transparent 60%), var(--bg); }
.hidden { display: none !important; }
#app { display: flex; height: 100%; gap: 8px; padding: 8px; }
button { font: inherit; }

/* ---- the lab bench (left) ---- */
#bench { width: 278px; flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 10px; border-radius: 16px;
  background: var(--glass); border: 1px solid var(--line);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05); }
#brand { display: flex; align-items: center; gap: 10px; }
#brand b { display: block; font-size: 16px; letter-spacing: .04em; background: linear-gradient(90deg, var(--neon), #b8a6ff 60%, var(--neon2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#brand small { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.flask { width: 30px; height: 34px; position: relative; }
.flask::before { content: ""; position: absolute; left: 10px; top: 0; width: 10px; height: 12px; border: 2px solid var(--neon); border-bottom: 0; border-radius: 2px 2px 0 0; }
.flask::after { content: ""; position: absolute; left: 2px; top: 11px; width: 26px; height: 22px; border: 2px solid var(--neon); border-radius: 4px 4px 12px 12px; box-shadow: 0 0 10px rgba(63, 240, 255, .5); }
.flask i { position: absolute; left: 5px; bottom: 4px; width: 20px; height: 9px; border-radius: 0 0 9px 9px; background: linear-gradient(180deg, var(--lime), #3fbf6a); box-shadow: 0 0 12px var(--lime); z-index: 1; }
.searchbox { position: relative; }
#search { width: 100%; font: inherit; padding: 8px 54px 8px 30px; color: var(--txt); background: rgba(5, 8, 18, .7); border: 1px solid var(--line2); border-radius: 10px; outline: none;
  user-select: text; -webkit-user-select: text; }
#search:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(63, 240, 255, .15); }
.searchbox::before { content: ""; position: absolute; left: 11px; top: 10px; width: 9px; height: 9px; border: 2px solid var(--dim); border-radius: 50%; }
.searchbox::after { content: ""; position: absolute; left: 20px; top: 20px; width: 6px; height: 2px; background: var(--dim); transform: rotate(45deg); }
#search-n { position: absolute; right: 10px; top: 9px; color: var(--dim); font-size: 11px; }
#palette { flex: 1; overflow-y: auto; min-height: 0; padding-right: 3px; scrollbar-width: thin; scrollbar-color: rgba(120, 220, 255, .3) transparent; }
.cat { margin-bottom: 4px; border-radius: 10px; background: rgba(255, 255, 255, .02); }
.cat > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; font-weight: 700; letter-spacing: .04em; color: #cfe6ff; }
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid var(--dim); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
.cat[open] > summary::before { transform: rotate(90deg); border-left-color: var(--neon); }
.cat > summary:hover { background: rgba(63, 240, 255, .07); }
.cat .n { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 11px; }
.cat .cdot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px 4px 8px; }
.chip { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: 8px; border: 1px solid transparent; background: rgba(255, 255, 255, .035); color: var(--txt);
  cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; font-size: 12px; }
.chip i { flex: none; width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), 0 0 6px rgba(0, 0, 0, .4); }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip:hover { background: rgba(63, 240, 255, .08); border-color: var(--line); }
.chip.sel { border-color: var(--neon); background: rgba(63, 240, 255, .13); box-shadow: 0 0 12px rgba(63, 240, 255, .25); }
#selinfo { border-top: 1px solid var(--line); padding-top: 8px; min-height: 54px; font-size: 12px; color: var(--dim); line-height: 1.35; }
#selinfo b { color: var(--txt); font-size: 13px; }
#selinfo .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; box-shadow: 0 0 8px currentColor; }

/* ---- the lab (right): toolbar, stage, readout ---- */
#lab { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
.tb { display: inline-flex; align-items: center; gap: 5px; color: var(--txt); background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 5px 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
.tb svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb:hover { background: rgba(63, 240, 255, .08); }
.tb.on { color: #041016; background: linear-gradient(180deg, #8ff8ff, var(--neon)); box-shadow: 0 0 14px rgba(63, 240, 255, .45); }
.tb.hot.on { background: linear-gradient(180deg, #ffb0f0, var(--neon2)); box-shadow: 0 0 14px rgba(255, 79, 216, .45); }
.tb.ic { padding: 5px 6px; }
.shapes { display: flex; gap: 1px; }
.sz { display: flex; align-items: center; gap: 4px; padding: 0 6px; color: var(--dim); }
.sz input { width: 80px; accent-color: var(--neon); }
#size-v { min-width: 16px; color: var(--neon); font-weight: 700; font-variant-numeric: tabular-nums; }
.facing { display: flex; gap: 1px; }
#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 16px; padding: 4px;
  background: repeating-linear-gradient(0deg, rgba(120, 220, 255, .03) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(120, 220, 255, .03) 0 1px, transparent 1px 24px), rgba(4, 6, 14, .6);
  border: 1px solid var(--line); }
#wrap { position: relative; background: #090c16; border-radius: 6px; box-shadow: 0 0 0 1px var(--line2), 0 0 40px rgba(63, 240, 255, .08), 0 14px 40px rgba(0, 0, 0, .6); touch-action: none; cursor: crosshair; overflow: hidden; }
#wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
#glow { image-rendering: auto !important; mix-blend-mode: screen; opacity: .9; }
#cursor { position: absolute; border: 1px solid rgba(63, 240, 255, .9); border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 8px rgba(63, 240, 255, .6); }
#cursor.sq { border-radius: 2px; }
#cursor.spray { border-style: dashed; }
#readout { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; font-variant-numeric: tabular-nums; }
.ro { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); font-size: 12px; min-width: 92px; }
.ro span { color: var(--dim); }
.ro b { color: var(--neon); font-weight: 700; }
.ro.wide { flex: 1; min-width: 120px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ro.right { margin-left: auto; }
#ro-el { min-width: 150px; }
#ro-el b { color: var(--txt); }
#ro-sw { width: 12px; height: 12px; border-radius: 3px; background: #222; box-shadow: 0 0 8px rgba(255, 255, 255, .2); }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(8, 14, 28, .92); border: 1px solid var(--neon); color: var(--txt);
  padding: 8px 16px; border-radius: 12px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 80; max-width: 90vw; text-align: center; box-shadow: 0 0 20px rgba(63, 240, 255, .3); }
#toast.on { opacity: 1; }

/* ---- title and dialogs ---- */
.screen { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#title { background: radial-gradient(ellipse at 50% 30%, rgba(63, 240, 255, .16), rgba(4, 6, 14, .9) 60%), rgba(4, 6, 14, .6); }
.tbg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tbg i { position: absolute; bottom: -12px; width: 8px; height: 8px; border-radius: 50%; opacity: 0; animation: rise 5s linear infinite; box-shadow: 0 0 10px currentColor; }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-85vh) translateX(20px) scale(1.2); opacity: 0; } }
.logo { position: relative; text-align: center; line-height: .9; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; }
.logo .l1 { display: block; font-size: min(9vw, 66px); color: #eaf8ff; text-shadow: 0 0 22px rgba(63, 240, 255, .7); }
.logo .l2 { display: block; font-size: min(15vw, 120px); background: linear-gradient(90deg, var(--neon), #b8a6ff 50%, var(--neon2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(63, 240, 255, .45)); }
.logo .l3 { position: absolute; right: -40px; top: 6px; font-size: 16px; padding: 3px 8px; border-radius: 8px; color: #041016; background: var(--lime); letter-spacing: .05em; box-shadow: 0 0 16px var(--lime); }
.tag { position: relative; margin: 14px 14px 22px; color: var(--dim); font-size: 16px; text-align: center; }
.menu { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(92vw, 460px); }
.foot { position: absolute; bottom: 10px; color: var(--dim); font-size: 12px; letter-spacing: .14em; }
.btn { color: var(--txt); cursor: pointer; border-radius: 12px; padding: 10px 16px; font-size: 15px; font-weight: 700; letter-spacing: .02em;
  background: linear-gradient(180deg, rgba(63, 240, 255, .14), rgba(63, 240, 255, .04)); border: 1px solid var(--line2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.btn:hover { border-color: var(--neon); box-shadow: 0 0 16px rgba(63, 240, 255, .3); }
.btn:active { transform: translateY(1px); }
.btn.big { grid-column: 1 / -1; font-size: 20px; padding: 14px; color: #041016; background: linear-gradient(90deg, var(--neon), #b8a6ff 55%, var(--neon2)); border: 0; box-shadow: 0 0 24px rgba(63, 240, 255, .4); }
.btn.small { font-size: 13px; padding: 7px 14px; }
.dim { background: rgba(2, 4, 10, .72); }
.card { background: rgba(14, 20, 38, .92); border: 1px solid var(--line2); border-radius: 16px; padding: 16px 20px; width: min(94vw, 680px); max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(63, 240, 255, .1); }
.card h2 { margin: 0 0 10px; color: var(--neon); letter-spacing: .08em; text-transform: uppercase; font-size: 17px; }
.card h3 { margin: 12px 0 4px; color: var(--neon2); font-size: 14px; letter-spacing: .04em; }
.card p, .card li { color: var(--txt); line-height: 1.45; margin: 4px 0; }
.card ul { padding-left: 18px; margin: 6px 0; }
.card kbd { background: #0a1020; border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; font-size: 12px; }
.card .note { color: var(--dim); font-size: 12px; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.opt { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.opt span { color: var(--dim); font-size: 12px; display: block; }
.opt .grp { display: flex; gap: 3px; flex-wrap: wrap; }
.opt .tb { border-color: var(--line); }
.scn, .chal, .slot { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); cursor: pointer; }
.scn:hover, .slot:hover { border-color: var(--neon); }
.scn b, .chal b, .slot b { color: var(--neon); } .scn span, .chal span, .slot span { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.chal { cursor: default; } .chal.done { border-color: rgba(157, 255, 106, .6); } .chal.done b::after { content: "  done"; color: var(--lime); font-size: 12px; }
.slot { display: flex; align-items: center; gap: 8px; cursor: default; }
.slot div { flex: 1; min-width: 0; }
textarea { width: 100%; min-height: 90px; background: #070b16; color: var(--txt); border: 1px solid var(--line2); border-radius: 8px; padding: 8px; font: 12px monospace; user-select: text; -webkit-user-select: text; resize: vertical; }

@media (max-width: 820px) {
  #app { flex-direction: column-reverse; padding: 6px; gap: 6px; }
  #bench { width: 100%; height: 36%; padding: 8px; }
  #brand, #selinfo { display: none; }
  .chips { grid-template-columns: repeat(3, 1fr); }
  .tb span.lbl { display: none; }
  .ro { min-width: 0; }
  .ro.wide, .ro.right { display: none; }
}

</style>
</head>
<body>
<div id="app">
  <aside id="bench">
    <div id="brand"><div class="flask"><i></i></div><div><b>Element Lab</b><small id="ver">lab bench</small></div></div>
    <div class="searchbox"><input id="search" type="search" placeholder="Search elements..." autocomplete="off" spellcheck="false"><span id="search-n"></span></div>
    <div id="palette"></div>
    <div id="selinfo"></div>
  </aside>
  <main id="lab">
    <div id="bar">
      <div class="seg" id="tools"></div>
      <div class="seg" id="brushseg">
        <div class="shapes" id="shapes"></div>
        <label class="sz" title="Brush size ([ and ])"><input id="size-r" type="range" min="0" max="24" value="4"><span id="size-v">4</span></label>
        <div class="facing" id="facing" title="Which way new machines face (fans, pumps, pistons, conveyors, spouts, lasers)"></div>

      <div class="seg" id="sim"></div>
      <div class="seg" id="views"></div>
      <div class="seg" id="acts"></div>
    </div>
    <section id="stage">
      <div id="wrap">
        <canvas id="view"></canvas><canvas id="glow"></canvas><canvas id="ov"></canvas><div id="cursor"></div>
      </div>
    </section>
    <div id="readout">
      <div class="ro" id="ro-el"><i id="ro-sw"></i><b id="ro-name">-</b></div>
      <div class="ro"><span>temp</span><b id="ro-t">-</b></div>
      <div class="ro"><span>charge</span><b id="ro-c">-</b></div>
      <div class="ro"><span>pressure</span><b id="ro-p">-</b></div>
      <div class="ro wide"><span id="ro-x">-</span></div>
      <div class="ro right"><span id="ro-perf">-</span></div>
    </div>
  </main>
</div>
<div id="toast"></div>

<div id="title" class="screen">
  <div class="tbg" id="tbg"></div>
  <div class="logo"><span class="l1">Element</span><span class="l2">Lab</span><span class="l3" id="t-ver">2.0</span></div>
  <div class="tag">Build reactors, circuits and cities. 300 elements, every one reacts.</div>
  <div class="menu">
    <button class="btn big" id="t-play">Enter the lab</button>
    <button class="btn" id="t-scenes">Example scenes</button>
    <button class="btn" id="t-cont">Continue</button>
    <button class="btn" id="t-chal">Challenges</button>
    <button class="btn" id="t-how">Lab guide</button>
    <button class="btn" id="t-set">Settings</button>
  </div>
  <div class="foot">Huntington Games</div>
</div>

<div id="dlg" class="screen dim hidden">
  <div class="card"><h2 id="dlg-t"></h2><div id="dlg-b"></div><div class="row"><button class="btn small" id="dlg-x">Close</button></div></div>
</div>

// ---- 00-core.js ----
// ==========================================
// ELEMENT LAB - core: helpers, saves, settings, sound
// ==========================================
const VERSION = '2.0';
const AMB = 20;                                   // room temperature, degrees C
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);

// small xorshift random: fast and (with seedRnd) repeatable for tests
let rs = 2463534242;
function rnd() { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return (rs >>> 0) / 4294967296; }
const rndi = n => (rnd() * n) | 0;
function seedRnd(s) { rs = (s | 0) || 1; }

// ---------- saves (every key starts with elementlab_) ----------
const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const QUAL = [{ n: 'Low', w: 160, h: 90 }, { n: 'Medium', w: 240, h: 135 }, { n: 'High', w: 320, h: 180 }, { n: 'Huge', w: 400, h: 225 }];
const VIEWS = ['normal', 'heat', 'pressure', 'charge'];
const SETTINGS = Object.assign({ quality: 1, sound: true, overlay: false, glow: true, bloom: true, noise: true, fx: true, replace: false, seenHelp: false,
    view: 'normal', shape: 'circle', dir: 0, open: null },
    LS.get('elementlab_settings', {}) || {});
if (!(SETTINGS.quality >= 0 && SETTINGS.quality < QUAL.length)) SETTINGS.quality = 1;
if (SETTINGS.overlay) { SETTINGS.view = 'heat'; SETTINGS.overlay = false; }   // 1.x saves: the old temperature view switch
if (VIEWS.indexOf(SETTINGS.view) < 0) SETTINGS.view = 'normal';
function saveSettings() { LS.set('elementlab_settings', SETTINGS); }

// ---------- sound (WebAudio, short synthesized effects; silent until the first click) ----------
let AC = null, NOISE = null;
const SFX_GAP = { sizzle: 140, boom: 60, splash: 160, zap: 120, pop: 80, ding: 200 };
const sfxLast = {};
function audioUnlock() {
    try {
        if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
        if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
}
function noiseBuffer() {
    if (NOISE) return NOISE;
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return NOISE;
}
function sfx(kind, vol) {
    if (!AC || !SETTINGS.sound || AC.state !== 'running') return;
    vol = vol === undefined ? 1 : vol;
    const now = performance.now();
    if (now - (sfxLast[kind] || 0) < (SFX_GAP[kind] || 80)) return;
    sfxLast[kind] = now;
    try {
        const t = AC.currentTime, g = AC.createGain();
        g.connect(AC.destination);
        const env = (peak, dur, atk) => {
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * vol), t + (atk || 0.01));
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        };
        const noise = (dur, type, f0, f1, q) => {
            const s = AC.createBufferSource(); s.buffer = noiseBuffer(); s.loop = true;
            const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
            f.frequency.setValueAtTime(f0, t);
            if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
            s.connect(f); f.connect(g); s.start(t); s.stop(t + dur + 0.05);
        };
        const tone = (type, f0, f1, dur) => {
            const o = AC.createOscillator(); o.type = type;
            o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            o.connect(g); o.start(t); o.stop(t + dur + 0.05);
        };
        if (kind === 'sizzle') { env(0.09, 0.4, 0.03); noise(0.4, 'highpass', 3200, 5000, 0.7); }
        else if (kind === 'boom') { env(0.5, 0.7, 0.005); noise(0.7, 'lowpass', 900, 70, 0.8); tone('sine', 110, 28, 0.6); }
        else if (kind === 'splash') { env(0.14, 0.28, 0.02); noise(0.28, 'bandpass', 700, 1800, 1.2); }
        else if (kind === 'zap') { env(0.12, 0.18, 0.003); tone('sawtooth', 1400, 90, 0.18); }
        else if (kind === 'pop') { env(0.12, 0.1, 0.002); tone('square', 420, 120, 0.09); }
        else if (kind === 'ding') { env(0.12, 0.5, 0.01); tone('triangle', 660, 990, 0.35); }
    } catch (e) { /* audio is optional */ }
}

const METALS = [];
function metal(name, label, col, dens, melt, o) {
    const mcol = [Math.min(255, col[0] * .4 + 160), Math.min(255, col[1] * .3 + 90), Math.min(255, col[2] * .2 + 30)];
    def(name, label, 'Metals', S_, col, Object.assign({ hard: .85, cond: .42, cool: .01, hi: [melt, 'molten_' + name], g: ['diss', 'metal'], elc: 'c' }, o || {}));
    def('molten_' + name, 'Molten ' + label, 'Metals', L_, mcol, { dens: dens, disp: 3, mv: .35, ti: melt + 150, cond: .35, cool: .01, lo: [melt - 20, name], self: 1, glow: [255, 140, 50, 3], awake: 1, danger: 1, g: ['molten'] });
    METALS.push(name);
}

const NE = DEFS.length;

DEFS.forEach((d, i) => { ID[d.name] = i; });
const KIND = new Uint8Array(NE), FLUID = new Uint8Array(NE), DENS = new Float32Array(NE);

const FLAM = new Float32Array(NE), BOOM = new Uint8Array(NE), BDELAY = new Uint8Array(NE), HARD = new Float32Array(NE);
const RUB = new Uint16Array(NE), UNB = new Uint8Array(NE), MOVEP = new Float32Array(NE), DISP = new Uint8Array(NE), SLIDE = new Float32Array(NE);
const L0 = new Uint8Array(NE), L1 = new Uint8Array(NE), AUX0 = new Uint16Array(NE), AWAKE = new Uint8Array(NE), LEAK = new Uint8Array(NE);
const SELF = new Uint8Array(NE), GLR = new Uint8Array(NE), GLG = new Uint8Array(NE), GLB = new Uint8Array(NE), GLS = new Uint8Array(NE);
const CONDUCT = new Uint8Array(NE), DOUSE = new Uint8Array(NE), ALPHA = new Float32Array(NE), VARY = new Float32Array(NE);

const ELC = new Uint8Array(NE);                    // 1 conductor, 2 source, 3 device, 4 gate, 5 sensor, 6 switch
const E_C = 1, E_SRC = 2, E_DEV = 3, E_GATE = 4, E_SENSOR = 5, E_SWITCH = 6;
const FIS = new Float32Array(NE), MOD = new Uint8Array(NE), ABSN = new Float32Array(NE), REFL = new Uint8Array(NE), RADN = new Float32Array(NE);
const DIRL = new Uint8Array(NE), HIDE = new Uint8Array(NE), DANGER = new Uint8Array(NE), BURST = new Uint8Array(NE);

const nm = n => { if (!(n in ID)) throw new Error('unknown element ' + n); return ID[n]; };
const ELCODE = { c: E_C, src: E_SRC, dev: E_DEV, gate: E_GATE, sensor: E_SENSOR, 'switch': E_SWITCH };
DEFS.forEach((d, e) => {
    KIND[e] = d.kind; FLUID[e] = d.kind === K.LIQUID || d.kind === K.GAS ? 1 : 0;
    DENS[e] = d.dens !== undefined ? d.dens : 5000;
    if (d.hi) { HI[e] = d.hi[0]; HIE[e] = nm(d.hi[1]); if (d.hi[2]) { HIA[e] = nm(d.hi[2]); HIAP[e] = d.hi[3]; } }
    if (d.lo) { LO[e] = d.lo[0]; LOE[e] = nm(d.lo[1]); if (d.lo[2]) { LOA[e] = nm(d.lo[2]); LOAP[e] = d.lo[3]; } }
    if (d.ti !== undefined) TINIT[e] = d.ti;
    const gas = d.kind === K.GAS;
    COND[e] = d.cond !== undefined ? d.cond : gas ? .12 : .1;
    COOL[e] = d.cool !== undefined ? d.cool : gas ? .1 : .03;
    if (d.ign) { IGN[e] = d.ign; BIGN[e] = d.ip !== undefined ? d.ip : .3; }
    if (d.burn) { BLIFE[e] = d.burn[0]; BTEMP[e] = d.burn[1]; BPROD[e] = d.burn[2] === 'empty' ? 0 : nm(d.burn[2]); }
    FLAM[e] = d.flam || 0; BOOM[e] = d.boom || 0; BDELAY[e] = d.bd || 1; HARD[e] = d.hard || 0;

        else if (k === 2) { const sl = PVX[n] * PVX[n] + PVY[n] * PVY[n] < 0.5; c = sl ? pack(120, 170, 255) : pack(200, 245, 255); if (glow) { const gi = ((y >> 2) * GWID + (x >> 2)) * 3; gacc[gi] += 100; gacc[gi + 1] += 200; gacc[gi + 2] += 255; } }
        else if (k === 3) c = pack(190, 230, 255);
        else if (k === 4) { c = PT[n] > 20 ? pack(255, 90, 90) : pack(255, 255, 210); if (glow) { const gi = ((y >> 2) * GWID + (x >> 2)) * 3; gacc[gi] += 600; gacc[gi + 1] += PT[n] > 20 ? 150 : 600; gacc[gi + 2] += PT[n] > 20 ? 150 : 400; } }
        else if (k >= 5) c = FWC[(k - 5) % 6];
        else c = PL[n] > 8 ? pack(255, 225, 130) : pack(255, 120, 40);
        buf[y * W + x] = c;
    }
    ctx.putImageData(img, 0, 0);
    if (bloom) {                                   // a cheap blur on the tiny bloom buffer (two box passes), added into the glow layer
        for (let pass = 0; pass < 2; pass++) for (let y = 0; y < BHEI; y++) for (let x = 0; x < BWID; x++) {
            const k = (y * BWID + x) * 3, l = x > 0 ? k - 3 : k, r = x < BWID - 1 ? k + 3 : k, u = y > 0 ? k - BWID * 3 : k, d = y < BHEI - 1 ? k + BWID * 3 : k;
            for (let c = 0; c < 3; c++) bacc[k + c] = (bacc[k + c] * 4 + bacc[l + c] + bacc[r + c] + bacc[u + c] + bacc[d + c]) >> 3;
        }
        for (let y = 0; y < GHEI; y++) {
            const by = Math.min(BHEI - 1, y >> 1) * BWID;
            for (let x = 0; x < GWID; x++) { const k = (y * GWID + x) * 3, q = (by + Math.min(BWID - 1, x >> 1)) * 3; gacc[k] += bacc[q] >> 1; gacc[k + 1] += bacc[q + 1] >> 1; gacc[k + 2] += bacc[q + 2] >> 1; }
        }
    }
    if (glow) {
        for (let k = 0, n = GWID * GHEI; k < n; k++) {
            const r = Math.min(255, gacc[k * 3] >> 4), g = Math.min(255, gacc[k * 3 + 1] >> 4), b = Math.min(255, gacc[k * 3 + 2] >> 4);
            gbuf[k] = pack(r, g, b);
        }
        gctx.putImageData(gimg, 0, 0);
    }
    gcv.style.display = glow ? '' : 'none';
    drawOverlay();
}

function drawOverlay() {
    const g = octx;
    g.clearRect(0, 0, W, H);
    if (preview) {
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1;
        if (preview.type === 'line') lineCells(preview.x0, preview.y0, preview.x1, preview.y1, (x, y) => g.fillRect(x, y, 1, 1));
        else {
            const a = Math.min(preview.x0, preview.x1), b = Math.min(preview.y0, preview.y1);
            g.strokeRect(a + 0.5, b + 0.5, Math.abs(preview.x1 - preview.x0), Math.abs(preview.y1 - preview.y0));
        }
    }
    if (SETTINGS.fx) for (let q = flashes.length - 1; q >= 0; q--) {
        const f = flashes[q], p = f.t / f.max;
        if (p >= 1) { flashes.splice(q, 1); continue; }
        const rad = f.r * (0.6 + p * 1.1);
        const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
        gr.addColorStop(0, 'rgba(255,240,200,' + (0.85 * (1 - p)).toFixed(2) + ')');
        gr.addColorStop(0.5, 'rgba(255,170,60,' + (0.45 * (1 - p)).toFixed(2) + ')');
        gr.addColorStop(1, 'rgba(255,100,20,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, rad, 0, 6.283); g.fill();
        f.t++;
    } else flashes.length = 0;
    for (let q = bolts.length - 1; q >= 0; q--) {
        const b = bolts[q];
        if (--b.t <= 0) { bolts.splice(q, 1); continue; }
        g.strokeStyle = (b.c ? 'rgba(200,170,255,' : 'rgba(230,240,255,') + (b.t / 7).toFixed(2) + ')'; g.lineWidth = b.c ? 0.8 : 1.4;
        g.beginPath(); b.pts.forEach((p, k) => k ? g.lineTo(p[0] + 0.5, p[1] + 0.5) : g.moveTo(p[0] + 0.5, p[1] + 0.5)); g.stroke();
    }
    const stg = $('wrap');
    if (shakeT > 0 && SETTINGS.fx) { shakeT--; stg.style.transform = 'translate(' + ((rnd() - 0.5) * shakeT * 0.8).toFixed(1) + 'px,' + ((rnd() - 0.5) * shakeT * 0.8).toFixed(1) + 'px)'; }
    else if (stg.style.transform) stg.style.transform = '';
}

const ptr = { gx: -1, gy: -1, inside: false };
let drag = null, holdFrames = 0;
let paused = false, speed = 1;
let onToolChange = null, onUiRefresh = null;

function toGrid(ev) {
    const r = $('wrap').getBoundingClientRect();
    return { x: Math.floor((ev.clientX - r.left) / r.width * W), y: Math.floor((ev.clientY - r.top) / r.height * H) };
}
function placeCursor() {
    const c = $('cursor'), wrap = $('wrap');
    if (!c) return;
    if (!ptr.inside || tool === 'zap' || (drag && (tool === 'line' || tool === 'rect'))) { c.style.display = 'none'; return; }
    const one = tool === 'use' || tool === 'pick';
    const cell = wrap.clientWidth / W, d = ((one ? 0 : brushR) * 2 + 1) * cell;
    c.className = one || SETTINGS.shape === 'square' ? 'sq' : SETTINGS.shape === 'spray' ? 'spray' : '';
    c.style.display = 'block'; c.style.width = c.style.height = d + 'px';
    c.style.left = ((ptr.gx + 0.5) * cell - d / 2) + 'px'; c.style.top = ((ptr.gy + 0.5) * cell - d / 2) + 'px';
}
function applyHold() {                             // runs every frame while the button is down
    if (!drag) return;
    holdFrames++;
    const x = drag.lx, y = drag.ly;
    if (tool === 'brush' || tool === 'erase') paintAt(x, y);
    else if (tool === 'heat') heatAt(x, y, 45);
    else if (tool === 'cool') heatAt(x, y, -45);
    else if (tool === 'zap' && holdFrames % 14 === 0) zapAt(x, y);
    dirtySave = true;
}
function pDown(ev) {
    if (drag) return;
    audioUnlock();
    if (ev.button !== undefined && ev.button > 0 && ev.pointerType === 'mouse') return;
    ev.preventDefault();
    try { $('wrap').setPointerCapture(ev.pointerId); } catch (e) { }
    const g = toGrid(ev);
    ptr.gx = g.x; ptr.gy = g.y; ptr.inside = true;
    drag = { id: ev.pointerId, x0: g.x, y0: g.y, lx: g.x, ly: g.y };
    holdFrames = 0;
    if (tool === 'use') { const m = useAt(g.x, g.y); if (m) toast(m); drag = null; dirtySave = true; return; }
    if (tool === 'pick') { if (inb(g.x, g.y)) { const e = el[ix(g.x, g.y)]; if (e && !HIDE[e]) { selectElement(e); toast(DEFS[e].label + ' picked'); } } drag = null; return; }
    if (tool !== 'zap') pushUndo();
    if (tool === 'brush' || tool === 'erase') { paintAt(g.x, g.y); if (curEl === ID.water && tool === 'brush') sfx('splash', 0.6); }
    else if (tool === 'zap') { zapAt(g.x, g.y); holdFrames = 1; }
    else if (tool === 'line' || tool === 'rect') preview = { type: tool, x0: g.x, y0: g.y, x1: g.x, y1: g.y };
    dirtySave = true; placeCursor();
}
function pMove(ev) {
    const g = toGrid(ev);
    ptr.gx = g.x; ptr.gy = g.y; ptr.inside = g.x >= 0 && g.y >= 0 && g.x < W && g.y < H;
    if (drag && ev.pointerId === drag.id) {
        const px = drag.lx, py = drag.ly;
        if (tool === 'brush' || tool === 'erase') strokeTo(px, py, g.x, g.y);
        else if (tool === 'heat') heatAt(g.x, g.y, 30);
        else if (tool === 'cool') heatAt(g.x, g.y, -30);
        else if (tool === 'wind') windAt(g.x, g.y, (g.x - px) * 1.2, (g.y - py) * 1.2);
        else if (preview) { preview.x1 = g.x; preview.y1 = g.y; }
        drag.lx = g.x; drag.ly = g.y;
        dirtySave = true;
    }
    placeCursor();
}
function pUp(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    if (preview) {
        if (preview.type === 'line') drawLine(preview.x0, preview.y0, preview.x1, preview.y1);
        else fillRect(preview.x0, preview.y0, preview.x1, preview.y1, tool === 'erase' ? 0 : curEl);
        preview = null;
    }
    drag = null; placeCursor();
}
function pLeave() { if (!drag) { ptr.inside = false; placeCursor(); } }
function setTool(t) { tool = t; preview = null; if (onToolChange) onToolChange(); placeCursor(); }
function setBrush(r) { brushR = clamp(r | 0, 0, 30); if (onToolChange) onToolChange(); placeCursor(); }
function togglePause() { paused = !paused; if (onUiRefresh) onUiRefresh(); }
function doUndo() { if (undo()) toast('Undone'); else toast('Nothing to undo'); }

function initInput() {
    const w = $('wrap');
    w.addEventListener('pointerdown', pDown);
    w.addEventListener('pointermove', pMove);
    w.addEventListener('pointerup', pUp);
    w.addEventListener('pointercancel', pUp);
    w.addEventListener('pointerleave', pLeave);
    w.addEventListener('contextmenu', e => e.preventDefault());
    w.addEventListener('wheel', e => { e.preventDefault(); setBrush(brushR + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    window.addEventListener('keydown', ev => {
        if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) && ev.key !== 'Escape') return;
        if (!$('title').classList.contains('hidden') || !$('dlg').classList.contains('hidden')) { if (ev.key === 'Escape') closeDlg(); return; }
        const k = ev.key.toLowerCase();
        if (ev.ctrlKey || ev.metaKey) { if (k === 'z') { ev.preventDefault(); doUndo(); } return; }
        const map = {};
        for (const t in TOOL_KEYS) map[TOOL_KEYS[t].toLowerCase()] = t;
        if (map[k]) setTool(map[k]);
        else if (k === 'v') setView(VIEWS[(VIEWS.indexOf(SETTINGS.view) + 1) % VIEWS.length]);
        else if (k === 'f') setFacing([3, 2, 0, 1][SETTINGS.dir & 3]);
        else if (k === ' ') { ev.preventDefault(); togglePause(); }
        else if (k === '.') stepOnce();
        else if (k === '[') setBrush(brushR - 1);
        else if (k === ']') setBrush(brushR + 1);
        else if (k === 'u') doUndo();
    });
}

// ---------- share codes ----------
// EL2.<w>x<h>.<base64>: runs of (element u16, aux varint, temperature byte, facing byte, run length varint).
//   temperature byte 0 = the element's normal start temperature, else (t + 300) / 25.
// EL1 (Element Lab 1): runs of (element byte, run length varint). Still loads.
function pushVar(out, v) { while (v >= 128) { out.push((v & 127) | 128); v >>>= 7; } out.push(v); }
function encodeScene() {
    const out = [];
    let run = 0, pe = -1, pa = 0, pt = 0, pf = 0;
    const flush = () => { if (!run) return; out.push(pe & 255, pe >> 8); pushVar(out, pa); out.push(pt, pf); pushVar(out, run); };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = ix(x, y), e = el[i];
        let a = 0, t = 0, f = 0;
        if (e !== 0) {
            a = e === ID.turbine || e === HEAD ? 0 : aux[i];
            const d = tp[i] - TINIT[e];
            if (d > 15 || d < -15) t = clamp(Math.round((tp[i] + 300) / 25), 1, 255);
            if (DIRL[e]) f = life[i] & 3;
        }
        if (e === pe && a === pa && t === pt && f === pf) run++;
        else { flush(); pe = e; pa = a; pt = t; pf = f; run = 1; }
    }
    flush();
    let s = '';
    for (let i = 0; i < out.length; i += 4096) s += String.fromCharCode.apply(null, out.slice(i, i + 4096));
    return 'EL2.' + W + 'x' + H + '.' + btoa(s).replace(/=+$/, '');
}
function decodeScene(code) {
    const m = /^EL([12])\.(\d+)x(\d+)\.([A-Za-z0-9+/]*)$/.exec(String(code).replace(/\s+/g, ''));
    if (!m) return false;
    const v2 = m[1] === '2', w = +m[2], h = +m[3];
    if (w < 8 || h < 8 || w > 1000 || h > 1000) return false;
    let bin; try { bin = atob(m[4]); } catch (e) { return false; }
    const n0 = w * h, cells = new Uint16Array(n0), ax = v2 ? new Uint16Array(n0) : null, tq = v2 ? new Uint8Array(n0) : null, fc = v2 ? new Uint8Array(n0) : null;
    let n = 0, p = 0;
    const rd = () => { let r = 0, sh = 0, b; do { if (p >= bin.length) throw 0; b = bin.charCodeAt(p++); r += (b & 127) * Math.pow(2, sh); sh += 7; } while (b & 128); return r; };
    try {
        while (p < bin.length && n < n0) {
            let e, a = 0, t = 0, f = 0;
            if (v2) { e = bin.charCodeAt(p) | (bin.charCodeAt(p + 1) << 8); p += 2; a = rd(); t = bin.charCodeAt(p++); f = bin.charCodeAt(p++); }
            else e = bin.charCodeAt(p++);
            const r = rd();
            if (e >= NE || p > bin.length) return false;
            for (let k = 0; k < r && n < n0; k++) { cells[n] = e; if (v2) { ax[n] = a; tq[n] = t; fc[n] = f; } n++; }
        }
    } catch (err) { return false; }
    if (n !== n0) return false;
    pushUndo(); clearGrid();
    for (let y = 0; y < H; y++) {
        const sy = Math.min(h - 1, Math.floor(y * h / H));
        for (let x = 0; x < W; x++) {
            const k = sy * w + Math.min(w - 1, Math.floor(x * w / W)), e = cells[k];
            if (!e) continue;
            const i = ix(x, y);
            if (e === HEAD) { el[i] = HEAD; tp[i] = 37; continue; }
            setUser(i, e);
            if (v2) { aux[i] = ax[k]; if (tq[k]) tp[i] = tq[k] * 25 - 300; if (DIRL[e]) life[i] = fc[k] & 3; }
        }
    }
    wakeAll();
    return true;
}

// ==========================================
const fx_ = f => Math.round(f * (W - 1)), fy_ = f => Math.round(f * (H - 1));
function Rf(x0, y0, x1, y1, name) { fillRect(fx_(x0), fy_(y0), fx_(x1), fy_(y1), ID[name], true); }
function Sc(x0, y0, x1, y1, name, prob, aux0) {      // scatter
    for (let y = fy_(y0); y <= fy_(y1); y++) for (let x = fx_(x0); x <= fx_(x1); x++) {
        if (rnd() > prob) continue;
        const i = ix(x, y); if (el[i] !== 0) continue;
        setUser(i, ID[name]); if (aux0) aux[i] = aux0;
    }
}
function Pt(x, y, name) { const i = ix(fx_(x), fy_(y)); setUser(i, ID[name]); }
// absolute layouts: drawn on a 160x90 base, bottom-centred on bigger grids
let OX = 0, OY = 0;
function base(w, h) { OX = Math.max(0, (W - w) >> 1); OY = Math.max(0, H - h); }
function A(x0, y0, x1, y1, name) { fillRect(OX + x0, OY + y0, OX + x1, OY + y1, name === 'empty' ? 0 : ID[name], true); }
function Ad(x0, y0, x1, y1, name, dir) { A(x0, y0, x1, y1, name); for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(OX + x, OY + y)) life[ix(OX + x, OY + y)] = dir; }
function Ax(x0, y0, x1, y1, name, a) { A(x0, y0, x1, y1, name); for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(OX + x, OY + y)) aux[ix(OX + x, OY + y)] = a; }
function Am(x0, y0, x1, y1, name, dir, a) { A(x0, y0, x1, y1, name); for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(OX + x, OY + y)) { const i = ix(OX + x, OY + y); life[i] = dir; aux[i] = a; } }
function Ah(x, y) { const i = ix(OX + x, OY + y); if (inb(OX + x, OY + y) && el[i] === 0) setUser(i, ID.human); }
function ground(name, rows) { fillRect(0, H - rows, W - 1, H - 1, ID[name], true); }
// a 3x3 logic gate with a battery + switch on each input side and a light underneath
function gateDemo(cx, cy, gate, light, sides) {
    A(cx - 1, cy - 1, cx + 1, cy + 1, gate);
    if (sides.includes('L')) { A(cx - 20, cy, cx - 2, cy, 'wire'); A(cx - 22, cy, cx - 21, cy, 'switch'); A(cx - 25, cy - 1, cx - 23, cy + 1, 'battery'); }
    if (sides.includes('R')) { A(cx + 2, cy, cx + 20, cy, 'wire'); A(cx + 21, cy, cx + 22, cy, 'switch'); A(cx + 23, cy - 1, cx + 25, cy + 1, 'battery'); }
    if (sides.includes('T')) { A(cx, cy - 8, cx, cy - 2, 'wire'); A(cx, cy - 10, cx, cy - 9, 'switch'); A(cx - 1, cy - 13, cx + 1, cy - 11, 'battery'); }
    A(cx, cy + 2, cx, cy + 8, 'wire'); A(cx - 3, cy + 9, cx + 3, cy + 11, light);
}

function loadScene(name) {
    const s = SCENES[name]; if (!s) return false;
    pushUndo(); clearGrid(); flashes.length = 0; s.build(); wakeAll();
    return true;
}

// ---- 90-main.js ----
// ==========================================
// ELEMENT LAB - start up, main loop, debug hook (window.__elementlab)
// ==========================================
let lastT = 0, acc = 0, simMs = 0, drawMs = 0, frameMs = 0, frameCount = 0, slowFrames = 0, hintShown = false;
const frameLog = [];

function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, t - lastT || 16); lastT = t;
    const f0 = performance.now();
    const title = !$('title').classList.contains('hidden');
    if (!paused) {
        acc += dt * speed * 0.06;
        let n = Math.floor(acc); acc -= n;
        if (n > 3) n = 3;
        if (simMs > 12 && n > 1) n = 1;            // a slow machine: slow the simulation down instead of freezing the page
        const s0 = performance.now();
        for (let k = 0; k < n; k++) step();
        simMs = simMs * 0.8 + (performance.now() - s0) * 0.2;
    }
    if (!title) applyHold();
    const r0 = performance.now();
    render();
    drawMs = drawMs * 0.8 + (performance.now() - r0) * 0.2;
    if (!title) updateHover();
    frameMs = frameMs * 0.9 + (performance.now() - f0) * 0.1;
    frameCount++;
    if (frameCount % 15 === 0 && !title) $('ro-perf').textContent = Math.round(1000 / Math.max(1, frameLog.length ? frameLog.reduce((a, b) => a + b, 0) / frameLog.length : 16)) + ' fps  ' + frameMs.toFixed(1) + ' ms  ' + (nNeut ? nNeut + ' n  ' : '') + 't' + tickN;
    if (frameCount % 20 === 0) { recount(); checkChallenges(); }
    if (frameCount % 600 === 0) autosave();
    frameLog.push(dt); if (frameLog.length > 120) frameLog.shift();
    if (!title && !hintShown && frameLog.length >= 100 && SETTINGS.quality > 0) {
        const avg = frameLog.reduce((a, b) => a + b, 0) / frameLog.length;
        if (avg > 30) { hintShown = true; toast('Running slowly? Try Low quality in Settings.'); }
    }
}

function init() {
    allocGrid(QUAL[SETTINGS.quality].w, QUAL[SETTINGS.quality].h);
    initRender(); buildTop(); buildPalette(); initInput(); initTitle();
    selectElement(ID.sand); setTool('brush');
    SCENES.reactor.build();                        // something to watch behind the title screen
    wakeAll(); refreshUi();
    onChallenge = c => toast('Challenge complete: ' + c.name);
    window.addEventListener('resize', layoutStage);
    window.addEventListener('pagehide', () => { dirtySave = true; autosave(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { dirtySave = true; autosave(); } });
    requestAnimationFrame(frame);
}

window.__elementlab = {
    VERSION, ID, DEFS, STAT, MADE, SETTINGS, REACTIONS, NE,
    get W() { return W; }, get H() { return H; }, get tick() { return tickN; },
    get el() { return el; }, get tp() { return tp; }, get life() { return life; }, get aux() { return aux; }, get pw() { return pw; }, get pr() { return pr; },
    get chainMax() { return chainMax; }, get particles() { return nParts; }, get neutrons() { return nNeut; }, get powered() { return poweredN; },
    get origin() { return { x: OX, y: OY }; },
    start() { startPlay(); },
    seed(n) { seedRnd(n); },
    clear() { clearGrid(); },
    idx: (x, y) => ix(x, y),
    place(x, y, name, temp) { if (!inb(x, y)) return false; const i = ix(x, y); if (name === 'empty') clr(i); else setUser(i, ID[name]); if (temp !== undefined) tp[i] = temp; wk(x, y); return true; },
    fill(x0, y0, x1, y1, name, temp) { fillRect(x0, y0, x1, y1, name === 'empty' ? 0 : ID[name], true); if (temp !== undefined) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (el[ix(x, y)]) tp[ix(x, y)] = temp; },
    paint(name, x, y, r) { paintCircle(x, y, r === undefined ? brushR : r, ID[name], 1); },
    get(x, y) { const i = ix(x, y); return { el: DEFS[el[i]].name, t: tp[i], life: life[i], aux: aux[i], pw: pw[i], pr: pr[i] }; },
    heat(x, y, r, d) { const o = brushR; brushR = r; heatAt(x, y, d); brushR = o; },
    use(x, y) { return useAt(x, y); },
    step(n) { const t0 = performance.now(); for (let k = 0; k < (n || 1); k++) step(); return performance.now() - t0; },
    render() { const t0 = performance.now(); render(); return performance.now() - t0; },
    count(name) { recount(); if (name) return CNT[ID[name]]; const o = {}; for (let e = 1; e < NE; e++) if (CNT[e]) o[DEFS[e].name] = CNT[e]; return o; },
    total() { recount(); let n = 0; for (let e = 1; e < NE; e++) n += CNT[e]; return n; },
    find(name) { const e = ID[name], out = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (el[ix(x, y)] === e) out.push([x, y]); return out; },
    poweredOf(name) { const e = ID[name]; let n = 0, on = 0; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = ix(x, y); if (el[i] === e) { n++; if (pw[i] || (ELC[e] >= E_GATE && ELC[e] !== E_SWITCH && life[i])) on++; } } return { n, on }; },
    avgTemp(name) { const e = ID[name]; let n = 0, s = 0; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = ix(x, y); if (el[i] === e) { n++; s += tp[i]; } } return n ? s / n : 0; },
    scene(name) { return loadScene(name); },
    scenes: () => Object.keys(SCENES),
    setQuality(q) { changeQuality(q); },
    setView(v) { setView(v); },
    explode(x, y, r) { queueBoom(x, y, r, 1, 0); },
    lightning(x, y) { lightning(x, y); },
    shareCode: () => encodeScene(), loadCode: c => decodeScene(c),
    slots: () => loadSlots(), saveSlot: (k, n) => saveSlot(k, n), loadSlot: k => loadSlot(k),
    challenges: () => CHALLENGES.map(c => ({ id: c.id, done: !!DONE[c.id] })),
    checkChallenges, undo: () => undo(), pushUndo, activeChunks,
    setTool, setBrush, selectElement: n => selectElement(ID[n]),
    pause(v) { paused = v === undefined ? !paused : v; refreshUi(); },
    perf: () => ({ simMs, drawMs, frameMs, frames: frameLog.slice(), active: activeChunks(), chunks: act.length }),
    counts: () => ({ elements: NE - 1, visible: NE - 1 - HIDE.reduce((a, b) => a + b, 0), reactionRows: REACTIONS.length, reactionPairs: RX_PAIRS })
};

init();
