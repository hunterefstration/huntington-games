<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<!--@css-->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="globe"></canvas>
<canvas id="overlay"></canvas>

<div id="loading" class="screen on">
  <div class="presents">HUNTINGTON GAMES <span>presents</span></div>
  <div class="logo">SOVEREIGN</div>
  <div class="bar"><div id="load-fill"></div></div>
  <div id="load-text">Loading the world...</div>
</div>

<div id="title" class="screen">
  <div class="title-box">
    <div class="logo big">SOVEREIGN</div>
    <div class="tagline">Lead any nation on Earth</div>
    <div class="menu">
      <button class="btn gold" data-act="new">New Game</button>
      <button class="btn" data-act="explore">Explore the World</button>
      <button class="btn" data-act="settings">Settings</button>
      <button class="btn" data-act="credits">Credits</button>
    </div>
  </div>
  <div class="foot">A Huntington Games production &middot; <span class="ver"></span></div>
</div>

<div id="select" class="screen">
  <div class="panel side">
    <div class="ph">
      <button class="icon" data-act="back" title="Back">&larr;</button>
      <h2>Choose your nation</h2>
    </div>
    <input id="sel-search" type="search" placeholder="Search 197 countries..." autocomplete="off">
    <div class="chips" id="sel-regions"></div>
    <div id="sel-list" class="list"></div>
  </div>
  <div id="sel-card" class="panel card hidden"></div>
</div>

<div id="hud" class="screen">
  <div class="topbar panel">
    <button class="icon" data-act="menu" title="Menu (Esc)">&#9776;</button>
    <div id="hud-nation" class="nation"></div>
    <div class="grow"></div>
    <div id="hud-note" class="note"></div>
  </div>
  <div class="modes panel" id="hud-modes"></div>
  <div class="zoom panel">
    <button class="icon" data-act="zin" title="Zoom in (+)">+</button>
    <button class="icon" data-act="zout" title="Zoom out (-)">&minus;</button>
    <button class="icon" data-act="home" title="Back to your nation (Home)">&#8962;</button>
    <button class="icon" data-act="night" title="Night view (N)">&#9790;</button>
  </div>
  <div id="info" class="panel card hidden"></div>
</div>

<div id="modal" class="modal hidden"><div class="panel box" id="modal-box"></div></div>
<div id="toast"></div>
<div id="fps" class="hidden"></div>
<!--@data-->
<!--@js-->
</body>
</html>
