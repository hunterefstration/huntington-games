<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense - Version 2.0</title>
<style>
:root { --bg: #0f1216; --panel: rgba(18, 22, 28, 0.92); --line: rgba(255,255,255,0.10); --text: #e8ecf1; --dim: #9aa4b2; --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; --purple: #9b59b6; --orange: #e67e22; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
body { background-image: radial-gradient(#1e2a36 1px, transparent 1px); background-size: 22px 22px; }
button { font-family: inherit; }
.hidden { display: none !important; }
.btn { padding: 8px 12px; background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 700; transition: background 0.15s, border-color 0.15s, transform 0.1s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.on { background: rgba(52,152,219,0.28); border-color: var(--blue); }
.btn-green { color: #6ee7a0; border-color: #27ae60; } .btn-red { color: #ff8a80; border-color: #c0392b; } .btn-gold { color: #ffd54f; border-color: #c49b0b; }
.btn-blue { color: #8cc8ff; border-color: #2980b9; } .btn-purple { color: #d5a6f2; border-color: #8e44ad; }
.btn-big { font-size: 18px; padding: 12px 22px; }
.tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; padding: 1px 6px; border-radius: 10px; background: rgba(255,255,255,0.08); color: var(--dim); margin: 1px 2px 1px 0; }
.tag.air { color: #8cc8ff; } .tag.det { color: #d5a6f2; } .tag.sup { color: #ffd54f; background: rgba(241,196,15,0.15); } .tag.aoe { color: #ffb36b; } .tag.path { color: #ff8a80; }
kbd { font-family: monospace; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 0 5px; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

/* ---------- menus ---------- */
#menu-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 16px; }
.menu-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px; width: min(860px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 100%; overflow-y: auto; }
.title { font-size: clamp(32px, 6vw, 54px); font-weight: 900; margin: 0; letter-spacing: -1px; background: linear-gradient(90deg, #5dade2, #a569bd, #f5b041); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subtitle { color: var(--dim); font-style: italic; margin: 2px 0 18px; }
.menu-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--dim); margin: 18px 0 8px; text-transform: uppercase; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { flex: 1 1 140px; text-align: left; padding: 10px 12px; }
.choice small { display: block; font-weight: 500; color: var(--dim); font-size: 11px; margin-top: 3px; white-space: normal; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.map-card { padding: 6px; text-align: left; }
.map-card canvas { width: 100%; height: auto; border-radius: 4px; display: block; background: #1d3a24; }
.map-card .mname { font-size: 13px; margin-top: 5px; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
.version { color: #5b6573; font-size: 11px; margin-top: 18px; letter-spacing: 1px; }

/* ---------- game layout ---------- */
#game-screen { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; }
#hud { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(10,12,16,0.92); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hud-stat { display: flex; align-items: baseline; gap: 5px; padding: 4px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; font-size: 14px; }
.hud-stat b { font-size: 17px; }
.hud-spacer { flex: 1; }
#wave-preview { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--dim); max-width: 360px; overflow: hidden; }
.wp-chip { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 1px 6px; }
.wp-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
.tab { flex: 1; padding: 7px 4px; font-size: 12px; border-radius: 6px 6px 0 0; border: 1px solid transparent; background: rgba(0,0,0,0.25); color: var(--dim); cursor: pointer; font-weight: 700; }
.tab.on { background: rgba(52,152,219,0.25); color: #fff; border-color: rgba(52,152,219,0.6); }
#shop { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
.tcard { position: relative; text-align: left; padding: 6px 7px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; min-height: 58px; }
.tcard .row { display: flex; align-items: center; gap: 6px; }
.tcard canvas { width: 26px; height: 26px; flex: none; }
.tcard .tname { font-weight: 800; font-size: 12px; line-height: 1.1; white-space: normal; }
.tcard .tcost { color: var(--gold); font-weight: 800; }
.tcard .tcount { color: var(--dim); font-size: 11px; font-weight: 600; }
.tcard .hk { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #6b7685; }
.tcard.sel { background: rgba(231,76,60,0.22); border-color: var(--red); }
.tcard.locked { opacity: 0.4; }
.tcard.poor .tcost { color: #ff8a80; }
.tcard .info { position: absolute; bottom: 3px; right: 4px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); font-size: 11px; line-height: 16px; text-align: center; color: var(--dim); background: rgba(0,0,0,0.3); }
.tcard .info:hover { color: #fff; border-color: #fff; }
#abilities { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.ability { flex: 1; position: relative; overflow: hidden; padding: 6px 4px; font-size: 11px; text-align: center; }
.ability .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--blue); }
.ability.armed { background: rgba(241,196,15,0.25); border-color: var(--gold); }

/* ---------- overlays inside the stage ---------- */
#toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.82); border: 1px solid var(--gold); color: var(--gold); padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; pointer-events: none; transition: opacity 0.3s; opacity: 0; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
#banner { position: absolute; top: 36%; left: 0; right: 0; text-align: center; font-size: clamp(26px, 5vw, 48px); font-weight: 900; letter-spacing: 2px; pointer-events: none; text-shadow: 0 4px 20px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.4s; }
#banner small { display: block; font-size: 0.4em; letter-spacing: 1px; color: var(--dim); font-weight: 700; }
#selpanel { position: absolute; left: 10px; bottom: 10px; width: min(330px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow-y: auto; background: var(--panel); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-size: 12px; }
#selpanel h3 { margin: 0; font-size: 15px; }
.sp-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
.sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; color: var(--dim); margin: 6px 0; }
.sp-grid b { color: var(--text); }
.unit-row { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; margin-bottom: 4px; }
.unit-row .ul { flex: 1; }
.unit-row .lv { display: inline-flex; gap: 2px; }
.pip { width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,0.15); display: inline-block; }
.pip.on { background: var(--gold); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.sp-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.sp-actions .btn { flex: 1 1 auto; }
select { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.25); padding: 4px; border-radius: 5px; font-size: 12px; outline: none; }
select option { background: #1d2530; }
.spec-box { border: 1px dashed rgba(241,196,15,0.5); border-radius: 8px; padding: 6px; margin: 6px 0; }
.spec-opt { display: block; width: 100%; text-align: left; margin-top: 4px; white-space: normal; }
.spec-opt small { display: block; color: var(--dim); font-weight: 500; }
#tooltip { position: absolute; pointer-events: none; background: rgba(8,10,14,0.95); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 7px 9px; font-size: 12px; max-width: 260px; z-index: 30; }
#tooltip .tt-title { font-weight: 800; font-size: 13px; }
#fps { position: absolute; right: 8px; top: 8px; font: 11px monospace; color: #8f9; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
#countdown { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,0.75); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; color: var(--dim); }

/* ---------- modals ---------- */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
.modal-card { background: #141a21; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
.modal-card.small { width: min(420px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-body { padding: 14px 16px; overflow-y: auto; min-height: 0; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
.set-row small { display: block; color: var(--dim); font-size: 11px; }
.set-row input[type=range] { width: 160px; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; color: var(--dim); border: none; padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; border-left: 1px solid rgba(255,255,255,0.12); }
.seg button:first-child { border-left: none; }
.seg button.on { background: rgba(52,152,219,0.35); color: #fff; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: rgba(255,255,255,0.15); border-radius: 22px; cursor: pointer; transition: 0.2s; }
.switch span:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span:before { transform: translateX(18px); }
.codex { display: grid; grid-template-columns: 220px 1fr; gap: 14px; min-height: 0; }
.codex-list { display: flex; flex-direction: column; gap: 3px; max-height: 60vh; overflow-y: auto; }
.codex-list .grp { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--dim); margin: 8px 0 2px; }
.codex-item { display: flex; align-items: center; gap: 8px; text-align: left; padding: 5px 8px; font-size: 12px; }
.codex-item canvas { width: 22px; height: 22px; }
.codex-item.on { background: rgba(52,152,219,0.25); border-color: var(--blue); }
.codex-detail h3 { margin: 0 0 4px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.codex-detail p { color: #c7cfda; font-size: 13px; line-height: 1.45; margin: 6px 0; }
table.stats { border-collapse: collapse; width: 100%; font-size: 12px; margin: 8px 0; }
table.stats th, table.stats td { padding: 4px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.07); }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { color: var(--dim); font-weight: 700; }
.spec-card { background: rgba(241,196,15,0.06); border: 1px solid rgba(241,196,15,0.3); border-radius: 8px; padding: 7px 9px; margin: 6px 0; font-size: 12px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
.ach .ico { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #555; }
.ach.got .ico { background: rgba(241,196,15,0.2); color: var(--gold); }
.endstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.endstats div { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px; text-align: center; }
.endstats b { display: block; font-size: 20px; }

/* ---------- small / tall screens ---------- */
@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  #side { border-left: none; border-top: 1px solid var(--line); max-height: 42vh; }
  #shop { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .codex { grid-template-columns: 1fr; }
  .codex-list { max-height: 26vh; }
  #wave-preview { display: none; }
}
@media (max-height: 520px) and (min-aspect-ratio: 1/1) { #main { grid-template-columns: 1fr 250px; } .hud-stat { font-size: 12px; } .hud-stat b { font-size: 14px; } }
</style>
</head>
<body>
<!-- ================= MENUS ================= -->
<div id="menu-screen">
  <div class="menu-card" id="menu-main">
    <h1 class="title">TOWER DEFENSE</h1>
    <p class="subtitle">Made by Huntington Games</p>
    <div class="menu-buttons">
      <button class="btn btn-green btn-big" id="btn-continue">&#9654; Continue</button>
      <button class="btn btn-gold btn-big" id="btn-new">New Game</button>
      <button class="btn btn-big" data-open="codex">Codex</button>
      <button class="btn btn-big" data-open="achievements">Achievements</button>
      <button class="btn btn-big" data-open="settings">Settings</button>
    </div>
    <div id="continue-info" class="subtitle" style="margin-top:10px;font-style:normal"></div>
    <div class="section-title">Your records</div>
    <div id="records" class="subtitle" style="font-style:normal"></div>
    <div class="version">VERSION 2.0 &middot; THE REBUILD</div>
  </div>

  <div class="menu-card hidden" id="menu-new">
    <h1 class="title" style="font-size:34px">NEW GAME</h1>
    <div class="section-title">Difficulty</div>
    <div class="choice-row" id="diff-choices"></div>
    <div class="section-title">Mode</div>
    <div class="choice-row" id="mode-choices"></div>
    <div class="section-title">Map variant</div>
    <div class="choice-row" id="variant-choices"></div>
    <div class="section-title">Map</div>
    <div class="map-grid" id="map-choices"></div>
    <div class="menu-buttons" style="margin-top:16px">
      <button class="btn" id="btn-new-back">&#8592; Back</button>
    </div>
  </div>
</div>

<!-- ================= GAME ================= -->
<div id="game-screen" class="hidden">
  <div id="hud">
    <div class="hud-stat" title="Money"><span style="color:var(--gold)">$</span><b id="h-money">0</b></div>
    <div class="hud-stat" title="Base health"><span style="color:var(--red)">&#9829;</span><b id="h-lives">0</b></div>
    <div class="hud-stat" title="Wave"><span>Wave</span><b id="h-wave">0</b><span id="h-wavemax" style="color:var(--dim)"></span></div>
    <div class="hud-stat" title="This wave"><span id="h-wavetype" style="color:var(--blue);font-weight:800">-</span></div>
    <div id="wave-preview"></div>
    <div class="hud-spacer"></div>
    <button class="btn btn-green" id="b-wave" title="Start the next wave (Space)">&#9654; Start Wave</button>
    <button class="btn btn-purple" id="b-auto" title="Start waves automatically">Auto: Off</button>
    <button class="btn btn-gold" id="b-speed" title="Game speed (F)">1x</button>
    <button class="btn" id="b-pause" title="Pause (P)">&#10073;&#10073;</button>
    <button class="btn" data-open="codex" title="Codex: every tower and enemy">Codex</button>
    <button class="btn" data-open="settings" title="Settings">&#9881;</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="game-canvas"></canvas>
      <div id="toast"></div>
      <div id="banner"></div>
      <div id="fps" class="hidden"></div>
      <div id="countdown" class="hidden"></div>
      <div id="selpanel" class="hidden"></div>
      <div id="tooltip" class="hidden"></div>
    </div>
    <div id="side">
      <div class="side-head">
        <button class="btn btn-red" id="b-deselect" style="flex:1" title="Deselect everything (Esc / right-click)">&#10005; Deselect</button>
        <button class="btn" id="b-sellmode" title="Show every tower's range">Ranges</button>
      </div>
      <div class="tabs" id="shop-tabs">
        <button class="tab on" data-tab="Attack">Attack</button>
        <button class="tab" data-tab="Support">Support</button>
        <button class="tab" data-tab="Special">Special</button>
      </div>
      <div id="shop"></div>
      <div id="abilities"></div>
    </div>
  </div>
</div>

<!-- ================= MODALS ================= -->
<div class="modal hidden" id="modal-settings"><div class="modal-card">
  <div class="modal-head"><h2>Settings</h2><button class="btn" data-close>&#10005;</button></div>
  <div class="tabs" id="set-tabs" style="padding:8px 16px 0"></div>
  <div class="modal-body" id="set-body"></div>
  <div class="modal-foot"><button class="btn" id="set-reset">Reset to defaults</button><button class="btn btn-green" data-close>Done</button></div>
</div></div>

<div class="modal hidden" id="modal-codex"><div class="modal-card">
  <div class="modal-head"><h2>Codex</h2><button class="btn" data-close>&#10005;</button></div>
  <div class="tabs" id="codex-tabs" style="padding:8px 16px 0"></div>
  <div class="modal-body"><div class="codex"><div class="codex-list" id="codex-list"></div><div class="codex-detail" id="codex-detail"></div></div></div>
</div></div>

<div class="modal hidden" id="modal-achievements"><div class="modal-card small">
  <div class="modal-head"><h2>Achievements</h2><button class="btn" data-close>&#10005;</button></div>
  <div class="modal-body" id="ach-body"></div>
</div></div>

<div class="modal hidden" id="modal-pause"><div class="modal-card small">
  <div class="modal-head"><h2>Paused</h2></div>
  <div class="modal-body" id="pause-body"></div>
  <div class="modal-foot">
    <button class="btn" data-open="settings">Settings</button>
    <button class="btn btn-red" id="b-quit">Save &amp; Quit</button>
    <button class="btn btn-green" id="b-resume">Resume</button>
  </div>
</div></div>

<div class="modal hidden" id="modal-end"><div class="modal-card small">
  <div class="modal-head"><h2 id="end-title">Game Over</h2></div>
  <div class="modal-body" id="end-body"></div>
  <div class="modal-foot"><button class="btn" id="b-end-menu">Main Menu</button><button class="btn btn-gold" id="b-end-endless">Keep Going (Endless)</button><button class="btn btn-green" id="b-end-retry">Play Again</button></div>
</div></div>

<div class="modal hidden" id="modal-confirm"><div class="modal-card small">
  <div class="modal-head"><h2 id="confirm-title">Are you sure?</h2></div>
  <div class="modal-body" id="confirm-body"></div>
  <div class="modal-foot"><button class="btn" id="confirm-no">Cancel</button><button class="btn btn-red" id="confirm-yes">Yes</button></div>
</div></div>
<script>
'use strict';
// =====================================================================
//  TOWER DEFENSE 2.0  -  Huntington Games
//  One file, no libraries. The world is a fixed 960 x 600 board that is
//  scaled to fit any window. Logic runs at a fixed 60 ticks a second.
// =====================================================================
const W = 960, H = 600, TPS = 60;
const VERSION = '2.0';

// ---------------------------------------------------------------------
//  TOWERS
//  range / aoe in board units, rate = ticks between shots (60 = 1/second)
//  air: 'no' | 'yes' | 'only'      detect: can see stealthed enemies
//  Every attack tower can be upgraded to level 5, then SPECIALIZED into
//  one of two paths (A or B). Supers are limited to one on the board.

  if (!paused && !G.over) {
    acc += dt * G.speed * TPS;
    let n = 0;
    while (acc >= 1 && n < 12) { G.beams.length = 0; tick(); stepVisuals(); acc -= 1; n++; }
    if (n >= 12) acc = 0;
    // build mode drops out by itself when you can no longer afford / place another
    if (G.place) { const err = buyError(TOWER[G.place]); if (err) cancelPlace(err); }
  }
  if (S.fpsCap && now - lastRender < 1000 / S.fpsCap - 2) return;
  lastRender = now; frames++;
  render(now);
  if (now - fpsT >= 1000) { const fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; if (S.showFps) { $('fps').classList.remove('hidden'); $('fps').textContent = Math.round(fps) + ' FPS'; } autoQualityTick(fps); }
  if (now - uiT > 200) { uiT = now; updateHUD(); refreshShopState(); renderAbilities(); renderSelPanel(); updateHoverTooltip(); }
  if (S.showTips && now - tipT > 45000 && G.wave > 1) { tipT = now; toast('Tip: ' + pick(TIPS), '#9fd3ff'); }
}
showMenu('main');
requestAnimationFrame(loop);
</script>
