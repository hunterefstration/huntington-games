<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Lab</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f6f7fb; color: #1f2430; user-select: none; -webkit-user-select: none; }
body[data-mode="studio"] { background: #1e2329; color: #dfe3e8; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
canvas { display: block; touch-action: none; }

/* ---- shared controls */
.btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #c9cfdd; background: #fff; font-weight: 600; color: #2b3140; white-space: nowrap; }
.btn:hover { background: #f0f2fa; }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.btn.primary { background: #5b5bf7; border-color: #4b4be0; color: #fff; }
.btn.primary:hover { background: #4b4be0; }
.btn.danger { background: #fff0f0; border-color: #f2b8b8; color: #c92a2a; }
.btn.fun { background: linear-gradient(90deg, #ff7eb3, #ff9f43); border-color: transparent; color: #fff; }
.sel { padding: 4px 6px; border-radius: 6px; border: 1px solid #c9cfdd; background: #fff; font: inherit; color: #2b3140; max-width: 200px; }
.sel.small { font-size: 12px; padding: 2px 4px; }
.sel.tiny { font-size: 10px; padding: 1px 2px; max-width: 78px; }
.txt { width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid #c9cfdd; font: inherit; }
.tog { padding: 4px 10px; border-radius: 6px; border: 1px solid #c9cfdd; background: #fff; font-weight: 600; font-size: 12px; }
.tog.on { background: #ffd43b; border-color: #e0b400; color: #2b2b00; }
.seg { display: inline-flex; border-radius: 7px; overflow: hidden; border: 1px solid #c9cfdd; }
.seg button { border: 0; background: #fff; padding: 4px 10px; font-weight: 600; font-size: 12px; }
.seg button + button { border-left: 1px solid #c9cfdd; }
.seg button.on { background: #5b5bf7; color: #fff; }
.hint { color: #7a8396; font-size: 12px; }
.lab { color: #8a94a3; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.slider { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #dfe3ee; width: 160px; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #5b5bf7; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

/* ---- app bar */
#appbar { height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: linear-gradient(90deg, #6c5ce7, #00a8e8); color: #fff; }
body[data-mode="studio"] #appbar { background: #121519; border-bottom: 1px solid #000; height: 40px; }
#appbar .btn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #fff; }
#appbar .btn:hover { background: rgba(255,255,255,.28); }
#appbar .spacer { flex: 1; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin-right: 6px; }
.logo b { color: #ffe066; }
.lg { width: 24px; height: 24px; border-radius: 7px; background: conic-gradient(#ff6b6b, #ffd43b, #69db7c, #4dabf7, #da77f2, #ff6b6b); box-shadow: inset 0 0 0 5px rgba(255,255,255,.85); }
.pname { background: none; border: 1px dashed transparent; color: #fff; font-weight: 700; font-size: 14px; padding: 3px 8px; border-radius: 6px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname:hover { border-color: rgba(255,255,255,.5); }
#appbar .seg.mode { border-color: rgba(255,255,255,.45); }
#appbar .seg.mode button { background: transparent; color: #fff; padding: 5px 14px; font-size: 13px; }
#appbar .seg.mode button + button { border-color: rgba(255,255,255,.45); }
#appbar .seg.mode button.on { background: #fff; color: #4b4be0; }
body[data-mode="studio"] #appbar .seg.mode button.on { color: #e8590c; }

/* ---- simple mode */
#simple { padding: 10px 14px; gap: 10px; }
.s-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.bigplay { width: 66px; height: 66px; border-radius: 50%; border: 0; background: #ff5f7e; box-shadow: 0 4px 0 #d9435f; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .08s; }
.bigplay:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9435f; }
.pi { width: 0; height: 0; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; margin-left: 6px; }
body.playing .bigplay .pi, body.playing .tbtn.play .pi { width: 20px; height: 20px; border: 0; background: #fff; margin: 0; border-radius: 3px; }
.s-tempo { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.s-tempo label, .s-lab, .s-group label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #8790a6; }
.s-tempo b { font-size: 18px; color: #5b5bf7; }
.s-tempo { flex-direction: row; align-items: center; gap: 10px; }
.s-sounds { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; flex: 1; min-width: 300px; }
.s-insts, .s-kits { display: flex; gap: 6px; flex-wrap: wrap; }
.ibtn { width: 66px; height: 58px; border-radius: 12px; border: 2px solid #e1e5f0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: #4a5268; padding: 2px; }
.ibtn i { width: 28px; height: 28px; display: block; }
.ibtn i svg { width: 100%; height: 100%; }
.ibtn:hover { border-color: #b9c0ff; }
.ibtn.on { background: #5b5bf7; border-color: #5b5bf7; color: #fff; }
.kbtn { padding: 6px 13px; border-radius: 20px; border: 2px solid #e1e5f0; background: #fff; font-weight: 700; font-size: 12px; color: #4a5268; }
.kbtn.on { background: #20c997; border-color: #20c997; color: #fff; }
.s-row2 { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.s-layers, .s-brush { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.s-brush { margin-left: auto; }
.s-layer { display: flex; align-items: center; gap: 5px; padding: 3px 6px 3px 4px; border-radius: 18px; border: 2px solid #e1e5f0; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; color: #4a5268; }
.s-layer.on { border-color: var(--lc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--lc) 25%, transparent); }
.s-layer.muted .lname { opacity: .45; text-decoration: line-through; }
.s-layer .ldot { width: 18px; height: 18px; border-radius: 50%; background: var(--lc); color: #fff; font-style: normal; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.s-layer .lm, .s-layer .lmore { border: 0; background: #eef1f8; border-radius: 6px; font-size: 11px; font-weight: 800; padding: 1px 5px; color: #6c7a99; }
.s-layer .lm.on { background: #ff6b6b; color: #fff; }
.s-layer .lvol { width: 54px; accent-color: var(--lc); }
.abtn { display: flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 14px; border: 2px solid #e1e5f0; background: #fff; font-size: 11px; font-weight: 700; color: #4a5268; }
.abtn i { font-style: normal; font-weight: 900; color: var(--ac, #4a5268); }
.abtn.on { background: var(--ac, #5b5bf7); border-color: var(--ac, #5b5bf7); color: #fff; }
.abtn.on i { color: #fff; }
.s-gridwrap { flex: 1; min-height: 160px; overflow-x: auto; overflow-y: hidden; border-radius: 14px; background: #fff; box-shadow: 0 2px 10px rgba(30,40,90,.1); }
#s-grid { height: 100%; cursor: pointer; }
.s-bottom { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.s-group { display: flex; gap: 6px; align-items: center; }
.s-group.right { margin-left: auto; }
.s-bars { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.rnd { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #c9cfdd; background: #fff; font-weight: 800; font-size: 16px; line-height: 1; }

/* ---- studio */
#studio { color: #dfe3e8; }
#studio .btn { background: #39414b; border-color: #4a535e; color: #e9ecef; }
#studio .btn:hover { background: #46505c; }
#studio .btn.primary { background: #e8590c; border-color: #d9480f; color: #fff; }
#studio .sel { background: #15191d; border-color: #3d4651; color: #e9ecef; }
#studio .tog { background: #2f363e; border-color: #444d58; color: #ced4da; }
#studio .tog.on { background: #ffa94d; border-color: #ff922b; color: #1a1a1a; }
#studio .seg { border-color: #444d58; }
#studio .seg button { background: #2f363e; color: #ced4da; }
#studio .seg button + button { border-color: #444d58; }
#studio .seg button.on { background: #e8590c; color: #fff; }
#studio .hint { color: #7d8794; }
.st-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 6px 8px; background: #2a3038; border-bottom: 1px solid #111; align-items: center; flex-shrink: 0; }
.st-bar .grp { display: flex; gap: 4px; align-items: center; }
.tbtn { width: 36px; height: 30px; border-radius: 6px; border: 1px solid #4a535e; background: #39414b; display: flex; align-items: center; justify-content: center; }
.tbtn .pi { border-left-width: 13px; border-top-width: 8px; border-bottom-width: 8px; margin-left: 3px; border-left-color: #69db7c; }
body.playing .tbtn.play .pi { width: 12px; height: 12px; background: #69db7c; }
.tbtn .si { width: 12px; height: 12px; background: #ced4da; border-radius: 2px; }
.tbtn .ri { width: 13px; height: 13px; border-radius: 50%; background: #c92a2a; }
.tbtn.rec.on { background: #5c1d1d; border-color: #ff6b6b; }
.tbtn.rec.on .ri { background: #ff4040; box-shadow: 0 0 8px #ff4040; }
.tbtn.rec.blink .ri { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.pos { font: 700 15px ui-monospace, Menlo, Consolas, monospace; background: #0d1013; color: #8ce99a; padding: 4px 10px; border-radius: 5px; min-width: 76px; text-align: center; }
.dragnum { background: #0d1013; color: #ffb84d; padding: 3px 9px; border-radius: 5px; cursor: ns-resize; font: 700 15px ui-monospace, Menlo, Consolas, monospace; display: flex; gap: 6px; align-items: baseline; }
.dragnum .dl { font: 700 9px system-ui; color: #7d8794; }
.cpu { margin-left: auto; color: #7d8794; font-size: 11px; }
.st-main { flex: 1; min-height: 0; display: flex; }
#browser { width: 232px; flex-shrink: 0; display: flex; flex-direction: column; background: #23282e; border-right: 1px solid #111; }
.bhead { padding: 7px 8px 2px; display: flex; flex-direction: column; }
.bhead .hint { font-size: 10px; }
#browser .txt { margin: 4px 8px 6px; width: calc(100% - 16px); background: #15191d; border-color: #3d4651; color: #e9ecef; padding: 5px 8px; }
.blist { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.bkit { margin: 4px 8px 6px; }
.bsec { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 5px; margin-top: 6px; border-top: 2px solid #ff922b; color: #ffa94d; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.bsec-add { border: 1px solid #ff922b; background: transparent; color: #ffa94d; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
.bcat { width: 100%; text-align: left; background: #2c333b; border: 0; border-top: 1px solid #1a1e22; color: #e9ecef; padding: 6px 8px; font-weight: 700; display: flex; justify-content: space-between; font-size: 12px; }
.bcat::before { content: '\25b8'; margin-right: 6px; color: #ff922b; }
.bcat.open::before { content: '\25be'; }
.bcat span { flex: 1; }
.bcat em { font-style: normal; color: #7d8794; font-weight: 600; }
.bitem { padding: 3px 6px 3px 20px; display: flex; align-items: center; cursor: pointer; font-size: 12.5px; color: #ced4da; }
.bitem:hover { background: #2f3740; }
.bitem.sel { background: #3b4552; color: #fff; }
.bitem .bn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badd { visibility: hidden; border: 0; background: #e8590c; color: #fff; border-radius: 4px; width: 20px; height: 18px; font-weight: 800; line-height: 1; }
.bitem:hover .badd, .bitem.sel .badd { visibility: visible; }
.blist .empty { padding: 12px; color: #7d8794; }
.st-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; background: #171b1f; padding: 4px 6px 0; flex-shrink: 0; }
.tabs button { border: 0; background: #252b32; color: #9aa4b2; padding: 6px 14px; border-radius: 6px 6px 0 0; font-weight: 700; font-size: 12px; border-top: 2px solid transparent; }
.tabs button.on { background: #262c33; color: #fff; border-top-color: #ff922b; }
.panes { flex: 1; min-height: 0; position: relative; }
.pane { position: absolute; inset: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }

<script type="module">
// ---- 10-engine.js ----
// =====================================================================================================================
// BEAT LAB ENGINE: plays Beat Lab projects with Web Audio. Everything is synthesised (no samples, no network).
// The engine is the files 10-engine.js .. 16-engine-simple.js. They use no DOM and nothing from the rest of Beat Lab,
// so another page (the launcher's music player) can paste them in, in name order, and get globalThis.BeatLabEngine.
// Playing a player's song from the launcher:
//   const p = BeatLabEngine.fromSave(localStorage.getItem('beatlab_p_' + id));   // simple songs are converted
//   const eng = BeatLabEngine.create(); eng.audio(); eng.load(p); eng.play({ mode: 'song' });   ... eng.destroy()
//
// API (E = BeatLabEngine)
//   const eng = E.create({ ctx, out })    a live engine (out: an AudioNode of ctx to play into instead of the speakers). ctx: an AudioContext (made on the first eng.audio() call if left
//                                         out; browsers only allow sound after a click, so call eng.audio() from one)
//   eng.load(project)                     use this project; call it again after every change (it only rebuilds what
//                                         changed, and running playback picks the change up)
//   eng.play({ mode, pat, from, countIn }) mode 'song' (the playlist) or 'pat' (loop pattern id `pat`); from: tick;
//                                         countIn: bars of metronome first
//   eng.stop(), eng.seek(tick), eng.playing, eng.position()  (ticks; PPQ 48, so a 16th-note step is 12 ticks)
//   eng.noteOn(chId, midi, vel0to1) / eng.noteOff(chId, midi)   play a channel live; eng.preview(params, midi)
//   eng.stats {notes, voices}, eng.onError(fn), eng.destroy()
//   E.render(project, { mode, pat, loops, tail, sampleRate, onProgress }) -> Promise<AudioBuffer>  (OfflineAudioContext)
//   E.toWav(audioBuffer) -> ArrayBuffer (16-bit PCM WAV)
//   E.songTicks(project), E.patTicks(pattern), E.barTicks(project), E.normalize(project) (fills defaults, migrates)
//   E.PRESETS [{id, n: name, c: category, p: params}], E.preset(id) -> params, E.DEMOS [{id, n, make() -> project}]
//   E.fromSave(savedJsonOrObject) -> project, E.fromSimple(simpleSong, name) -> project, E.addChannel(project, presetId)
//   Saves: one project per localStorage key beatlab_p_<id>; { mode: 'simple', simple: {...} } or a studio project.
//
// Project format (version 1, plain JSON; times in ticks, 48 per quarter note):
//   { v: 1, id, name, bpm, sig: [beats, unit], swing: 0..100, key: 0..11, scale: 'minor',
//     ch:  [{ id, n: name, col: '#rrggbb', p: presetId, s: params (see 13-engine-voice.js), mix: mixer track,
//             vol: 0..1 (0.8 = unity), pan: -1..1, mute, solo, root: midi note the step sequencer plays }],
//     pat: [{ id, n: name, len: steps, st: { chId: [velocity 0-127 per step] }, nt: { chId: [[tick, len, midi, vel 1-127, art]] },
//             sa: { chId: [articulation per step, 0 or '' = normal] } (optional) }],
//            art (optional, absent = normal; 2026-11-16) is how the note is played, one of E.ARTS:
//              'acc' accent (louder, brighter)  'stac' staccato (short, detached)  'slide' legato (glides from the
//              previous note's pitch on that channel)  'vib' vibrato  'soft' ghost note  'bend' bends up into the note
//              'fall' falls off at the end  'flam' a grace hit just before  'roll' repeated fast hits (drum roll / tremolo)
//     pl:  { tr: [{ n: name, mute }], cl: [[patId, track, startStep, lengthSteps]] },
//     mix: [{ n, vol, pan, mute, solo, out: track it feeds (0 = master), snd: [track, amount] | null,
//             fx: [{ t: 'eq'|'filter'|'comp'|'dist'|'crush'|'delay'|'reverb'|'chorus'|'phaser'|'limit', on: 1, p: {...} }] }]
//            mix[0] is the master (also has lim: 1 for its brick-wall limiter),
//     loop: [startStep, endStep] | null }
// =====================================================================================================================
const BeatLabEngine = (globalThis.BeatLabEngine = globalThis.BeatLabEngine || {});
(function (E) {
  'use strict';
  const PPQ = 48, STEP = 12;
  E.PPQ = PPQ; E.STEP = STEP; E.VERSION = 1;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  if (ctrl && (k === 'y' || k === 'Y')) { e.preventDefault(); Hist.doRedo(); return; }

  if (A.p.mode !== 'studio') return;
  if (ctrl && k === 'Enter') { e.preventDefault(); toggleRecord(); return; }
  const fk = { F5: 'playlist', F6: 'rack', F7: 'roll', F8: 'synth', F9: 'mixer' }[k];

  const data = E.dsp.drum(c.s.d, 22050), { g, w, h: H } = fitCanvas(SY.wave);
  g.fillStyle = '#14181c'; g.fillRect(0, 0, w, H);
  g.fillStyle = c.col; const step = Math.max(1, Math.floor(data.length / w));
  for (let x = 0; x < w; x++) { let pk = 0; for (let i = x * step; i < (x + 1) * step && i < data.length; i++) pk = Math.max(pk, Math.abs(data[i])); const hh = pk * (H / 2 - 2); g.fillRect(x, H / 2 - hh, 1, hh * 2 || 1); }

// ===== Playing and recording: computer keyboard as a piano (FL layout), Web MIDI, record with count-in + quantize =====
const KEYMAP = {};
['KeyZ', 'KeyS', 'KeyX', 'KeyD', 'KeyC', 'KeyV', 'KeyG', 'KeyB', 'KeyH', 'KeyN', 'KeyJ', 'KeyM', 'Comma', 'KeyL', 'Period', 'Semicolon', 'Slash'].forEach((c, i) => KEYMAP[c] = i);
['KeyQ', 'Digit2', 'KeyW', 'Digit3', 'KeyE', 'KeyR', 'Digit5', 'KeyT', 'Digit6', 'KeyY', 'Digit7', 'KeyU', 'KeyI', 'Digit9', 'KeyO', 'Digit0', 'KeyP'].forEach((c, i) => KEYMAP[c] = 12 + i);
const IN = { held: new Map(), rec: new Map(), midi: null };
function typingNoteDown(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (e.code === 'BracketLeft' || e.code === 'BracketRight') { A.set.oct = clamp(A.set.oct + (e.code === 'BracketLeft' ? -1 : 1), 1, 7); Store.saveSet(); toast('Keyboard octave: C' + A.set.oct, 900); return true; }
  const k = KEYMAP[e.code]; if (k == null) return false;
  if (e.repeat || IN.held.has(e.code)) return true;
  const m = 12 * (A.set.oct + 1) + k;
  IN.held.set(e.code, m);
  liveNoteOn(m, 0.8);
  return true;
}
function typingNoteUp(e) {
  const m = IN.held.get(e.code); if (m == null) return;
  IN.held.delete(e.code);
  liveNoteOff(m);
}
function liveNoteOn(m, vel) {
  const c = curCh(); if (!c) return;
  A.eng.noteOn(c.id, m, vel);
  if (A.ui.rec && A.playing) { const pos = A.eng.position(); if (pos != null && pos > -STEP) IN.rec.set(m, { pos: Math.max(0, pos), vel, ch: c.id }); }
  if (A.ui.tab === 'roll') { RL.keyDown = m; A.views.roll.dirty = true; }
}
function liveNoteOff(m) {
  const c = curCh(); if (!c) return;
  A.eng.noteOff(c.id, m);
  const r = IN.rec.get(m);
  if (r) { IN.rec.delete(m); const pos = A.eng.position(); addRecorded(r, m, pos == null ? r.pos + STEP : pos); }
  if (RL.keyDown === m) { RL.keyDown = null; if (A.views.roll) A.views.roll.dirty = true; }
}
function addRecorded(r, m, endPos) {
  const q = curPat(), len = q.len * STEP, ch = chById(r.ch); if (!ch) return;
  const qz = A.set.recQ | 0;
  if (endPos < r.pos) endPos += len;                 // the loop wrapped while the key was held
  let t = r.pos % len, d = Math.max(3, endPos - r.pos);
  if (qz > 0) { t = Math.round(t / qz) * qz; d = Math.max(qz, Math.round(d / qz) * qz); if (t >= len) t -= len; }
  (q.nt[ch.id] = q.nt[ch.id] || []).push([Math.round(t), Math.round(Math.min(d, len)), m, Math.round(clamp(r.vel, 0.05, 1) * 127)]);
  if (q.st[ch.id]) delete q.st[ch.id];                // a channel with piano-roll notes stops using its steps
  changed();
}
function toggleRecord() {

  if (A.playing) stopPlay();

  A.ui.rec = true; IN.rec.clear();

  startPlay(A.set.countIn ? 1 : 0);

}
function finishRecording() {
  if (!A.ui.rec) return;
  const pos = A.eng.position();

  IN.rec.clear();

function recordTick(pos) { if (ST.rec) ST.rec.classList.toggle('blink', pos == null || pos < 0); }
function connectMidi() {
  if (!navigator.requestMIDIAccess) return toast('This browser has no MIDI support. The computer keyboard works as a piano: Z S X D C... and Q 2 W 3 E...', 4000);
  if (IN.midi) return toast('MIDI is on: ' + (IN.midiNames || 'no keyboard found yet'), 2500);

function midiMsg(ev) {

  const [st, d1, d2] = ev.data, cmd = st & 0xf0;

function practiceSong(withKeys, arranged) {

  const beat = q => { setSteps(p, q, 'Kick', [0, 7, 8, 10]); setSteps(p, q, 'Snare', [4, 12]); setSteps(p, q, 'Hat', [0, 2, 4, 6, 8, 10, 12, 14]); setSteps(p, q, 'Clap', [12]); };

function tutXY(kind, a, b) {

  }
  if (kind === 'rack') { const r = RK.cv.getBoundingClientRect(); return { x: r.left + 1 + (b + 0.5) * RK.cw, y: r.top + (a + 0.5) * ROWH }; }

  if (kind === 'vel') { const r = RL.cv.getBoundingClientRect(); return { x: r.left + tx(a) + 1, y: r.top + r.height - VELH + 8 + (1 - b / 127) * (VELH - 12) }; }

function setMode(mode) {
  hideOffer(); if (mode !== 'studio') setExplain(false);
  A.set.mode = mode; Store.saveSet();
  document.body.dataset.mode = mode;
  $('#simple').classList.toggle('hidden', mode !== 'simple');
  $('#studio').classList.toggle('hidden', mode !== 'studio');
  if (mode === 'simple') { if (!SV.cv) buildSimple(); simpleSync(); SV.refresh(); }
  else { if (!ST.tempo) buildStudio(); fixUi(); A.eng.load(A.p); refreshStudio(); syncRackRows(true); MX.sig = ''; SY.sig = ''; PL.hsig = ''; markViews(); showTab(A.ui.tab); fillBrowser(ST.search.value); }
  refreshAppBar();
  emit('changed', true);
  queueWarm();
  // the first time in the Studio: offer the tour once (seenStudio is remembered whatever the answer)
  if (mode === 'studio' && !A.set.seenStudio && !Tutor.active) { A.set.seenStudio = 1; Store.saveSet(); if (!Tutor.done('studio1')) setTimeout(() => { if (!Tutor.active && A.p.mode === 'studio') offer('studio'); }, 400); }
}
on('changed', () => {
  if (!A.p) return;
  if (A.p.mode === 'simple') { if (SV.refresh) SV.refresh(); }
  else if (ST.tempo) refreshStudio();
  refreshAppBar();
  queueWarm();
});
let statusT = 0;
function setStatus(msg) { const s = $('#status'); if (!s) return; s.textContent = msg; clearTimeout(statusT); statusT = setTimeout(() => { s.textContent = ''; }, 2500); }

// render plucked/modal notes and drum hits ahead of time, a little at a time, so playing never waits for them
const WARM = { q: [], t: 0 };
function queueWarm() {
  clearTimeout(WARM.t);
  WARM.t = setTimeout(() => {
    const p = A.p.mode === 'simple' ? SP : A.p; if (!p) return;
    const q = [];
    for (const c of p.ch) {
      if (c.s.k === 'drm') { q.push({ d: c.s.d }); continue; }
      if (![c.s.o1.w, c.s.o2.w].some(w => w === 'pluck' || /^m:/.test(w))) continue;
      const notes = new Set();
      for (const pat of p.pat) { const nt = pat.nt[c.id]; if (nt) for (const n of nt) notes.add(n[2]); if (pat.st[c.id] && pat.st[c.id].some(v => v > 0)) notes.add(c.root || 60); }
      if (p === SP) for (let r = 0; r < sRows(A.p.simple); r++) notes.add(sMidi(A.p.simple, r));
      for (const n of notes) q.push({ s: c.s, n });
    }
    WARM.q = q;
  }, 300);
}
setInterval(() => {
  const ctx = A.eng.ctx; if (!ctx || !WARM.q.length || A.rendering) return;
  const t0 = performance.now();
  while (WARM.q.length && performance.now() - t0 < 12) {
    const it = WARM.q.shift();
    try { if (it.d) E.drumBuffer(ctx, it.d); else E.warm(ctx, it.s, [it.n]); } catch (e) { reportErr(e); }
  }
}, 60);

function boot() {
  Store.loadSet();
  buildAppBar();
  let p = A.set.last ? Store.load(A.set.last) : null;
  if (!p) { const l = Store.list(); if (l.length) p = Store.load(l[0].id); }
  if (!p) { p = newSimpleProject('My first song'); }
  A.p = openProject(p);
  if (A.p.mode === 'studio') { A.ui.pat = A.p.pat[0].id; A.ui.brush = A.ui.pat; A.ui.ch = A.p.ch[0] ? A.p.ch[0].id : null; }
  setMode(A.p.mode);
  Store.save(A.p); A.set.last = A.p.id; Store.saveSet();
  const wake = () => { A.eng.audio(); };
  document.addEventListener('pointerdown', wake, { capture: true });
  document.addEventListener('keydown', wake, { capture: true });
  requestAnimationFrame(frame);
  if (A.set.ver !== BL_VERSION) {                // a returning player gets What's New once per version
    if (A.set.seenHelp) setTimeout(() => modal('New in Beat Lab ' + BL_VERSION, whatsNew(), [{ t: 'Help', f: () => { setTimeout(helpDialog, 30); } }, { t: 'Try a lesson', f: () => { setTimeout(learnHub, 30); } }, { t: 'Let\'s go', primary: true }], { wide: true }), 500);
    A.set.ver = BL_VERSION; Store.saveSet();
  }
  if (!A.set.seenHelp && A.p.mode === 'simple') { A.set.seenHelp = 1; Store.saveSet(); setTimeout(() => { if (!Tutor.active && A.p.mode === 'simple') offer('simple'); }, 600); }
}

// ---- debug hook for tests
window.__beatlab = {
  get state() { return { mode: A.p && A.p.mode, playing: A.playing, tick: A.eng.position(), name: A.p && A.p.name, tab: A.ui.tab, ch: A.ui.ch, pat: A.ui.pat, playMode: A.ui.playMode, undo: Hist.undo.length, redo: Hist.redo.length, audio: A.eng.ctx ? A.eng.ctx.state : 'none', rec: A.ui.rec }; },
  get project() { return A.p; },
  songsApi: () => songsApi(), openSharedCode: c => openSharedCode(c), saveData: () => { saveNow(); try { return localStorage.getItem(KEY_P + A.p.id); } catch (e) { return null; } },
  get lastError() { return A.lastError || E.lastError || ''; },
  app: A, engine: A.eng, E, Store, Hist,
  load(p) { openProjectObj(typeof p === 'string' ? JSON.parse(p) : E.clone(p)); return A.p.id; },
  loadDemo(id) { const p = E.demo(id); if (!p) return null; p.id = uid(); p.mode = 'studio'; openProjectObj(p); return A.p.id; },
  newSimple() { openProjectObj(newSimpleProject('Test song')); return A.p.id; },
  newStudio() { openProjectObj(newStudioProject('Test project')); return A.p.id; },
  play(mode) { if (mode && A.p.mode === 'studio') setPlayMode(mode); startPlay(); return A.playing; },
  stop() { stopPlay(); },
  step(sec) { A.eng.step(sec || 1); return A.eng.stats.notes; },
  counts() {
    const p = A.p, out = { scheduled: A.eng.stats.notes, voices: A.eng.stats.voices };
    if (p.mode === 'simple') return Object.assign(out, { melody: p.simple.ly.reduce((n, L) => n + L.mel.length, 0), layers: p.simple.ly.length, drums: p.simple.drm.length, channels: SP ? SP.ch.length : 0 });
    let notes = 0, steps = 0; for (const q of p.pat) { for (const k in q.nt) notes += q.nt[k].length; for (const k in q.st) steps += q.st[k].filter(v => v > 0).length; }
    return Object.assign(out, { channels: p.ch.length, patterns: p.pat.length, notes, steps, clips: p.pl.cl.length, mixerFx: p.mix.reduce((n, m) => n + m.fx.length, 0) });
  },
  undo() { Hist.doUndo(); }, redo() { Hist.doRedo(); }, save() { return saveNow(); },
  switchMode(m) { if (m === 'studio' && A.p.mode === 'simple') openInStudio(); else if (m === 'simple' && A.p.mode === 'studio') { openProjectObj(newSimpleProject()); } return A.p.mode; },
  openInStudio() { openInStudio(); return A.p.mode; },
  tab(t) { showTab(t); },
  async render(o) { const proj = A.p.mode === 'simple' ? simpleToProject(A.p.simple, A.p.name) : A.p; const buf = await E.render(proj, o || (A.p.mode === 'simple' ? { mode: 'pat', pat: 1 } : { mode: 'song' })); return E.bufferStats(buf); },
  simpleProject() { return SP; }, stemProject,
  tut: { start: id => tutStart(id), stop: () => tutStop('skip'), next: () => Tutor.next(), back: () => Tutor.back(), keep: () => tutKeep(), xy: tutXY, learn: () => learnHub(), explain: on => setExplain(on),
    lessons: () => LESSONS.map(l => ({ id: l.id, title: l.title, steps: l.steps.length })),
    get state() { const l = TT.les; return { active: !!l, id: l ? l.id : null, step: TT.i, of: l ? l.steps.length : 0, finale: !!l && TT.i >= l.steps.length, title: l && TT.i < l.steps.length ? l.steps[TT.i].title : '', done: Object.assign({}, A.set.tut), temp: isTemp(), kept: TT.kept, prog: TT.el ? TT.el.prog.textContent : '' }; } },
  presets() { return { total: E.PRESETS.length, categories: E.CATEGORIES.length, drums: E.PRESETS.filter(x => x.p.k === 'drm').length }; }
};
boot();

</script>
