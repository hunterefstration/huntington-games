<style>
/* Huntington Minigames: shared look (copied into every minigame by Minigames/build.sh) */
:root { --mg: #38bdf8; --bg: #0b0f1a; --panel: rgba(17, 24, 39, .92); --line: rgba(255,255,255,.12); --text: #e5e7eb; --dim: #94a3b8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; }
.hidden { display: none !important; }
#mg-lobby, #mg-res { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); backdrop-filter: blur(4px); }
.mg-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.mg-kicker { font: 700 11px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--mg); }
.mg-card h1 { margin: 6px 0 4px; font-size: 40px; font-weight: 900; letter-spacing: .01em; text-shadow: 0 0 24px color-mix(in srgb, var(--mg) 50%, transparent); }
.mg-sub { color: var(--dim); margin: 4px 0 10px; } .mg-how { font-size: 14px; color: #cbd5e1; margin: 8px 0 14px; line-height: 1.5; }
.mg-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
.mg-btn { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
.mg-btn:hover { border-color: var(--mg); } .mg-btn.big { background: var(--mg); color: #06101f; border-color: var(--mg); }
.mg-btn:disabled { opacity: .45; cursor: default; }
#mg-code { width: 140px; text-align: center; font: 800 18px system-ui; letter-spacing: .15em; padding: 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; }
#mg-st { min-height: 20px; color: #bae6fd; font-size: 14px; } #mg-st.bad { color: #fda4af; }
.mg-code { font-size: 16px; margin: 8px 0; } .mg-code b { color: var(--mg); font-size: 26px; letter-spacing: .2em; }
#mg-people { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.mg-chip { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; } .mg-chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .mg-chip small { color: var(--dim); }
select { background: rgba(0,0,0,.4); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 700 14px system-ui; }
label { color: var(--dim); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.mg-res-row { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; } .mg-res-row b { color: var(--mg); }
.mg-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font: 800 14px system-ui; pointer-events: none; }
.mg-hud span { background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
canvas { display: block; }
.mg-btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 9px; vertical-align: middle; }
#mg-snd { position: fixed; top: 10px; right: 10px; z-index: 70; min-width: 40px; min-height: 36px; font-size: 16px; }
#mg-name { width: 170px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: 700 15px system-ui; user-select: text; }
#mg-ready { color: #bbf7d0; margin: 2px 0 6px; }
#mg-confirm { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); }
#mg-confirm .mg-card { max-width: 420px; } #mg-confirm h2 { margin: 4px 0; }

</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ---- 00-mg.js ----
// ==========================================
// HUNTINGTON MINIGAMES: the shared lobby (copied into every minigame by Minigames/build.sh; edit it here).
// Play vs bots right away, or open a room (6-digit code, HGNet = the launcher's multiplayer network) and friends
// join; the host adds bots to fill seats and starts. The host runs the game (and the bots) and tells everyone.
// A game calls MG.init({...}) and gets onStart(roster, seed), onMsg(peerId, msg), onLeave(id) back.
// ==========================================
const MG = { cfg: null, net: null, host: false, solo: false, code: '', me: 0, name: '', roster: [], started: false, bots: 1, adT: 0 };
const MG_BOTS = ['Byte', 'Pixel', 'Turbo', 'Glitch', 'Echo', 'Nova', 'Bolt', 'Rusty', 'Sprocket', 'Zippy'];
const MG_COLS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80', '#a78bfa', '#fb923c', '#f87171', '#2dd4bf', '#e879f9', '#fde68a'];
function mgEl(id) { return document.getElementById(id); }
function mgEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mgCol(i) { return MG_COLS[i % MG_COLS.length]; }
function mgHG() {
    const h = window.HGNet || (() => { try { return window.parent && window.parent.HGNet; } catch (e) { return null; } })();
    if (h) return Promise.resolve(h);
    return new Promise(res => { const s = document.createElement('script'); s.src = '../../gv/vendor/hgnet.js'; s.onload = () => res(window.HGNet || null); s.onerror = () => res(null); document.head.appendChild(s); });
}
function mgLauncherName() { try { const L = window.parent && window.parent.HGGrapevine, me = L && L.me(); if (me) return me.name; } catch (e) {} return ''; }
function mgMyName() {
    const ln = mgLauncherName(); if (ln) return ln;
    try { let n = localStorage.getItem('hgmini_name'); if (!n) { n = 'Player ' + (100 + Math.floor(Math.random() * 900)); localStorage.setItem('hgmini_name', n); } return n; } catch (e) { return 'Player'; }
}
function mgLs(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function mgSay(t, bad) { const e = mgEl('mg-st'); if (e) { e.textContent = t; e.className = bad ? 'bad' : ''; } }
// ---- the lobby screen
MG.init = function (cfg) {
    MG.cfg = Object.assign({ min: 2, max: 8, bots: 7, defBots: 1, color: '#38bdf8', solo: true }, cfg);
    document.documentElement.style.setProperty('--mg', MG.cfg.color);
    const d = document.createElement('div'); d.id = 'mg-lobby';
    d.innerHTML = `<div class="mg-card"><div class="mg-kicker">Huntington Minigames</div><h1>${mgEsc(cfg.title)}</h1><p class="mg-sub">${cfg.sub || ''}</p>
      <div class="mg-how">${cfg.howto || ''}</div>
      <div class="mg-row">${MG.cfg.solo ? '<button class="mg-btn big" id="mg-solo">Play vs bots</button>' : ''}<button class="mg-btn" id="mg-host">Open a room</button>
        <input id="mg-code" maxlength="7" inputmode="numeric" placeholder="6-digit code" autocomplete="off"><button class="mg-btn" id="mg-join">Join</button></div>
      <div class="mg-row hidden" id="mg-namerow"><label>Your name <input id="mg-name" maxlength="16" autocomplete="off"></label></div>
      <div id="mg-st"></div>
      <div id="mg-room" class="hidden"><div class="mg-code">Room code <b id="mg-codev"></b> <button class="mg-btn sm" id="mg-copy" title="Copy the room code">Copy</button></div><div id="mg-people"></div>
        <div class="mg-row" id="mg-hostrow"><label>Bots <select id="mg-bots"></select></label><button class="mg-btn big" id="mg-start" title="Start (Enter)">Start</button></div>
        <div id="mg-ready" class="mg-sub hidden"></div>
        <div id="mg-wait" class="mg-sub hidden">Waiting for the host to start...</div></div></div>`;
    document.body.appendChild(d);
    const r = document.createElement('div'); r.id = 'mg-res'; r.className = 'hidden'; document.body.appendChild(r);
    const sel = mgEl('mg-bots'); for (let i = 0; i <= MG.cfg.bots; i++) sel.add(new Option(String(i), i)); sel.value = MG.cfg.defBots;
    const bk = 'hgmini_bots_' + MG.cfg.id, sb = parseInt(mgLs(bk), 10);     // the bot count you picked last time
    sel.onchange = () => { MG.bots = +sel.value; mgLs(bk, String(MG.bots)); mgLobbySend(); };
    MG.bots = sb >= 0 && sb <= MG.cfg.bots ? sb : MG.cfg.defBots; sel.value = MG.bots;
    if (!mgLauncherName()) {     // not signed in to the launcher: the name can be changed here and is remembered
        const ni = mgEl('mg-name'); mgEl('mg-namerow').classList.remove('hidden'); ni.value = mgMyName();
        ni.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ni.blur(); };
        ni.onchange = () => { const v = ni.value.replace(/\s+/g, ' ').trim().slice(0, 16); if (v) mgLs('hgmini_name', v); ni.value = mgMyName(); };
    }
    mgEl('mg-copy').onclick = () => mgCopyCode();
    mgQolInit();
    if (mgEl('mg-solo')) mgEl('mg-solo').onclick = () => mgSolo();
    mgEl('mg-host').onclick = () => mgHost();
    mgEl('mg-join').onclick = () => mgJoin(mgEl('mg-code').value);
    mgEl('mg-code').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') mgJoin(mgEl('mg-code').value); };
    mgEl('mg-start').onclick = () => mgStart();
    // the launcher: invites, open parties, Quick Match
    window.__hgJoin = c => { mgShowLobby(); mgEl('mg-code').value = c; mgJoin(c); return true; };
    window.__hgHost = convId => { mgShowLobby(); mgHost(); const iv = setInterval(() => { if (MG.code) { clearInterval(iv); try { window.parent.HG_sendInvite(convId, { game: MG.cfg.id, code: MG.code, max: MG.cfg.max }); } catch (e) {} } }, 300); setTimeout(() => clearInterval(iv), 25000); };
    setTimeout(() => { try { const p = window.parent; if (!p || p === window) return; const c = p.HG_takeJoin && p.HG_takeJoin(MG.cfg.id); if (c) return window.__hgJoin(c); const h = p.HG_takeHost && p.HG_takeHost(MG.cfg.id); if (h && h.convId) window.__hgHost(h.convId); } catch (e) {} }, 400);
    window.__mg = MG;
};
function mgShowLobby() { mgEl('mg-lobby').classList.remove('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgHideLobby() { mgEl('mg-lobby').classList.add('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgBotsFor(nHumans, n) { const out = []; for (let i = 0; i < Math.min(n, MG.cfg.max - nHumans); i++) out.push({ id: 100 + i, name: MG_BOTS[i % MG_BOTS.length] + ' (bot)', bot: true }); return out; }
function mgHumans() {
    const out = [{ id: 0, name: MG.host ? MG.name : ((MG.roster.find(r => r.id === 0) || {}).name || 'Host') }];
    if (MG.net && MG.host) for (const p of MG.net.peers()) if (!p.isHost && p.state !== 'left') out.push({ id: p.id, name: String(p.name || 'Player').slice(0, 16) });
    return out;
}
function mgRosterNow() { const h = mgHumans().slice(0, MG.cfg.max); return h.concat(mgBotsFor(h.length, MG.bots)).map((r, i) => Object.assign(r, { col: mgCol(i) })); }
function mgSolo() {
    MG.solo = true; MG.host = true; MG.me = 0; MG.name = mgMyName();
    const bots = Math.max(MG.cfg.min - 1, MG.bots || 1);
    MG.roster = [{ id: 0, name: MG.name }].concat(mgBotsFor(1, bots)).map((r, i) => Object.assign(r, { col: mgCol(i) }));
    mgBegin({ roster: MG.roster, seed: (Math.random() * 1e9) | 0 });
}
function mgWire(net) {
    net.on('message', (peer, m) => {
        if (!m || typeof m !== 'object') return;
        if (m.t === '_lobby' && !MG.host) { MG.roster = m.roster; MG.bots = m.bots; if (m.room && !MG.started) mgShowLobby(); mgPaint(); return; }
        if (m.t === '_start' && !MG.host) return mgBegin(m);
        if (m.t === '_end' && !MG.host) return mgShowEnd(m.html);
        if (m.t === 'g' && MG.cfg.onMsg) MG.cfg.onMsg(peer.id, m.d);
    });
    net.on('join', () => { if (MG.host) mgLobbySend(); });
    net.on('leave', peer => { if (MG.host) { if (!MG.started) mgLobbySend(); else if (MG.cfg.onLeave) MG.cfg.onLeave(peer.id); } mgPaint(); });
    net.on('closed', (r, t) => { if (MG.net !== net) return; MG.net = null; MG.code = ''; MG.started = false; mgShowLobby(); mgEl('mg-room').classList.add('hidden'); mgConfirmClose(); mgSay(r === 'host-left' ? 'The host left, so the room closed. Open your own room or play vs bots.' : 'Disconnected' + (t ? ': ' + t : '.'), true); if (MG.cfg.onQuit) MG.cfg.onQuit(); });
}
function mgHost() {
    if (MG.net) return; mgSay('Opening a room...');
    mgHG().then(HG => {
        if (!HG) return mgSay('Playing with friends needs the Huntington Games launcher. "Play vs bots" works anywhere.', true);
        MG.name = mgMyName(); const net = MG.net = HG.create({ game: MG.cfg.id }); mgWire(net);

}
function mgJoin(code) {

function mgLobbySend(room) { if (!MG.host || !MG.net) return; MG.roster = mgRosterNow(); MG.net.send('all', room ? { t: '_lobby', roster: MG.roster, bots: MG.bots, room: 1 } : { t: '_lobby', roster: MG.roster, bots: MG.bots }); mgPaint(); }

function mgStart() {

function mgBegin(m) {

// ---- during a game
MG.isHost = () => MG.host || MG.solo;

function mgLeave() {

// ---- quality of life: sound toggle (M), copy code, keyboard, leave confirm (Esc)
function mgCopyCode() {
    const b = mgEl('mg-copy'), done = ok => { b.textContent = ok ? 'Copied!' : 'Copy failed'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); };
    const fallback = () => { try { const t = document.createElement('textarea'); t.value = MG.code; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); done(ok); } catch (e) { done(false); } };

}
function mgPaintSnd() { const b = mgEl('mg-snd'); if (b) { b.textContent = MGS.muted ? '🔇' : '🔊'; b.title = MGS.muted ? 'Sound off (M)' : 'Sound on (M)'; } }

function mgConfirmClose() { const c = mgEl('mg-confirm'); if (c) c.classList.add('hidden'); }
function mgConfirmLeave() {
    let c = mgEl('mg-confirm');

        c.innerHTML = '<div class="mg-card"><h2>Leave this match?</h2><p class="mg-sub" id="mg-confirm-t"></p><div class="mg-row"><button class="mg-btn big" id="mg-confirm-stay" title="Esc">Keep playing</button><button class="mg-btn" id="mg-confirm-go" title="Enter">Leave</button></div></div>';

}
function mgQolInit() {

MG.leave = mgLeave;
// a seeded random (the same on every screen when the host sends the seed)
function mgRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const MGS = (() => { let ac = null; const c = () => { if (MGS.muted) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; };

// ---- 10-game.js ----
// ==========================================
// CONNECT FOUR: drop discs, four in a row wins (across, down or diagonal). Two players, or you against the bot.
// The host keeps the board and checks every move. The bot looks four moves ahead (and is not perfect on purpose).
// ==========================================
const C = 7, Rw = 6;
const G4 = { b: [], turn: 0, ids: [0, 0], over: false, last: -1, hover: -1, anim: null, wins: null };
document.getElementById('app').innerHTML = '<div class="mg-hud"><span id="c4-a"></span><span id="c4-t"></span><span id="c4-b"></span></div><canvas id="c4"></canvas>';
const cv = document.getElementById('c4'), x = cv.getContext('2d'), S = 80, Wd = C * S, Ht = (Rw + 1) * S;
function fit() { const k = Math.min(innerWidth / Wd, (innerHeight - 50) / Ht) * 0.95; cv.width = Wd; cv.height = Ht; cv.style.width = Wd * k + 'px'; cv.style.height = Ht * k + 'px'; cv.style.margin = '46px auto 0'; }
addEventListener('resize', fit); fit();
const fresh = () => Array.from({ length: Rw }, () => Array(C).fill(-1));
function dropRow(b, c) { for (let r = Rw - 1; r >= 0; r--) if (b[r][c] < 0) return r; return -1; }
function lineAt(b, r, c) {
    const p = b[r][c]; if (p < 0) return null;
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const cells = [[r, c]];
        for (const s of [1, -1]) for (let k = 1; k < 4; k++) { const rr = r + dr * k * s, cc = c + dc * k * s; if (rr < 0 || rr >= Rw || cc < 0 || cc >= C || b[rr][cc] !== p) break; cells.push([rr, cc]); }

    }

}
// ---- the bot: minimax, 4 plies, with a simple window score
function score(b, me) {
    let s = 0; const opp = 1 - me;
    for (let r = 0; r < Rw; r++) if (b[r][3] === me) s += 3;
    const win = (cells) => { let m = 0, o = 0; for (const [r, c] of cells) { if (b[r][c] === me) m++; else if (b[r][c] === opp) o++; } if (m && o) return 0; return m === 3 ? 5 : m === 2 ? 2 : o === 3 ? -6 : o === 2 ? -2 : 0; };
    for (let r = 0; r < Rw; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const cells = []; for (let k = 0; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= Rw || cc < 0 || cc >= C) break; cells.push([rr, cc]); }

}
function mm(b, depth, who, me, a, bb) {
    const moves = [3, 2, 4, 1, 5, 0, 6].filter(c => dropRow(b, c) >= 0);
    if (!moves.length || depth === 0) return [score(b, me), -1];
    let best = who === me ? -1e9 : 1e9, bestC = moves[0];

        const r = dropRow(b, c); b[r][c] = who;

        if (who === me ? v > best : v < best) { best = v; bestC = c; }

}
function botMove(side) { const b = G4.b.map(r => r.slice()); if (Math.random() < 0.12) { const ok = [0, 1, 2, 3, 4, 5, 6].filter(c => dropRow(b, c) >= 0); return ok[Math.floor(Math.random() * ok.length)]; } return mm(b, 4, side, side, -1e9, 1e9)[1]; }
// ---- the host applies moves
function hostMove(from, c) {

    const r = dropRow(G4.b, c); if (r < 0) return;

    MG.toAll(m); onState(m);
    if (G4.over) setTimeout(() => { const w = line ? MG.player(G4.ids[side]) : null; MG.end(w ? `<h1>${mgEsc(w.name)} wins!</h1><p class="mg-sub">Four in a row.</p>` : '<h1>A draw</h1><p class="mg-sub">The board is full.</p>'); }, 1600);
    else botTurn();
}
function botTurn() { const p = MG.player(G4.ids[G4.turn]); if (p && p.bot && !G4.over) setTimeout(() => hostMove(p.id, botMove(G4.turn)), 500 + Math.random() * 500); }
function onState(m) { G4.b = m.b; G4.turn = m.turn; G4.over = m.over; G4.wins = m.wins; G4.anim = { c: m.last, r: m.row, y: 0, t: 0 }; MGS.blip(); hud(); if (m.over) (m.wins && G4.ids[G4.b[m.row][m.last]] === MG.me ? MGS.win : MGS.lose)(); }
function hud() {
    const a = MG.player(G4.ids[0]), b = MG.player(G4.ids[1]);
    document.getElementById('c4-a').innerHTML = `<i style="color:#f43f5e">●</i> ${mgEsc(a ? a.name : '')}`; document.getElementById('c4-b').innerHTML = `<i style="color:#facc15">●</i> ${mgEsc(b ? b.name : '')}`;
    const t = MG.player(G4.ids[G4.turn]); document.getElementById('c4-t').textContent = G4.over ? 'Game over' : (G4.ids[G4.turn] === MG.me ? 'Your turn' : (t ? t.name + '’s turn' : ''));
}
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); G4.hover = Math.floor((e.clientX - r.left) / r.width * C); });
cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(), c = Math.floor((e.clientX - r.left) / r.width * C); if (G4.ids[G4.turn] === MG.me && !G4.over) MG.toHost({ k: 'drop', c }); });
addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 7 && G4.ids[G4.turn] === MG.me && !G4.over) MG.toHost({ k: 'drop', c: n - 1 }); });
function draw(t) {
    requestAnimationFrame(draw);
    x.fillStyle = '#0b1026'; x.fillRect(0, 0, Wd, Ht);
    if (G4.ids[G4.turn] === MG.me && !G4.over && G4.hover >= 0) { x.fillStyle = G4.turn ? '#facc15' : '#f43f5e'; x.globalAlpha = 0.6; x.beginPath(); x.arc(G4.hover * S + S / 2, S / 2, S * 0.38, 0, 7); x.fill(); x.globalAlpha = 1; }
    x.fillStyle = '#1d4ed8'; x.fillRect(0, S, Wd, Rw * S);
    for (let r = 0; r < Rw; r++) for (let c = 0; c < C; c++) {
        const v = G4.b[r] ? G4.b[r][c] : -1, cx = c * S + S / 2; let cy = (r + 1) * S + S / 2;
        if (G4.anim && G4.anim.c === c && G4.anim.r === r) { G4.anim.t = Math.min(1, G4.anim.t + 0.08); cy = S / 2 + (cy - S / 2) * (G4.anim.t * G4.anim.t); }

    }
    if (G4.wins) { x.strokeStyle = '#fff'; x.lineWidth = 6; x.beginPath(); G4.wins.slice().sort((a, b) => a[1] - b[1] || a[0] - b[0]).forEach(([r, c], i) => { const px = c * S + S / 2, py = (r + 1) * S + S / 2; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke(); }
}
requestAnimationFrame(draw);
MG.init({
    id: 'mg-connect4', title: 'Connect Four', color: '#f43f5e', min: 2, max: 2, bots: 1, defBots: 1,
    sub: 'Four in a row wins.', howto: 'Click a column (or press <b>1-7</b>) to drop your disc. Get four in a row across, down or diagonally.',
    onStart(roster) { G4.ids = [roster[0].id, roster[1].id]; G4.b = fresh(); G4.turn = Math.random() < 0.5 ? 0 : 1; G4.over = false; G4.wins = null; G4.anim = null;
        if (MG.isHost()) { const m = { k: 'start', turn: G4.turn }; MG.toAll(m); } hud(); if (MG.isHost()) botTurn(); },
    onMsg(from, m) { if (m.k === 'drop' && MG.isHost()) hostMove(from, m.c); else if (m.k === 'st') onState(m); else if (m.k === 'start') { G4.turn = m.turn; hud(); } },
    onLeave() { if (!G4.over && MG.isHost()) { G4.over = true; MG.end('<h1>Your opponent left</h1>'); } }
});
