<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Tetris Surge - a falling-block game with power blocks, rogue-lite perks, bosses, and classic modes.">
<title>Tetris Surge 2.0 - Power Block Edition</title>
<style>
:root{--acc:#5ad1ff;--acc2:#ff5ad1;--ink:#eaf0ff;--dim:#93a0c8;--pan:rgba(14,18,44,.96);--line:rgba(130,160,255,.30);--ctrl:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#0a0c1c;overflow:hidden;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hide{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#0a0c1c}
#stage{position:absolute;left:0;top:0;right:0;bottom:var(--ctrl)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;image-rendering:auto}
#ov{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:8px;background:radial-gradient(ellipse at center,rgba(8,10,34,.50),rgba(3,4,14,.90))}
#ov.clear{background:rgba(3,4,14,.55)}
.panel{width:min(100%,760px);max-height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;text-align:center}
.panel.narrow{width:min(100%,520px)}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:rgba(130,160,255,.35);border-radius:4px}
h1,h2,h3{margin:0}
.logo{font-weight:900;letter-spacing:3px;line-height:1;font-size:clamp(30px,8vw,56px);text-shadow:0 0 22px rgba(90,209,255,.55)}
.logo span{background:linear-gradient(90deg,#5ad1ff,#8d7bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo b{margin-left:.25em;background:linear-gradient(90deg,#ff5ad1,#ffb84a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tag{color:var(--dim);margin:4px 0 12px;font-size:clamp(12px,3.2vw,16px);letter-spacing:2px;text-transform:uppercase}
h2{font-size:clamp(20px,5vw,28px);letter-spacing:2px;margin-bottom:8px}
h3{font-size:15px;letter-spacing:1px;margin:10px 0 6px;color:var(--acc);text-transform:uppercase}
.btn{font:inherit;color:#fff;background:linear-gradient(#34459f,#232f78);border:1px solid var(--line);border-radius:11px;padding:10px 16px;cursor:pointer;font-weight:700;letter-spacing:.5px;touch-action:manipulation;margin:3px;min-height:40px}
.btn:hover{border-color:var(--acc);filter:brightness(1.12)}
.btn:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(90,209,255,.40)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#ff9a3a,#e5470e);border-color:rgba(255,200,150,.6)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:30px}
.btn.off{opacity:.45}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;margin-top:8px}
.mrow .btn{padding:8px 10px;font-size:13px;margin:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin:8px 0}
.card{position:relative;text-align:left;background:linear-gradient(160deg,rgba(60,75,160,.55),rgba(30,38,100,.55));border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover,.card:focus{transform:translateY(-2px);border-color:var(--acc);outline:none}
.card h3{margin:0 0 2px;color:#fff;font-size:17px;letter-spacing:1px}
.card p{margin:0;font-size:12px;color:#b9c4ec;line-height:1.3}
.card .best{margin-top:6px;font-size:12px;color:#ffd96b;font-weight:700}
.card.feat{grid-column:1/-1;background:linear-gradient(120deg,#4a1b94,#b0238d 55%,#ff7a2b);border-color:rgba(255,200,255,.5);padding:14px 16px}
.card.feat h3{font-size:clamp(22px,6vw,30px);letter-spacing:3px}
.card.feat p{font-size:13px;color:#ffe9ff}
.badge{position:absolute;right:10px;top:10px;background:#111a;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:2px 7px;font-size:11px;letter-spacing:1px;color:#ffe08a}
.card:not(.feat) .badge{position:static;display:inline-block;margin:0 0 4px}
.lv{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:#cfd8ff}
.lv b{min-width:20px;text-align:center;color:#fff}
.lv .btn{margin:0;padding:0 8px;min-height:22px;font-size:14px;line-height:20px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:8px}
.tab{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(40,52,120,.5);cursor:pointer;font-weight:700;font-size:13px}
.tab.on{background:linear-gradient(#34459f,#5b3fc4);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid rgba(130,160,255,.15);text-align:left}
th{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
td.r,th.r{text-align:right}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid rgba(130,160,255,.12);text-align:left}
.set label{font-size:14px}
.set small{display:block;color:var(--dim);font-size:11px}
.set input[type=range]{width:44%;max-width:230px;accent-color:#5ad1ff}
.set input[type=text]{background:#0b1030;color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;width:44%;max-width:200px;-webkit-user-select:text;user-select:text}
.set .val{min-width:56px;text-align:right;color:#ffd96b;font-weight:700;font-size:13px}
.kb{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;align-items:center}
.key{display:inline-block;min-width:26px;padding:3px 8px;border-radius:7px;background:#0b1030;border:1px solid var(--line);border-bottom-width:3px;font-size:12px;font-weight:700;text-align:center;margin:1px 2px}
.key.listen{border-color:#ff9a3a;color:#ffb36b;animation:blink .7s infinite alternate}
@keyframes blink{from{opacity:.4}to{opacity:1}}
.how{text-align:left;font-size:14px;line-height:1.45;color:#d6defa}
.how p{margin:4px 0}
.how .pw{display:flex;gap:10px;align-items:center;margin:5px 0;padding:6px 8px;background:rgba(40,52,120,.35);border-radius:10px}
.how .pw canvas{flex:0 0 auto;width:36px;height:36px;background:#0006;border-radius:6px}
.how b{color:#fff}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:10px 0}
.sum div{background:rgba(40,52,120,.45);border-radius:10px;padding:6px 4px}
.sum small{display:block;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.sum span{font-size:18px;font-weight:800}
.big{font-size:clamp(32px,9vw,56px);font-weight:900;letter-spacing:2px}
.rec{color:#ffd96b;font-weight:900;letter-spacing:2px;animation:blink .5s infinite alternate}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.perk{text-align:left;border-radius:14px;padding:12px;cursor:pointer;border:2px solid #fff3;background:linear-gradient(170deg,#1b2260,#10143c);transition:transform .12s;position:relative}
.perk:hover,.perk:focus{transform:translateY(-4px);outline:none}
.perk.common{border-color:#8fb3ff}
.perk.uncommon{border-color:#5be39a;background:linear-gradient(170deg,#143f4a,#0d2230)}
.perk.rare{border-color:#ffb84a;background:linear-gradient(170deg,#4d2a10,#2a1208);box-shadow:0 0 22px rgba(255,170,60,.35)}
.perk h3{margin:0 0 4px;color:#fff;font-size:16px;text-transform:none;letter-spacing:.5px}
.perk .rar{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cde}
.perk p{margin:4px 0 0;font-size:13px;color:#d6defa;line-height:1.35}
.perk .own{margin-top:6px;font-size:11px;color:#ffd96b}
.perk .num{position:absolute;right:10px;top:8px;font-weight:900;color:#fff8;font-size:18px}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;text-align:left}
.ach>div{padding:7px 9px;border-radius:10px;background:rgba(40,52,120,.35);border:1px solid transparent;font-size:12px;color:#aeb8de}
.ach>div.got{border-color:#ffd96b88;background:rgba(120,90,20,.35);color:#fff}
.ach b{display:block;font-size:14px}
.thm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.thm div{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:rgba(30,40,100,.4);text-align:left}
.thm div.sel{border-color:#ffd96b}
.thm div.lock{opacity:.5;cursor:default}
.thm canvas{width:100%;height:46px;border-radius:6px;display:block;margin-bottom:5px}
.thm small{color:var(--dim);font-size:11px}
#toasts{position:absolute;left:0;right:0;top:8px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:linear-gradient(90deg,#3a2a80,#a02a8a);border:1px solid #fff6;border-radius:12px;padding:8px 16px;font-weight:800;font-size:14px;box-shadow:0 4px 24px #000a;animation:tin .35s ease-out;max-width:92%;text-align:center}
.toast small{display:block;font-weight:600;color:#ffe8ff;font-size:12px}
@keyframes tin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#touch{position:absolute;left:0;right:0;bottom:0;height:var(--ctrl);display:none;z-index:10;touch-action:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#touch.on{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1.25fr 1fr;gap:7px}
.tb{display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(52,70,170,.60);border:1px solid rgba(170,195,255,.50);color:#fff;font-weight:900;font-size:14px;letter-spacing:1px;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 3px 0 rgba(10,14,50,.7)}
.tb.dn{background:rgba(130,170,255,.85);transform:translateY(2px);box-shadow:none}
.tb svg{width:42%;height:42%;fill:currentColor}
.tb.surge{background:linear-gradient(#a02a8a,#5a1fa8);border-color:#ffb0f0}
.tb.surge.ready{animation:blink .4s infinite alternate;background:linear-gradient(#ffb84a,#ff5a2a)}
.tb.b-left{grid-column:1;grid-row:1}.tb.b-down{grid-column:2;grid-row:1}.tb.b-right{grid-column:3;grid-row:1}
.tb.b-ccw{grid-column:4;grid-row:1}.tb.b-cw{grid-column:5;grid-row:1}.tb.b-hold{grid-column:6;grid-row:1}
.tb.b-hard{grid-column:1/5;grid-row:2}.tb.b-surge{grid-column:5;grid-row:2}.tb.b-pause{grid-column:6;grid-row:2}
#touch.ns:not(.mini):not(.ls) .b-hard{grid-column:1/6}
#touch.ns .b-surge{display:none}
#touch.mini{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
#touch.mini .tb{display:none}
#touch.mini .tb.b-hold,#touch.mini .tb.b-surge,#touch.mini .tb.b-pause{display:flex;grid-row:1}
#touch.mini .tb.b-hold{grid-column:1}#touch.mini .tb.b-surge{grid-column:2}#touch.mini .tb.b-pause{grid-column:3}
#touch.ls{display:block;background:none;pointer-events:none;height:100%;--bs:clamp(46px,15vh,72px);padding:0}
#touch.ls .tb{position:absolute;width:var(--bs);height:var(--bs);opacity:.78;pointer-events:auto;grid-column:auto;grid-row:auto;border-radius:50%}
#touch.ls .b-left{left:12px;bottom:12px}#touch.ls .b-down{left:calc(12px + var(--bs) + 8px);bottom:12px}#touch.ls .b-right{left:calc(12px + 2*(var(--bs) + 8px));bottom:12px}
#touch.ls .b-hard{left:calc(12px + var(--bs) + 8px);bottom:calc(12px + var(--bs) + 8px);border-radius:16px;width:calc(var(--bs)*1.4);font-size:11px}
#touch.ls .b-cw{right:12px;bottom:12px}#touch.ls .b-ccw{right:calc(12px + var(--bs) + 8px);bottom:12px}
#touch.ls .b-hold{right:12px;bottom:calc(12px + var(--bs) + 8px);font-size:11px}
#touch.ls .b-surge{right:calc(12px + var(--bs) + 8px);bottom:calc(12px + var(--bs) + 8px);font-size:10px}
#touch.ls .b-pause{right:12px;top:10px;width:calc(var(--bs)*.7);height:calc(var(--bs)*.7)}
#touch.ls.mini .tb{display:none}
#touch.ls.mini .b-hold,#touch.ls.mini .b-surge,#touch.ls.mini .b-pause{display:flex}
.rk{margin-top:5px;font-size:12px;font-weight:800;letter-spacing:.5px}
.rk small{color:#93a0c8;font-weight:600;font-size:11px}
.card.feat .rk{font-size:13px;text-shadow:0 1px 3px #0008}
.rkcard{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(40,52,120,.45);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}
.rkcard canvas.emb{flex:0 0 auto;width:60px;height:60px}
.rki{flex:1;min-width:0}

.dhero{background:linear-gradient(120deg,#1b4a94,#2a2a8a 50%,#7a2a9a);border:1px solid rgba(190,210,255,.45);border-radius:14px;padding:12px 14px;margin:6px 0 8px;text-align:left}

<body>
<div id="app">
<div id="stage"><canvas id="cv" tabindex="0"></canvas></div>
<div id="touch" class="hide"></div>

<div id="ov" class="hide"></div>
<noscript>This game needs JavaScript.</noscript>
</div>
<script>
(function(){
'use strict';
/* =====================================================================
   TETRIS SURGE - single file falling-block game
   Sections: utils/storage, data, audio, themes+sprites, game logic,
   rendering, input, UI screens, main loop.
   ===================================================================== */

// ---------- utils ----------
var $=function(id){return document.getElementById(id);};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function pad2(n){return (n<10?'0':'')+n;}
function fmtTime(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return m+':'+pad2(s)+'.'+pad2(c);}
function fmtSec(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+':'+pad2(s);}
function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function today(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgba(h,a){var c=hexRGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function shade(h,amt){var c=hexRGB(h);function f(v){return clamp(Math.round(amt>=0?v+(255-v)*amt:v*(1+amt)),0,255);}return 'rgb('+f(c[0])+','+f(c[1])+','+f(c[2])+')';}
function cleanName(s){return String(s||'').replace(/[^\x20-\x7e]/g,'').replace(/[<>&"']/g,'').slice(0,10).trim()||'PLAYER';}

// ---------- storage (always try/catch; sandboxed iframes throw) ----------
var KEY='huntingtonTetrisSurge1', mem={};
function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;}}
function lsSet(k,v){try{window.localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
function defaults(){return {v:2,
  set:{sfx:70,music:30,hap:true,theme:'classic',skin:'auto',bg:'auto',ghost:true,grid:true,shake:true,fx:2,das:130,arr:25,sdf:2,touch:'auto',name:'PLAYER'},
  binds:{},best:{},ach:{},seen:{},last:{lv:1},
  rank:{},kills:{},pseen:{},
  puz:{},tut:{},
  daily:{h:{},streak:0,bestStreak:0,lastDay:0,plays:0,days:0},
  stats:{games:0,lines:0,pieces:0,tspins:0,tetrises:0,pcs:0,time:0,maxCombo:0,bosses:0,bestFloor:0,powers:0,bombs:0,lasers:0,frosts:0,quakes:0,golds:0,surges:0,holds:0,score:0,b2bMax:0}};}
var S=defaults();
function num(v,def){v=+v;return isFinite(v)?v:def;}
function cleanRank(o){
  var out={};
  if(!o||typeof o!=='object')return out;
  for(var m in o){
    var r=o[m];if(!r||typeof r!=='object')continue;
    out[m]={r:Math.max(0,num(r.r,0)),n:Math.max(0,num(r.n,0)),pk:Math.max(0,num(r.pk,0)),
      h:Array.isArray(r.h)?r.h.filter(function(v){return isFinite(+v);}).slice(-30):[],
      pl:Array.isArray(r.pl)?r.pl.filter(function(v){return isFinite(+v);}).slice(0,3):[]};
  }
  return out;
}
function cleanPuz(o){ // puzzle progress: id -> {s: best stars, p: fewest pieces, n: attempts}
  var out={};
  if(!o||typeof o!=='object')return out;
  for(var id in o){var e=o[id];if(!e||typeof e!=='object')continue;out[id]={s:clamp(Math.round(num(e.s,0)),0,3),p:Math.max(0,num(e.p,0)),n:Math.max(0,num(e.n,0))};}
  return out;
}
function loadSave(){
  var raw=lsGet(KEY),d=defaults();
  if(raw){try{var o=JSON.parse(raw);
    ['set','stats','last','daily'].forEach(function(k){if(o[k]&&typeof o[k]==='object'){for(var i in o[k]){if(Object.prototype.hasOwnProperty.call(d[k],i))d[k][i]=o[k][i];}}});
    ['binds','best','ach','seen','kills','pseen','tut'].forEach(function(k){if(o[k]&&typeof o[k]==='object')d[k]=o[k];});
    d.rank=cleanRank(o.rank);
    d.puz=cleanPuz(o.puz);
    if(!d.daily.h||typeof d.daily.h!=='object')d.daily.h={};
    // v1 -> v2: old Daily Run top scores become the start of the daily history
    if(!(o.v>=2)&&d.best.daily&&d.best.daily.length){
      d.best.daily.forEach(function(e){
        if(!e||!e.d)return;
        var h=d.daily.h[e.d];
        if(!h)d.daily.h[e.d]={k:'surge',s:e.s||0,l:e.l||0,t:e.t||0,f:e.f||1,w:0,n:1};
        else{h.n++;if((e.s||0)>h.s){h.s=e.s;h.l=e.l||0;h.t=e.t||0;h.f=e.f||1;}}
      });
      var ks=Object.keys(d.daily.h).map(Number).sort();
      if(ks.length){d.daily.lastDay=ks[ks.length-1];d.daily.days=ks.length;d.daily.plays=ks.length;d.daily.streak=1;d.daily.bestStreak=1;}
    }
  }catch(e){}}
  else{ // migrate the old single high score
    var old=parseInt(lsGet('tetrisHighScore'),10);
    if(old>0){d.best.marathon=[{s:old,l:0,lv:1,d:today(),n:'PLAYER'}];}
  }
  d.set.name=cleanName(d.set.name);
  S=d;
}
function save(){lsSet(KEY,JSON.stringify(S));}
loadSave();

// ---------- data ----------
var COLS=10,ROWS=24,HID=4,VIS=20;
var TYPES='IJLOSTZ';
var BASE={I:[[0,1],[1,1],[2,1],[3,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]],O:[[1,0],[2,0],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]]};
var SHAPES=[];
(function(){
  for(var t=0;t<7;t++){
    var ch=TYPES[t],n=(ch==='I'||ch==='O')?4:3,st=[BASE[ch].map(function(p){return [p[0],p[1]];})];
    for(var r=1;r<4;r++){
      var prev=st[r-1];
      if(ch==='O'){st.push(prev);continue;}
      st.push(prev.map(function(p){return [n-1-p[1],p[0]];}));
    }
    SHAPES.push(st);
  }
})();
var KICK_JLSTZ={'01':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'10':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'12':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'21':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'23':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'32':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'30':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'03':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
var KICK_I={'01':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'10':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'12':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'21':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'23':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'32':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'30':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'03':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};
var SDF=[5,10,20,40,0];
var SDF_NAME=['5x','10x','20x','40x','Instant'];
var ULTRA_MS=120000, SPRINT_LINES=40;

var MODES={
  surge:{name:'Surge Run',tag:'Rogue-lite! Power blocks, perks, bosses. Climb the tower.',sort:'score'},
  daily:{name:'Daily Surge',tag:'Surge Run with a seed shared by everyone today.',sort:'score'},
  marathon:{name:'Marathon',tag:'Endless levels. How far can you go?',sort:'score'},
  sprint:{name:'Sprint',tag:'Clear 40 lines. Fastest time wins.',sort:'time'},
  ultra:{name:'Ultra',tag:'Score as much as you can in 2 minutes.',sort:'score'},
  zen:{name:'Zen',tag:'No game over. Stack, relax, repeat.',sort:'score'},
  puzzle:{name:'Puzzles',tag:'Handcrafted boards. Solve them in as few pieces as you can.',sort:'score'},
  tutorial:{name:'Tutorial',tag:'Learn Hold and T-Spins step by step.',sort:'score'}
};
var MODE_ORDER=['surge','daily','marathon','sprint','ultra','zen'];

var POWERS={1:{n:'Bomb',d:'Clear its line and it explodes, wiping a big round area.'},
  2:{n:'Laser',d:'Clear its line and a beam wipes its entire column.'},
  3:{n:'Frost',d:'Clear its line to freeze gravity for a few seconds.'},
  4:{n:'Quake',d:'Clear its line and every block falls to fill gaps. Free chains!'},
  5:{n:'Gold',d:'Clear its line for a big pile of bonus points.'}};

var BOSSES=[
  {id:'rumble',name:'THE RUMBLER',desc:'Junk rows rise every few pieces!'},
  {id:'hourglass',name:'THE HOURGLASS',desc:'Gravity runs twice as fast!'},
  {id:'phantom',name:'THE PHANTOM',desc:'Your stack fades out of sight!'},
  {id:'mirror',name:'THE MIRROR',desc:'Left and right swap at random!'},
  {id:'hail',name:'THE HAILSTORM',desc:'Stray blocks rain from above!'},
  {id:'blind',name:'THE BLINDFOLD',desc:'Your Next queue is hidden! It only peeks every few pieces.'},
  {id:'upside',name:'THE UPSIDE',desc:'Gravity flips! The board turns upside-down.'},
  {id:'flood',name:'THE FLOODGATE',desc:'Junk floods in on a timer. Clear lines to block it!'},
  {id:'conveyor',name:'THE CONVEYOR',desc:'Your whole stack slides sideways every few pieces!'},
  {id:'cryo',name:'THE CRYOMANCER',desc:'Ice pillars freeze columns shut. Slide pieces under them!'}];
var BOSS_BY={};BOSSES.forEach(function(b){BOSS_BY[b.id]=b;});
var BOSS_ACH={blind:'b_blind',upside:'b_upside',flood:'b_flood',conveyor:'b_conv',cryo:'b_cryo'};

// perks: id, name, desc, rarity, max, short code
var PERKS=[
  {id:'slow',n:'Slow Fall',d:'Gravity is 12% slower.',r:'common',max:4,c:'SF'},
  {id:'charged',n:'Charged Bricks',d:'Power blocks show up more often.',r:'common',max:4,c:'CB'},
  {id:'greed',n:'Greed',d:'All points +20%.',r:'common',max:5,c:'GR'},
  {id:'battery',n:'Surge Battery',d:'The Surge meter charges 35% faster.',r:'common',max:3,c:'SB'},
  {id:'sweeper',n:'Floor Sweeper',d:'Bottom 2 rows vanish at the start of every floor.',r:'common',max:3,c:'FS'},
  {id:'sticky',n:'Sticky Floor',d:'Longer lock delay and more move resets.',r:'common',max:2,c:'ST'},
  {id:'bigbomb',n:'Mega Bombs',d:'Bomb blasts are bigger.',r:'uncommon',max:2,c:'MB'},
  {id:'widelaser',n:'Wide Laser',d:'Lasers also hit the neighbouring columns.',r:'uncommon',max:2,c:'WL'},
  {id:'deepfreeze',n:'Deep Freeze',d:'Frost lasts 4 seconds longer.',r:'uncommon',max:3,c:'DF'},
  {id:'combofuel',n:'Combo Fuel',d:'Combos score double and charge Surge.',r:'uncommon',max:2,c:'CF'},
  {id:'spinner',n:'Spin Doctor',d:'T-Spins score 50% more and charge Surge.',r:'uncommon',max:3,c:'SD'},
  {id:'ilove',n:'Long Bag',d:'An extra I piece in every bag.',r:'uncommon',max:2,c:'IP'},
  {id:'phoenix',n:'Phoenix Feather',d:'Survive a top-out once: the top of the board is wiped.',r:'rare',max:3,c:'PH'},
  {id:'pocket',n:'Pocket Dimension',d:'A second Hold slot.',r:'rare',max:1,c:'PD'},
  {id:'overcharge',n:'Overcharge',d:'Shockwave clears 2 more rows. Each floor starts with 40% Surge.',r:'rare',max:3,c:'OC'},
  {id:'midas',n:'Midas Touch',d:'Gold blocks are common and worth triple.',r:'rare',max:2,c:'MT'},
  {id:'hardhit',n:'Heavy Hands',d:'Hard drops score double and each one adds 1% Surge.',r:'common',max:3,c:'HH'},
  {id:'steady',n:'Short Floors',d:'Normal floors need 1 fewer line to clear.',r:'common',max:3,c:'SH'},
  {id:'conductor',n:'Conductor',d:'Every power block you set off adds 6% Surge.',r:'common',max:3,c:'CO'},
  {id:'lucky',n:'Lucky Draw',d:'+1 free reroll on every perk draft.',r:'common',max:2,c:'LD'},

function interp(tab,x){
  var n=tab.length;
  var inc=tab[n-1][0]>tab[0][0];
  if(inc?x<=tab[0][0]:x<=tab[n-1][0])return inc?tab[0][1]:tab[n-1][1];
  if(inc?x>=tab[n-1][0]:x>=tab[0][0])return inc?tab[n-1][1]:tab[0][1];
  for(var i=0;i<n-1;i++){
    var a=tab[i],b=tab[i+1],lo=Math.min(a[0],b[0]),hi=Math.max(a[0],b[0]);
    if(x>=lo&&x<=hi)return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
  }
  return 0;
}
function invInterp(tab,r){ // performance rating -> result needed
  for(var i=0;i<tab.length-1;i++){
    var a=tab[i],b=tab[i+1],lo=Math.min(a[1],b[1]),hi=Math.max(a[1],b[1]);
    if(r>=lo&&r<=hi&&a[1]!==b[1])return a[0]+(b[0]-a[0])*(r-a[1])/(b[1]-a[1]);
  }
  return tab[tab.length-1][0];
}
function tierOf(r){
  var t=0,i;
  for(i=TIERS.length-1;i>=0;i--)if(r>=TIERS[i].min){t=i;break;}
  var T=TIERS[t],lo=T.min,hi=t<TIERS.length-1?TIERS[t+1].min:T.min+600,d=-1;
  if(T.div){var span=(hi-lo)/3;d=Math.min(2,Math.floor((r-lo)/span));lo=T.min+d*span;hi=lo+span;}
  return {t:t,d:d,step:t*3+(d<0?0:d),lo:lo,hi:hi,prog:clamp((r-lo)/(hi-lo),0,1)};
}

var AC=null,gMaster=null,gSfx=null,gMus=null,audioOK=true,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  if(!audioOK)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C){audioOK=false;return;}
    AC=new C();
    gMaster=AC.createGain();gMaster.gain.value=1;
    var comp=AC.createDynamicsCompressor();gMaster.connect(comp);comp.connect(AC.destination);
    gSfx=AC.createGain();gSfx.connect(gMaster);
    gMus=AC.createGain();gMus.connect(gMaster);
    applyVol();
  }catch(e){AC=null;audioOK=false;}
}
function applyVol(){if(!AC)return;try{gSfx.gain.value=S.set.sfx/100*0.9;gMus.gain.value=S.set.music/100*0.30;}catch(e){}}
function tone(f,d,type,v,f2,delay,dest){
  if(!AC)return;
  if(!dest&&S.set.sfx<=0)return;
  try{
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v||0.2),t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest||gSfx);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
function noise(d,v,f,delay,f2){
  if(!AC||S.set.sfx<=0)return;
  try{
    if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var a=noiseBuf.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    var t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=noiseBuf;s.loop=true;fl.type='lowpass';fl.frequency.setValueAtTime(f||1000,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
    g.gain.setValueAtTime(v||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(gSfx);s.start(t);s.stop(t+d+0.05);
  }catch(e){}
}

// ---------- pieces / bag ----------

  while(G.queue.length<8){
    if(G.bag.length===0){
      // the 7-bag always comes from its own stream; perk extras are slotted in with a separate stream
      var b=[0,1,2,3,4,5,6],ex=pkc('ilove'),et=pkc('tparty'),i;
      shuffle(b,G.rb);
      for(i=0;i<ex;i++)b.splice(Math.floor(G.rx()*(b.length+1)),0,0);
      for(i=0;i<et;i++)b.splice(Math.floor(G.rx()*(b.length+1)),0,5);
      G.bag=b;
    }
    G.queue.push(makePiece(G.bag.pop()));
  }
}

function clearStep(dt){

  if(G.mode==='ultra'&&G.time>=ULTRA_MS){G.time=ULTRA_MS;endGame('time');return;}
  das(dt,true);
  if(G.frost>0)G.frost=Math.max(0,G.frost-dt);

  if(G.clear.t>=G.clear.dur)endClear();

function endClear(){
  var c=G.clear,i;
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(c.kill[y*COLS+x])G.grid[y][x]=0;
  var rs={};c.rows.forEach(function(y){rs[y]=1;});
  var ng=[],removed=0;

    confettiBurst();

    }

function nextTurn(){

// ---------- Surge Run: floors, perks, bosses ----------
function bossFor(f){
  // every lap through the boss list is shuffled from its own seeded stream (daily: same bosses for everyone)
  var idx=f/3-1,lap=Math.floor(idx/BOSSES.length);
  while(G.bossOrd.length<=lap){var o=[];for(var i=0;i<BOSSES.length;i++)o.push(i);G.bossOrd.push(shuffle(o,G.rboss));}
  return BOSSES[G.bossOrd[lap][idx%BOSSES.length]];
}
function startFloor(f){
  if(G.curse)endCurse();
  G.floor=f;G.target=floorTarget(f);
  if(f>S.stats.bestFloor)S.stats.bestFloor=f;
  if(f>=5)ach('floor5');
  if(f>=10)ach('floor10');
  if(f>=15)ach('floor15');
  var gift='';
  if(f===1&&G.daily&&G.daily.gift&&!G.giftGiven){
    var gid=G.daily.gift;G.giftGiven=true;G.pk[gid]=(G.pk[gid]||0)+1;G.perkLog.push(gid);
    gift=PERK_BY[gid].n;G.target=floorTarget(f);
  }
  var sw=2*pkc('sweeper');
  if(sw>0){
    wipe(ROWS-sw,ROWS);
    var ng=G.grid.slice(0,ROWS-sw);while(ng.length<ROWS)ng.unshift(newRow());G.grid=ng;
  }
  if(pkc('overcharge'))G.meter=Math.max(G.meter,Math.min(100,40*pkc('overcharge')));
  mus.bpm=Math.min(172,132+f*3);
  if(isBoss(f)){
    var idx=f/3-1,b=bossFor(f);
    G.curse={b:b,cyc:Math.floor(idx/5),cnt:0,t:0,mir:false,warned:false,peek:0,inc:0,ft:0,flip:false,fk:0,
      dir:G.re()<.5?-1:1,shifts:0,slide:0,sdir:1};
    G.ward=2*pkc('ward');
    if(b.id==='blind')G.curse.peek=2200; // one last look once play starts, then the lights go out
    G.banner={t:0,dur:2800,title:b.name,sub:b.desc,sub2:G.ward?'Your Boss Ward blocks '+G.ward+' attacks':'',next:'play',boss:true};sfx.boss();shake(.8);
  }else{
    var nb=isBoss(f+1)?bossFor(f+1):null;
    G.banner={t:0,dur:(gift||nb)?2000:1300,title:'FLOOR '+f,sub:'Clear '+G.target+' lines',
      sub2:gift?'DAILY GIFT: '+gift.toUpperCase():(nb?'NEXT FLOOR BOSS: '+nb.name:''),next:'play'};sfx.ready();
  }
  G.state='banner';G.cur=null;
}
function floorComplete(){
  var boss=isBoss(G.floor),bonus=1000*G.floor*(boss?3*(1+.5*pkc('hunter')):1);
  G.floorLines-=G.target;if(G.floorLines<0)G.floorLines=0;
  bonus=Math.round(bonus*(1+.2*pkc('greed')));
  G.score+=bonus;
  if(boss){
    G.st.bosses++;S.stats.bosses++;ach('boss');
    var bid=G.curse?G.curse.b.id:'';
    if(bid){S.kills[bid]=(S.kills[bid]||0)+1;if(BOSS_ACH[bid])ach(BOSS_ACH[bid]);}
    if(S.stats.bosses>=10)ach('bosses10');
    if(bossKinds()>=BOSSES.length)ach('bestiary');
  }
  G.banner={t:0,dur:1700,title:boss?'BOSS DEFEATED!':'FLOOR '+G.floor+' CLEARED',sub:'+'+fmtNum(bonus)+' bonus',next:'draft',boss:boss};
  G.state='banner';G.cur=null;
  if(boss){sfx.win();flash('255,220,120',.5);confettiBurst();shake(1);kick(5);}else{sfx.level();flash('120,220,255',.25);}
  vibe(40);
  endCurse();
}
function endCurse(){
  for(var x=0;x<COLS;x++)if(G.ice[x])melt(x,true);
  G.curse=null;G.ward=0;
}
function makeDraft(boss){
  var W=boss?{common:20,uncommon:45,rare:35}:{common:60,uncommon:30,rare:10};
  var pool=PERKS.filter(function(p){return (G.pk[p.id]||0)<p.max;}),out=[],want=3+pkc('wide');
  while(out.length<want&&pool.length){
    var tot=0;pool.forEach(function(p){tot+=W[p.r];});
    var r=G.rd()*tot,pick=pool[0];
    for(var i=0;i<pool.length;i++){r-=W[pool[i].r];if(r<=0){pick=pool[i];break;}}
    out.push(pick.id);pool.splice(pool.indexOf(pick),1);
  }
  return out;
}
function openDraft(boss){

  G.state='draft';

function pickPerk(id){

    if(tot>=8)ach('perks');
    if(cntKeys(S.pseen)>=20)ach('perkdex');
  }
  G.draft=null;closeOv();
  startFloor(G.floor+1);
}
function rerollDraft(){
  if(!G||!G.draft||G.draft.rerolls<=0)return;
  G.draft.rerolls--;G.draft.cards=makeDraft(G.draft.boss);sfx.click();showDraft();

function bannerStep(dt){

    if(b.next==='draft')openDraft(b.boss);

// ---- boss curses ----
function curseInterval(){
  var c=G.curse;if(!c)return 0;
  switch(c.b.id){
    case 'rumble':return Math.max(3,7-c.cyc);
    case 'hail':return Math.max(3,5-c.cyc);
    case 'blind':return Math.max(3,5-c.cyc);
    case 'conveyor':return Math.max(3,6-c.cyc);
    case 'cryo':return Math.max(3,5-c.cyc);
  }
  return 0;
}
function wardBlock(){
  if(G.ward>0){G.ward--;popup('WARD BLOCKED!','#9fe8ff',1.05,G.ward?G.ward+' block left':'Ward used up');sfx.ward();flash('160,230,255',.25);return true;}
  return false;
}
function curseOnLock(){
  var c=G.curse;if(!c)return;
  var id=c.b.id;
  if(id==='cryo')iceTick();
  if(id==='flood'){
    // queued junk only rises when you place a piece without clearing a line
    if(G.lc===0&&c.inc>0){
      var n=Math.min(c.inc,4);c.inc-=n;
      if(!wardBlock()){addGarbage(n);sfx.rumble();shake(1.1);popup('FLOOD! +'+n+' JUNK','#ff7a7a',1.15);vibe(50);}
    }
    return;
  }
  var iv=curseInterval();
  if(!iv)return;
  c.cnt++;
  if(c.cnt<iv)return;
  c.cnt=0;
  if(id==='blind'){c.peek=1300+250*Math.max(0,2-c.cyc);popup('PEEK!','#c9b8ff',.9);sfx.peek();return;}
  if(wardBlock())return;
  if(id==='rumble'){addGarbage(1);sfx.rumble();shake(1.2);popup('JUNK RISES!','#ff7a7a',1.1);}
  else if(id==='hail'){hail(2+c.cyc);sfx.rumble();shake(.7);popup('HAIL!','#9ad8ff',1.1);}
  else if(id==='conveyor')shiftStack();
  else if(id==='cryo')freezeColumn();
}
function floodPeriod(){return Math.max(4500,8000-1000*(G.curse?G.curse.cyc:0));}
function curseUpdate(dt){
  var c=G.curse;if(!c)return;
  var id=c.b.id;
  if(id==='mirror'){
    c.t+=dt;
    var off=Math.max(5000,9000-1500*c.cyc),on=4500+700*c.cyc,p=c.t%(off+on),mir=p>=off;
    if(!c.warned&&p>=off-1500&&p<off){c.warned=true;popup('MIRROR SOON!','#ff9aff',1.1);sfx.warn();}
    if(mir!==c.mir){
      c.mir=mir;
      if(mir){popup('MIRRORED!','#ff5aff',1.4,'Left and right swapped');sfx.boss();shake(.5);}
      else{popup('NORMAL AGAIN','#9fe',1);c.warned=false;}
    }
  }else if(id==='upside'){
    c.t+=dt;
    var off2=Math.max(6000,11000-1500*c.cyc),on2=6500+1000*c.cyc,p2=c.t%(off2+on2),fl=p2>=off2;
    if(!c.warned&&p2>=off2-1600&&p2<off2){c.warned=true;popup('FLIP INCOMING!','#ffd27a',1.05);sfx.warn();}
    if(fl!==c.flip){
      c.flip=fl;sfx.flip();
      if(fl){popup('GRAVITY FLIPPED!','#ffb84a',1.4,'The board is upside-down');shake(.6);}
      else{popup('RIGHT SIDE UP','#9fe',1);c.warned=false;}
    }
  }else if(id==='flood'){
    var per=floodPeriod();
    c.ft+=dt;
    if(c.ft>=per){
      if(c.inc<8){c.ft-=per;c.inc++;popup('+1 JUNK INCOMING','#ff9a9a',.75);sfx.flood();}
      else c.ft=per;
    }
  }
}
function curseVisual(dt){ // animation timers that keep running during clears and banners
  var c=G.curse;if(!c)return;
  if(c.peek>0&&(G.state==='play'||G.state==='clear'))c.peek=Math.max(0,c.peek-dt);
  if(c.slide>0)c.slide=Math.max(0,c.slide-dt/220);
  var tgt=c.flip?1:0;
  if(c.fk!==tgt){var st=dt/520;c.fk=tgt>c.fk?Math.min(tgt,c.fk+st):Math.max(tgt,c.fk-st);}
}
function boardFlipScale(){
  var c=G&&G.curse;if(!c||c.b.id!=='upside'||c.fk<=0||G.state==='paused')return 1;
  var s=Math.cos(c.fk*Math.PI);
  return Math.abs(s)<.03?(s<0?-.03:.03):s;
}
function shiftStack(){
  var c=G.curse,d=c.dir,x,y,r,v;
  for(y=0;y<ROWS;y++){
    r=G.grid[y];
    if(d>0){v=r[COLS-1];for(x=COLS-1;x>0;x--)r[x]=r[x-1];r[0]=v;}
    else{v=r[0];for(x=0;x<COLS-1;x++)r[x]=r[x+1];r[COLS-1]=v;}
  }
  c.slide=1;c.sdir=d;c.shifts++;
  if(c.shifts%3===0)c.dir=-c.dir;
  popup(d>0?'STACK SHIFT >>':'<< STACK SHIFT','#ffd27a',1.05);sfx.shift();shake(.5);kick(1.5);
}
var ICE_COLS=[0,1,2,7,8,9];
function freezeColumn(){
  var c=G.curse,maxP=c.cyc>=1?3:2,act=0,x,i;
  for(x=0;x<COLS;x++)if(G.ice[x])act++;
  if(act>=maxP)return;
  var cand=ICE_COLS.filter(function(x){return !G.ice[x];});
  shuffle(cand,G.re);
  for(i=0;i<cand.length;i++){
    x=cand[i];
    var top=ROWS;
    for(var xx=Math.max(0,x-1);xx<=Math.min(COLS-1,x+1);xx++)top=Math.min(top,colTop(xx));
    var len=Math.min(5+c.cyc,top-HID-5);
    if(len<2)continue;
    G.ice[x]=HID+len;G.iceT[x]=7;
    popup('COLUMN FROZEN!','#bff0ff',1.05,'Slide under the ice. Melts in 7 pieces');sfx.freeze();shake(.4);
    if(S.set.fx>0)for(var yy=HID;yy<HID+len;yy++)burstCell(x,yy,'#dff6ff',2,.6);
    return;
  }
}
function iceTick(){
  for(var x=0;x<COLS;x++)if(G.ice[x]){G.iceT[x]--;if(G.iceT[x]<=0)melt(x);}
}
function melt(x,quiet){
  var b=G.ice[x];G.ice[x]=0;G.iceT[x]=0;
  if(S.set.fx>0)for(var y=HID;y<b;y++)burstCell(x,y,'#bfeaff',2,.5);
  if(!quiet)sfx.melt();

function addGarbage(n){
  var holes=1+pkc('junkbreak'),hs=[],overflow=false,x,i;
  while(hs.length<holes){var h=Math.floor(G.re()*COLS);if(hs.indexOf(h)<0)hs.push(h);}
  for(i=0;i<n;i++){
    for(x=0;x<COLS;x++)if(G.grid[0][x]){overflow=true;break;}
    G.grid.shift();
    var row=new Array(COLS);for(x=0;x<COLS;x++)row[x]=(hs.indexOf(x)>=0)?0:8;
    G.grid.push(row);
    if(G.cur&&!fits(G.cur.t,G.cur.r,G.cur.x,G.cur.y))G.cur.y--;
  }
  kick(-1.5*n);
  if(overflow){topOut();}
}
function hail(n){
  for(var i=0;i<n;i++){
    var x=Math.floor(G.re()*COLS),y=HID;
    while(y<ROWS&&!G.grid[y][x])y++;
    if(y-1>=HID+1){G.grid[y-1][x]=8;var cc=cellCenter(x,y-1);spark(cc.x,cc.y,'#9ad8ff',5,.8);}
  }
}
function fireSurge(){

}

// ---------- puzzle & tutorial engine ----------
// Puzzles use a fixed queue, no gravity and no lock timer: pieces only lock when you hard drop.
function pzLoadBoard(rows){ // fills the grid from board rows, returns the '*' target cells as [x,y,x,y...]
  var tg=[],y0=ROWS-rows.length,x,y,r;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++)G.grid[y][x]=0;
  for(r=0;r<rows.length;r++){
    y=y0+r;
    for(x=0;x<COLS;x++){
      var ch=rows[r].charAt(x),t=TYPES.indexOf(ch);
      if(ch==='*')tg.push(x,y);
      else if(ch==='#')G.grid[y][x]=8|PZ_MARK;
      else if(t>=0)G.grid[y][x]=(t+1)|PZ_MARK;
    }

// ---------- end of game / records ----------
function recordScore(){
  var m=G.mode,list=S.best[m]||(S.best[m]=[]),isTime=(m==='sprint');
  if(G.daily&&m!=='daily')return -1; // daily sprint/ultra results live in the daily history
  if(isTime){if(G.over!=='win')return -1;}else if(G.score<=0)return -1;
  var e={s:G.score,l:G.lines,t:Math.round(G.time),lv:G.level,f:G.floor,d:today(),n:S.set.name};
  list.push(e);
  list.sort(isTime?function(a,b){return a.t-b.t;}:function(a,b){return b.s-a.s;});
  var idx=list.indexOf(e);
  if(list.length>5)list.length=5;
  return idx>=5?-1:idx;
}
function endGame(reason){
  if(!G||G.state==='over')return;
  if(G.pz){pzEnd(reason);return;}
  G.over=reason;G.state='over';G.overT=0;
  musicStop();
  S.stats.games++;S.stats.time+=G.time/1000;S.stats.score+=G.score;
  if(G.surge&&G.floor>S.stats.bestFloor)S.stats.bestFloor=G.floor;
  G.rank=recordScore();G.record=(G.rank===0);
  G.rk=rateRun(reason);
  if(G.daily)G.dres=recordDaily(reason);
  if(G.mode==='sprint'&&reason==='win'){if(G.time<120000)ach('sprint2');if(G.time<60000)ach('sprint1');}
  if(G.mode==='ultra'&&G.score>=20000)ach('ultra');
  if(G.mode==='ultra'&&G.score>=50000)ach('ultra50');
  if(G.pieces>=100&&G.time>0&&G.pieces/(G.time/1000)>=2)ach('pps2');
  if(S.stats.lines>=1000)ach('lines1000');
  if(S.stats.lines>=5000)ach('lines5000');
  if(S.stats.games>=25)ach('games25');
  if(S.stats.games>=100)ach('games100');
  checkProgressAch(false);
  checkThemes();
  save();
  if(reason==='win'||reason==='time'){sfx.win();confettiBurst();}
  else if(reason==='quit'){}
  else{sfx.over();shake(1);}
  updateTouchUI();
}
// ---- rank ladder: each finished run moves your rating toward how well that run played ----
function perfOf(m,reason){
  var tab=RANKED[m].tab;
  if(m==='sprint'){
    if(reason==='win')return interp(tab,G.time/1000);
    if(G.lines<4)return 0;
    return interp(tab,G.time/1000*SPRINT_LINES/G.lines*1.35); // topped out: judged on a slowed-down pace
  }
  if(m==='surge')return interp(tab,G.floor+Math.min(.95,G.target?G.floorLines/G.target:0));
  return interp(tab,G.score);
}
function rateRun(reason){
  var m=G.mode;
  if(G.daily||!RANKED[m])return null;
  if(G.pieces<10&&!(m==='sprint'&&reason==='win'))return {mode:m,skip:true};
  var perf=Math.round(perfOf(m,reason)),R=rankRec(m),before=R.r,wasPlaced=R.n>=PLACE,bt=tierOf(before);
  var res={mode:m,perf:perf,before:before,after:before,delta:0,placing:false,placed:false,promo:'',demo:false,tierUp:false};
  R.n++;
  if(!wasPlaced){
    R.pl.push(perf);
    if(R.n>=PLACE){
      var sum=0,mx=0;R.pl.forEach(function(v){sum+=v;if(v>mx)mx=v;});
      R.r=Math.round(.6*sum/R.pl.length+.4*mx);res.placed=true;res.promo='placed';
    }else res.placing=true;
  }else{
    var diff=perf-R.r,delta=Math.round(diff*(diff>=0?.3:.16));
    delta=diff>=0?clamp(delta,3,220):clamp(delta,-90,-2);
    R.r=Math.max(0,R.r+delta);
  }
  res.after=R.r;res.delta=R.r-before;
  var at=tierOf(R.r);res.tier=at;
  if(R.n>=PLACE){
    R.h.push(R.r);if(R.h.length>30)R.h.shift();
    if(R.r>R.pk)R.pk=R.r;
    if(wasPlaced){
      if(at.step>bt.step){res.promo='up';res.tierUp=at.t>bt.t;}
      else if(at.step<bt.step)res.demo=true;
    }
    for(var i=1;i<=at.t;i++)ach(RANK_ACH[i]);
    if(rankedModes()>=4)ach('rk_all');
  }
  return res;
}
// ---- daily challenge history ----
function recordDaily(reason){
  var D=S.daily,d=G.daily.d,k=G.daily.kind,h=D.h[d];
  var e={k:k,s:G.score,l:G.lines,t:Math.round(G.time),f:G.floor,w:(k==='sprint'&&reason==='win')?1:0,n:(h?h.n:0)+1};
  var better=!h||h.k!==k||dailyBetter(e,h);
  if(better)D.h[d]=e;else h.n=e.n;
  if(D.lastDay!==d){
    D.streak=(D.lastDay===prevDay(d))?(D.streak||0)+1:1;
    D.lastDay=d;D.days=(D.days||0)+1;
  }
  D.bestStreak=Math.max(D.bestStreak||0,D.streak||0);
  D.plays=(D.plays||0)+1;
  var ks=Object.keys(D.h).map(Number).sort(function(a,b){return b-a;});
  for(var i=60;i<ks.length;i++)delete D.h[ks[i]];
  ach('daily1');
  if(D.bestStreak>=3)ach('daily3');
  if(D.bestStreak>=7)ach('daily7');
  if(D.days>=10)ach('daily10');
  return {best:better,first:!h,tries:e.n,entry:D.h[d]};
}

// ---------- effects helpers ----------
function cellCenter(x,y){return {x:L.bx+(x+.5)*L.c,y:L.by+(y-HID+.5)*L.c};}
function spark(px,py,col,n,spd){
  if(S.set.fx===0)return;
  n=Math.round(n*(S.set.fx===1?.5:1));

function das(dt,chargeOnly){
  var l=isHeld('left'),r=isHeld('right'),d;
  if(l&&r)d=G.lastDir||-1;else d=l?-1:(r?1:0);
  if(d!==G.dasDir){G.dasDir=d;G.dasT=0;G.autoMoved=0;return;}
  if(!d)return;

  if(chargeOnly){if(G.dasT>S.set.das)G.dasT=S.set.das;return;}
  var DAS=S.set.das,ARR=S.set.arr;
  if(G.dasT>=DAS){
    var due=ARR<=0?99:Math.floor((G.dasT-DAS)/ARR)+1,sg=dirSign();
    while(G.autoMoved<due){

}
function playStep(dt){
  G.time+=dt;
  if(G.mode==='ultra'&&G.time>=ULTRA_MS){G.time=ULTRA_MS;endGame('time');return;}
  if(G.hint){G.hint.t-=dt;if(G.hint.t<=0)G.hint=null;}
  G.vis=Math.max(0,G.vis-dt/1500);
  if(G.frost>0)G.frost=Math.max(0,G.frost-dt);
  curseUpdate(dt);

  das(dt,false);
  var c=G.cur;
  if(!c||G.state!=='play')return;
  var gi=gravityMs(),soft=isHeld('soft'),interval=G.frost>0?1e12:gi;
  if(soft){var si=SDF[S.set.sdf]===0?0.4:Math.max(0.4,(G.pz?1000:gi)/SDF[S.set.sdf]);interval=Math.min(interval,si);}
  G.acc+=dt;
  var n=0;
  while(G.acc>=interval&&n<50){G.acc-=interval;n++;if(!stepDown(soft)){G.acc=0;break;}}
  if(n>=50)G.acc=0;
  c=G.cur;
  if(!c)return;
  if(!fits(c.t,c.r,c.x,c.y+1)){G.lockT+=dt;if(G.lockT>=lockDelay())lockPiece();}
  else G.lockT=0;
  // danger tracking
  var top=ROWS;
  for(var y=HID;y<ROWS&&top===ROWS;y++)for(var x=0;x<COLS;x++)if(G.grid[y][x]){top=y;break;}
  var nd=(top<=HID+4)?1:0;

function update(dt){
  fxUpdate(dt);
  if(!G)return;
  if(G.state!=='paused'){
    G.cpulse+=dt;G.bpulse+=dt;
    if(G.curse)curseVisual(dt);
  }
  switch(G.state){
    case 'countdown':case 'resume':{
      G.cd-=dt;
      var dg=G.cd>1500?3:(G.cd>800?2:(G.cd>150?1:0));
      if(G.state==='resume')dg=G.cd>1000?3:(G.cd>500?2:(G.cd>100?1:0));
      if(dg!==G.lastDigit){G.lastDigit=dg;if(dg>0)sfx.beep();else sfx.go();}
      if(G.cd<=0){
        if(G.state==='resume'){G.state=G.pstate||'play';}
        else{
          if(G.surge)startFloor(1);
          else{spawnNext();if(G.state!=='over')G.state='play';}
        }
        if(S.set.music>0&&G.state!=='over')musicStart();

    case 'play':if(G.pz&&G.pz.demo)demoStep(dt);if(G.state==='play')playStep(dt);break;
    case 'clear':clearStep(dt);break;
    case 'banner':bannerStep(dt);break;

}

  gs.ax+=e.clientX-gs.lx;gs.ay+=e.clientY-gs.ly;gs.lx=e.clientX;gs.ly=e.clientY;
  var sg=dirSign();

  while(gs.ax<=-cell){gs.ax+=cell;tryMove(-sg,0);gs.moved=true;}
  while(gs.ay>=cell*1.1){gs.ay-=cell*1.1;if(G.cur&&stepDown(true))G.acc=0;gs.moved=true;}
  if(gs.ay<0)gs.ay=Math.max(gs.ay,-cell*3);
  if(!gs.hold&&e.clientY-gs.y0<-cell*2.6&&Math.abs(e.clientX-gs.x0)<cell*2){gs.hold=true;gs.moved=true;doHold();}

function gestureEnd(e){
  if(!gs||e.pointerId!==gs.id)return;
  var g=gs;gs=null;
  if(!G||G.state!=='play')return;
  var dt=Math.max(1,Date.now()-g.t0),dx=e.clientX-g.x0,dy=e.clientY-g.y0,cell=Math.max(8,L.c/DPR*.85);
  if(!g.moved&&dt<300&&Math.abs(dx)<12&&Math.abs(dy)<12){tryRotate(dx<0&&false?-1:1);return;}

function shieldPath(g,cx,cy,r){g.beginPath();g.moveTo(cx,cy-r);g.quadraticCurveTo(cx+r*.55,cy-r*.72,cx+r*.95,cy-r*.8);g.lineTo(cx+r*.9,cy+r*.1);g.quadraticCurveTo(cx+r*.75,cy+r*.78,cx,cy+r*1.12);g.quadraticCurveTo(cx-r*.75,cy+r*.78,cx-r*.9,cy+r*.1);g.lineTo(cx-r*.95,cy-r*.8);g.quadraticCurveTo(cx-r*.55,cy-r*.72,cx,cy-r);g.closePath();}
function polyPath(g,cx,cy,r,n,rot){g.beginPath();for(var i=0;i<n;i++){var a=rot+i*2*Math.PI/n;if(i)g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);else g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.closePath();}
function starPath(g,cx,cy,r1,r2,n){g.beginPath();for(var i=0;i<n*2;i++){var r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;if(i)g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);else g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.closePath();}
function gemPath(g,cx,cy,r){g.beginPath();g.moveTo(cx-r*.95,cy-r*.3);g.lineTo(cx-r*.52,cy-r*.85);g.lineTo(cx+r*.52,cy-r*.85);g.lineTo(cx+r*.95,cy-r*.3);g.lineTo(cx,cy+r*1.05);g.closePath();}
function drawEmblem(g,t,d,s){
  var cx=s/2,cy=s/2,i;
  g.clearRect(0,0,s,s);g.save();
  g.lineJoin='round';g.lineCap='round';
  if(t<0){ // unranked
    g.fillStyle='rgba(120,135,180,.35)';g.strokeStyle='rgba(200,210,255,.6)';g.lineWidth=Math.max(1.5,s*.03);
    shieldPath(g,cx,cy-s*.02,s*.34);g.fill();g.stroke();
    g.fillStyle='#dfe6ff';g.font='bold '+Math.round(s*.32)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('?',cx,cy+s*.02);
    g.restore();return;
  }
  var T=TIERS[t],gr=g.createLinearGradient(0,s*.12,0,s*.9);
  gr.addColorStop(0,shade(T.c,.45));gr.addColorStop(.5,T.c);gr.addColorStop(1,T.c2);
  g.shadowColor=T.c;g.shadowBlur=s*.1;
  if(t>=5){ // Master+: a star burst behind the badge
    g.fillStyle=t===6?'#ffd23a':shade(T.c,.25);starPath(g,cx,cy,s*.48,s*.31,8);g.fill();
  }
  if(t>=2){ // Gold+: wings
    g.fillStyle=shade(T.c,-.12);
    for(i=-1;i<=1;i+=2){g.beginPath();g.moveTo(cx+i*s*.18,cy-s*.14);g.quadraticCurveTo(cx+i*s*.5,cy-s*.32,cx+i*s*.47,cy+s*.03);g.quadraticCurveTo(cx+i*s*.36,cy+s*.03,cx+i*s*.18,cy+s*.16);g.closePath();g.fill();
      g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=Math.max(1,s*.012);g.beginPath();g.moveTo(cx+i*s*.24,cy-s*.06);g.lineTo(cx+i*s*.42,cy-s*.18);g.moveTo(cx+i*s*.24,cy+s*.02);g.lineTo(cx+i*s*.43,cy-s*.06);g.stroke();}
  }
  g.fillStyle=gr;g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=Math.max(1.5,s*.025);
  if(t<=2)shieldPath(g,cx,cy-s*.03,s*.32);
  else if(t===4)gemPath(g,cx,cy-s*.02,s*.34);
  else polyPath(g,cx,cy,s*.32,6,-Math.PI/2);
  g.fill();g.shadowBlur=0;g.stroke();
  if(t===1||t===3){g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=Math.max(1,s*.012);if(t===1)shieldPath(g,cx,cy-s*.03,s*.25);else polyPath(g,cx,cy,s*.25,6,-Math.PI/2);g.stroke();}
  if(t===4){ // gem facets
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=Math.max(1,s*.012);g.beginPath();
    g.moveTo(cx-s*.32,cy-s*.12);g.lineTo(cx+s*.32,cy-s*.12);g.moveTo(cx-s*.18,cy-s*.31);g.lineTo(cx-s*.1,cy-s*.12);g.lineTo(cx,cy+s*.33);
    g.moveTo(cx+s*.18,cy-s*.31);g.lineTo(cx+s*.1,cy-s*.12);g.lineTo(cx,cy+s*.33);g.stroke();
  }
  // shine
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(cx-s*.07,cy-s*.17,s*.13,s*.06,-.5,0,6.2832);g.fill();
  if(t===6){ // Grandmaster crown
    var ky=cy-s*.36;
    g.beginPath();g.moveTo(cx-s*.17,ky+s*.07);g.lineTo(cx-s*.2,ky-s*.08);g.lineTo(cx-s*.09,ky-s*.01);g.lineTo(cx,ky-s*.13);g.lineTo(cx+s*.09,ky-s*.01);g.lineTo(cx+s*.2,ky-s*.08);g.lineTo(cx+s*.17,ky+s*.07);g.closePath();
    g.fillStyle='#ffd23a';g.fill();g.strokeStyle='#7a4a00';g.lineWidth=Math.max(1,s*.015);g.stroke();
  }
  // centre mark: division chevrons (III = 1, II = 2, I = 3) or a letter for Master / Grandmaster
  if(d>=0){
    var n=d+1,hh=s*.065,w=s*.12,y0=cy+s*.02-(n-1)*hh*.8;
    for(var pass=0;pass<2;pass++){
      g.strokeStyle=pass?'#fff':'rgba(0,0,0,.45)';g.lineWidth=pass?s*.04:s*.07;
      for(i=0;i<n;i++){var yy=y0+i*hh*1.6;g.beginPath();g.moveTo(cx-w,yy+hh*.6);g.lineTo(cx,yy-hh*.6);g.lineTo(cx+w,yy+hh*.6);g.stroke();}
    }
  }else{
    g.font='900 '+Math.round(s*(t===6?.2:.24))+'px '+FONT;g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=s*.04;g.strokeStyle='rgba(0,0,0,.5)';g.strokeText(t===6?'GM':'M',cx,cy+s*.02);g.fillStyle='#fff';g.fillText(t===6?'GM':'M',cx,cy+s*.02);
  }
  g.restore();
}
function drawSpark(c2,arr,col){
  var w=Math.max(60,c2.clientWidth||200),h=Math.max(16,c2.clientHeight||26);
  c2.width=w;c2.height=h;
  var g=c2.getContext('2d'),i;
  g.clearRect(0,0,w,h);
  if(!arr||arr.length<2){g.fillStyle='rgba(150,165,210,.75)';g.font='11px '+FONT;g.textBaseline='middle';g.fillText('Your rating trend shows up here',2,h/2);return;}
  var mn=Infinity,mx=-Infinity;
  for(i=0;i<arr.length;i++){if(arr[i]<mn)mn=arr[i];if(arr[i]>mx)mx=arr[i];}
  if(mx-mn<60){var mid=(mx+mn)/2;mn=mid-30;mx=mid+30;}
  function Y(v){return h-2-(v-mn)/(mx-mn)*(h-4);}
  g.lineWidth=1;
  TIERS.forEach(function(T){if(T.min>mn&&T.min<mx){g.strokeStyle=rgba(T.c,.4);g.beginPath();g.moveTo(0,Y(T.min)+.5);g.lineTo(w,Y(T.min)+.5);g.stroke();}});
  g.strokeStyle=col;g.lineWidth=2;g.beginPath();
  for(i=0;i<arr.length;i++){var x=2+i/(arr.length-1)*(w-6);if(i)g.lineTo(x,Y(arr[i]));else g.moveTo(x,Y(arr[i]));}
  g.stroke();
  g.fillStyle=col;g.beginPath();g.arc(w-4,Y(arr[arr.length-1]),3,0,6.2832);g.fill();
}

var PREV_BOARD=['..........','....T.....','...TTT..Z.','J.OO....ZZ','JJOO.SS.LZ','IIIISSLLL.'];
function previewCustom(c2){

    h+='<div class="sum">'+sumBox('Streak',nDays(dailyStreakNow()))+sumBox('Best streak',nDays(D.bestStreak))+sumBox('Days played',D.days||0)+sumBox('Daily runs',D.plays||0)+'</div>';
    h+='<h3>Personal bests</h3><div class="sum">'+sumBox('Daily Surge',pb.surge?dailyResStr(pb.surge):'--')+sumBox('Daily Sprint',pb.sprint?fmtTime(pb.sprint.t):'--')+sumBox('Daily Ultra',pb.ultra?fmtNum(pb.ultra.s):'--')+'</div>';
    h+='<div class="row"><button class="btn pri" data-a="daily">Today\'s challenge</button></div>';
    h+='<h3>History</h3>'+dailyHistHtml(60);
  }else if(tab==='scores'){
    MODE_ORDER.forEach(function(id){
      var l=S.best[id]||[];
      h+='<h3>'+MODES[id].name+'</h3>';
      if(!l.length){h+='<div style="color:#7f8bb8;font-size:13px;text-align:left">No scores yet.</div>';return;}
      h+='<table><tr><th>#</th><th>Name</th><th class="r">'+(id==='sprint'?'Time':'Score')+'</th><th class="r">Lines</th><th class="r">'+((id==='surge'||id==='daily')?'Floor':'Date')+'</th></tr>';
      l.forEach(function(e,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(e.n||'PLAYER')+'</td><td class="r">'+(id==='sprint'?fmtTime(e.t):fmtNum(e.s))+'</td><td class="r">'+e.l+'</td><td class="r">'+((id==='surge'||id==='daily')?(e.f||1):dateStr(e.d))+'</td></tr>';});
      h+='</table>';
    });
  }else if(tab==='stats'){
    var st=S.stats;
    h+='<div class="sum">'+sumBox('Games',st.games)+sumBox('Lines',fmtNum(st.lines))+sumBox('Pieces',fmtNum(st.pieces))+sumBox('Play time',Math.floor(st.time/3600)+'h '+Math.floor(st.time/60)%60+'m')+sumBox('T-Spins',st.tspins)+sumBox('Tetrises',st.tetrises)+sumBox('Perfect clears',st.pcs)+sumBox('Best combo',st.maxCombo)+sumBox('Holds',fmtNum(st.holds))+sumBox('Bosses beaten',st.bosses)+sumBox('Best floor',st.bestFloor)+sumBox('Power blocks',st.powers)+sumBox('Bombs',st.bombs)+sumBox('Lasers',st.lasers)+sumBox('Frosts',st.frosts)+sumBox('Quakes',st.quakes)+sumBox('Gold',st.golds)+sumBox('Shockwaves',st.surges)+sumBox('Best B2B streak',st.b2bMax||0)+sumBox('Bosses met',bossKinds()+'/'+BOSSES.length)+sumBox('Perks found',cntKeys(S.pseen)+'/'+PERKS.length)+sumBox('Puzzles solved',pzSolvedCount()+'/'+PZ_ALL.length)+sumBox('Puzzle stars',pzStars()+'/'+PZ_ALL.length*3)+sumBox('Lessons done',tutDone()+'/'+LESSONS.length)+'</div>';
  }else if(tab==='ach'){
    h+=achHtml();
  }else{
    h+='<div class="thm">';
    THEMES.forEach(function(t){
      var un=themeUnlocked(t),sel=S.set.theme===t.id;
      h+='<div class="'+(sel?'sel':'')+(un?'':' lock')+'" '+(un?'data-a="theme:'+t.id+'" tabindex="0"':'')+'><canvas class="tp" width="240" height="46" data-t="'+t.id+'"></canvas><b>'+esc(t.name)+'</b><br><small>'+(un?(sel?'Selected':'Click to use'):'Locked: '+esc(t.how))+'</small></div>';
    });
    h+='</div>';
  }
  h+=backBtn('Back to menu')+'</div>';
  openOv(h,'stats',back||showMenu);
  var pn=ov.querySelector('.panel');if(pn&&tab==='scores'){}
}
function ovBack(){
  if(ovState==='pause'){resumeGame();return;}
  if(ovBackFn)ovBackFn();
}
function act(a,el){
  var p=a.split(':'),k=p[0],v=p[1];
  sfx.click();
  switch(k){
    case 'play':startGame(v);break;
    case 'again':if(G&&G.pz){act('restart');break;}startGame(G?(G.daily?'daily':G.mode):'marathon',{level:G?G.startLevel:1});break;
    case 'puzzles':if(G&&G.state!=='over')save();G=null;updateTouchUI();showPuzzles();break;
    case 'tutorial':if(G&&G.state!=='over')save();G=null;updateTouchUI();showTutorial();break;
    case 'pack':if(G&&G.state!=='over')save();G=null;updateTouchUI();showPack(+v);break;
    case 'pz':if(PZ_BY[v]&&packOpen(PZ_PACKS[PZ_BY[v].pi]))startGame('puzzle',{pz:v});else showPuzzles();break;
    case 'les':if(LES_BY[v])startGame('tutorial',{les:v});break;
    case 'pzundo':closeOv();resumeGame();pzUndo();break;
    case 'pzhint':closeOv();resumeGame();pzHint();break;
    case 'pzretry':closeOv();resumeGame();pzRetry();break;
    case 'news':showNews(ovState==='menu'?showMenu:ovBackFn);break;
    case 'daily':showDaily();break;
    case 'promo':showResult(true);break;
    case 'menu':goMenu();break;
    case 'resume':resumeGame();break;
    case 'restart':
      if(G&&G.pz){if(G.mode==='puzzle')startGame('puzzle',{pz:G.pz.d.id,quick:true});else startGame('tutorial',{les:G.pz.l.id});break;}
      startGame(G.daily?'daily':G.mode,{level:G.startLevel});break;
    case 'quit':
      if(G.mode==='sprint'){goMenu();}
      else{closeOv();endGame('quit');}
      break;
    case 'settings':{var fromPause=(ovState==='pause');showSettings(fromPause?showPause:(G?showPause:showMenu));break;}
    case 'controls':{
      if(ovState==='pause')showControls(showPause);
      else{var sb0=ovBackFn;showControls(function(){showSettings(sb0);});}
      break;}
    case 'how':{var fp2=(ovState==='pause');showHow(fp2?showPause:showMenu);break;}
    case 'stats':if(v==='themes'){showCustomize(showMenu);break;}showStats(v,showMenu);break;
    case 'back':ovBack();break;
    case 'lv':S.last.lv=clamp((S.last.lv||1)+(+v),1,15);save();showMenu();break;
    case 'perk':pickPerk(v);break;
    case 'reroll':rerollDraft();break;
    case 'theme':S.set.theme=v;sprCache={};save();if(ovState==='custom')showCustomize(ovBackFn,true);else showStats('themes',showMenu);break;
    case 'skin':S.set.skin=v;sprCache={};save();showCustomize(ovBackFn,true);break;
    case 'bg':S.set.bg=v;scn.key='';save();showCustomize(ovBackFn,true);break;
    case 'custom':{var cb=(ovState==='pause')?showPause:(ovState==='settings'?(function(b){return function(){showSettings(b);};})(ovBackFn):showMenu);showCustomize(cb);break;}
    case 'tog':S.set[v]=!S.set[v];save();showSettings(null,true);break;
    case 'cyc':
      if(v==='fx')S.set.fx=(S.set.fx+2)%3;   // 2->1->0->2
      else if(v==='touch'){var o=['auto','buttons','swipe','off'];S.set.touch=o[(o.indexOf(S.set.touch)+1)%o.length];updateTouchUI();}
      else if(v==='theme'){var un=THEMES.filter(themeUnlocked),i=0;un.forEach(function(t,j){if(t.id===S.set.theme)i=j;});S.set.theme=un[(i+1)%un.length].id;sprCache={};}
      save();showSettings(null,true);break;
    case 'rebind':listening=v;showControls(ovBackFn);break;
    case 'rebreset':S.binds={};rebuildCodes();save();showControls(ovBackFn);break;
    case 'reset':
      if(resetArmed&&Date.now()-resetArmed<5000){
        var nm=S.set.name;S=defaults();S.set.name=nm;save();rebuildCodes();applyVol();sprCache={};resetArmed=0;checkThemes();showSettings(null,true);
      }else{resetArmed=Date.now();showSettings(null,true);}
      break;
  }
}
ov.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-a]'):null;
  if(!t||!ov.contains(t))return;
  initAudio();act(t.getAttribute('data-a'),t);
});
ov.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-s');
  if(!k)return;
  S.set[k]=+t.value;
  var sp=ov.querySelector('[data-v="'+k+'"]');if(sp)sp.textContent=fmtSet(k,S.set[k]);
  if(k==='sfx'||k==='music'){initAudio();applyVol();}
  if(k==='music'&&S.set.music<=0)musicStop();
});
ov.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-s'),n=t.getAttribute&&t.getAttribute('data-n');
  if(k){if(k==='sfx')sfx.click();save();}
  if(n==='name'){S.set.name=cleanName(t.value);t.value=S.set.name;save();}
});
function menuKey(e){
  var c=e.code,list=Array.prototype.slice.call(ov.querySelectorAll('[data-a],input[type=range]')),ae=document.activeElement,i=list.indexOf(ae);
  if(ovState==='draft'&&/^(Digit|Numpad)[1-4]$/.test(c)){
    e.preventDefault();var id=G.draft&&G.draft.cards[+c.slice(-1)-1];if(id){initAudio();pickPerk(id);}return;
  }
  if(c==='Escape'||(c==='KeyP'&&ovState==='pause')){e.preventDefault();if(ovState==='draft'||ovState==='menu')return;ovBack();return;}
  if(c==='Enter'||c==='Space'){
    if(ae&&ae.getAttribute&&ae.getAttribute('data-a')&&ae.tagName!=='BUTTON'){e.preventDefault();act(ae.getAttribute('data-a'),ae);}
    else if(ae&&ae.tagName==='BUTTON'){/* native click */}
    return;
  }
  var isRange=ae&&ae.tagName==='INPUT'&&ae.type==='range';
  var next=(c==='ArrowDown'||(c==='ArrowRight'&&!isRange)),prev=(c==='ArrowUp'||(c==='ArrowLeft'&&!isRange));
  if(next||prev){
    e.preventDefault();if(!list.length)return;
    i=i<0?0:(next?(i+1)%list.length:(i-1+list.length)%list.length);
    try{list[i].focus();}catch(_){}
  }
}

// ---------- main loop ----------
var lastT=0,themeTick=0,errShown=false;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=ts-lastT;lastT=ts;
  if(dt>50)dt=50;if(dt<0)dt=0;
  if(document.hidden)return;
  try{
    update(dt);
    draw(ts,dt);
    themeTick+=dt;
    if(themeTick>1500){themeTick=0;if(G){checkThemes();var sb=touchEl.querySelector('.b-surge');if(sb&&G.surge)sb.classList.toggle('ready',G.meter>=100);}}
  }catch(err){
    if(!errShown){errShown=true;try{console.error('Tetris Surge error: '+(err&&err.stack?err.stack:err));}catch(_){}}
  }
}
function init(){
  if(window.ResizeObserver){try{new ResizeObserver(function(){resize();}).observe(stage);}catch(e){}}
  resize();
  S.seen.t_classic=1;
  checkProgressAch(true);
  var upd=!S.seen.v20;
  if(upd){S.seen.v20=1;checkThemes(true);save();}else checkThemes(); // first launch of 2.0: unlock quietly, then show what is new
  showMenu();
  if(upd&&S.stats.games>0)showNews(showMenu);
  requestAnimationFrame(frame);
  try{window.parent.postMessage({tetrisSurge:'ready'},'*');}catch(e){}
}
