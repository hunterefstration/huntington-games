<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frontline: Command</title>
<style>
:root{--bg:#0a1017;--panel:rgba(12,18,26,.93);--panel2:rgba(22,32,44,.95);--line:#2b3b4f;--gold:#f0b94d;--gold2:#ffd98a;--txt:#e6edf5;--dim:#8c9db1;--red:#ff5a4d;--green:#4ade80;--blue:#4aa3ff;--ui:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06090d;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(180deg,rgba(6,10,15,.92),rgba(6,10,15,.55));border-bottom:1px solid #1d2a3a;pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid #243245;font-weight:700;font-size:14px;white-space:nowrap}
.chip small{font-weight:600;color:var(--dim);font-size:11px}
.chip.sup b{color:var(--gold)}
#tixbar{flex:1;display:flex;justify-content:center;gap:8px;min-width:0}
.tix{display:flex;align-items:center;gap:6px;min-width:96px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid #243245;font-size:12px;font-weight:700}
.tix .dot{width:10px;height:10px;border-radius:50%}
.tix .bar{flex:1;height:6px;background:#0008;border-radius:3px;overflow:hidden;min-width:40px}
.tix .bar i{display:block;height:100%}
.tix.dead{opacity:.4;text-decoration:line-through}
#timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--gold2)}
.tbtn{padding:5px 12px;border-radius:6px;background:#17222f;border:1px solid #2d3f55;font-weight:700;font-size:13px}
.tbtn:hover{background:#21324a;border-color:var(--gold)}
#bottom{position:absolute;left:0;right:0;bottom:0;height:176px;display:flex;align-items:flex-end;gap:8px;padding:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#mmwrap{position:relative;width:172px;height:160px;background:var(--panel);border:2px solid #2b3f57;border-radius:8px;overflow:hidden;flex:none}
#mm{width:100%;height:100%;touch-action:none}
#selinfo{flex:1;min-width:0;height:160px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:hidden;position:relative}
#card{width:276px;height:160px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:5px;flex:none;position:relative}
.cb{position:relative;border:1px solid #2f4259;border-radius:6px;background:linear-gradient(180deg,#1d2c3e,#121c29);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1.1;text-align:center;padding:2px;overflow:hidden;min-height:0}
.cb:hover{border-color:var(--gold);background:linear-gradient(180deg,#27405d,#16253a)}
.cb.off{opacity:.45;filter:grayscale(.6)}
.cb .ic{width:36px;height:30px;background-size:contain;background-position:center;background-repeat:no-repeat;flex:none}
.cb .hk{position:absolute;left:3px;top:1px;font-size:9px;color:var(--gold2);opacity:.9}
.cb .cs{position:absolute;right:3px;top:1px;font-size:9px;color:#9fe7a5}
.cb .nm{margin-top:1px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cb .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.cb.on{border-color:var(--gold);box-shadow:0 0 8px #f0b94d88}
.cb .qn{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff;background:#000a;border-radius:3px;padding:0 3px}
#callins{position:absolute;right:8px;bottom:178px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:420px;pointer-events:auto}
.ci{position:relative;width:46px;height:46px;border:1px solid #3a5272;border-radius:7px;background:linear-gradient(180deg,#22344b,#142030);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0}
.ci:hover{border-color:var(--gold)}
.ci.sel{border-color:var(--gold);box-shadow:0 0 10px #f0b94d}
.ci.off{opacity:.5}
.ci .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;transition:none}
.ci .hk{position:absolute;left:2px;top:0;font-size:9px;color:var(--gold2)}
.ci .ct{position:absolute;right:2px;bottom:0;font-size:9px;color:#9fe7a5}
.ci .ic{width:100%;height:100%;position:absolute;left:0;top:0}
#alerts{position:absolute;left:10px;top:56px;width:min(340px,60%);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000}
#alerts div{padding:3px 9px;border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,0));animation:fadein .2s}
#banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:6px 18px;background:rgba(10,16,24,.85);border:1px solid var(--gold);border-radius:8px;font-weight:700;font-size:14px;pointer-events:none}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:290px;background:rgba(6,10,15,.97);border:1px solid var(--gold);border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.35;box-shadow:0 4px 18px #000a}
#tip b{color:var(--gold2);font-size:13px}
#tip .tl{color:var(--dim)}
#boxsel{position:fixed;border:1px solid #6fe28c;background:rgba(111,226,140,.12);pointer-events:none;z-index:4}
#chatbox{position:absolute;left:10px;bottom:186px;width:min(360px,70%);pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000}
#chatbox div{padding:1px 4px;background:rgba(0,0,0,.35);margin-top:1px;border-radius:3px}
#chatin{position:absolute;left:10px;bottom:186px;width:min(360px,70%);padding:6px 8px;background:#0b121a;border:1px solid var(--gold);border-radius:6px;color:#fff;font:inherit;font-size:13px;z-index:7;user-select:text;-webkit-user-select:text}
#tut{position:absolute;right:10px;top:56px;width:min(310px,62%);background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4;pointer-events:auto}
#tut h4{margin:0 0 4px;color:var(--gold2);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
#tut .st{color:var(--dim);font-size:11px;margin-top:6px}
#touchbtns{position:absolute;right:8px;top:100px;display:flex;flex-direction:column;gap:6px}
#touchbtns .tbtn{min-width:64px;padding:9px 6px;text-align:center}
#touchbtns .tbtn.on{background:#6b4b12;border-color:var(--gold)}
#netbar{position:absolute;left:50%;top:50px;transform:translateX(-50%);padding:3px 12px;border-radius:5px;background:#5a1d1d;border:1px solid var(--red);font-size:12px;font-weight:700}
#fps{position:absolute;left:10px;top:50px;font-size:11px;color:#9fe7a5;pointer-events:none}
.selbig{display:flex;gap:10px;height:100%}
.selbig .pic{width:84px;height:84px;border-radius:8px;border:1px solid #33475f;background:#0c141d center/contain no-repeat;flex:none}
.selbig .tx{flex:1;min-width:0;font-size:12px;line-height:1.35}
.selbig h3{margin:0;font-size:15px;color:var(--gold2)}
.hpbar{height:7px;background:#0009;border-radius:4px;overflow:hidden;margin:3px 0;border:1px solid #1d2b3b}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#3dd16b,#9be86a)}
.selgrid{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;height:100%;overflow:auto}
.sg{position:relative;width:40px;height:40px;border:1px solid #33475f;border-radius:5px;background:#0c141d center/contain no-repeat}
.sg b{position:absolute;right:1px;bottom:0;font-size:11px;text-shadow:0 0 3px #000}
.sg:hover{border-color:var(--gold)}
.sg .h{position:absolute;left:0;bottom:0;height:3px;background:#4ade80}
.vet{color:var(--gold)}
/* menus */
#menus{position:fixed;inset:0;z-index:20;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:12px;overflow:auto;touch-action:pan-y}
.scr.bg{background:radial-gradient(ellipse at 50% 40%,rgba(8,14,22,.55),rgba(4,7,11,.9))}
.scr.clear{pointer-events:none;background:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 12px 50px #000c;max-width:100%}
.title{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:.06em;text-align:center;line-height:1;background:linear-gradient(180deg,#fff2c9,#f0b94d 55%,#b0701b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px #000)}
.sub{text-align:center;color:var(--dim);letter-spacing:.35em;font-size:12px;margin:6px 0 18px;text-transform:uppercase}
.mbtn{display:block;width:100%;margin:7px 0;padding:12px 16px;border-radius:8px;background:linear-gradient(180deg,#223347,#14202e);border:1px solid #34506f;font-weight:800;font-size:16px;letter-spacing:.05em;text-align:left;transition:.12s}
.mbtn:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px);background:linear-gradient(180deg,#2c4461,#18283a)}
.mbtn small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:0;margin-top:2px}
.mbtn:disabled{opacity:.4;cursor:default}
.mbtn.go{background:linear-gradient(180deg,#d99a2b,#8f5f12);border-color:#ffd98a;color:#16100a;text-align:center}
.mbtn.go:hover:not(:disabled){background:linear-gradient(180deg,#f0b94d,#a8711a)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:12px 0 5px;font-weight:700}
select,input[type=text],input[type=number]{background:#0d1620;color:var(--txt);border:1px solid #33475f;border-radius:6px;padding:7px 9px;font:inherit;font-size:14px;max-width:100%}
input[type=range]{accent-color:var(--gold);width:170px}
input[type=text]{user-select:text;-webkit-user-select:text}
.seg{display:flex;border:1px solid #33475f;border-radius:7px;overflow:hidden}
.seg button{padding:7px 12px;background:#0d1620;border:0;border-right:1px solid #2a3b50;font-size:13px;font-weight:700;color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button.on{background:#7a5413;color:#fff}
.mapcards{display:flex;gap:8px;flex-wrap:wrap}
.mc{width:118px;border:2px solid #2d4059;border-radius:8px;background:#0d1620;padding:4px;text-align:center;font-size:11px;font-weight:700}
.mc canvas{width:100%;height:auto;border-radius:4px;display:block;margin-bottom:3px}
.mc.on{border-color:var(--gold);box-shadow:0 0 10px #f0b94d66}
.mc small{display:block;color:var(--dim);font-weight:500}
.slot{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid #2a3b50;border-radius:7px;background:#0d1620;margin-bottom:5px;flex-wrap:wrap}
.slot .cdot{width:16px;height:16px;border-radius:50%;flex:none}
.slot select{padding:4px 6px;font-size:13px}
.big{font-size:42px;font-weight:900;letter-spacing:.2em;color:var(--gold2);text-align:center;font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:12px;line-height:1.45}
.kv{display:grid;grid-template-columns:auto auto;gap:3px 22px;font-size:13px}
.kv b{text-align:right;color:var(--gold2)}
kbd{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:4px;background:#1c2a3b;border:1px solid #3b5473;border-bottom-width:2px;font-size:11px;font-weight:700;color:#fff}
.tech{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px;margin-top:8px}
.tcol h5{margin:0 0 6px;color:var(--gold2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tcard{position:relative;border:1px solid #33475f;border-radius:7px;background:#0d1620;padding:6px 7px;margin-bottom:6px;font-size:11px;line-height:1.3;min-height:74px;cursor:pointer}
.tcard b{display:block;font-size:12px;color:#fff}
.tcard:hover{border-color:var(--gold)}
.tcard.done{border-color:#3d9b5b;background:#102418}
.tcard.act{border-color:var(--gold);background:#2a2008}
.tcard.lock{opacity:.45}
.tcard .pgb{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:absolute;inset:4px;z-index:2;background:var(--panel2)}
.spc{border:1px solid var(--gold);border-radius:6px;background:#1c2a3a;padding:4px;font-size:10px;line-height:1.2;overflow:auto}
.spc:hover{background:#2d4562}
.spc b{display:block;font-size:11px;color:var(--gold2)}
.stars{color:var(--gold);letter-spacing:2px}
@keyframes fadein{from{opacity:0;transform:translateX(-8px)}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;background:#14202e;border:1px solid var(--gold);padding:8px 16px;border-radius:8px;font-weight:700;pointer-events:none}
.ach{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid #29394d;border-radius:6px;margin-bottom:4px;font-size:12px}
.ach.ok{border-color:#3d9b5b;background:#0f2216}.ach i{font-style:normal;color:var(--dim)}
#loading{position:fixed;inset:0;z-index:90;background:#06090d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--gold2)}
#loading .bar{width:220px;height:6px;background:#1a2634;border-radius:3px;overflow:hidden}#loading .bar i{display:block;height:100%;width:30%;background:var(--gold);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
@media (max-width:760px),(max-height:520px){
 #topbar{height:38px;gap:4px;padding:0 4px}.chip{padding:3px 6px;font-size:12px}.chip small{display:none}.tix{min-width:0;padding:2px 5px;font-size:11px}
 .tix .bar{display:none}.tbtn{padding:5px 8px;font-size:12px}#timer{font-size:12px}#tixbar{gap:3px;overflow:hidden}
 #alerts{top:44px;font-size:11px}#fps{top:44px}
 .cb{font-size:8px}.cb .ic{width:26px;height:20px}.cb .hk{display:none}
 .selbig .pic{width:48px;height:48px}.selbig .tx{font-size:11px;line-height:1.25}.selbig h3{font-size:13px}
 .ci{width:36px;height:36px}.ci .ct{font-size:8px}.ci .hk{display:none}
 .tech{grid-template-columns:repeat(3,1fr)}.panel{padding:12px}
 .hint{display:none}
}
@media (max-width:760px) and (min-height:521px){
 :root{--specb:200px}
 #bottom{flex-wrap:wrap;height:auto;padding:4px;gap:4px;align-items:flex-end}
 #selinfo{order:-1;flex:1 1 100%;height:62px;padding:5px 7px}
 #mmwrap{width:112px;height:118px}
 #card{flex:1;width:auto;height:118px;gap:3px;padding:3px;min-width:0}
 #callins{bottom:196px;max-width:94%}#chatbox,#chatin{bottom:200px}
 #touchbtns{top:84px}
}
@media (max-height:520px){
 :root{--specb:112px}
 #bottom{height:104px;padding:3px;gap:3px}
 #mmwrap{width:96px;height:96px}#selinfo{height:96px;padding:4px 6px}
 #card{width:min(240px,42vw);height:96px;gap:2px;padding:2px}
 #callins{bottom:108px;max-width:50%}#chatbox,#chatin{bottom:112px}#tut{display:none}
 #touchbtns{top:44px;flex-direction:row;right:60px}#touchbtns .tbtn{min-width:0;padding:6px 8px}
}
</style>

<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
 <div id="topbar">
  <div class="chip sup" data-tip="Supplies|Spend supplies on units, buildings, upgrades and call-ins. Income comes from your HQ, captured points and Supply Depots."><b id="vSup">0</b><small id="vInc">+0/s</small></div>
  <div class="chip" data-tip="Population|Units alive / population cap. The cap grows with each point you hold."><span id="vPop">0/0</span></div>
  <div id="tixbar"></div>
  <div id="timer">0:00</div>
  <button class="tbtn" id="btnTech" data-tip="Tech Tree (T)|Research global upgrades.">Tech</button>
  <button class="tbtn" id="btnMenu" data-tip="Menu (Esc)|Pause, settings and quit.">Menu</button>
 </div>
 <div id="fps"></div>
 <div id="alerts"></div>
 <div id="netbar" class="hidden"></div>
 <div id="touchbtns" class="hidden"></div>
 <div id="callins"></div>
 <div id="chatbox"></div>
 <div id="tut" class="hidden"></div>
 <div id="bottom">
  <div id="mmwrap"><canvas id="mm" width="172" height="160"></canvas></div>
  <div id="selinfo"></div>
  <div id="card"></div>
 </div>
</div>
<div id="boxsel" class="hidden"></div>
<div id="tip" class="hidden"></div>
<div id="menus"></div>
<div id="loading"><div>FRONTLINE: COMMAND</div><div class="bar"><i></i></div></div>
<script type="module">
import * as THREE from 'three';
// =====================================================================
//  FRONTLINE: COMMAND  -  single file RTS for Huntington Games
// =====================================================================
const VERSION = '1.0';
const TICK = 0.05;                 // simulation step (20 Hz)
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const rr = (a, b) => a + Math.random() * (b - a);
const PI = Math.PI, TAU = PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
const hex3 = n => '#' + ('000000' + n.toString(16)).slice(-6);

// ---------------- teams / colours ----------------
const PCOL = [
  { n: 'Azure', c: 0x3b8cff, rank: 0 }, { n: 'Crimson', c: 0xf0483c, rank: 0 }, { n: 'Emerald', c: 0x36cf6a, rank: 0 }, { n: 'Amber', c: 0xffb52e, rank: 0 },
  { n: 'Violet', c: 0xa56bff, rank: 2 }, { n: 'Cyan', c: 0x2ee6e0, rank: 3 }, { n: 'Rose', c: 0xff6fb5, rank: 4 }, { n: 'Ivory', c: 0xeaeaea, rank: 6 }
];

// ---------------- combat tables ----------------
// armour classes: 0 infantry, 1 vehicle, 2 heavy, 3 air, 4 building
const WTM = {
  bullet: [1, .45, .2, .55, .25], rocket: [.5, 1.3, 1.2, 0, 1], shell: [1.1, .8, .5, 0, 1.2], cannon: [.6, 1.2, 1, 0, .9],
  snipe: [2, .15, .05, 0, .1], flak: [.35, .3, .15, 1.6, .1], aam: [0, 0, 0, 1.8, 0], comm: [1, .6, .3, .5, 1.6], bomb: [1.2, 1, .8, 0, 1.5], mine: [1.1, 1.3, 1, 0, 0]
};
const WTD = { bullet: 'b', rocket: 'g', shell: 'g', cannon: 'g', snipe: 'g', flak: 'b', aam: 'a', comm: 'b', bomb: 'g', mine: 'g' };
const WKIND = { bullet: 0, rocket: 1, shell: 2, bomb: 3, flak: 4, snipe: 5, cannon: 7, aam: 9, comm: 0, mine: 2 };
const VETDMG = [1, 1.1, 1.2, 1.32], VETHP = [1, 1.1, 1.22, 1.38];
const VETNAME = ['Recruit', 'Veteran', 'Elite', 'Hero'];
function Wp(wt, dmg, cd, rng, o) { return Object.assign({ wt, dmg, cd, rng, minr: 0, spl: 0, ps: 0, arc: 0, shots: 1, scat: 0, g: WTD[wt], k: WKIND[wt] }, o || {}); }

  sfx(win ? 'win' : 'lose'); showScreen('results', { win, reason: reason || me.out || '', time: W.t, rows, xp, newAch, rankUp, mp: !!W.o.mp, sandbox: !!W.o.sandbox });
}

// ---------------- frame ----------------
function frame(ts) { requestAnimationFrame(frame); step(ts, false); }
let stepErrs = 0;
function step(ts, hidden) { try { stepInner(ts, hidden); } catch (e) { if (stepErrs++ < 20) { console.error(e); window.__errs.push('step: ' + (e && e.stack || e)); } if (stepErrs === 3) toast('Something went wrong - the game may behave oddly'); } }
function stepInner(ts, hidden) {
  const dt = Math.min(.1, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts; if (!W) return; sfxBudget = 0;
  if (MODE !== 'game' && MODE !== 'demo') return;
  if (NET.role) netTick(ts); if (!hidden) musicTick(dt);
  if (!W.mirror) {
    if (!W.paused && (!W.over || W.o.sandbox) && !(MODE === 'demo' && W.over)) {
      simAcc += dt * W.speed; let n = 0; while (simAcc >= TICK && n < 6) { simTick(); simAcc -= TICK; n++; if (NET.role === 'host') netHostAfterTick(); } if (n >= 6) simAcc = 0;
    }
    interpHost(W.paused ? 1 : simAcc / TICK);
    if (MODE === 'demo' && W.over) { demoT += dt; if (demoT > 5) startDemo(); }
  } else {
    interpGuest(ts); if (ts - guestVisT > 200) { guestVisT = ts; updateVision(); } for (let i = W.reveals.length - 1; i >= 0; i--) { W.reveals[i].t -= dt; if (W.reveals[i].t <= 0) W.reveals.splice(i, 1); }
    if (NET.gotSnap && ts - NET.gotSnap > 100000) { }
  }
  if (W.ev.length) {
    for (const e of W.ev) { if (!hidden || e[0] === 3 || e[0] === 7 || e[0] === 11 || e[0] === 12) { try { fxEvent(e); } catch (er) { window.__errs.push('fx ' + er.message); } } }
    if (NET.role === 'host') netFlush(); W.ev.length = 0;
  }
  if (MODE === 'game') {
    updInput(dt); hudAcc += dt; if (hudAcc > .1) { hudAcc = 0; hudUpdate(); if (!W.o.sandbox && !resultsShown && !P(ME).alive && !W.over && !W.mirror) showResults(false, P(ME).out || 'Eliminated'); else if (!resultsShown && W.mirror && !P(ME).alive && P(ME).out && !W.over) showResults(false, P(ME).out); }
    mmAcc += dt; if (mmAcc > .12) { mmAcc = 0; mmDraw(); }
  } else if (MODE === 'demo') {
    demoT += dt; let cx = 0, cz = 0, n = 0; for (const u of W.units) { cx += u.x; cz += u.z; n++; } if (n) { cx /= n; cz /= n; } cam.tx = cx; cam.tz = cz; cam.tyaw += dt * .06; cam.tdist = 95;
  }
  if (!hidden) {
    renderFrame(dt, ts);
    afAcc += dt; afN++; if (afAcc >= 4) { fpsNow = afN / afAcc; afAcc = 0; afN = 0; if (SET.gfx === 'auto' && !W.paused) autoAdjust(fpsNow); }
    if (SET.fps) { const f = $('#fps'); f.textContent = Math.round(fpsNow) + ' fps | ' + W.units.length + ' units'; }
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && inGame && W && !W.o.mp && !W.paused && !W.over && !SCREEN) openPause(); });
window.addEventListener('pagehide', () => { try { if (NET.role && NET.peer) sendRel({ t: 'bye' }); } catch (e) { } });
window.addEventListener('resize', () => { if (inGame && W) { try { mmBuild(); } catch (e) { } } });
// ---------------- debug hook ----------------
if (DEBUG) {
  window.__fl = {
    get renderer() { return renderer; }, get W() { return W; }, get ME() { return ME; }, UI, NET, cam, SET, PROF, UT, BT, TECH, CALL, MAPS, AIP, AID, WTM, get inGame() { return inGame; }, get mode() { return MODE; }, get fps() { return fpsNow; },
    startGame, startTutorial, startSandbox, applyCmd, issue, selectUnits, clearSel, hudUpdate, renderCard, fxEvent, showScreen, openTech, makeIcons, ICONS, genMap, createWorld, simTick, spawnUnit, placeBuilding, unitsForB, callAvail, killUnit, eliminate, w2s, screenToGround,
    step(n) { for (let i = 0; i < n; i++) simTick(); }, fast(sec, nofx) { const fx = W.fx; W.fx = false; const n = Math.round(sec / TICK); for (let i = 0; i < n && !(W.over && !W.o.sandbox); i++) { simTick(); if (NET.role === 'host') netHostAfterTick(); if (i % 40 === 0) keepEv(); } keepEv(); W.fx = fx; interpHost(1); hudUpdate(true); return W.tick; },
    spawn(type, owner, x, z, vet) { const u = spawnUnit(type, owner, x, z, { vet: vet || 0 }); return u.id; },
    build(owner, ptId, slot, type, instant) { const p = P(owner), pt = W.pts[ptId]; const b = placeBuilding(type, owner, pt, slot, !!instant); return b; },
    state() { return { tick: W.tick, t: W.t, over: W.over, winner: W.winner, reason: W.reason, units: W.units.length, bld: W.bld.length, tix: W.teamList.map(t => Math.round(t.tickets)), pts: W.pts.map(p => p.owner), sup: W.players.map(p => Math.round(p.sup)), pop: W.players.map(p => p.pop) }; },
    navAscii(x0, z0, x1, z1, tx, tz) { const M = W.M, n = M.nav; const f = getField(M, tx, tz); let out = ''; const arrows = ['>', '\\', 'v', '/', '<', '\\', '^', '/']; for (let z = z1; z >= z0; z -= 2) { let row = ''; for (let x = x0; x <= x1; x += 2) { const i = n.idx(x, z); let c = (n.blk[i] | n.dyn[i]) ? '#' : (f.dir[i] >= 0 ? arrows[f.dir[i]] : '?'); for (const u of W.units) if (u.owner === ME && Math.abs(u.x - x) < 1 && Math.abs(u.z - z) < 1) c = 'U'; row += c; } out += row + '\n'; } return out; },
    snapshot() { return { fps: fpsNow, mode: MODE, errs: window.__errs.slice() }; }, setME(i) { ME = i; MYTEAM = P(ME).team; }
  };
}
// ---------------- boot ----------------
function boot() {
  try {
    initRenderer(); setupInput(); bindMenus(); if (SET.gfx === 'auto') applyLevel(['low', 'medium', 'high'][autoLvl]); else if (SET.gfx !== 'custom' && GFX[SET.gfx]) { }
    makeIcons(); applyGfx(); setTimeout(() => { startDemo(); showScreen('main'); showLoading(false); lastTs = performance.now(); requestAnimationFrame(frame); startTicker(); }, 30);
  } catch (e) { console.error(e); window.__errs.push('boot: ' + (e && e.stack || e)); showLoading(true, 'Failed to start: ' + (e && e.message)); }
}
boot();
