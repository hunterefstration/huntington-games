<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frontline: Command</title>
<style>
:root{--bg:#0b1118;--panel:rgba(15,23,34,.95);--panel2:rgba(28,41,58,.97);--line:#2f4560;--gold:#f6c04e;--gold2:#ffe2a6;--txt:#f1f5f9;--dim:#a3b4c7;--red:#ff6b5e;--green:#4fdc86;--blue:#5aa9ff;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f15;color:var(--txt);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;user-select:none;-webkit-user-select:none}
canvas{display:block}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;flex:none}
b{font-weight:700}
/* ---------- HUD frame ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;min-height:52px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(180deg,rgba(8,13,20,.92),rgba(8,13,20,.55));border-bottom:1px solid rgba(80,110,140,.35)}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.tb-mid{flex:1;display:flex;justify-content:center;min-width:0}
.stat{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:800;font-size:19px;white-space:nowrap}
.stat .ic{color:var(--gold);width:22px;height:22px}
.stat small{font-size:12px;font-weight:600;color:var(--dim)}
.stat.army .ic{color:#9fd0ff}
.stat.low{background:rgba(255,107,94,.28)}
#timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;color:var(--gold2);min-width:46px;text-align:center}
.tbtn{padding:9px 14px;min-height:40px;border-radius:10px;background:#22364d;border:1px solid #3a566f;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn:hover{background:#2c4663;border-color:var(--gold)}
.tbtn.on{background:#6b4b12;border-color:var(--gold)}
#scoreRow{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.side{display:flex;align-items:center;gap:7px;min-width:0;flex:none}
.side .nm{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.side b{font-size:18px;font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.side .bar{width:92px;height:11px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.side .bar i{display:block;height:100%;transition:width .4s}
.side.foe{flex-direction:row-reverse}
.side.sm .bar,.side.sm .nm{display:none}
.side.sm b{font-size:16px;min-width:30px;padding:2px 4px;border-radius:7px;background:rgba(255,255,255,.1)}
.side .drain{color:var(--red);font-size:11px;font-weight:800}
#flags{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.35)}
.fl{width:24px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--c,#8d97a3);position:relative;background:rgba(255,255,255,.05)}
.fl .ic{width:19px;height:19px;filter:drop-shadow(0 1px 1px #0008)}
.fl:hover{background:rgba(255,255,255,.2)}
.fl.hq .ic{width:21px;height:21px}
.fl i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:rgba(0,0,0,.5);overflow:hidden}
.fl i s{display:block;height:100%;background:var(--c,#fff);text-decoration:none}
.fl.ct{outline:2px solid var(--red);animation:pls .8s infinite}
@keyframes pls{50%{outline-color:transparent}}
#goal{position:absolute;left:50%;top:58px;transform:translateX(-50%);max-width:min(760px,96vw);padding:5px 14px;border-radius:20px;background:rgba(10,16,24,.82);border:1px solid rgba(110,140,170,.35);font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap;pointer-events:none}
#goal b{color:var(--gold2);letter-spacing:.06em;font-size:12px}
#goal .sh{display:none}
#goal .st{font-weight:800;padding:2px 9px;border-radius:12px;font-size:13px}
#goal .st.w{background:rgba(79,220,134,.22);color:#8ff0b4}
#goal .st.l{background:rgba(255,107,94,.25);color:#ffb0a6}
#goal .st.t{background:rgba(255,255,255,.14);color:#e6edf5}
#goal .st.wx{background:rgba(90,150,255,.22);color:#bcd8ff;font-weight:700}
#modebar{position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:8px 14px 8px 18px;border-radius:12px;background:rgba(160,96,10,.95);border:1px solid var(--gold2);font-weight:800;display:flex;gap:12px;align-items:center;box-shadow:0 4px 18px #0008;max-width:96vw}
#alerts{position:absolute;left:10px;top:96px;width:min(300px,56%);display:flex;flex-direction:column;gap:4px;pointer-events:none}
#hud.tuton #alerts{left:auto;right:66px;top:100px;align-items:flex-end}
#alerts div{padding:5px 10px;border-left:4px solid var(--gold);background:rgba(10,16,24,.88);border-radius:0 8px 8px 0;font-size:13px;font-weight:600;animation:fin .3s;pointer-events:none}#alerts div[data-x]{pointer-events:auto;cursor:pointer}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}to{opacity:1}}
#netbar{position:absolute;left:50%;top:94px;transform:translateX(-50%);padding:4px 14px;border-radius:12px;background:#7a2a20;border:1px solid #ff8a7a;font-size:13px;font-weight:700}
#fps{position:absolute;left:10px;bottom:132px;font-size:11px;color:#9fe7a5;pointer-events:none}
#chatbox{position:absolute;left:10px;bottom:164px;width:min(360px,70%);pointer-events:none;font-size:13px;text-shadow:0 1px 3px #000}
#chatbox div{padding:2px 6px;background:rgba(0,0,0,.45);margin-top:2px;border-radius:5px}
#chatin{position:absolute;left:10px;bottom:164px;width:min(360px,70%);padding:8px 10px;background:#0c1620;border:1px solid var(--gold);border-radius:8px;color:#fff;font-size:15px;user-select:text;-webkit-user-select:text}
#boxsel{position:fixed;border:2px solid #6fe28c;background:rgba(111,226,140,.14);pointer-events:none;z-index:6}
#touchbtns{position:absolute;right:8px;top:100px;display:flex;flex-direction:column;gap:6px}
#camctl{position:absolute;right:8px;bottom:134px;display:flex;flex-direction:column;gap:5px}
#camctl .tbtn{padding:0;width:44px;min-height:44px;font-size:22px;background:rgba(15,23,34,.9)}
.plbl{position:fixed;left:0;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:14px;background:rgba(10,16,24,.62);font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
.plbl .dot{width:9px;height:9px;border-radius:50%;border:1px solid #fff9;flex:none}
.plbl .lb{pointer-events:auto;background:var(--gold);color:#1a1204;font-weight:900;font-size:12.5px;border-radius:9px;padding:4px 10px;min-height:28px;box-shadow:0 2px 8px #0009;text-shadow:none}
.plbl .lb:hover{background:#ffd884}
/* ---------- bottom bar ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;height:122px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:6px 8px;background:linear-gradient(0deg,rgba(7,11,17,.96),rgba(9,14,21,.82));border-top:1px solid rgba(90,120,150,.4)}
#bottom>*{pointer-events:auto}
#mmwrap{position:relative;width:162px;height:108px;background:#05080c;border:2px solid #34495f;border-radius:10px;overflow:hidden}
#mm{width:100%;height:100%;touch-action:none;cursor:pointer}
#panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:row;gap:8px;overflow:hidden}
.phead{flex:none;width:204px;display:flex;flex-direction:column;gap:4px;min-width:0;padding-right:8px;border-right:1px solid rgba(120,150,180,.28);justify-content:center}
.phead.wide{flex:1;width:auto;border-right:0;padding-right:0}
/* building panel: Sell sits in the title row so it can never be covered; the rest wraps and scrolls inside the header */
.phead.bh{width:262px;justify-content:flex-start;overflow-x:hidden;overflow-y:auto;gap:3px}
.phead.bh .ph1{gap:6px}.phead.bh .pt{flex:1}
.phead.bh .sell{margin-left:auto;flex:none;padding:3px 7px;min-height:24px;font-size:11.5px;background:#4a2620;border-color:#a0574a}
.phead.bh .sell:hover{border-color:#ff9a8c;background:#6a3028}
.phead.bh .pm{white-space:nowrap;text-overflow:ellipsis;max-height:16px;flex:none}
.phead.bh .hbtns{flex-wrap:wrap;gap:4px}
.ph1{display:flex;gap:7px;align-items:center;min-width:0}
.pic{width:36px;height:36px;border-radius:8px;background:#0d1620 center/contain no-repeat;border:1px solid #3a4f66;flex:none}
.pt{font-weight:800;font-size:14.5px;line-height:1.15;min-width:0;overflow:hidden}
.pt small{display:block;font-weight:600;color:var(--dim);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:12px;color:var(--dim);line-height:1.2;max-height:30px;overflow:hidden}
.pm b{color:var(--gold2)}
.hpbar{height:7px;width:100%;background:#000a;border-radius:5px;overflow:hidden;border:1px solid #ffffff22;flex:none}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#3dd16b,#9be86a)}
.chips{display:flex;gap:4px;flex-wrap:wrap;max-height:84px;overflow:hidden}
.chip{position:relative;width:34px;height:34px;border:1px solid #44607c;border-radius:7px;background:#0d1620 center/contain no-repeat;flex:none}
.chip b{position:absolute;right:2px;bottom:0;font-size:12px;text-shadow:0 0 3px #000,0 0 3px #000}
.chip:hover{border-color:var(--gold)}
.chip .h{position:absolute;left:0;bottom:0;height:3px;background:#4ade80}
.sm{padding:5px 10px;min-height:28px;font-size:12px;border-radius:8px;background:#22364d;border:1px solid #3a566f;font-weight:700;white-space:nowrap}
.sm:hover{border-color:var(--gold)}
.cards{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;align-items:stretch;touch-action:pan-x}
.cards::-webkit-scrollbar{height:12px}
.cards.compact{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-columns:max-content;gap:5px 6px;align-content:stretch}
.hbtns{display:flex;gap:5px;flex-wrap:wrap}
.hbtns{flex-wrap:nowrap}.hbtns .sm{padding:3px 5px;min-height:24px;font-size:11px}
.hbtns .sm.on{border-color:var(--gold);background:#6b4b12}
#goal .wgo{background:linear-gradient(180deg,#e6a937,#9a6612);border-color:#ffe2a6;color:#1a1204;font-weight:900;font-size:13px;padding:4px 12px;animation:wpulse 1.6s ease-in-out infinite}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 #f6c04e00}50%{box-shadow:0 0 12px #f6c04eaa}}
.hbtns.fm{flex-wrap:wrap;gap:3px;margin-top:3px}.hbtns.fm .sm{padding:2px 5px;min-height:21px;font-size:10.5px}
.card{position:relative;flex:none;width:118px;border:1px solid #3f5b78;border-radius:10px;background:linear-gradient(180deg,#26405c,#182a40);padding:5px 6px;display:flex;flex-direction:column;gap:2px;text-align:left;overflow:hidden;min-height:0}
.card:hover{border-color:var(--gold);background:linear-gradient(180deg,#2e4d6e,#1c3149)}
.card .crow{display:flex;gap:6px;align-items:center;min-width:0}
.card .cimg{width:34px;height:34px;border-radius:7px;background:#0d1620 center/contain no-repeat;flex:none}
.card .cimg .ic{width:24px;height:24px}
.card .cn{font-weight:800;font-size:12.5px;line-height:1.1;min-width:0;overflow:hidden}
.card .cc{font-weight:800;font-size:13px;color:var(--gold);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.card .cc .ic{width:13px;height:13px}
.card .cm{min-height:16px}
.card .cd{font-size:11px;line-height:1.15;color:#cfdbe8;overflow:hidden;max-height:26px}
.card .hk{position:absolute;right:5px;top:3px;font-size:10px;color:#8fa5bb}
.card.off{opacity:.6}
.card.off .cc{color:var(--red)}
.card.lock{filter:grayscale(.7);opacity:.78}
.card.lock .cc{color:#c4d0dd}
.card.go{border-color:var(--gold);background:linear-gradient(180deg,#6b4d12,#3d2a08)}
.card.on{border-color:var(--gold);box-shadow:0 0 10px #f6c04e88}
.card.stk{position:sticky;right:0;z-index:3;box-shadow:-12px 0 12px -8px rgba(0,0,0,.85)}

    assaultbarge: 'Assault Barges carry Legion troopers to the shore behind a humming energy shield. When the ramp drops, the shield drops with it, and eight troopers charge up the beach.',

    hq: 'The Legion Citadel rises like a dark steel spire with an Embercore beacon at its tip. Every order, every shield charge and every drop pod is guided from inside its walls. If the Citadel falls, the battle is lost.',

  maps: {
    lighthouse: 'Lighthouse Bay was a fishing coast until the Beacons went dark. Now storms roll in from the sea every evening, and the two old lighthouses on the island in the middle are the best lookout points in the west. Whoever holds the water holds the island.',
    coral: 'Coral Straits is a ring of sunny islands around a warm lagoon, once a holiday spot for the Banner families. Every island has its own harbor, and the reef in the middle hides a sunken Armory that nobody has managed to reach.',
    harbor: 'Harbor Run is a port city that the fog almost never leaves. Its harbor cuts the city in two, so the docks, the warehouses and the long stone mole at each end change hands every night.',
    glacier: 'Glacier Pass is the only road over the Frostspine mountains. Blizzards blow through it all year, and the old lodge near the summit has sheltered more soldiers than skiers.',
    mesa: 'Moonlit Mesa is a desert of giant flat-topped rocks where the Wardens once watched the stars from their Observatory. Battles here are fought at night, by searchlight and muzzle flash.',
    greenfield: 'Greenfield Crossing was once the breadbasket of Ardena, with golden wheat fields on both sides of a lazy river. The very first big battle of the Flag War was fought for the Old Bridge in the middle, and the stones still carry the scorch marks. Whoever holds the bridge controls the crossing.',
    dustbowl: 'Dustbowl Ridge is a sun-baked desert canyon where the Amber Company once ran its trade caravans. The oasis at its center is the only fresh water for miles, so every army that passes through ends up fighting for it. The canyon walls echo every shot for miles.',

    ironworks: 'Ironworks was the biggest factory district in Ardena until the Beacons went dark and its machines fell silent. Now its ruined streets, rusting cranes and wide central plaza are a maze of cover and ambush points. The old foundry still holds stacks of steel that every army wants.'

function genMap(def) {
  const sym = def.sym, rots = ROTS[sym], rota = ROTA[sym], B = BIOME[def.biome];
  const rng = mulberry32(def.seed * 7919 + 13);
  const M = { def, id: def.id, name: def.name, w: def.w, d: def.d, hw: def.w / 2, hd: def.d / 2, sym, biome: B, bname: def.biome, wl: 0, maxP: def.maxP };
  const L = { hills: [], ridges: [], lakes: [], decks: [], paints: [], pads: [], seas: [] };
  const base = { pts: [], forests: [], rocks: [], blocks: [], spawns: [], cities: [], docks: [] };
  const rep = (x, z, c, fn) => { if (c) fn(x, z, 0); else for (let k = 0; k < rots.length; k++) { const p = rots[k](x, z); fn(p[0], p[1], k); } };
  const api = {
    hill(x, z, r, h, c) { rep(x, z, c, (a, b) => L.hills.push({ x: a, z: b, r, h })); },
    ridge(x1, z1, x2, z2, w, h, c) { if (c) L.ridges.push({ x1, z1, x2, z2, w, h }); else for (let k = 0; k < rots.length; k++) { const p = rots[k](x1, z1), q = rots[k](x2, z2); L.ridges.push({ x1: p[0], z1: p[1], x2: q[0], z2: q[1], w, h }); } },
    lake(x, z, r, depth, c) { rep(x, z, c, (a, b) => L.lakes.push({ x: a, z: b, r, depth })); },
    // 3.0: a stretch of deep sea (a capsule from one point to another, w = half width) and a coastal build spot for a Shipyard
    sea(x1, z1, x2, z2, w, depth, c) { if (c) L.seas.push({ x1, z1, x2, z2, w, depth }); else for (let k = 0; k < rots.length; k++) { const p = rots[k](x1, z1), q = rots[k](x2, z2); L.seas.push({ x1: p[0], z1: p[1], x2: q[0], z2: q[1], w, depth }); } },
    dock(x, z, c) { rep(x, z, c, (a, b) => base.docks.push({ x: a, z: b })); },
    deck(x, z, len, wid, rot, h, c) { rep(x, z, c, (a, b, k) => L.decks.push({ x: a, z: b, len, wid, rot: rot + (c ? 0 : rota[k]), h })); },
    point(x, z, name, val, home, c) { base.pts.push({ x, z, name, val, home: home === undefined ? -1 : home, c: !!c }); },
    spawn(x, z, big, name) { base.spawns.push({ x, z, big, name }); },
    forest(x, z, r, dens) { base.forests.push({ x, z, r, dens }); },
    rocks(x, z, r, n) { base.rocks.push({ x, z, r, n }); },
    block(x, z, w, d, h, rot, col) { base.blocks.push({ x, z, w, d, h, rot, col }); },

    netAttach(role, peer) { if (role === 'host') { hostCandidate(peer); return; } netReset(); NET.role = 'guest'; NET.peer = peer; NET.via = 'direct'; wirePeer(peer, () => guestHostGone()); NET.joinState = 'connected'; NET.myFac = SET.fac | 0; sendRel({ t: 'hello', name: SET.name, ver: VERSION, nv: NETV, fac: NET.myFac }); if (GVL.on()) { NET.hostGvn = GVL.L.newChallenge(); sendRel({ t: 'gvq', n: NET.hostGvn }); } showScreen('mplobby'); }
  };
}
// ---------------- boot ----------------
function boot() {
  try {
    initRenderer(); setupInput(); bindMenus(); if (SET.gfx === 'auto') applyLevel(['low', 'medium', 'high'][autoLvl]);
    makeIcons(); applyGfx(); setTimeout(() => { startDemo(); showScreen(!PROF.seenIntro && !PROF.tutDone ? 'welcome' : 'main'); if (!PROF.seenIntro) { PROF.seenIntro = 1; saveProf(); } showLoading(false); lastTs = performance.now(); requestAnimationFrame(frame); startTicker(); }, 30);
  } catch (e) { console.error(e); window.__errs.push('boot: ' + (e && e.stack || e)); showLoading(true, 'Failed to start: ' + (e && e.message)); }
}
boot();
</script>
